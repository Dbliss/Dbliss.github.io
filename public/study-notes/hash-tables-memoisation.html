<script>

    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296

let ctx = null
let W = 0
let H = 0
let NARROW = false
let U = 1
let GA = 1
let FONT = 'system-ui, sans-serif'
let T = 0
let LIVE = false

const fz = (n) => Math.max(8.5, n * U)
const cycle = (period, offset = 0) => (T / period + offset) % 1

  GA = parent * a

}

  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`
}
function txt (s, x, y, o = {}) {

  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  ctx.fillStyle = color
  ctx.textAlign = align
  ctx.textBaseline = base
  ctx.fillText(s, x, y)

// Typeset a small maths expression: single letters italic, numbers and longer words upright,
// `_x` / `^x` (or `_{xy}`) as subscripts and superscripts.
function mathRuns (s) {
  const runs = []
  const push = (t, level) => {
    const re = /([A-Za-zα-ωΑ-Ω]+)|([^A-Za-zα-ωΑ-Ω]+)/g
    let m
    while ((m = re.exec(t))) {
      if (m[1]) {
        // A single letter straight after a number and a space is a unit (4 m), so it stays upright.
        const prev = runs[runs.length - 1]
        const unit = m[1].length === 1 && prev && prev.level === level && /\d\s$/.test(prev.t)
        runs.push({ t: m[1], italic: m[1].length < 3 && !unit, level })
      }
      else runs.push({ t: m[2], italic: false, level })

  let i = 0
  while (i < s.length) {
    const c = s[i]
    if ((c === '_' || c === '^') && i + 1 < s.length) {
      const level = c === '_' ? -1 : 1
      if (s[i + 1] === '{') {
        const j = s.indexOf('}', i + 2)
        push(s.slice(i + 2, j < 0 ? s.length : j), level)
        i = j < 0 ? s.length : j + 1
      } else {
        push(s[i + 1], level)
        i += 2
      }
    } else {
      let j = i
      while (j < s.length && s[j] !== '_' && s[j] !== '^') j++
      push(s.slice(i, j), 0)
      i = j

  const fontFor = (r) => `${r.italic ? 'italic ' : ''}${o.weight} ${r.level ? o.size * 0.68 : o.size}px ${MATH}`
  let total = 0
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    r.w = ctx.measureText(r.t).width + (r.italic && !r.level ? o.size * 0.04 : 0)

  })

  A(o.alpha)
  ctx.fillStyle = o.color
  ctx.textAlign = 'left'
  ctx.textBaseline = o.base
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    ctx.fillText(r.t, cx, y + (r.level < 0 ? o.size * 0.3 : r.level > 0 ? -o.size * 0.36 : 0))

  return ctx.measureText(s).width

  ctx.arc(x, y, r * 4, 0, TAU)

  softShadow(true)
  rr(x, y, w, h, 12)

// A glowing dot with a tail, arcing from a to b as t goes 0..1.

function polyLen (pts) {

}
function along (pts, L, t) {

  for (let l = 0; l < lv.length - 1; l++) {
    lv[l].forEach((n, i) => {
      line(n.x, n.y, lv[l + 1][2 * i].x, lv[l + 1][2 * i].y, C.faint, 1, a)
      line(n.x, n.y, lv[l + 1][2 * i + 1].x, lv[l + 1][2 * i + 1].y, C.faint, 1, a)
    })
  }
  lv.forEach((nodes) => nodes.forEach((n) => dot(n.x, n.y, r, C.faint, a)))
}
// A code listing. `active` is a line index and may be fractional, so the highlight can slide between lines.
function codeBlock (lines, x, y, w, h, active, a = 1) {
  panel(x, y, w, h, a, C.faint)
  const lh = Math.min(fz(22), (h - 20) / lines.length)

  const size = Math.min(lh * 0.64, (w - 28) / (longest * 0.62))

  ctx.fillStyle = C.hi

    const on = Math.abs(n - at) < 0.5

// ===== CONTENT: hash tables and memoisation =====
// One worked example: computing Fibonacci numbers, first by plain recursion, then remembering answers
// in an 8-slot hash table. The final chapters carry the idea into a chess engine's transposition table.

const fibVal = (n) => { let a = 0; let b = 1; for (let i = 0; i < n; i++) [a, b] = [b, a + b]; return a }
const naiveCalls = (n) => 2 * fibVal(n + 1) - 1
const memoCalls = (n) => Math.max(1, 2 * n - 1)
const fmtInt = (n) => Math.round(n).toLocaleString('en')
const TOP = 5

// The call tree of fib(5), laid out with leaves evenly spaced. Each node also records what happens with a notebook.
const TREE = (() => {
  const nodes = []
  let leaf = 0
  const known = new Set()
  function rec (n, depth, parent, skipped) {
    const id = nodes.length
    const node = { n, depth, parent, kids: [], id, x: 0 }
    nodes.push(node)
    if (skipped) node.memo = 'skip'
    else if (known.has(n)) node.memo = 'hit'
    else node.memo = 'compute'
    if (n >= 2) {
      const under = skipped || node.memo === 'hit'
      node.kids.push(rec(n - 1, depth + 1, id, under))
      node.kids.push(rec(n - 2, depth + 1, id, under))
      node.x = (nodes[node.kids[0]].x + nodes[node.kids[1]].x) / 2
    } else {
      node.x = leaf++
    }
    if (node.memo === 'compute') known.add(n)
    return id
  }
  rec(TOP, 0, -1, false)
  const count = (n) => nodes.filter((q) => q.n === n).length
  const memoOrder = nodes.filter((q) => q.memo !== 'skip')
  return { nodes, leaves: leaf, depth: Math.max(...nodes.map((q) => q.depth)), count, memoOrder }
})()

// FNV-1a, a simple real hash function, on the key text.
function fnv (s) {
  let h = 0x811c9dc5
  for (const c of s) {
    h ^= c.charCodeAt(0)
    h = Math.imul(h, 0x01000193) >>> 0
  }
  return h >>> 0
}
const SLOTS = 8
const keyOf = (n) => `fib(${n})`
const hex = (h) => `0x${h.toString(16).padStart(8, '0')}`
const slotOf = (n) => fnv(keyOf(n)) % SLOTS
const STORED = [0, 1, 2, 3, 4, 5]
const MORE = [6, 7, 8]
const COLLIDE = (() => {
  const seen = {}
  for (const n of [...STORED, ...MORE]) {
    const s = slotOf(n)
    if (seen[s] !== undefined) return { a: seen[s], b: n, slot: s }
    seen[s] = n
  }
  return null
})()
const SHOW = 3

// Chess positions: the start, then 1. e4 e5 (White to move), then 2. Nf3 (Black to move).
const FILES = 'abcdefgh'
const GLYPHS = ['♔', '♕', '♖', '♗', '♘', '♙', '♚', '♛', '♜', '♝', '♞', '♟']
const START_POS = (() => {
  const back = ['♖', '♘', '♗', '♕', '♔', '♗', '♘', '♖']
  const blackOf = { '♖': '♜', '♘': '♞', '♗': '♝', '♕': '♛', '♔': '♚' }
  const ps = []
  back.forEach((g, i) => ps.push([g, `${FILES[i]}1`]))
  for (let i = 0; i < 8; i++) ps.push(['♙', `${FILES[i]}2`])
  for (let i = 0; i < 8; i++) ps.push(['♟', `${FILES[i]}7`])
  back.forEach((g, i) => ps.push([blackOf[g], `${FILES[i]}8`]))
  return ps
})()
const movePiece = (ps, from, to) => ps.map(([g, s]) => [g, s === from ? to : s])
const POS_A = movePiece(movePiece(START_POS, 'e2', 'e4'), 'e7', 'e5')
const POS_B = movePiece(POS_A, 'g1', 'f3')

// Zobrist numbers: one random number per piece kind per square, plus one for "Black to move".
// Shown as 16-bit numbers so they fit on screen (real engines use 64 bits).
const ZOB = (() => {
  const r = rng(64)
  const table = {}
  GLYPHS.forEach((g) => {
    for (let rank = 1; rank <= 8; rank++) for (const f of FILES) table[g + f + rank] = 1 + Math.floor(r() * 65535)
  })
  const side = 1 + Math.floor(r() * 65535)
  const z = (g, s) => table[g + s]
  const keyFor = (ps) => ps.reduce((k, [g, s]) => k ^ z(g, s), 0)
  // The build order: the knight on g1 first, the rook on a1 second, then the rest of the board.
  const firsts = ['g1', 'a1']
  const order = [...firsts.map((s) => POS_A.find((q) => q[1] === s)), ...POS_A.filter((q) => !firsts.includes(q[1]))]
  const prefix = [0]
  order.forEach(([g, s]) => prefix.push(prefix[prefix.length - 1] ^ z(g, s)))
  const revOrder = order.slice().reverse()
  const rev = [0]
  revOrder.forEach(([g, s]) => rev.push(rev[rev.length - 1] ^ z(g, s)))
  const kA = prefix[order.length]
  const out = z('♘', 'g1')
  const inn = z('♘', 'f3')
  const kOut = kA ^ out
  const kIn = kOut ^ inn
  const k1 = kIn ^ side
  return { z, side, order, prefix, revOrder, rev, kA, out, inn, kOut, kIn, k1, check: keyFor(POS_B) ^ side }
})()
const h16 = (v) => `0x${v.toString(16).padStart(4, '0')}`

// ---------- shared pieces ----------
function arrow (x1, y1, x2, y2, color, a = 1, w = 2) {
  if (a <= 0) return
  line(x1, y1, x2, y2, color, w, a)
  const ang = Math.atan2(y2 - y1, x2 - x1)
  const s = 5 + w * 1.5
  A(a)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.moveTo(x2, y2)
  ctx.lineTo(x2 - s * Math.cos(ang - 0.45), y2 - s * Math.sin(ang - 0.45))
  ctx.lineTo(x2 - s * Math.cos(ang + 0.45), y2 - s * Math.sin(ang + 0.45))
  ctx.closePath()
  ctx.fill()
}

function chip (s, x, y, color, a = 1, filled = false, size = fz(10.5)) {
  if (a <= 0) return
  const w = measure(s, size, 700, true) + 16
  const h = size + 10
  A(a)
  rr(x - w / 2, y - h / 2, w, h, h / 2)
  ctx.fillStyle = filled ? color : C.surface
  ctx.fill()
  ctx.strokeStyle = rgba(color, 0.5)
  ctx.lineWidth = 1
  ctx.stroke()
  txt(s, x, y, { size, mono: true, weight: 700, color: filled ? '#ffffff' : color, align: 'center', alpha: a })
}

function treeXY (q) {
  return {
    x: lerp(W * 0.07, W * 0.93, q.x / (TREE.leaves - 1)),
    y: H * 0.12 + q.depth * H * 0.15
  }
}
const nodeR = () => Math.max(10, Math.min(16 * U, W * 0.84 / TREE.leaves * 0.36))

function callNode (q, color, a = 1, filled = false, ring = null) {
  if (a <= 0) return
  const p = treeXY(q)
  const r = nodeR()
  A(a)
  ctx.beginPath()
  ctx.arc(p.x, p.y, r, 0, TAU)
  ctx.fillStyle = filled ? color : C.surface
  ctx.fill()
  ctx.strokeStyle = color
  ctx.lineWidth = 1.6
  ctx.stroke()
  txt(`${q.n}`, p.x, p.y + 0.5, { size: fz(12), weight: 750, mono: true, color: filled ? '#ffffff' : color, align: 'center', alpha: a })
  if (ring) {
    A(a)
    ctx.beginPath()
    ctx.arc(p.x, p.y, r + 4, 0, TAU)
    ctx.strokeStyle = ring
    ctx.lineWidth = 2
    ctx.stroke()
  }
}

function callEdge (q, color, a, dash = null) {
  if (q.parent < 0 || a <= 0) return
  const p = treeXY(TREE.nodes[q.parent])
  const c = treeXY(q)
  line(p.x, p.y, c.x, c.y, color, 1.4, a, dash)
}

const REPEAT_COLOURS = { 3: C.two, 2: C.pink }

// 8-slot table drawn as a row of boxes.
function slotsRow (y, a = 1) {
  const x0 = W * 0.06
  const w = (W * 0.88) / SLOTS
  const h = Math.max(H * 0.16, fz(54))
  const at = (i) => ({ x: x0 + i * w + w / 2, y, w: w - 6, h })
  if (a > 0) {
    for (let i = 0; i < SLOTS; i++) {
      const s = at(i)
      A(a)
      rr(s.x - s.w / 2, y - h / 2, s.w, h, 8)
      ctx.fillStyle = C.surface
      ctx.fill()
      ctx.strokeStyle = C.faint
      ctx.lineWidth = 1.2
      ctx.stroke()
      txt(`${i}`, s.x, y + h / 2 + fz(13), { size: fz(10), color: C.dim, mono: true, align: 'center', alpha: a })
    }
  }
  return at
}

function entry (s, n, a = 1, row = 0, color = C.ink) {
  if (a <= 0) return
  const y = s.y - s.h / 2 + fz(16) + row * fz(26)
  txt(NARROW ? `f${n}` : keyOf(n), s.x, y, { size: fz(NARROW ? 9.5 : 10), mono: true, weight: 700, color, align: 'center', alpha: a })
  txt(`= ${fibVal(n)}`, s.x, y + fz(12), { size: fz(10), mono: true, color: C.muted, align: 'center', alpha: a })
}

// ---------- 01 · repeated work ----------
function sceneRepeat (p) {
  const toTree = ease(seg(p, 1, 1.25))
  const toBig = ease(seg(p, 3, 3.25))

  group(1 - toTree, () => {
    const seq = [0, 1, 2, 3, 4, 5, 6, 7].map(fibVal)
    const x0 = W * 0.1
    const step = W * 0.8 / (seq.length - 1)
    seq.forEach((v, i) => {
      const a = easeOut(seg(p, 0.1 + i * 0.06, 0.3 + i * 0.06))
      const x = x0 + i * step
      txt(`${v}`, x, H * 0.4, { size: fz(22), weight: 750, mono: true, color: i >= 2 ? C.ink : C.accent, align: 'center', alpha: a })
      txt(`fib(${i})`, x, H * 0.4 + fz(26), { size: fz(10), mono: true, color: C.dim, align: 'center', alpha: a })
      if (i >= 2 && a > 0) {
        A(a * 0.6)
        ctx.beginPath()
        ctx.moveTo(x - step * 2, H * 0.4 - fz(18))
        ctx.quadraticCurveTo(x - step, H * 0.4 - fz(60), x, H * 0.4 - fz(18))
        ctx.strokeStyle = C.hi
        ctx.lineWidth = 1.2
        ctx.stroke()
      }
    })
    txt('fib(n) = fib(n − 1) + fib(n − 2)', W / 2, H * 0.72, { size: fz(17), math: true, color: C.hi, align: 'center', alpha: easeOut(seg(p, 0.6, 0.85)) })
  })

  group(toTree * (1 - toBig), () => {
    const reveal = ease(seg(p, 1.1, 1.9)) * TREE.nodes.length
    const rep = easeOut(seg(p, 2.05, 2.35))
    TREE.nodes.forEach((q, i) => {
      const a = easeOut(clamp(reveal - i))
      callEdge(q, C.faint, a)
    })
    TREE.nodes.forEach((q, i) => {
      const a = easeOut(clamp(reveal - i))
      const col = rep > 0 && REPEAT_COLOURS[q.n] ? REPEAT_COLOURS[q.n] : C.hi
      callNode(q, col, a, rep > 0.5 && !!REPEAT_COLOURS[q.n])
    })
    chip(`fib(3) × ${TREE.count(3)}`, W * 0.2, H * 0.93, C.two, rep, true)
    chip(`fib(2) × ${TREE.count(2)}`, W * 0.5, H * 0.93, C.pink, rep, true)
    chip(`${TREE.nodes.length} calls`, W * 0.8, H * 0.93, C.hi, rep)
    txt('each circle n is a call to fib(n)', W / 2, H * 0.04, { size: fz(10.5), color: C.muted, weight: 600, align: 'center', alpha: easeOut(seg(p, 1.2, 1.4)) })
  })

  group(toBig, () => {
    txt('Calls needed by plain recursion', W / 2, H * 0.12, { size: fz(15), weight: 750, align: 'center' })
    ;[5, 30, 40].forEach((n, i) => {
      const a = easeOut(seg(p, 3.15 + i * 0.15, 3.4 + i * 0.15))
      const y = H * (0.34 + i * 0.2)
      txt(`fib(${n})`, W * 0.38, y, { size: fz(15), mono: true, weight: 700, color: C.muted, align: 'right', alpha: a })
      txt(fmtInt(naiveCalls(n)), W * 0.44, y, { size: fz(18), mono: true, weight: 750, color: n === 5 ? C.hi : C.pink, alpha: a })
    })
  })
}

// ---------- 02 · memoisation ----------
function sceneMemo (p) {
  const order = TREE.memoOrder
  const q = ease(seg(p, 1.1, 1.9)) * order.length
  const done = new Set(order.slice(0, Math.floor(q)).map((n) => n.id))
  const notebook = new Set(order.slice(0, Math.floor(q)).filter((n) => n.memo === 'compute').map((n) => n.n))
  const fade = p < 1 ? 0.25 : 1

  TREE.nodes.forEach((n) => {
    const skip = n.memo === 'skip'
    callEdge(n, C.faint, skip ? 0.25 : fade * (done.has(n.id) || p < 1 ? 1 : 0.35), skip ? [3, 4] : null)
  })
  TREE.nodes.forEach((n) => {
    if (n.memo === 'skip') {
      callNode(n, C.faint, p < 1 ? 0.25 : 0.35)
      return
    }
    const seen = done.has(n.id)
    if (n.memo === 'hit') callNode(n, C.green, seen ? 1 : fade * 0.4, false, seen ? C.green : null)
    else callNode(n, C.hi, seen ? 1 : fade * 0.4, seen)
  })
  const hitA = easeOut(seg(p, 1.85, 2))
  TREE.nodes.filter((n) => n.memo === 'hit').forEach((n) => {
    const at = treeXY(n)
    txt('lookup', at.x, at.y + nodeR() + fz(11), { size: fz(9.5), color: C.green, weight: 700, align: 'center', alpha: hitA })
  })

  // The notebook of answers along the bottom.
  const na = easeOut(seg(p, 0.15, 0.4))
  if (na > 0) {
    const y = H * 0.93
    txt('notebook:', W * 0.06, y, { size: fz(11), color: C.muted, weight: 700, alpha: na })
    for (let n = 0; n <= TOP; n++) {
      const x = W * (0.24 + n * 0.125)
      const has = notebook.has(n) || p >= 2
      txt(has ? `${n} → ${fibVal(n)}` : `${n} → ?`, x, y, { size: fz(11), mono: true, weight: 700, color: has ? C.hi : C.faint, align: 'center', alpha: na })
    }
  }
  const ca = easeOut(seg(p, 1.85, 2.05))
  chip(`${memoCalls(TOP)} calls instead of ${naiveCalls(TOP)}`, W * 0.8, H * 0.05, C.green, ca * (1 - seg(p, 2, 2.15)), true)
  chip(`fib(30): ${memoCalls(30)} calls, not ${fmtInt(naiveCalls(30))}`, W / 2, H * 0.05, C.green, easeOut(seg(p, 2.15, 2.35)), true)
}

// ---------- 03 · a hash table ----------
function sceneHash (p) {
  const at = slotsRow(H * 0.66, easeOut(seg(p, 0.1, 0.35)))
  txt(`a table of ${SLOTS} slots`, W * 0.06, H * 0.66 - Math.max(H * 0.16, fz(54)) / 2 - fz(12), { size: fz(11), color: C.muted, weight: 700, alpha: easeOut(seg(p, 0.2, 0.4)) })
  const k = SHOW
  const h = fnv(keyOf(k))
  const s = slotOf(k)
  const py = H * 0.2
  const xs = NARROW ? [0.13, 0.39, 0.68, 0.9] : [0.12, 0.36, 0.62, 0.86]
  const show = (t0) => easeOut(seg(p, t0, t0 + 0.2))
  const lookup = p >= 2
  const t = (a, b) => (lookup ? seg(p, 2.05 + a * 0.6, 2.05 + b * 0.6) : seg(p, 1.05 + a * 0.8, 1.05 + b * 0.8))
  const k1 = easeOut(t(0, 0.2))
  const k2 = easeOut(t(0.2, 0.45))
  const k3 = easeOut(t(0.45, 0.7))
  const k4 = easeOut(t(0.7, 1))
  const pipeA = p >= 3 ? 1 - seg(p, 3, 3.15) : 1
  group(pipeA, () => {
    chip(`"${keyOf(k)}"`, W * xs[0], py, C.ink, k1)
    arrow(W * xs[0] + W * 0.07, py, W * xs[1] - W * 0.08, py, C.faint, k2, 1.4)
    chip(NARROW ? 'hash' : 'hash function', W * xs[1], py, C.hi, k2, true)
    arrow(W * xs[1] + W * 0.08, py, W * xs[2] - W * 0.1, py, C.faint, k3, 1.4)
    txt(hex(h), W * xs[2], py, { size: fz(12), mono: true, weight: 700, color: C.hi, align: 'center', alpha: k3 })
    txt(`÷ ${SLOTS} leaves ${s}`, W * xs[3], py, { size: fz(12), mono: true, weight: 700, color: C.accent, align: 'center', alpha: k4 })
    if (k4 > 0) arrow(W * xs[3], py + fz(14), at(s).x, H * 0.66 - at(s).h / 2 - 6, C.accent, k4, 1.8)
    if (lookup && k4 > 0.5) {
      ripple(at(s).x, H * 0.66, 6, at(s).w * 0.7, C.green, 1, 1400)
      chip('found', at(s).x, H * 0.66 + at(s).h / 2 + fz(30), C.green, k4, true)
    }
  })
  entry(at(s), k, easeOut(seg(p, 1.8, 2)) * (p < 3 ? 1 : 1))
  STORED.filter((n) => n !== k).forEach((n, i) => {
    entry(at(slotOf(n)), n, easeOut(seg(p, 3.15 + i * 0.12, 3.35 + i * 0.12)))
  })
}

// ---------- 04 · collisions ----------
function sceneCollide (p) {
  const at = slotsRow(H * 0.5, 1)
  if (!COLLIDE) return
  const cs = COLLIDE.slot
  const grow = ease(seg(p, 2.1, 2.5))
  STORED.forEach((n) => { if (slotOf(n) !== cs) entry(at(slotOf(n)), n, 1) })
  MORE.forEach((n, i) => {
    if (n === COLLIDE.b) return
    entry(at(slotOf(n)), n, easeOut(seg(p, 0.1 + i * 0.12, 0.3 + i * 0.12)), slotOf(n) === cs ? 1 : 0)
  })
  const s = at(cs)
  // Grow the colliding slot downwards when the entries share it.
  if (grow > 0) {
    A(1)
    rr(s.x - s.w / 2, s.y - s.h / 2, s.w, s.h * (1 + grow), 8)
    ctx.fillStyle = C.surface
    ctx.fill()
    ctx.strokeStyle = C.green
    ctx.lineWidth = 1.6
    ctx.stroke()
  }
  entry(s, COLLIDE.a, 1, 0)
  const ba = easeOut(seg(p, 0.5, 0.75))
  const lift = (1 - ease(seg(p, 0.75, 1))) * H * 0.18
  const bRow = grow
  entry({ ...s, y: s.y - lift + bRow * s.h * 0.95 }, COLLIDE.b, ba, 0, C.pink)
  const clash = easeOut(seg(p, 0.85, 1)) * (1 - grow)
  if (clash > 0) {
    A(clash)
    rr(s.x - s.w / 2 - 4, s.y - s.h / 2 - 4, s.w + 8, s.h + 8, 10)
    ctx.strokeStyle = C.pink
    ctx.lineWidth = 2
    ctx.stroke()
    chip(`collision in slot ${cs}`, s.x, s.y - s.h / 2 - fz(26), C.pink, clash, true)
  }
  const ka = easeOut(seg(p, 1.1, 1.35)) * (1 - seg(p, 2, 2.15))
  if (ka > 0) {
    txt(`looking up "${keyOf(COLLIDE.a)}": slot ${cs} holds "${keyOf(COLLIDE.b)}"?`, W / 2, H * 0.82, { size: fz(12), mono: true, weight: 700, color: C.ink, align: 'center', alpha: ka })
    txt(NARROW ? 'key differs: not a match' : 'stored key differs, so it is not a match', W / 2, H * 0.82 + fz(22), { size: fz(12), color: C.pink, weight: 700, align: 'center', alpha: easeOut(seg(p, 1.4, 1.6)) * (1 - seg(p, 2, 2.15)) })
  }
  chip(NARROW ? 'chained: both kept' : 'chaining: both entries kept in a short list', W / 2, H * 0.9, C.green, easeOut(seg(p, 2.4, 2.6)), true)
}

// ---------- shared chess pieces ----------
function board (x, y, size, pieces, a = 1, highlight = []) {
  const sq = size / 8
  for (let f = 0; f < 8; f++) {
    for (let r = 0; r < 8; r++) {
      A(a)
      ctx.fillStyle = (f + r) % 2 ? '#e9e7f7' : '#ffffff'
      ctx.fillRect(x + f * sq, y + (7 - r) * sq, sq, sq)
    }
  }
  A(a)
  ctx.strokeStyle = C.faint
  ctx.lineWidth = 1
  ctx.strokeRect(x, y, size, size)
  for (let i = 0; i < 8; i++) {
    txt(FILES[i], x + (i + 0.5) * sq, y + size + fz(9), { size: fz(8.5), mono: true, color: C.dim, align: 'center', alpha: a * 0.9 })
    txt(`${i + 1}`, x - fz(6), y + (7.5 - i) * sq, { size: fz(8.5), mono: true, color: C.dim, align: 'center', alpha: a * 0.9 })
  }
  highlight.forEach(([sqName, color, ha = 1]) => {
    if (ha <= 0) return
    const f = FILES.indexOf(sqName[0])
    const r = Number(sqName[1]) - 1
    A(a * 0.38 * ha)
    ctx.fillStyle = color
    ctx.fillRect(x + f * sq, y + (7 - r) * sq, sq, sq)
  })
  pieces.forEach(([pc, sqName, alpha = 1, dy = 0]) => {
    const f = FILES.indexOf(sqName[0])
    const r = Number(sqName[1]) - 1
    txt(pc, x + (f + 0.5) * sq, y + (7.5 - r) * sq + 1 + dy, { size: sq * 0.78, color: C.ink, align: 'center', alpha: a * alpha })
  })
}

// Board on the left, a working column on the right.
function zLayout () {
  const size = Math.min(W * 0.42, H * 0.74)
  const bx = W * 0.045
  const by = (H - size) / 2
  const rx = bx + size + W * 0.06
  return { size, bx, by, rx, rw: W * 0.96 - rx }
}
function sqXY (L, name) {
  const s = L.size / 8
  return { x: L.bx + (FILES.indexOf(name[0]) + 0.5) * s, y: L.by + (8.5 - Number(name[1])) * s }
}
function pieceAt (L, g, x, y, a = 1, scale = 1) {
  txt(g, x, y + 1, { size: (L.size / 8) * 0.78 * scale, color: C.ink, align: 'center', alpha: a })
}

// A 16-bit number drawn as 16 cells, filled where the bit is 1. `from` and `t` morph from an earlier
// value, `upto` reveals cells left to right, and `mark` rings the cells whose bit is set in it.
function bitStrip (v, x, y, w, h, o = {}) {
  const { color = C.hi, a = 1, from = null, t = 1, upto = 16, mark = 0, markColor = C.hi, markA = 0 } = o
  if (a <= 0) return
  const gap = Math.max(1, w * 0.012)
  const cw = (w - gap * 15) / 16
  const r = Math.min(3, cw * 0.25)
  for (let i = 0; i < 16; i++) {
    const cx = x + i * (cw + gap)
    A(a)
    rr(cx, y, cw, h, r)
    ctx.fillStyle = C.surface
    ctx.fill()
    ctx.strokeStyle = C.faint
    ctx.lineWidth = 1
    ctx.stroke()
    const show = clamp(upto - i)
    if (show <= 0) continue
    const bit = (v >> (15 - i)) & 1
    const was = from === null ? bit : (from >> (15 - i)) & 1
    const fill = lerp(was, bit, t) * show
    if (fill > 0) {
      A(a * fill)
      rr(cx, y, cw, h, r)
      ctx.fillStyle = color
      ctx.fill()
    }
    if (markA > 0 && ((mark >> (15 - i)) & 1)) {
      A(a * markA * show)
      rr(cx - 2, y - 2, cw + 4, h + 4, r + 2)
      ctx.strokeStyle = markColor
      ctx.lineWidth = 2
      ctx.stroke()
    }
  }
}
function cellX (x, w, i) {
  const gap = Math.max(1, w * 0.012)
  const cw = (w - gap * 15) / 16
  return x + i * (cw + gap) + cw / 2
}
const bitAt = (v, i) => (v >> (15 - i)) & 1

// One piece kind's 64 random numbers as an 8 × 8 grid, darker for bigger numbers.
function zGrid (g, x, y, s, a = 1, wave = 1, focus = null, focusA = 0) {
  if (a <= 0) return
  const c = s / 8
  A(a)
  softShadow(true)
  rr(x - 3, y - 3, s + 6, s + 6, 6)
  ctx.fillStyle = C.surface
  ctx.fill()
  softShadow(false)
  ctx.strokeStyle = C.faint
  ctx.lineWidth = 1
  ctx.stroke()
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const show = clamp(wave * 68 - ((7 - r) * 8 + f))
      if (show <= 0) continue
      const v = ZOB.z(g, FILES[f] + (r + 1))
      A(a * show * (0.08 + 0.75 * v / 65535))
      ctx.fillStyle = C.hi
      ctx.fillRect(x + f * c + 0.5, y + (7 - r) * c + 0.5, Math.max(0.5, c - 1), Math.max(0.5, c - 1))
    }
  }
  if (focus && focusA > 0) {
    const f = FILES.indexOf(focus[0])
    const r = Number(focus[1]) - 1
    A(a * focusA)
    ctx.strokeStyle = C.one
    ctx.lineWidth = 2
    ctx.strokeRect(x + f * c - 1, y + (7 - r) * c - 1, c + 2, c + 2)
  }
}
const cellOf = (x, y, s, name) => ({ x: x + (FILES.indexOf(name[0]) + 0.5) * s / 8, y: y + (8.5 - Number(name[1])) * s / 8 })

// ---------- 05 · a random number for every piece on every square ----------
function sceneZTable (p) {
  const L = zLayout()
  const sq = L.size / 8
  const order = ZOB.order
  const t0s = order.map((_, i) => (i === 0 ? 4.12 : i === 1 ? 4.42 : 4.6 + (i - 2) * 0.005))
  const ba = easeOut(seg(p, 0, 0.15))

  // The board: pieces drop in, then both e-pawns advance two squares.
  const lit = []
  if (p >= 1 && p < 4) lit.push(['g1', C.one, easeOut(seg(p, 2.05, 2.2))])
  if (p >= 4) order.forEach(([, s], i) => lit.push([s, i === 0 ? C.one : i === 1 ? C.two : C.hi, easeOut(seg(p, t0s[i], t0s[i] + 0.06))]))
  const pieces = START_POS.filter(([, s]) => s !== 'e2' && s !== 'e7').map(([g, s], i) => {
    const d = easeOut(seg(p, 0.02 + i * 0.007, 0.18 + i * 0.007))
    return [g, s, d, (1 - d) * -sq * 0.5]
  })
  board(L.bx, L.by, L.size, pieces, ba, lit)
  const slide = (g, a, b, t) => {
    const A0 = sqXY(L, a)
    const B0 = sqXY(L, b)
    pieceAt(L, g, lerp(A0.x, B0.x, t), lerp(A0.y, B0.y, t), ba, 1 + 0.15 * Math.sin(Math.PI * t))
  }
  slide('♙', 'e2', 'e4', ease(seg(p, 0.35, 0.58)))
  slide('♟', 'e7', 'e5', ease(seg(p, 0.6, 0.83)))
  txt(NARROW ? '1. e4 e5' : 'after 1. e4 e5', L.bx, L.by - fz(14), { size: fz(11), color: C.muted, weight: 700, alpha: easeOut(seg(p, 0.6, 0.85)) })

  // The white knight's grid, which then joins the other eleven.
  const fan = ease(seg(p, 3.05, 3.5))
  const big = Math.min(L.rw * 0.66, H * 0.46)
  const gTop = H * 0.15
  const cols = 4
  const gap = Math.max(6, L.rw * 0.05)
  const labH = fz(16)
  const m = Math.min((L.rw - gap * (cols - 1)) / cols, (H * 0.64 - 3 * labH - 2 * gap) / 3)
  const slot = (k) => ({ x: L.rx + (k % cols) * (m + gap), y: gTop + labH + Math.floor(k / cols) * (m + gap + labH) })
  const ki = GLYPHS.indexOf('♘')
  group(easeOut(seg(p, 1, 1.15)) * (1 - ease(seg(p, 4, 4.15))), () => {
    GLYPHS.forEach((g, k) => {
      if (k === ki) return
      const a = fan * easeOut(seg(p, 3.15 + k * 0.035, 3.35 + k * 0.035))
      if (a <= 0) return
      const s = slot(k)
      zGrid(g, s.x, s.y, m, a, seg(p, 3.15 + k * 0.035, 3.5 + k * 0.035))
      txt(g, s.x, s.y - labH * 0.55, { size: fz(13), color: C.ink, alpha: a })
    })
    const s = slot(ki)
    const gx = lerp(L.rx, s.x, fan)
    const gy = lerp(gTop + fz(4), s.y, fan)
    const gs = lerp(big, m, fan)
    const focusA = easeOut(seg(p, 2.05, 2.2)) * (1 - fan)
    zGrid('♘', gx, gy, gs, 1, ease(seg(p, 1.1, 1.75)), 'g1', focusA)
    txt(NARROW ? '♘: 64 numbers' : 'white knight ♘: 64 numbers', L.rx, gTop - fz(10), { size: fz(11.5), color: C.muted, weight: 700, alpha: 1 - fan })
    txt('♘', s.x, s.y - labH * 0.55, { size: fz(13), color: C.one, weight: 700, alpha: fan })

    // The knight's g1 number travels from the board to the grid, then is read out in binary.
    const cell = cellOf(gx, gy, gs, 'g1')
    if (p < 3) flight(sqXY(L, 'g1'), cell, (p - 2.1) / 0.35, C.one, 2.6, 36)
    const va = easeOut(seg(p, 2.4, 2.6)) * (1 - fan)
    const vy = gy + gs + fz(20)
    txt(`♘ g1 = ${h16(ZOB.out)}`, L.rx, vy, { size: fz(13), mono: true, weight: 700, color: C.one, alpha: va })
    const sw = Math.min(L.rw, big * 1.35)
    bitStrip(ZOB.out, L.rx, vy + fz(14), sw, Math.min(sw / 16 * 1.1, fz(20)), { color: C.one, a: va, upto: seg(p, 2.5, 2.85) * 16 })
    chip('12 × 64 = 768 numbers', L.rx + L.rw / 2, slot(11).y + m + fz(20), C.hi, easeOut(seg(p, 3.6, 3.8)), true)
  })

  // Every piece looks up its own number: 32 pieces, 32 numbers.
  group(easeOut(seg(p, 4.02, 4.15)), () => {
    const top = H * 0.1
    const rowH = (H * 0.84) / order.length
    const sw = L.rw * (NARROW ? 0.62 : 0.7)
    const sx = L.rx + L.rw - sw
    txt(NARROW ? '32 numbers' : '32 pieces, 32 numbers', L.rx, top - fz(14), { size: fz(11.5), color: C.muted, weight: 700 })
    order.forEach(([g, s], i) => {
      const y = top + i * rowH
      const slow = i < 2
      const color = i === 0 ? C.one : i === 1 ? C.two : C.hi
      flight(sqXY(L, s), { x: sx, y: y + rowH / 2 }, (p - t0s[i]) / (slow ? 0.25 : 0.1), color, slow ? 2.6 : 1.8, slow ? 30 : 12)
      const a = easeOut(seg(p, t0s[i] + (slow ? 0.2 : 0.07), t0s[i] + (slow ? 0.28 : 0.1)))
      bitStrip(ZOB.z(g, s), sx, y + rowH * 0.15, sw, rowH * 0.7, { color: slow ? color : C.dim, a })
      if (slow) txt(`${g} ${s}`, sx - fz(8), y + rowH / 2, { size: fz(11), mono: true, weight: 700, color, align: 'right', alpha: a })
    })
  })
}

// ---------- 06 · XOR, bit by bit ----------
function sceneXor (p) {
  const a = ZOB.z('♘', 'g1')
  const b = ZOB.z('♖', 'a1')
  const ab = a ^ b
  const ox = W * 0.05
  const lx = ox + fz(24)
  const sx = W * (NARROW ? 0.3 : 0.24)
  const sw = W * 0.95 - sx
  const sh = Math.min((sw / 16) * 0.95, H * 0.085)
  const R = [H * 0.12, H * 0.33, H * 0.58]
  const row = (name, v, y, color, al, o = {}, hexA = 1) => {
    if (al <= 0) return
    txt(name, lx, y + sh / 2 - fz(8), { size: fz(13), weight: 700, color, alpha: al })
    txt(h16(v), lx, y + sh / 2 + fz(9), { size: fz(10.5), mono: true, color: C.muted, alpha: al * hexA })
    bitStrip(v, sx, y, sw, sh, { color, a: al, ...o })
  }
  const ops = (al) => {
    txt('⊕', ox, R[1] + sh / 2, { size: fz(20), weight: 700, color: C.hi, alpha: al })
    const ry = (R[1] + sh + R[2]) / 2
    line(sx, ry, sx + sw, ry, C.faint, 1.2, al)
    txt('=', ox, R[2] + sh / 2, { size: fz(20), weight: 700, color: C.hi, alpha: al })
  }
  // A frame that sweeps across the columns, with the comparison for the current column below.
  const scan = (up, top, bottom, x0, x1, al) => {
    const col = Math.floor(up)
    if (al <= 0 || col < 0 || col > 15) return
    const x = cellX(sx, sw, col)
    const cw = sw / 16
    A(al)
    rr(x - cw / 2 - 2, top - 6, cw + 4, bottom - top + 12, 6)
    ctx.strokeStyle = C.hi
    ctx.lineWidth = 1.6
    ctx.stroke()
    const tx = clamp(x, sx + fz(40), sx + sw - fz(40))
    txt(`${bitAt(x0, col)} ⊕ ${bitAt(x1, col)} = ${bitAt(x0 ^ x1, col)}`, tx, bottom + fz(20), { size: fz(12), mono: true, weight: 700, color: C.hi, align: 'center', alpha: al })
  }

  // Step 1: the knight's number meets the rook's, one column at a time.
  group(1 - seg(p, 1, 1.12), () => {
    row('♘ g1', a, R[0], C.one, easeOut(seg(p, 0.05, 0.2)))
    row('♖ a1', b, R[1], C.two, easeOut(seg(p, 0.15, 0.3)))
    ops(easeOut(seg(p, 0.2, 0.3)))
    const up = seg(p, 0.32, 0.85) * 16
    row('', ab, R[2], C.hi, easeOut(seg(p, 0.28, 0.35)), { upto: up }, easeOut(seg(p, 0.82, 0.92)))
    scan(up, R[0], R[2] + sh, a, b, seg(p, 0.3, 0.35) * (1 - seg(p, 0.85, 0.9)))
  })

  // Step 2: the result moves up and the rook's number goes in again, undoing itself.
  group(seg(p, 1, 1.12) * (1 - seg(p, 2, 2.12)), () => {
    const m = ease(seg(p, 1.05, 1.3))
    row('♘ g1', a, R[0] - m * H * 0.08, C.one, 1 - m)
    row(m > 0.5 ? '♘ ⊕ ♖' : '', ab, lerp(R[2], R[0], m), C.hi, 1)
    row('♖ a1', b, R[1], C.two, 1)
    ops(1)
    const up = seg(p, 1.35, 1.82) * 16
    row('♘ g1', a, R[2], C.one, easeOut(seg(p, 1.3, 1.36)), { upto: up, mark: b, markColor: C.two, markA: 1 }, easeOut(seg(p, 1.8, 1.9)))
    scan(up, R[0], R[2] + sh, ab, b, seg(p, 1.33, 1.38) * (1 - seg(p, 1.82, 1.87)))
    chip(NARROW ? 'back to ♘ g1' : 'back to the knight’s number', W / 2, H * 0.9, C.green, easeOut(seg(p, 1.85, 1.98)), true)
  })

  // Step 3: swap the two inputs; the result is unchanged.
  group(seg(p, 2, 2.12), () => {
    const s = ease(seg(p, 2.25, 2.7))
    const lift = Math.sin(Math.PI * s) * sh * 0.6
    row('♖ a1', b, lerp(R[1], R[0], s) + lift, C.two, 1)
    row('♘ g1', a, lerp(R[0], R[1], s) - lift, C.one, 1)
    ops(1)
    row('', ab, R[2], C.hi, 1, { mark: ab, markColor: C.green, markA: easeOut(seg(p, 2.72, 2.8)) * (1 - seg(p, 2.9, 3)) })
    chip(NARROW ? 'same result' : 'swapped inputs, same result', W / 2, H * 0.9, C.green, easeOut(seg(p, 2.72, 2.85)), true)
  })
}

// ---------- 07 · building the key, piece by piece ----------
function sceneBuild (p) {
  const L = zLayout()
  const order = ZOB.order
  const P = ZOB.prefix
  const N = order.length
  const kw = L.rw
  const kh = Math.min((kw / 16) * 1.15, fz(28))
  const ih = kh * 0.75
  const ky = H * 0.16
  const iy = H * 0.48
  const keyMid = { x: L.rx + kw / 2, y: ky + kh / 2 }
  const t0 = (i) => (i === 0 ? 1.1 : i === 1 ? 2.1 : 3.05 + (i - 2) * 0.025)
  const landAt = (i) => t0(i) + (i < 2 ? 0.5 : 0.07)
  const rt0 = (j) => 5.08 + j * 0.02
  const rLand = (j) => rt0(j) + 0.06
  const rev = p >= 5
  let n = 0
  for (let i = 0; i < N; i++) if (p >= (rev ? rLand(i) : landAt(i))) n = i + 1
  const v = rev ? ZOB.rev[n] : P[n]
  const pieceColor = (i) => (i === 0 ? C.one : i === 1 ? C.two : C.hi)

  // The board: each square lights up once its piece is in the key.
  const lit = []
  if (!rev) {
    order.forEach(([, s], i) => {
      if (i < n) lit.push([s, pieceColor(i), 1])
      else if (i < 2 && p >= t0(i)) lit.push([s, pieceColor(i), easeOut(seg(p, t0(i), t0(i) + 0.1))])
    })
  } else {
    ZOB.revOrder.forEach(([, s], j) => { if (j < n) lit.push([s, C.accent, 1]) })
  }
  board(L.bx, L.by, L.size, POS_A, 1, lit)
  txt(NARROW ? '1. e4 e5' : 'after 1. e4 e5', L.bx, L.by - fz(14), { size: fz(11), color: C.muted, weight: 700 })

  // The key itself.
  let from = null
  let t = 1
  let mark = 0
  let markA = 0
  let markColor = C.hi
  if (!rev && n >= 1 && n <= 2) {
    const i = n - 1
    from = P[i]
    t = ease(seg(p, landAt(i), landAt(i) + 0.2))
    mark = ZOB.z(...order[i])
    markColor = pieceColor(i)
    markA = easeOut(seg(p, landAt(i), landAt(i) + 0.1)) * (1 - seg(p, i + 1.9, i + 2.05))
  } else if (n >= 1) {
    const last = rev ? ZOB.revOrder[n - 1] : order[n - 1]
    const at = rev ? rLand(n - 1) : landAt(n - 1)
    mark = ZOB.z(...last)
    markColor = rev ? C.accent : C.hi
    markA = 0.8 * (1 - seg(p, at, at + 0.05))
  }
  const ka = easeOut(seg(p, 0.05, 0.25))
  txt('key', L.rx, ky - fz(12), { size: fz(11.5), color: C.muted, weight: 700, alpha: ka })
  bitStrip(v, L.rx, ky, kw, kh, { color: C.hi, a: ka, from, t, mark, markA, markColor })
  txt(`= ${h16(v)}`, L.rx, ky + kh + fz(18), { size: fz(16), mono: true, weight: 750, color: C.hi, alpha: ka })
  const done = easeOut(seg(p, 4.05, 4.2)) * (1 - seg(p, 5, 5.08))
  if (done > 0) {
    A(done * (0.45 + 0.55 * pulse(1600)))
    rr(L.rx - 6, ky - 6, kw + 12, kh + 12, 8)
    ctx.strokeStyle = C.hi
    ctx.lineWidth = 2
    ctx.stroke()
  }

  // The first two pieces: number flies out, shows in full, then rises into the key.
  if (!rev) {
    ;[0, 1].forEach((i) => {
      const [g, s] = order[i]
      const z = ZOB.z(g, s)
      const col = pieceColor(i)
      const st = t0(i)
      flight(sqXY(L, s), { x: L.rx + kw / 2, y: iy + ih / 2 }, (p - st) / 0.2, col, 2.6, 30)
      const rise = ease(seg(p, st + 0.32, landAt(i)))
      const sa = easeOut(seg(p, st + 0.18, st + 0.28)) * (1 - seg(p, landAt(i) - 0.04, landAt(i) + 0.03))
      bitStrip(z, L.rx, lerp(iy, ky, rise), kw, lerp(ih, kh, rise), { color: col, a: sa })
      const la = easeOut(seg(p, st + 0.18, st + 0.28)) * (1 - seg(p, st + 0.85, st + 0.95))
      txt(`⊕ ${g} ${s}  ${h16(z)}`, L.rx, iy - fz(14), { size: fz(12), mono: true, weight: 700, color: col, alpha: la })
    })
    // The other thirty, quickly.
    for (let i = 2; i < N; i++) flight(sqXY(L, order[i][1]), keyMid, (p - t0(i)) / 0.07, C.hi, 1.8, 18)
  } else {
    ZOB.revOrder.forEach(([, s], j) => flight(sqXY(L, s), keyMid, (p - rt0(j)) / 0.06, C.accent, 1.8, 18))
  }

  chip(`${rev ? 0 : n} / ${N} pieces`, keyMid.x, H * 0.76, C.hi, easeOut(seg(p, 1, 1.15)) * (1 - seg(p, 4, 4.1)))
  chip(`1. e4 e5 → ${h16(ZOB.kA)}`, keyMid.x, H * 0.66, C.hi, easeOut(seg(p, 4.1, 4.3)) * (1 - seg(p, 5, 5.08)), true)
  chip(NARROW ? `reversed: ${n} / ${N}` : `reverse order: ${n} / ${N} pieces`, keyMid.x, H * 0.76, C.accent, easeOut(seg(p, 5.02, 5.12)))
  chip(`same key: ${h16(ZOB.rev[N])}`, keyMid.x, H * 0.88, C.green, easeOut(seg(p, 5.78, 5.9)), true)
}

// ---------- 08 · a move edits the key ----------
function sceneMove (p) {
  const L = zLayout()
  const sq = L.size / 8
  const kw = L.rw
  const kh = Math.min((kw / 16) * 1.15, fz(28))
  const ih = kh * 0.75
  const ky = H * 0.14
  const iy = H * 0.44
  const g1 = sqXY(L, 'g1')
  const f3 = sqXY(L, 'f3')
  const hover = { x: (g1.x + f3.x) / 2, y: f3.y - sq * 0.6 }
  const lift = ease(seg(p, 0.2, 0.55))
  const drop = ease(seg(p, 2.05, 2.3))
  const kp = drop > 0
    ? { x: lerp(hover.x, f3.x, drop), y: lerp(hover.y, f3.y, drop) }
    : { x: lerp(g1.x, hover.x, lift), y: lerp(g1.y, hover.y, lift) }

  // The board, with the knight lifted off g1 and set down on f3.
  const hl = []
  if (p >= 1) hl.push(['g1', C.pink, easeOut(seg(p, 1.05, 1.2))])
  if (p >= 2) hl.push(['f3', C.green, easeOut(seg(p, 2.05, 2.2))])
  board(L.bx, L.by, L.size, POS_A.filter(([, s]) => s !== 'g1'), 1, hl)
  line(g1.x, g1.y, f3.x, f3.y, C.hi, 1.4, easeOut(seg(p, 0.45, 0.7)) * (1 - seg(p, 2.05, 2.2)), [4, 4])
  pieceAt(L, '♘', kp.x, kp.y, 1, 1 + 0.18 * (lift - drop))
  const turned = ease(seg(p, 3.05, 3.2))
  const labelY = L.by - fz(14)
  txt(NARROW ? 'White to move' : 'after 1. e4 e5 · White to move', L.bx, labelY, { size: fz(11), color: C.muted, weight: 700, alpha: 1 - turned })
  txt(NARROW ? 'Black to move' : 'after 2. Nf3 · Black to move', L.bx, labelY, { size: fz(11), color: C.accent, weight: 700, alpha: turned })

  // Three edits: XOR out the knight on g1, XOR in the knight on f3, XOR in the turn number.
  const stages = [
    { t0: 1.1, num: ZOB.out, from: ZOB.kA, to: ZOB.kOut, name: '♘ g1', color: C.pink, src: g1 },
    { t0: 2.3, num: ZOB.inn, from: ZOB.kOut, to: ZOB.kIn, name: '♘ f3', color: C.green, src: f3 },
    { t0: 3.25, num: ZOB.side, from: ZOB.kIn, to: ZOB.k1, name: NARROW ? 'turn' : 'Black to move', color: C.accent, src: { x: L.bx + fz(30), y: labelY } }
  ]
  let v = ZOB.kA
  let from = null
  let t = 1
  let mark = 0
  let markA = 0
  let markColor = C.hi
  stages.forEach((s, i) => {
    const land = s.t0 + 0.36
    if (p < land) return
    v = s.to
    from = s.from
    t = ease(seg(p, land, land + 0.15))
    mark = s.num
    markColor = s.color
    markA = easeOut(seg(p, land, land + 0.08)) * (1 - seg(p, i + 1.92, i + 2.05))
  })
  txt('key', L.rx, ky - fz(12), { size: fz(11.5), color: C.muted, weight: 700 })
  bitStrip(v, L.rx, ky, kw, kh, { color: C.hi, from, t, mark, markA, markColor })
  txt(`= ${h16(v)}`, L.rx, ky + kh + fz(18), { size: fz(16), mono: true, weight: 750, color: C.hi })

  const ly = H * 0.64
  const lg = fz(22)
  stages.forEach((s, i) => {
    const land = s.t0 + 0.36
    flight(s.src, { x: L.rx + kw / 2, y: iy + ih / 2 }, (p - s.t0) / 0.15, s.color, 2.6, 30)
    const rise = ease(seg(p, s.t0 + 0.22, land))
    const sa = easeOut(seg(p, s.t0 + 0.12, s.t0 + 0.2)) * (1 - seg(p, land - 0.03, land + 0.04))
    bitStrip(s.num, L.rx, lerp(iy, ky, rise), kw, lerp(ih, kh, rise), { color: s.color, a: sa })
    const la = easeOut(seg(p, s.t0 + 0.12, s.t0 + 0.2)) * (1 - seg(p, i + 1.9, i + 2))
    txt(`⊕ ${s.name}  ${h16(s.num)}`, L.rx, iy - fz(14), { size: fz(12), mono: true, weight: 700, color: s.color, alpha: la })
    txt(`${h16(s.from)} ⊕ ${s.name} → ${h16(s.to)}`, L.rx, ly + i * lg, { size: fz(11.5), mono: true, weight: 700, color: s.color, alpha: easeOut(seg(p, land, land + 0.12)) })
  })

  // Step 5: rebuild from scratch and compare.
  const cy = ly + 3 * lg + fz(10)
  const target = { x: L.rx + kw * 0.75, y: cy }
  POS_B.forEach(([, s], j) => flight(sqXY(L, s), target, (p - (4.08 + j * 0.014)) / 0.12, C.hi, 1.6, 16))
  flight(stages[2].src, target, (p - 4.55) / 0.12, C.accent, 1.8, 16)
  const ca = easeOut(seg(p, 4.62, 4.75))
  txt(NARROW ? `scratch: ${h16(ZOB.check)}` : `from scratch, 33 XORs: ${h16(ZOB.check)}`, L.rx, cy, { size: fz(11.5), mono: true, weight: 700, color: C.ink, alpha: ca })
  chip(NARROW ? 'same key' : 'same key, from 3 XORs', L.rx + kw / 2, cy + fz(30), C.green, easeOut(seg(p, 4.72, 4.85)), true)
}

// ---------- 09 · the transposition table ----------
function sceneTT (p) {
  const toTable = ease(seg(p, 1, 1.25))
  group(1 - toTable, () => {
    const top = { x: W * 0.5, y: H * 0.12 }
    const bottom = { x: W * 0.5, y: H * 0.82 }
    const paths = [['e4', 'e5', 'Nf3'], ['Nf3', 'e5', 'e4']]
    paths.forEach((moves, side) => {
      const xs = W * (side ? 0.72 : 0.28)
      const pts = [top, { x: xs, y: H * 0.3 }, { x: xs, y: H * 0.47 }, { x: xs, y: H * 0.64 }, bottom]
      const t = ease(seg(p, 0.1 + side * 0.3, 0.5 + side * 0.3))
      tracePath(pts, t, side ? C.accent : C.two, 2.2, 1)
      moves.forEach((m, k) => {
        const a = easeOut(seg(t, (k + 1) / 4 - 0.05, (k + 1) / 4 + 0.1))
        dot(pts[k + 1].x, pts[k + 1].y, 3.6, side ? C.accent : C.two, a)
        txt(m, pts[k + 1].x + (side ? 12 : -12), pts[k + 1].y, { size: fz(13), mono: true, weight: 700, color: side ? C.accent : C.two, align: side ? 'left' : 'right', alpha: a })
      })
    })
    dot(top.x, top.y, 7, C.ink, 1)
    txt('start', top.x + 12, top.y, { size: fz(11), color: C.muted, weight: 700 })
    const ma = easeOut(seg(p, 0.75, 0.95))
    dot(bottom.x, bottom.y, 9, C.green, ma)
    ripple(bottom.x, bottom.y, 8, 26, C.green, ma)
    txt(NARROW ? 'same position' : 'the same position', bottom.x + 16, bottom.y, { size: fz(12), color: C.green, weight: 700, alpha: ma })
    chip(`key ${h16(ZOB.k1)}`, bottom.x, bottom.y + fz(28), C.hi, easeOut(seg(p, 0.85, 0.98)), true)
  })

  group(toTable, () => {
    const tx = W * 0.06
    const tw = W * 0.88
    const ty = H * 0.12
    const cols = NARROW ? [['key', 0.02], ['score', 0.4], ['depth', 0.62], ['move', 0.82]] : [['key', 0.03], ['score', 0.38], ['depth', 0.56], ['best move', 0.74]]
    panel(tx, ty, tw, H * 0.46, 1, C.green)
    cols.forEach(([name, f]) => txt(name, tx + tw * f, ty + fz(18), { size: fz(11), color: C.muted, weight: 700 }))
    const rows = [
      [h16(ZOB.k1), '+0.3', '6', 'Bc4'],
      [h16(0x51c0), '−1.2', '4', 'Qd2'],
      [h16(0x0b8e), '+2.0', '5', 'Rxe7']
    ]
    rows.forEach((r, i) => {
      const a = easeOut(seg(p, 1.1 + i * 0.12, 1.3 + i * 0.12))
      const y = ty + fz(44) + i * fz(28)
      r.forEach((v, j) => txt(v, tx + tw * cols[j][1], y, { size: fz(12), mono: true, weight: i === 0 ? 700 : 500, color: i === 0 ? C.ink : C.dim, alpha: a }))
    })

    // Beat 2: a lookup that skips the search below this position.
    const la = easeOut(seg(p, 2.05, 2.3)) * (1 - seg(p, 3, 3.15))
    if (la > 0) {
      const nx = W * 0.3
      const ny = H * 0.68
      dot(nx, ny, 8, C.green, la)
      txt(`key ${h16(ZOB.k1)}`, nx + 14, ny, { size: fz(11.5), mono: true, weight: 700, color: C.green, alpha: la })
      const sa = easeOut(seg(p, 2.3, 2.55))
      A(la * 0.15 * sa)
      ctx.fillStyle = C.green
      ctx.beginPath()
      ctx.moveTo(nx, ny + 8)
      ctx.lineTo(nx - W * 0.16, H * 0.95)
      ctx.lineTo(nx + W * 0.16, H * 0.95)
      ctx.closePath()
      ctx.fill()
      txt(NARROW ? 'skipped' : 'whole search below: skipped', nx, H * 0.88, { size: fz(11), color: C.green, weight: 700, align: 'center', alpha: la * sa })
      arrow(nx + W * 0.1, ny - 6, tx + tw * 0.2, ty + fz(52), C.green, la * sa, 1.6)
      chip('found: score +0.3 from depth 6', W * 0.72, H * 0.72, C.green, la * sa, true)
    }

    // Beat 3: a newer, shallower result for the same slot.
    const ra = easeOut(seg(p, 3.05, 3.3))
    if (ra > 0) {
      const y = H * 0.72
      chip(`new: ${h16(0x7d21)}, depth 3`, W * 0.3, y, C.pink, ra)
      chip(`stored: ${h16(ZOB.k1)}, depth 6`, W * 0.3, y + fz(36), C.green, ra)
      chip(NARROW ? 'keep depth 6' : 'same slot: keep the deeper result', W * 0.72, y + fz(18), C.green, easeOut(seg(p, 3.4, 3.6)), true)
    }
  })
}

      { text: 'The C++ chess engine’s hash table of searched positions is called a transposition table. Each entry stores the position’s key, its score, how deeply it was searched, and the best move found there.' },
      { text: 'Whenever the search reaches a position, it looks up the key first. If the table holds a usable result from a deep enough search, the engine reuses it and skips everything below that position.' },

    ]
  }
]

// ===== RUNTIME: do not change =====
function drawScene (context, index, p, { width, height, dpr, font }, time = 0) {
  ctx = context
  T = time
  LIVE = time > 0
  W = width
  H = height
  NARROW = width < 520
  U = clamp(Math.min(width, height) / 600, 0.55, 1.15)
  GA = 1
  if (font) FONT = font
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.globalAlpha = 1
  ctx.clearRect(0, 0, W, H)
  SCENES[index].draw(p)
}

        inner.style.transitionDelay = `${120 + n * 90}ms`
        outer.append(inner)
        title.append(outer, ' ')
      })
    }
    const map = opening.querySelector('.opening-map')
    if (map) {
      SCENES.forEach((s, i) => {
        const li = make('li')
        const btn = make('button', 'map-item')
        btn.type = 'button'
        btn.style.setProperty('--i', i)
        btn.append(make('span', 'map-num mono', String(i + 1).padStart(2, '0')), make('span', 'map-label', s.short))
        btn.addEventListener('click', () => jump(i))
        li.append(btn)
        map.append(li)
      })
    }
    requestAnimationFrame(() => requestAnimationFrame(() => opening.classList.add('play')))
  }

  const chapters = SCENES.map((s, i) => {
    const el = make('section', i % 2 ? 'chapter flip' : 'chapter')
    const col = make('div', 'stage-col')
    const stage = make('div', 'stage')
    const box = make('div', 'canvas-box')
    const canvas = make('canvas')
    canvas.setAttribute('role', 'img')
    canvas.setAttribute('aria-label', `Animation: ${s.title}. The steps are described in the text alongside.`)
    box.append(canvas)
    const ticks = make('div', 'ticks')
    ticks.setAttribute('aria-hidden', 'true')
    const tickEls = s.beats.map(() => ticks.appendChild(make('span', 'tick')))
    stage.append(box, ticks)
    col.append(stage)

    const copy = make('div', 'copy')
    const head = make('header', 'chapter-head')
    head.append(make('span', 'chapter-num mono', String(i + 1).padStart(2, '0')), make('h2', 'chapter-title', s.title))
    if (s.formula) head.append(noteFormula(s.formula, s.where, i + 1))
    if (s.code) head.append(make('code', 'chapter-code', s.code))
    const pagesEl = make('div', 'pages')
    const firstPage = make('div', 'pg')
    const steps = make('ol', 'steps')
    const lis = []
    const beatEls = s.beats.map((b, bi) => {
      const li = make('li')
      const btn = make('button', 'beat')
      btn.type = 'button'
      const bar = make('span', 'beat-bar')
      bar.setAttribute('aria-hidden', 'true')
      bar.append(make('span', 'beat-fill'))
      const text = make('span', 'beat-text')
      text.innerHTML = b.text
      btn.append(bar, text)
      btn.addEventListener('click', () => seek(i, bi))
      li.append(btn)
      steps.append(li)
      lis.push(li)
      return btn
    })
    firstPage.append(head, steps)
    pagesEl.append(firstPage)
    copy.append(pagesEl)
    el.append(col, copy)
    root.append(el)

    const durations = s.beats.map(beatDuration)
    let elapsed = 0
    const starts = durations.map((d) => { const at = elapsed; elapsed += d; return at })
    return {
      el, canvas, box, copy, beatEls, tickEls, durations, starts,
      col, stage, head, pagesEl, lis,
      flip: i % 2 === 1,
      num: String(i + 1).padStart(2, '0'),
      pages: [{ el: firstPage, list: steps }],
      pageOf: s.beats.map(() => 0),
      page: -1,
      ctx: canvas.getContext('2d'),
      total: elapsed,
      time: reduceMotion ? elapsed : 0,
      near: false,
      seen: false,
      started: reduceMotion,
      dirty: true,
      size: null,
      shown: reduceMotion ? durations.length : 0,
      drawn: -1,
      beat: -1,
      done: false
    }
  })

  function sizeCanvas (ch) {
    const width = ch.box.clientWidth
    const height = ch.box.clientHeight
    if (!width || !height) return
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    ch.size = { width, height, dpr, font }
    ch.canvas.width = Math.round(width * dpr)
    ch.canvas.height = Math.round(height * dpr)
    ch.dirty = true
  }
  let layoutKey = ''
  function resizeStages () {
    const key = `${window.innerWidth}x${window.innerHeight}`
    if (key !== layoutKey) {
      layoutKey = key
      chapters.forEach(paginate)
    }
    chapters.forEach((ch) => { if (ch.near) sizeCanvas(ch) })
    start()
  }
  function progressAt (ch) {
    let b = ch.durations.length - 1
    while (b > 0 && ch.time < ch.starts[b]) b--
    return b + Math.min(1, (ch.time - ch.starts[b]) / ch.durations[b])
  }
  function paintBeats (ch, beat, done) {
    if (ch.beat === beat && ch.done === done) return
    ch.beat = beat
    ch.done = done
    ch.copy.classList.toggle('done', done)
    ch.beatEls.forEach((el, n) => {
      el.classList.toggle('active', n === beat)
      el.classList.toggle('past', n < beat || done)
      if (n === beat) el.setAttribute('aria-current', 'step')
      else el.removeAttribute('aria-current')
    })
    ch.tickEls.forEach((el, n) => el.classList.toggle('on', n <= beat))
    applyPages(ch)
  }

  // A chapter whose steps do not fit beside the stage is split into pages. Reaching the next
  // page slides the stage across, squeezes the old page off the edge as it fades, and brings
  // the new page in on the side the stage has left. Narrow screens scroll the steps instead.
  const CONT_H = 40
  function paginate (ch) {
    const first = ch.pages[0]
    ch.lis.forEach((li) => first.list.append(li))
    ch.pages.splice(1).forEach((pg) => pg.el.remove())
    const wide = window.innerWidth > 900
    const limit = ch.stage.offsetHeight - 16
    const heights = ch.lis.map((li) => li.offsetHeight + 4)
    let used = ch.head.offsetHeight + (parseFloat(getComputedStyle(ch.head).marginBottom) || 0)
    const fits = !wide || used + heights.reduce((sum, h) => sum + h, 0) <= limit
    const groups = [[]]
    heights.forEach((h, i) => {
      if (!fits && groups[groups.length - 1].length && used + h > limit) {
        groups.push([])
        used = CONT_H
      }
      groups[groups.length - 1].push(i)
      used += h
    })
    groups.slice(1).forEach(() => {
      const el = make('div', 'pg')
      const list = make('ol', 'steps')
      el.append(make('span', 'chapter-cont mono', `${ch.num} · continued`), list)
      ch.pagesEl.append(el)
      ch.pages.push({ el, list })
    })
    groups.forEach((g, k) => g.forEach((i) => {
      if (k) ch.pages[k].list.append(ch.lis[i])
      ch.pageOf[i] = k
    }))
    applyPages(ch, true)
  }
  // How much of the previous page stays in view beside the stage before fading out.
  const GHOST_SHOWN = 0.5
  function applyPages (ch, force = false) {
    const cur = ch.pageOf[Math.max(0, ch.beat)] || 0
    if (!force && cur === ch.page) return
    ch.page = cur
    if (ch.pages.length < 2) {
      ch.col.style.translate = ''
      ch.pages.forEach(({ el }) => {
        el.style.translate = ''
        el.style.opacity = ''
        el.style.removeProperty('--fade')
        el.inert = false
      })
      return
    }
    const dir = ch.flip ? -1 : 1
    const stageW = ch.col.offsetWidth
    const copyW = ch.copy.offsetWidth
    const gap = Math.abs(ch.copy.offsetLeft - ch.col.offsetLeft) - (dir > 0 ? stageW : copyW)
    // The row pans as one: the stage moves across, the new page takes the side it left, and
    // the old page slides out beside the stage as a fading ghost. The whole row then shifts
    // away from the ghost, as far as the screen allows, so it stays balanced on screen.
    let shift = 0
    if (cur > 0) {
      const ghostSide = cur % 2 ? dir : -dir
      const rect = ch.el.getBoundingClientRect()
      const room = ghostSide > 0 ? rect.left : window.innerWidth - rect.right
      shift = -ghostSide * Math.min((gap + copyW * GHOST_SHOWN) / 2, Math.max(0, room - 16))
    }
    ch.col.style.translate = `${(cur % 2 ? dir * (copyW + gap) : 0) + shift}px 0`
    ch.pages.forEach(({ el }, k) => {
      const away = k % 2 === 1
      const base = (away ? -dir * (stageW + gap) : 0) + shift
      const out = away ? -dir : dir
      const s = el.style
      s.setProperty('--fade-dir', out > 0 ? '90deg' : '270deg')
      if (k === cur) {
        s.translate = `${base}px 0`
        s.opacity = '1'
        s.setProperty('--fade', '150%')
      } else if (k < cur) {
        s.translate = `${base + out * (copyW + gap)}px 0`
        s.opacity = k === cur - 1 ? '.75' : '0'
        s.setProperty('--fade', k === cur - 1 ? `${GHOST_SHOWN * 100}%` : '0%')
      } else {
        s.translate = `${base + out * 56}px 0`
        s.opacity = '0'
        s.setProperty('--fade', '150%')
      }
      el.inert = k !== cur
    })
  }

  function frame (now) {
    raf = 0
    if (!inView) { lastFrame = 0; return }
    const dt = lastFrame ? Math.min(64, now - lastFrame) : 16
    lastFrame = now
    const vh = window.innerHeight
    const rate = reduceMotion ? 1 : 1 - Math.exp(-dt / DAMPING_MS)
    let current = activeChapter

    chapters.forEach((ch, i) => {
      const rect = ch.el.getBoundingClientRect()
      if (rect.top < vh * 0.5 && rect.bottom > vh * 0.5) current = i
      const near = rect.bottom > -vh * 0.3 && rect.top < vh * 1.3
      if (near !== ch.near) {
        ch.near = near
        if (near) {
          sizeCanvas(ch)
        } else {
          ch.canvas.width = 0
          ch.canvas.height = 0
          ch.size = null
        }
      }
      if (!ch.seen && rect.top < vh * 0.9) {
        ch.seen = true
        ch.el.classList.add('seen')
      }
      if (!ch.started && rect.top < vh * START_LINE && rect.bottom > vh * 0.2) ch.started = true
      const visible = rect.top < vh * 0.8 && rect.bottom > vh * 0.2
      if (ch.started && visible && !reduceMotion && ch.time < ch.total) {
        ch.time = Math.min(ch.total, ch.time + dt)
      }
      const target = progressAt(ch)
      ch.shown += (target - ch.shown) * rate
      if (Math.abs(target - ch.shown) < 0.0004) ch.shown = target
      const beat = Math.min(ch.beatEls.length - 1, Math.floor(target))
      paintBeats(ch, beat, ch.time >= ch.total)
      ch.beatEls[beat].style.setProperty('--fill', (target - beat).toFixed(3))
      if (!near) return
      const looping = !reduceMotion && rect.bottom > 0 && rect.top < vh
      if (ch.size && (looping || ch.dirty || Math.abs(ch.shown - ch.drawn) > 0.0002)) {
        drawScene(ch.ctx, i, ch.shown, ch.size, reduceMotion ? 0 : now)
        ch.drawn = ch.shown
        ch.dirty = false
      }
    })

    if (current !== activeChapter) {
      activeChapter = current
      railItems.forEach((item, n) => item.classList.toggle('on', n === current))
    }
    const first = chapters[0].el.getBoundingClientRect()
    const last = chapters[chapters.length - 1].el.getBoundingClientRect()
    const shown = first.top < vh * 0.5 && last.bottom > vh * 0.5
    if (shown !== railShown) {
      railShown = shown
      rail.classList.toggle('shown', shown)
    }
    raf = requestAnimationFrame(frame)
  }
  function start () {
    if (!raf && inView) raf = requestAnimationFrame(frame)
  }

  // The opening is a stop of its own, so one scroll from it glides into the first chapter.
  function openingZone () {
    if (!opening) return []
    const bottom = opening.getBoundingClientRect().bottom + window.scrollY
    return [{ snap: 0, end: Math.max(0, bottom - window.innerHeight) }]
  }
  function zoneOf (ch) {
    const vh = window.innerHeight
    const rect = ch.el.getBoundingClientRect()
    const top = rect.top + window.scrollY
    const maxScroll = document.documentElement.scrollHeight - vh
    const snap = Math.min(maxScroll, Math.max(0, top - Math.max(SNAP_PADDING, (vh - rect.height) / 2)))
    const end = Math.min(maxScroll, Math.max(snap, top + rect.height + SNAP_PADDING - vh))
    return { snap, end }
  }
  // `force` lets the keyboard enter the story from anywhere above or below it.
  function nextStop (direction, force = false) {
    const y = window.scrollY
    const reach = window.innerHeight * ENTRY_REACH
    const zones = [...openingZone(), ...chapters.map(zoneOf)]
    if (direction > 0) {
      for (let i = 0; i < zones.length; i++) {
        if (y < zones[i].snap - SNAP_EPSILON) return i === 0 && !force && zones[i].snap - y > reach ? null : zones[i].snap
        if (y < zones[i].end - SNAP_EPSILON) return null
      }
      return null
    }
    for (let i = zones.length - 1; i >= 0; i--) {
      if (y > zones[i].end + SNAP_EPSILON) return i === zones.length - 1 && !force && y - zones[i].end > reach ? null : zones[i].end
      if (y > zones[i].snap + SNAP_EPSILON) return null
    }
    return null
  }
  function cancelGlide () {
    if (glideRaf) cancelAnimationFrame(glideRaf)
    glideRaf = 0
  }
  function glideTo (target) {
    cancelGlide()
    const from = window.scrollY
    const distance = Math.abs(target - from)
    if (distance < 2) return
    const duration = Math.min(MAX_GLIDE_MS, Math.max(MIN_GLIDE_MS, distance * GLIDE_MS_PER_PX + 500))
    const startedAt = performance.now()
    settling = true
    wheelTotal = 0
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - startedAt) / duration))
      window.scrollTo({ top: from + (target - from) * ease(t), behavior: 'instant' })
      glideRaf = t < 1 ? requestAnimationFrame(step) : 0
    }
    glideRaf = requestAnimationFrame(step)
  }
  function onWheel (e) {
    if (e.ctrlKey || !e.deltaY || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return
    const delta = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaMode === 2 ? e.deltaY * window.innerHeight : e.deltaY
    const size = Math.abs(delta)
    const now = performance.now()
    const gap = now - lastWheelAt
    const rising = size > 30 && size > lastWheelSize * 1.6
    lastWheelAt = now
    lastWheelSize = size
    if (glideRaf) { e.preventDefault(); return }
    if (gap > WHEEL_QUIET_MS) {
      settling = false
      wheelTotal = 0
    }
    if (settling) {
      if (!rising) { e.preventDefault(); return }
      settling = false
      wheelTotal = 0
    }
    const direction = Math.sign(delta)
    const target = nextStop(direction)
    if (target === null) return
    e.preventDefault()
    if (Math.sign(wheelTotal) !== direction) wheelTotal = 0
    wheelTotal += delta
    if (Math.abs(wheelTotal) >= WHEEL_THRESHOLD) glideTo(target)
  }
  // ← and → move between steps, continuing into the next or previous chapter at either end.
  function stepBy (dir) {
    const i = Math.max(0, activeChapter)
    const ch = chapters[i]
    if (activeChapter !== i) {
      jump(i)
      seek(i, 0)
      return
    }
    const n = ch.beatEls.length
    const current = ch.started ? Math.min(n - 1, Math.floor(progressAt(ch))) : -1
    const target = current + dir
    if (target >= n) {
      if (i + 1 < chapters.length) {
        jump(i + 1)
        seek(i + 1, 0)
      }
    } else if (target < 0) {
      if (i > 0) {
        jump(i - 1)
        seek(i - 1, chapters[i - 1].beatEls.length - 1)
      }
    } else {
      seek(i, target)
    }
  }
  function onKeydown (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault()
      stepBy(e.key === 'ArrowRight' ? 1 : -1)
      return
    }
    let direction = KEY_DIRECTION[e.key]
    if (e.key === ' ') {
      if (e.target.closest?.('button, a')) return
      direction = e.shiftKey ? -1 : 1
    }
    if (!direction) return
    if (glideRaf) { e.preventDefault(); return }
    const target = nextStop(direction, true)
    if (target === null) return
    e.preventDefault()
    if (reduceMotion) window.scrollTo({ top: target, behavior: 'instant' })
    else glideTo(target)
  }
  function onTouchStart (e) {
    touch = e.touches.length === 1 ? { y: e.touches[0].clientY, target: undefined } : null
  }
  function onTouchMove (e) {
    if (glideRaf) {
      if (e.cancelable) e.preventDefault()
      return
    }
    if (!touch) return
    const dy = e.touches[0].clientY - touch.y
    if (touch.target === undefined) {
      if (Math.abs(dy) < 8) return
      touch.target = nextStop(dy < 0 ? 1 : -1)
    }
    if (touch.target === null || !e.cancelable) return
    e.preventDefault()
    if (Math.abs(dy) >= SWIPE_THRESHOLD) {
      glideTo(touch.target)
      touch = null
    }
  }
  function onPointerDown (e) {
    if (e.target === document.documentElement) cancelGlide()
  }
  function jump (i) {
    const { snap } = zoneOf(chapters[i])
    if (reduceMotion) window.scrollTo({ top: snap, behavior: 'instant' })
    else glideTo(snap)
  }
  function seek (i, beat) {
    const ch = chapters[i]
    ch.started = true
    ch.time = reduceMotion ? ch.starts[beat] + ch.durations[beat] - 1 : ch.starts[beat]
  }

  new ResizeObserver(resizeStages).observe(root)
  window.addEventListener('resize', resizeStages)
  window.addEventListener('keydown', onKeydown)
  if (!reduceMotion) {
    window.addEventListener('wheel', onWheel, { passive: false })
    window.addEventListener('touchstart', onTouchStart, { passive: true })
    window.addEventListener('touchmove', onTouchMove, { passive: false })
    window.addEventListener('pointerdown', onPointerDown)
  }
  document.fonts?.ready.then(() => chapters.forEach((ch) => { paginate(ch); ch.dirty = true }))
  window.addEventListener('scene-assets', () => chapters.forEach((ch) => { ch.dirty = true }))
  new IntersectionObserver(([entry]) => {
    inView = entry.isIntersecting
    if (inView) start()
  }, { rootMargin: '30% 0px' }).observe(root)
})()
</script>
<script src="note-end.js" defer></script>
</body>
