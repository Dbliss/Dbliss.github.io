<style>
:root {
  --bg: #fafaff; --ink: #111632; --muted: #626980; --line: #e2e4ee; --faint: #c9cde0; --accent: #6858e8;
  --stage-h: min(calc(100vh - 48px), 640px);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.5;
}
.page { width: min(1240px, 100% - 48px); margin: 0 auto; }
html, body { overflow-x: clip; }
.opening { position: relative; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(220px, .65fr); align-items: center; column-gap: clamp(32px, 6vw, 96px); min-height: 100svh; padding: 84px 0 84px; }
.back { position: absolute; top: 28px; left: 0; font-size: .9rem; font-weight: 650; color: var(--muted); text-decoration: none; opacity: 0; transition: opacity .6s ease .1s, color .2s ease; }
.opening-kicker { font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); opacity: 0; translate: 0 10px; transition: opacity .6s ease, translate .6s cubic-bezier(.2, .7, .2, 1); }
.opening-title { margin: 14px 0 0; font-size: clamp(2.8rem, 7vw, 6.2rem); font-weight: 800; line-height: .98; letter-spacing: -.055em; overflow-wrap: anywhere; }
.opening-title .ow { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
.opening-title .ow > span { display: inline-block; translate: 0 105%; transition: translate .95s cubic-bezier(.2, .8, .2, 1); }
.opening-rule { display: block; width: min(220px, 40%); height: 3px; margin-top: 30px; border-radius: 3px; background: var(--accent); transform: scaleX(0); transform-origin: left center; transition: transform 1s cubic-bezier(.65, 0, .35, 1) .55s; }
.opening-map { position: relative; margin: 0; padding: 0 0 0 24px; list-style: none; }
.opening-map::before { content: ''; position: absolute; left: 4px; top: 14px; bottom: 14px; border-left: 1px solid var(--faint); transform: scaleY(0); transform-origin: top center; transition: transform 1.2s cubic-bezier(.65, 0, .35, 1) .6s; }
.map-item { position: relative; display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 6px 0; border: 0; background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; opacity: 0; translate: -10px 0; transition: opacity .5s ease, translate .5s cubic-bezier(.2, .7, .2, 1), color .2s ease; transition-delay: calc(700ms + var(--i) * 70ms), calc(700ms + var(--i) * 70ms), 0s; }
.map-item::before { content: ''; position: absolute; left: -24px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border: 1.5px solid var(--faint); border-radius: 50%; background: var(--bg); transition: border-color .2s ease, background .2s ease; }

.opening-cue i { display: block; width: 1px; height: 28px; background: linear-gradient(var(--accent), transparent); transform-origin: top center; animation: cue 1.8s ease-in-out infinite; }
@keyframes cue { 0% { transform: scaleY(0); opacity: 1; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
.opening.play .back, .opening.play .opening-cue { opacity: 1; }
.opening.play .opening-kicker, .opening.play .map-item { opacity: 1; translate: 0 0; }
.opening.play .opening-title .ow > span { translate: 0 0; }

@media (max-width: 900px) {
  .opening { grid-template-columns: minmax(0, 1fr); align-content: center; row-gap: 40px; padding: 72px 0 48px; }
  .opening-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); column-gap: 16px; padding-left: 0; }
  .opening-map::before, .map-item::before { display: none; }
  .map-item { padding: 4px 0; font-size: .92rem; }
  .opening-cue { display: none; }
}
.back:hover, .back:focus-visible { color: var(--accent); }
.story { margin-top: 44px; }
.chapter { display: grid; grid-template-columns: minmax(0, 1.42fr) minmax(0, 1fr); column-gap: clamp(36px, 6vw, 84px); }
.chapter + .chapter { margin-top: clamp(72px, 14vh, 150px); }
.chapter.flip { grid-template-columns: minmax(0, 1fr) minmax(0, 1.42fr); }
.chapter.flip .stage-col { grid-column: 2; grid-row: 1; }
.chapter.flip .copy { grid-column: 1; grid-row: 1; }
.chapter { position: relative; }
.stage-col { position: relative; z-index: 2; transition: translate .95s cubic-bezier(.65, 0, .35, 1); }
.copy { position: relative; z-index: 1; }
.pages { display: grid; }
@property --fade { syntax: '<percentage>'; inherits: false; initial-value: 150%; }
.pg { grid-area: 1 / 1; align-self: center; min-width: 0; --fade: 150%; -webkit-mask-image: linear-gradient(var(--fade-dir, 90deg), #000 calc(var(--fade) - 35%), transparent var(--fade)); mask-image: linear-gradient(var(--fade-dir, 90deg), #000 calc(var(--fade) - 35%), transparent var(--fade)); transition: translate .95s cubic-bezier(.65, 0, .35, 1), opacity .7s ease, --fade .95s cubic-bezier(.65, 0, .35, 1); }
.chapter-cont { display: block; margin-bottom: 14px; font-size: .78rem; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.stage {
  position: sticky; top: calc((100vh - var(--stage-h)) / 2); height: var(--stage-h);
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--line); border-radius: 24px;
  background: radial-gradient(rgba(104, 88, 232, .13) 1px, transparent 1.4px) 0 0 / 22px 22px, linear-gradient(160deg, #fff 0%, #fbfaff 100%);
  box-shadow: 0 28px 70px rgba(27, 31, 69, .1);
  opacity: 0; transform: translateY(26px) scale(.985);
  transition: opacity .7s ease, transform .9s cubic-bezier(.2, .7, .2, 1);
}

.canvas-box { position: relative; flex: 1 1 0; min-height: 0; margin: 10px 10px 0; }

.copy { align-self: center; min-width: 0; }
.chapter-head { margin-bottom: 20px; }
.chapter-num { display: block; margin-bottom: 8px; font-size: .86rem; font-weight: 700; letter-spacing: .12em; color: var(--accent); }
.chapter-title { margin: 0; font-size: clamp(1.9rem, 3vw, 2.7rem); font-weight: 750; line-height: 1.04; letter-spacing: -.04em; }
.chapter-code { display: inline-block; margin-top: 12px; padding: 4px 10px; border-radius: 8px; font-size: .72rem; overflow-wrap: anywhere; background: color-mix(in srgb, var(--accent) 7%, transparent); color: var(--accent); }
.beat-text i { font-family: KaTeX_Math, "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", serif; font-style: italic; }

.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 .12em; font-size: .88em; line-height: 1.15; }
.frac > :first-child { padding: 0 .25em .12em; border-bottom: 1px solid currentColor; }
.frac > :last-child { padding: .12em .25em 0; }
.sqrt { display: inline-block; padding: .06em .12em 0; border-top: 1px solid currentColor; }

.steps { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.beat { display: grid; grid-template-columns: 3px minmax(0, 1fr); column-gap: 14px; width: 100%; padding: 8px 8px 8px 0; border: 0; background: none; font: inherit; text-align: left; color: var(--ink); cursor: pointer; opacity: .42; transition: opacity .5s ease; }
.beat:hover, .beat.active, .copy.done .beat { opacity: 1; }
.beat:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; border-radius: 6px; }
.beat-bar { display: block; border-radius: 3px; background: var(--line); overflow: hidden; }

.beat.active .beat-fill { transform: scaleY(var(--fill, 0)); }
.beat.past .beat-fill { transform: scaleY(1); }
.beat-text { font-size: clamp(1.02rem, 1.25vw, 1.14rem); line-height: 1.45; letter-spacing: -.01em; }
.mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.rail { position: fixed; right: 20px; top: 50%; z-index: 5; display: none; flex-direction: column; align-items: flex-end; gap: 2px; transform: translateY(-50%); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.rail.shown { opacity: 1; pointer-events: auto; }
.rail-item { display: flex; align-items: center; gap: 10px; height: 22px; padding: 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: .78rem; cursor: pointer; }
.rail-label { opacity: 0; transform: translateX(4px); transition: opacity .2s ease, transform .2s ease; }
.rail-mark { display: block; width: 14px; height: 3px; border-radius: 3px; background: var(--faint); transition: width .25s ease, background .25s ease; }
.rail-item:hover .rail-label, .rail-item:focus-visible .rail-label, .rail-item.on .rail-label { opacity: 1; transform: none; }
.rail-item.on { color: var(--ink); font-weight: 650; }
.rail-item.on .rail-mark { width: 28px; background: var(--accent); }
@media (min-width: 1360px) { .rail { display: flex; } }
@media (max-width: 900px) {
  :root { --stage-h: min(46svh, 400px); }
  .page { width: calc(100% - 32px); }
  .chapter, .chapter.flip { display: block; }
  .stage-col { display: contents; }
  .stage { top: 8px; z-index: 2; border-radius: 18px; background: radial-gradient(rgba(104, 88, 232, .13) 1px, transparent 1.4px) 0 0 / 22px 22px, #fff; }
  .canvas-box { margin: 6px 6px 0; }
  .ticks { padding: 6px 0 8px; }

}

  .stage, .beat, .tick, .rail, .rail-label, .rail-mark, .stage-col, .pg, .opening * { transition: none; }

  .stage { opacity: 1; transform: none; }
}

<body>
<div class="page">
  <section class="opening" aria-label="Introduction">
    <a class="back" href="../#/notes">← Study notes</a>
    <div class="opening-body">
      <div class="opening-kicker">Statistics · Machine learning</div>
      <h1 class="opening-title">The Kalman filter</h1>
      <span class="opening-rule" aria-hidden="true"></span>
    </div>
    <ol class="opening-map" aria-label="Chapters"></ol>
    <div class="opening-cue"><i aria-hidden="true"></i>Scroll to begin · ← → to step through</div>
  </section>
  <main id="story" class="story"></main>
</div>

<script>
// ===== DRAWING HELPERS (keep these; add more in the content section if needed) =====
const C = {
  ink: '#111632', muted: '#626980', dim: '#8a90ad', faint: '#c9cde0',
  one: '#e4002b', two: '#c08a12', accent: '#1aa3c2', hi: '#6858e8',
  green: '#0e9f6e', pink: '#d63d8f', surface: '#ffffff', track: 'rgba(17,22,50,0.07)'
}
const MONO = "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
const MATH = 'KaTeX_Main, "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", serif'
const TAU = Math.PI * 2
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, t) => a + (b - a) * t
const seg = (p, a, b) => clamp((p - a) / (b - a))
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)
const easeOut = (t) => 1 - Math.pow(1 - t, 3)
const backOut = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2) }
function rng (seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6d2b79f5) >>> 0
    let t = a
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

let ctx = null
let W = 0
let H = 0
let NARROW = false
let U = 1
let GA = 1
let FONT = 'system-ui, sans-serif'
let T = 0
let LIVE = false

const fz = (n) => Math.max(8.5, n * U)
const cycle = (period, offset = 0) => (T / period + offset) % 1
const pulse = (period = 1800, offset = 0) => (LIVE ? 0.5 + 0.5 * Math.sin(TAU * cycle(period, offset)) : 1)
const bob = (seed, amount = 2) => (LIVE ? Math.sin(T / 520 + seed) * amount : 0)
function A (a = 1) { ctx.globalAlpha = clamp(GA * a) }
function group (a, fn) {
  if (a <= 0) return
  const parent = GA
  GA = parent * a
  fn()
  GA = parent
}
function rgba (hex, a) {
  const n = parseInt(hex.slice(1), 16)
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`
}
function txt (s, x, y, o = {}) {
  const { size = 11, color = C.ink, align = 'left', weight = 500, mono = false, math = false, base = 'middle', alpha = 1 } = o
  if (math) return drawMath(s, x, y, { size: size * 1.12, color, align, weight, alpha, base })
  A(alpha)
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  ctx.fillStyle = color
  ctx.textAlign = align
  ctx.textBaseline = base
  ctx.fillText(s, x, y)
}
// Typeset a small maths expression: single letters italic, numbers and longer words upright,
// `_x` / `^x` (or `_{xy}`) as subscripts and superscripts.
function mathRuns (s) {
  const runs = []
  const push = (t, level) => {
    const re = /([A-Za-zα-ωΑ-Ω]+)|([^A-Za-zα-ωΑ-Ω]+)/g
    let m
    while ((m = re.exec(t))) {
      if (m[1]) {
        // A single letter straight after a number and a space is a unit (4 m), so it stays upright.
        const prev = runs[runs.length - 1]
        const unit = m[1].length === 1 && prev && prev.level === level && /\d\s$/.test(prev.t)
        runs.push({ t: m[1], italic: m[1].length < 3 && !unit, level })
      }
      else runs.push({ t: m[2], italic: false, level })
    }
  }
  let i = 0
  while (i < s.length) {
    const c = s[i]
    if ((c === '_' || c === '^') && i + 1 < s.length) {
      const level = c === '_' ? -1 : 1
      if (s[i + 1] === '{') {
        const j = s.indexOf('}', i + 2)
        push(s.slice(i + 2, j < 0 ? s.length : j), level)
        i = j < 0 ? s.length : j + 1
      } else {
        push(s[i + 1], level)
        i += 2
      }
    } else {
      let j = i
      while (j < s.length && s[j] !== '_' && s[j] !== '^') j++
      push(s.slice(i, j), 0)
      i = j
    }
  }
  return runs
}
function drawMath (s, x, y, o) {
  const runs = mathRuns(s)
  const fontFor = (r) => `${r.italic ? 'italic ' : ''}${o.weight} ${r.level ? o.size * 0.68 : o.size}px ${MATH}`
  let total = 0
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    r.w = ctx.measureText(r.t).width + (r.italic && !r.level ? o.size * 0.04 : 0)
    total += r.w
  })
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x
  A(o.alpha)
  ctx.fillStyle = o.color
  ctx.textAlign = 'left'
  ctx.textBaseline = o.base
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    ctx.fillText(r.t, cx, y + (r.level < 0 ? o.size * 0.3 : r.level > 0 ? -o.size * 0.36 : 0))
    cx += r.w
  })
}
// Stacked maths lines for derivations and slow worked examples. The newest revealed line is highlighted.
function formulaSteps (lines, x, y, shown, o = {}) {
  const { size = fz(15), gap = fz(30), align = 'left' } = o
  lines.forEach((s, i) => {
    const a = clamp(shown - i)
    if (a <= 0) return
    const current = shown - i < 2 && i === Math.min(lines.length - 1, Math.ceil(shown) - 1)
    txt(s, x, y + i * gap, { size, math: true, color: current ? C.hi : C.ink, align, alpha: easeOut(a) * (current ? 1 : 0.75) })
  })
}
function measure (s, size, weight = 500, mono = false) {
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  return ctx.measureText(s).width
}
function rr (x, y, w, h, r) {
  ctx.beginPath()
  ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r)
}
function line (x1, y1, x2, y2, color, w = 1, a = 1, dash = null) {
  A(a)
  ctx.strokeStyle = color
  ctx.lineWidth = w
  if (dash) ctx.setLineDash(dash)
  ctx.beginPath()
  ctx.moveTo(x1, y1)
  ctx.lineTo(x2, y2)
  ctx.stroke()
  if (dash) ctx.setLineDash([])
}
function dot (x, y, r, color, a = 1) {
  A(a)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.arc(x, y, Math.max(0.1, r), 0, TAU)
  ctx.fill()
}
function glow (x, y, r, color, a = 1) {
  A(a)
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4)
  g.addColorStop(0, rgba(color, 0.3))
  g.addColorStop(1, rgba(color, 0))
  ctx.fillStyle = g
  ctx.beginPath()
  ctx.arc(x, y, r * 4, 0, TAU)
  ctx.fill()
  dot(x, y, r, color, a)
  dot(x, y, r * 0.42, '#ffffff', a)
}
function softShadow (on) {
  ctx.shadowColor = on ? 'rgba(27,31,69,0.08)' : 'transparent'
  ctx.shadowBlur = on ? 14 : 0
  ctx.shadowOffsetY = on ? 4 : 0
}
function panel (x, y, w, h, a = 1, border = C.hi) {
  A(a)
  softShadow(true)
  rr(x, y, w, h, 12)
  ctx.fillStyle = C.surface
  ctx.fill()
  softShadow(false)
  ctx.strokeStyle = rgba(border, 0.4)
  ctx.lineWidth = 1
  ctx.stroke()
}
function qb (a, c, b, t) {
  const u = 1 - t
  return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }
}
// A glowing dot with a tail, arcing from a to b as t goes 0..1.
function flight (a, b, t, color, r = 2.4, lift = 40) {
  if (t <= 0 || t >= 1.25) return
  const c = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - lift }
  for (let k = 6; k >= 0; k--) {
    const tt = t - k * 0.04
    if (tt < 0 || tt > 1) continue
    const q = qb(a, c, b, ease(tt))
    if (k === 0) glow(q.x, q.y, r, color)
    else dot(q.x, q.y, r * (1 - k / 9), color, 0.45 * (1 - k / 7))
  }
}
function polyLen (pts) {
  const L = [0]
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y))
  return L
}
function along (pts, L, t) {
  const d = clamp(t) * L[L.length - 1]
  let i = 1
  while (i < L.length - 1 && L[i] < d) i++
  const s = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1)
  return { x: lerp(pts[i - 1].x, pts[i].x, s), y: lerp(pts[i - 1].y, pts[i].y, s) }
}
// Draws a path up to t (0..1) and returns its leading point.
function tracePath (pts, t, color, width = 2.2, a = 1) {
  const L = polyLen(pts)
  const total = L[L.length - 1] || 1
  for (let s = 1; s < pts.length; s++) {
    if (t * total < L[s - 1]) break
    const end = t * total < L[s] ? along(pts, L, t) : pts[s]
    line(pts[s - 1].x, pts[s - 1].y, end.x, end.y, color, width, a)
  }
  return along(pts, L, t)
}
// Looping: small dots travelling along a path.
function runner (pts, offset = 0, color = C.hi, alpha = 1, period = 2600) {
  if (!LIVE || alpha <= 0 || pts.length < 2) return
  const L = polyLen(pts)
  const t = cycle(period, offset)
  const fade = Math.sin(Math.PI * t) * alpha
  for (let k = 4; k >= 0; k--) {
    const tail = t - k * 0.018
    if (tail < 0) continue
    const q = along(pts, L, tail)
    dot(q.x, q.y, k ? 1.5 : 2.8, color, fade * (1 - k / 6))
  }
}
// Looping: an expanding ring.
function ripple (x, y, r0, r1, color, a = 1, period = 2000, offset = 0) {
  if (!LIVE || a <= 0) return
  const t = cycle(period, offset)
  A(a * (1 - t) * 0.55)
  ctx.beginPath()
  ctx.arc(x, y, lerp(r0, r1, t), 0, TAU)
  ctx.strokeStyle = color
  ctx.lineWidth = 1.4
  ctx.stroke()
}
function treeLayout (cx, top, w, h, depth = 3) {
  const lv = []
  for (let l = 0; l <= depth; l++) {
    const n = 1 << l
    lv.push(Array.from({ length: n }, (_, i) => ({ x: cx - w / 2 + (i + 0.5) * w / n, y: top + l * h / depth })))
  }
  return lv
}
const treePath = (lv, leaf) => lv.map((nodes, l) => nodes[leaf >> (lv.length - 1 - l)])
function drawTree (lv, a = 1, r = 2.2) {
  for (let l = 0; l < lv.length - 1; l++) {
    lv[l].forEach((n, i) => {
      line(n.x, n.y, lv[l + 1][2 * i].x, lv[l + 1][2 * i].y, C.faint, 1, a)
      line(n.x, n.y, lv[l + 1][2 * i + 1].x, lv[l + 1][2 * i + 1].y, C.faint, 1, a)
    })
  }
  lv.forEach((nodes) => nodes.forEach((n) => dot(n.x, n.y, r, C.faint, a)))
}
// A code listing. `active` is a line index and may be fractional, so the highlight can slide between lines.
function codeBlock (lines, x, y, w, h, active, a = 1) {
  panel(x, y, w, h, a, C.faint)
  const lh = Math.min(fz(22), (h - 20) / lines.length)
  const longest = Math.max(...lines.map((s) => s.length), 1)
  const size = Math.min(lh * 0.64, (w - 28) / (longest * 0.62))
  const top = y + (h - lh * lines.length) / 2
  const at = clamp(active, 0, lines.length - 1)
  A(a * 0.1)
  ctx.fillStyle = C.hi
  rr(x + 6, top + at * lh, w - 12, lh, 5)
  ctx.fill()
  lines.forEach((s, n) => {
    const on = Math.abs(n - at) < 0.5
    txt(s, x + 14, top + (n + 0.5) * lh, { size, mono: true, color: on ? C.ink : C.muted, weight: on ? 700 : 500, alpha: a })
  })
}

// ===== CONTENT: the Kalman filter =====
// One worked example: a car on a straight road with a noisy GPS.
// Start: best guess 100 m, σ 4 m. It drives 10 m/s with σ 3 m of motion noise per second. GPS has σ 5 m.

const M0 = 100
const S0 = 4
const SPEED = 10
const Q = 9
const R = 25
const GPS = 116
const TRUE0 = 101.5
const TRUE1 = 112
const PRIOR = { m: M0 + SPEED, P: S0 * S0 + Q }
const GAIN = PRIOR.P / (PRIOR.P + R)
const POST = { m: PRIOR.m + GAIN * (GPS - PRIOR.m), P: (1 - GAIN) * PRIOR.P }
const R_BAD = 100
const GAIN_BAD = PRIOR.P / (PRIOR.P + R_BAD)
const POST_BAD = { m: PRIOR.m + GAIN_BAD * (GPS - PRIOR.m), P: (1 - GAIN_BAD) * PRIOR.P }
const sd = (P) => Math.sqrt(P)
const f1 = (v) => v.toFixed(1)
const f2 = (v) => v.toFixed(2)

// Twenty seconds of the same filter, with simulated truth and GPS readings.
const LOOP = (() => {
  const r = rng(1140)
  const g = () => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(TAU * r())
  const N = 20
  const truth = [TRUE0]
  const gps = [null]
  const mPre = [M0]
  const PPre = [S0 * S0]
  const mPost = [M0]
  const PPost = [S0 * S0]
  for (let k = 1; k <= N; k++) {
    truth.push(truth[k - 1] + SPEED + g() * 3)
    gps.push(truth[k] + g() * 5)
    mPre.push(mPost[k - 1] + SPEED)
    PPre.push(PPost[k - 1] + Q)
    const K = PPre[k] / (PPre[k] + R)
    mPost.push(mPre[k] + K * (gps[k] - mPre[k]))
    PPost.push((1 - K) * PPre[k])
  }
  const rms = (xs) => Math.sqrt(xs.reduce((s, v) => s + v * v, 0) / xs.length)
  const rmsG = rms(gps.slice(1).map((z, i) => z - truth[i + 1]))
  const rmsF = rms(mPost.slice(1).map((m, i) => m - truth[i + 1]))
  const steady = (-9 + Math.sqrt(81 + 4 * R * Q)) / 2 // P⁺ where widening and narrowing balance
  const plan = (k) => M0 + SPEED * k
  return { N, truth, gps, mPre, PPre, mPost, PPost, rmsG, rmsF, steady, plan }
})()

// Esports ratings: one player's uncertainty over a season, and an upset for a new and a veteran player.
const RATE = (() => {
  const q = 400
  const r = 150 * 150
  const games = [0, 2, 4, 6, 8, 10, 12, 38, 40, 42]
  const days = []
  let P = 200 * 200
  let last = 0
  for (let d = 0; d <= 50; d++) {
    P += q * (d - last)
    last = d
    const pre = P
    if (games.includes(d)) P = P * r / (P + r)
    days.push({ d, pre, post: P })
  }
  const surprise = 120
  const players = [
    { name: 'new player', P: 200 * 200 },
    { name: 'veteran', P: 50 * 50 }
  ].map((pl) => {
    const K = pl.P / (pl.P + r)
    return { ...pl, K, move: K * surprise, after: (1 - K) * pl.P }
  })
  return { games, days, players, surprise, r }
})()

// ---------- shared pieces ----------
function arrow (x1, y1, x2, y2, color, a = 1, w = 2) {
  if (a <= 0) return
  line(x1, y1, x2, y2, color, w, a)
  const ang = Math.atan2(y2 - y1, x2 - x1)
  const s = 5 + w * 1.5
  A(a)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.moveTo(x2, y2)
  ctx.lineTo(x2 - s * Math.cos(ang - 0.45), y2 - s * Math.sin(ang - 0.45))
  ctx.lineTo(x2 - s * Math.cos(ang + 0.45), y2 - s * Math.sin(ang + 0.45))
  ctx.closePath()
  ctx.fill()
}

function chip (s, x, y, color, a = 1, filled = false, size = fz(10.5)) {
  if (a <= 0) return
  const w = measure(s, size, 700, true) + 16
  const h = size + 10
  A(a)
  rr(x - w / 2, y - h / 2, w, h, h / 2)
  ctx.fillStyle = filled ? color : C.surface
  ctx.fill()
  ctx.strokeStyle = rgba(color, 0.5)
  ctx.lineWidth = 1
  ctx.stroke()
  txt(s, x, y, { size, mono: true, weight: 700, color: filled ? '#ffffff' : color, align: 'center', alpha: a })
}

// The road, as a number line in metres.
function road (lo, hi, a = 1, label = 'position along the road (m)', step = 10) {
  const x0 = W * 0.06
  const x1 = W * 0.94
  const y0 = H * 0.13
  const y1 = H * 0.74
  const X = (v) => lerp(x0, x1, (v - lo) / (hi - lo))
  if (a > 0) {
    line(x0, y1, x1, y1, C.ink, 1.4, a * 0.6)
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
      line(X(v), y1, X(v), y1 + 5, C.dim, 1, a)
      txt(`${v}`, X(v), y1 + fz(15), { size: fz(10), color: C.dim, mono: true, align: 'center', alpha: a })
    }
    txt(label, (x0 + x1) / 2, y1 + fz(33), { size: fz(10.5), color: C.muted, align: 'center', alpha: a })
  }
  return { x0, x1, y0, y1, X, lo, hi }
}

const bellPeak = (ax, s) => Math.min(0.95, 0.85 * (3 / s)) * (ax.y1 - ax.y0)

function bellPath (ax, mu, s, from, to, grow = 1) {
  const peak = bellPeak(ax, s) * grow
  const pts = []
  for (let i = 0; i <= 120; i++) {
    const v = lerp(from, to, i / 120)
    pts.push({ x: ax.X(v), y: ax.y1 - peak * Math.exp(-0.5 * ((v - mu) / s) ** 2) })
  }
  return pts
}

// A belief drawn as a bell curve; returns the peak point.
function bell (ax, mu, s, color, a = 1, { fill = 0.14, width = 2.2, grow = 1, dash = null } = {}) {
  if (a <= 0) return null
  const pts = bellPath(ax, Math.max(ax.lo, Math.min(ax.hi, mu)), s, Math.max(ax.lo, mu - 4 * s), Math.min(ax.hi, mu + 4 * s), grow)
  ctx.save()
  ctx.beginPath()
  ctx.rect(ax.x0, 0, ax.x1 - ax.x0, H)
  ctx.clip()
  if (fill > 0) {
    A(a * fill)
    ctx.fillStyle = color
    ctx.beginPath()
    ctx.moveTo(pts[0].x, ax.y1)
    pts.forEach((q) => ctx.lineTo(q.x, q.y))
    ctx.lineTo(pts[pts.length - 1].x, ax.y1)
    ctx.closePath()
    ctx.fill()
  }
  A(a)
  ctx.strokeStyle = color
  ctx.lineWidth = width
  if (dash) ctx.setLineDash(dash)
  ctx.beginPath()
  pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)))
  ctx.stroke()
  ctx.setLineDash([])
  ctx.restore()
  return { x: ax.X(mu), y: ax.y1 - bellPeak(ax, s) * grow }
}

function bellBand (ax, mu, s, k, color, alpha) {
  if (alpha <= 0) return
  const pts = bellPath(ax, mu, s, mu - k * s, mu + k * s)
  A(alpha)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.moveTo(pts[0].x, ax.y1)
  pts.forEach((q) => ctx.lineTo(q.x, q.y))
  ctx.lineTo(pts[pts.length - 1].x, ax.y1)
  ctx.closePath()
  ctx.fill()
}

function car (x, y, s, a = 1, color = C.ink) {
  if (a <= 0) return
  A(a)
  ctx.fillStyle = color
  rr(x - s, y - s * 0.55, s * 2, s * 0.42, s * 0.14)
  ctx.fill()
  rr(x - s * 0.55, y - s * 0.9, s * 1.05, s * 0.4, s * 0.16)
  ctx.fill()
  dot(x - s * 0.55, y - s * 0.12, s * 0.2, color, a)
  dot(x + s * 0.55, y - s * 0.12, s * 0.2, color, a)
}

function truthMark (ax, v, a, label = 'true position') {
  if (a <= 0) return
  const s = Math.max(9, W * 0.022)
  car(ax.X(v), ax.y1 - 2, s, a * 0.85, C.ink)
  txt(label, ax.X(v), ax.y1 + fz(48), { size: fz(10), color: C.ink, weight: 700, align: 'center', alpha: a * 0.8 })
}

// ---------- 01 · a belief ----------
function sceneBelief (p) {
  const ax = road(85, 145, easeOut(seg(p, 0, 0.15)))
  const carA = easeOut(seg(p, 0.1, 0.3))
  truthMark(ax, TRUE0, carA, 'true position: unknown')
  chip('?', ax.X(TRUE0), ax.y1 - Math.max(9, W * 0.022) * 2.2, C.pink, carA * (1 - 0.7 * seg(p, 1, 1.2)))

  const grow = easeOut(seg(p, 1.05, 1.5))
  const band = easeOut(seg(p, 2.05, 2.35))
  bellBand(ax, M0, S0, 2, C.accent, band * 0.1)
  bellBand(ax, M0, S0, 1, C.accent, band * 0.18)
  const top = bell(ax, M0, S0, C.accent, grow > 0 ? 1 : 0, { grow })
  if (top) txt(`best guess ${M0} m`, top.x, top.y - fz(14), { size: fz(12), color: C.accent, weight: 700, align: 'center', alpha: easeOut(seg(p, 1.3, 1.5)) })

  if (band > 0) {
    const by = ax.y1 - bellPeak(ax, S0) * 0.6
    line(ax.X(M0 - S0), by, ax.X(M0 + S0), by, C.hi, 1.8, band)
    ;[-1, 1].forEach((sgn) => line(ax.X(M0 + sgn * S0), by - 5, ax.X(M0 + sgn * S0), by + 5, C.hi, 1.8, band))
    txt('σ = 4 m', ax.X(M0 + S0) + 8, by, { size: fz(13), color: C.hi, math: true, alpha: band })
    txt('68%', ax.X(M0), ax.y1 - fz(14), { size: fz(11), color: C.hi, mono: true, weight: 700, align: 'center', alpha: band })
    txt('95%', ax.X(M0 + 1.6 * S0), ax.y1 - fz(10), { size: fz(9.5), color: C.accent, mono: true, weight: 700, align: 'center', alpha: band * 0.85 })
  }
  txt('σ² = 4 × 4 = 16', ax.X(126), H * 0.3, { size: fz(17), color: C.hi, math: true, align: 'center', alpha: easeOut(seg(p, 3.05, 3.3)) })
  txt(NARROW ? 'the variance' : 'the variance', ax.X(126), H * 0.3 + fz(24), { size: fz(11), color: C.muted, weight: 600, align: 'center', alpha: easeOut(seg(p, 3.15, 3.4)) })
}

// ---------- 02 · predict ----------
function scenePredict (p) {
  const ax = road(85, 145, 1)
  const move = ease(seg(p, 0.15, 0.75))
  const widen = ease(seg(p, 3.3, 3.95))
  const mu = lerp(M0, PRIOR.m, move)
  const s = lerp(S0, sd(PRIOR.P), widen)
  truthMark(ax, lerp(TRUE0, TRUE1, move), 1)
  bell(ax, M0, S0, C.accent, 0.35 * seg(p, 0.15, 0.3), { fill: 0, width: 1.4, dash: [4, 4] })
  const top = bell(ax, mu, s, C.accent, 1)
  const ma = easeOut(seg(p, 0.2, 0.4)) * (1 - seg(p, 1, 1.2))
  arrow(ax.X(M0), H * 0.08, ax.X(lerp(M0, PRIOR.m, move)), H * 0.08, C.accent, ma, 2)
  txt('+10 m in one second', ax.X(105), H * 0.08 - fz(14), { size: fz(11), color: C.accent, weight: 700, align: 'center', alpha: ma })
  if (top) txt(`${f1(mu)} m`, top.x, top.y - fz(14), { size: fz(12), color: C.accent, mono: true, weight: 700, align: 'center' })

  // Beat 1: the motion's own uncertainty, as a small gold bell.
  const qa = easeOut(seg(p, 1.1, 1.4)) * (1 - seg(p, 3.9, 4.1))
  const qb = bell(ax, PRIOR.m, 3, C.two, qa, { fill: 0.08, width: 1.6, dash: [5, 4] })
  if (qb) txt('motion noise, σ = 3', qb.x + fz(70), qb.y + fz(6), { size: fz(11), color: C.two, weight: 700, alpha: qa })

  // Beat 2: independent errors combine like the sides of a right triangle.
  const ta = easeOut(seg(p, 2.05, 2.35)) * (1 - seg(p, 3, 3.15))
  if (ta > 0) {
    const u = Math.min(W * 0.045, H * 0.06)
    const ox = W * 0.68
    const oy = H * 0.42
    const draw = ease(seg(p, 2.1, 2.7))
    line(ox, oy, ox + 4 * u, oy, C.accent, 3, ta)
    line(ox + 4 * u, oy, ox + 4 * u, oy - 3 * u * draw, C.two, 3, ta)
    if (draw > 0.95) line(ox, oy, ox + 4 * u, oy - 3 * u, C.hi, 3, ta)
    txt('4', ox + 2 * u, oy + fz(13), { size: fz(13), math: true, color: C.accent, align: 'center', alpha: ta })
    txt('3', ox + 4 * u + 10, oy - 1.5 * u, { size: fz(13), math: true, color: C.two, alpha: ta * draw })
    txt('√(4² + 3²) = 5', ox + 1.6 * u, oy - 2.4 * u, { size: fz(14), math: true, color: C.hi, align: 'right', alpha: ta * easeOut(seg(p, 2.6, 2.8)) })
  }

  // Beat 3: the slow example; the bell widens as each line arrives.
  formulaSteps(['σ² ← σ² + q', 'σ² = 16 + 9', 'σ² = 25', 'σ = √25 = 5'], W * 0.64, H * 0.12, 4 * ease(seg(p, 3.05, 3.95)), { size: fz(15), gap: fz(28) })

  const fa = easeOut(seg(p, 4.05, 4.35))
  ;[[120, Math.sqrt(16 + 18)], [130, Math.sqrt(16 + 27)]].forEach(([m, s2], i) => {
    const a = fa * easeOut(seg(p, 4.05 + i * 0.2, 4.35 + i * 0.2))
    const t = bell(ax, m, s2, C.dim, a, { fill: 0.06, width: 1.6, dash: [5, 4] })
    if (t) txt(`σ ${f1(s2)}`, t.x, t.y - fz(12), { size: fz(11), color: C.muted, mono: true, weight: 700, align: 'center', alpha: a })
  })
}

// ---------- 03 · measure ----------
function sceneMeasure (p) {
  const ax = road(85, 145, 1)
  truthMark(ax, TRUE1, 1)
  const prior = bell(ax, PRIOR.m, sd(PRIOR.P), C.accent, 1)
  txt('prediction 110', prior.x - 8, prior.y - fz(14), { size: fz(11.5), color: C.accent, weight: 700, align: 'right' })
  const ga = easeOut(seg(p, 0.15, 0.5))
  const gps = bell(ax, GPS, sd(R), C.two, ga, { grow: ga })
  if (gps) {
    txt('GPS 116', gps.x + 8, gps.y - fz(14), { size: fz(11.5), color: C.two, weight: 700, alpha: ga })
    dot(ax.X(GPS), ax.y1, 4, C.two, ga)
    ripple(ax.X(GPS), ax.y1, 4, 18, C.two, ga, 1600)
  }
  const da = easeOut(seg(p, 1.1, 1.4))
  if (da > 0) {
    const y = prior.y - fz(36)
    line(ax.X(PRIOR.m), y, ax.X(GPS), y, C.pink, 2, da)
    ;[PRIOR.m, GPS].forEach((v) => line(ax.X(v), y - 5, ax.X(v), y + 5, C.pink, 2, da))
    txt('6 m apart', ax.X((PRIOR.m + GPS) / 2), y - fz(13), { size: fz(12), color: C.pink, weight: 700, align: 'center', alpha: da })
  }
}

// ---------- 04 · combining two guesses ----------
function weightTag (ax, v, s, label, color, a) {
  if (a <= 0) return
  txt(label, ax.X(v), ax.y1 - bellPeak(ax, s) - fz(16), { size: fz(12), math: true, color, align: 'center', alpha: a })
}

function sceneCombine (p) {
  const ax = road(85, 145, 1)
  truthMark(ax, TRUE1, 0.4)
  const bad = ease(seg(p, 3.05, 3.4))
  const gpsS = lerp(sd(R), sd(R_BAD), bad)
  bell(ax, PRIOR.m, sd(PRIOR.P), C.accent, 0.55, { fill: 0.06, width: 1.8 })
  bell(ax, GPS, gpsS, C.two, 0.55, { fill: 0.06, width: 1.8 })

  // Beat 0: the plain average.
  const avgA = easeOut(seg(p, 0.15, 0.4)) * (1 - seg(p, 1, 1.15))
  if (avgA > 0) {
    const x = ax.X((PRIOR.m + GPS) / 2)
    line(x, ax.y0 + fz(30), x, ax.y1, C.ink, 1.6, avgA, [4, 3])
    txt('(110 + 116) ÷ 2 = 113', x, ax.y0 + fz(16), { size: fz(14), math: true, color: C.ink, align: 'center', alpha: avgA })
  }

  // Beat 1: weights are precisions, 1 ÷ variance.
  const wa = easeOut(seg(p, 1.1, 1.4))
  weightTag(ax, PRIOR.m, sd(PRIOR.P), 'weight 1/25', C.accent, wa)
  weightTag(ax, GPS, gpsS, bad > 0.5 ? 'weight 1/100' : 'weight 1/25', C.two, wa)

  // Beat 2: the weighted average, worked through; the result slides in as the lines arrive.
  const lines = ['μ = (μ_p ÷ σ² + z ÷ r) ÷ (1 ÷ σ² + 1 ÷ r)', 'μ = (110 ÷ 25 + 116 ÷ 25) ÷ (1 ÷ 25 + 1 ÷ 25)', 'μ = (4.4 + 4.64) ÷ 0.08', 'μ = 113']
  const linesBad = ['μ = (μ_p ÷ σ² + z ÷ r) ÷ (1 ÷ σ² + 1 ÷ r)', 'μ = (110 ÷ 25 + 116 ÷ 100) ÷ (1 ÷ 25 + 1 ÷ 100)', 'μ = (4.4 + 1.16) ÷ 0.05', `μ = ${f1(POST_BAD.m)}`]
  const steps = 4 * ease(seg(p, 2.05, 2.9))
  group(1 - bad, () => formulaSteps(lines, W / 2, H * 0.06, steps, { size: fz(NARROW ? 11 : 14), gap: fz(24), align: 'center' }))
  group(bad, () => formulaSteps(linesBad, W / 2, H * 0.06, 4 * ease(seg(p, 3.3, 3.9)), { size: fz(NARROW ? 11 : 14), gap: fz(24), align: 'center' }))
  const resA = easeOut(seg(p, 2.6, 2.9))
  const resM = lerp(POST.m, POST_BAD.m, bad)
  if (resA > 0) {
    const x = ax.X(lerp(PRIOR.m, resM, resA))
    line(x, ax.y1 - bellPeak(ax, 4) * 0.9, x, ax.y1, C.hi, 2.6, resA)
    glow(x, ax.y1, 4, C.hi, resA)
    txt(`${f1(resM)}`, x, ax.y1 - bellPeak(ax, 4) * 0.9 - fz(12), { size: fz(13), mono: true, weight: 700, color: C.hi, align: 'center', alpha: resA })
  }
}

// ---------- 05 · the Kalman gain ----------
function sceneGain (p) {
  const ax = road(85, 145, 1)
  bell(ax, PRIOR.m, sd(PRIOR.P), C.accent, 0.5, { fill: 0.05, width: 1.6 })
  bell(ax, GPS, sd(R), C.two, 0.5, { fill: 0.05, width: 1.6 })
  const algebra = [
    'μ = (μ_p ÷ σ² + z ÷ r) ÷ (1 ÷ σ² + 1 ÷ r)',
    'μ = (r μ_p + σ² z) ÷ (σ² + r)',
    'μ = μ_p + σ² ÷ (σ² + r) × (z − μ_p)',
    'K = σ² ÷ (σ² + r)'
  ]
  const shown = 2 * ease(seg(p, 0.1, 0.8)) + 2 * ease(seg(p, 1.1, 1.8))
  group(1 - seg(p, 3, 3.15), () => formulaSteps(algebra, W / 2, H * 0.06, shown, { size: fz(NARROW ? 11.5 : 14), gap: fz(25), align: 'center' }))

  // Beat 2: K slides between ignoring the GPS (0) and believing it completely (1).
  const ka = easeOut(seg(p, 2.05, 2.3)) * (1 - seg(p, 3, 3.15))
  if (ka > 0) {
    const y = ax.y1 - bellPeak(ax, sd(R)) - fz(30)
    const k = LIVE ? 0.5 + 0.5 * Math.sin(T / 900) : 0.5
    line(ax.X(PRIOR.m), y, ax.X(GPS), y, C.hi, 2, ka)
    glow(ax.X(PRIOR.m + k * (GPS - PRIOR.m)), y, 4, C.hi, ka)
    txt('K = 0', ax.X(PRIOR.m) - 8, y, { size: fz(12), math: true, color: C.accent, align: 'right', alpha: ka })
    txt('K = 1', ax.X(GPS) + 8, y, { size: fz(12), math: true, color: C.two, alpha: ka })
  }

  // Beat 3: the slow example, with the guess moving as the numbers go in.
  const ex = ['K = 25 ÷ (25 + 25) = 0.5', 'μ = 110 + 0.5 × (116 − 110)', 'μ = 110 + 3', 'μ = 113']
  const n = 4 * ease(seg(p, 3.1, 3.95))
  formulaSteps(ex, W / 2, H * 0.06, n, { size: fz(NARROW ? 12 : 15), gap: fz(26), align: 'center' })
  const move = ease(seg(n, 2.2, 3.2))
  if (n > 1) {
    const y = ax.y1 + fz(62)
    arrow(ax.X(PRIOR.m), y, ax.X(PRIOR.m + GAIN * (GPS - PRIOR.m) * Math.max(0.02, move)), y, C.hi, 1, 2.4)
    if (move > 0.95) glow(ax.X(POST.m), ax.y1, 4, C.hi)
  }
}

// ---------- 06 · the new uncertainty ----------
function sceneVariance (p) {
  const ax = road(85, 145, 1)
  const bad = ease(seg(p, 3.05, 3.4))
  truthMark(ax, TRUE1, easeOut(seg(p, 2.5, 2.7)), 'actually at 112 m')
  bell(ax, PRIOR.m, sd(PRIOR.P), C.accent, 0.4, { fill: 0.04, width: 1.4 })
  bell(ax, GPS, lerp(sd(R), sd(R_BAD), bad), C.two, 0.4, { fill: 0.04, width: 1.4 })

  const derive = ['1 ÷ σ²_{new} = 1 ÷ σ² + 1 ÷ r', 'σ²_{new} = σ² r ÷ (σ² + r)', 'σ²_{new} = (1 − K) σ²']
  const dn = 2 * ease(seg(p, 0.1, 0.8)) + ease(seg(p, 1.1, 1.6))
  group(1 - seg(p, 2, 2.15), () => formulaSteps(derive, W / 2, H * 0.06, dn, { size: fz(NARROW ? 12 : 15), gap: fz(26), align: 'center' }))

  const ex = ['σ²_{new} = (1 − 0.5) × 25', 'σ²_{new} = 12.5', 'σ_{new} ≈ 3.5']
  const exBad = ['σ²_{new} = (1 − 0.2) × 25', 'σ²_{new} = 20', 'σ_{new} ≈ 4.5']
  const n = 3 * ease(seg(p, 2.1, 2.8))
  group(seg(p, 2, 2.1) * (1 - bad), () => formulaSteps(ex, W / 2, H * 0.06, n, { size: fz(15), gap: fz(26), align: 'center' }))
  group(bad, () => formulaSteps(exBad, W / 2, H * 0.06, 3 * ease(seg(p, 3.3, 3.9)), { size: fz(15), gap: fz(26), align: 'center' }))

  // The new belief narrows as the numbers arrive.
  const narrow = p < 2 ? 0 : ease(seg(n, 0.8, 2))
  const mu = lerp(POST.m, POST_BAD.m, bad)
  const s = lerp(lerp(sd(PRIOR.P), sd(POST.P), narrow), sd(POST_BAD.P), bad)
  const show = p < 2 ? easeOut(seg(p, 0.1, 0.4)) * 0.5 : 1
  const top = bell(ax, mu, s, C.hi, show, { fill: 0.16, width: 2.6 })
  if (top && p >= 2) txt(`σ ≈ ${f1(s)}`, top.x + fz(30), top.y, { size: fz(13), math: true, color: C.hi })
}

// ---------- 05 · the loop ----------
function sceneLoop (p) {
  const L = LOOP
  const x0 = W * (NARROW ? 0.13 : 0.1)
  const x1 = W * 0.96
  const y0 = H * 0.12
  const y1 = H * 0.8
  const X = (t) => lerp(x0, x1, t / L.N)
  const Y = (v) => lerp(y1, y0, (v + 15) / 30)
  const dev = (v, k) => v - L.plan(k)
  const a0 = easeOut(seg(p, 0, 0.15))
  ;[-10, 0, 10].forEach((v) => {
    line(x0, Y(v), x1, Y(v), C.faint, 1, a0 * (v === 0 ? 0.9 : 0.4))
    txt(`${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v)}`, x0 - 8, Y(v), { size: fz(10), color: C.dim, mono: true, align: 'right', alpha: a0 })
  })
  for (let t = 0; t <= L.N; t += 5) txt(`${t}`, X(t), y1 + fz(14), { size: fz(10), color: C.dim, mono: true, align: 'center', alpha: a0 })
  txt('time (seconds)', (x0 + x1) / 2, y1 + fz(31), { size: fz(10.5), color: C.muted, align: 'center', alpha: a0 })
  txt(NARROW ? 'm ahead of 10 m/s' : 'metres ahead of a steady 10 m/s', x0, y0 - fz(14), { size: fz(10.5), color: C.muted, weight: 700, alpha: a0 })

  // Sawtooth band: widen on each predict, narrow on each update.
  const band = (upto, alpha) => {
    if (alpha <= 0) return
    const upper = []
    const lower = []
    const mid = []
    for (let k = 0; k <= Math.min(L.N, Math.floor(upto)); k++) {
      if (k > 0) {
        upper.push({ x: X(k), y: Y(dev(L.mPre[k], k) + sd(L.PPre[k])) })
        lower.push({ x: X(k), y: Y(dev(L.mPre[k], k) - sd(L.PPre[k])) })
        mid.push({ x: X(k), y: Y(dev(L.mPre[k], k)) })
      }
      upper.push({ x: X(k), y: Y(dev(L.mPost[k], k) + sd(L.PPost[k])) })
      lower.push({ x: X(k), y: Y(dev(L.mPost[k], k) - sd(L.PPost[k])) })
      mid.push({ x: X(k), y: Y(dev(L.mPost[k], k)) })
    }
    A(alpha * 0.16)
    ctx.fillStyle = C.accent
    ctx.beginPath()
    upper.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)))
    for (let i = lower.length - 1; i >= 0; i--) ctx.lineTo(lower[i].x, lower[i].y)
    ctx.closePath()
    ctx.fill()
    A(alpha)
    ctx.strokeStyle = C.accent
    ctx.lineWidth = 2.4
    ctx.beginPath()
    mid.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)))
    ctx.stroke()
  }

  const early = 1 - seg(p, 1, 1.15)
  band(lerp(0, 5, ease(seg(p, 0.1, 0.8))), early)
  const la = easeOut(seg(p, 0.35, 0.55)) * early
  if (la > 0) {
    txt('predict: wider', X(1) + 6, Y(dev(L.mPre[1], 1) + sd(L.PPre[1])) - fz(12), { size: fz(10.5), color: C.accent, weight: 700, alpha: la })
    txt('update: narrower', X(1) + 6, Y(dev(L.mPost[1], 1) - sd(L.PPost[1])) + fz(14), { size: fz(10.5), color: C.hi, weight: 700, alpha: la })
  }

  const ta = easeOut(seg(p, 1.1, 1.35))
  const reveal = ease(seg(p, 1.1, 1.8)) * L.N
  if (ta > 0) {
    const tp = []
    for (let k = 0; k <= L.N; k++) if (k <= reveal + 0.001) tp.push({ x: X(k), y: Y(dev(L.truth[k], k)) })
    A(ta)
    ctx.strokeStyle = C.ink
    ctx.lineWidth = 1.6
    ctx.setLineDash([5, 4])
    ctx.beginPath()
    tp.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)))
    ctx.stroke()
    ctx.setLineDash([])
    for (let k = 1; k <= L.N; k++) if (k <= reveal + 0.001) dot(X(k), Y(dev(L.gps[k], k)), 3.4, C.two, ta)
    const lg = easeOut(seg(p, 1.6, 1.8))
    txt('true position', x1, Y(dev(L.truth[L.N], L.N)) - fz(12), { size: fz(10.5), color: C.ink, weight: 700, align: 'right', alpha: lg })
    txt('GPS readings', x1, y0 + fz(4), { size: fz(10.5), color: C.two, weight: 700, align: 'right', alpha: lg })
  }
  band(ease(seg(p, 2.05, 2.75)) * L.N, easeOut(seg(p, 2.05, 2.2)))

  const sa = easeOut(seg(p, 3.05, 3.3))
  if (sa > 0) {
    const k = L.N
    const m = dev(L.mPost[k], k)
    const x = X(k) - 10
    line(x, Y(m - sd(L.steady)), x, Y(m + sd(L.steady)), C.hi, 2, sa)
    txt(`±${f1(sd(L.steady))} m`, x - 8, Y(m), { size: fz(12), color: C.hi, mono: true, weight: 700, align: 'right', alpha: sa })
  }
}

// ---------- 07 · esports ratings ----------
function sceneRatings (p) {
  const toTime = ease(seg(p, 1, 1.3))
  const toUpset = ease(seg(p, 2, 2.3))

  group(1 - toTime, () => {
    txt('The same filter, applied to players', W / 2, H * 0.12, { size: fz(15), weight: 750, align: 'center', alpha: easeOut(seg(p, 0, 0.2)) })
    const rows = [['car position', 'a player’s true skill'], ['one second of driving', 'time between matches'], ['a GPS reading', 'a match result'], ['GPS noise', 'luck in a single game']]
    rows.forEach(([from, to], i) => {
      const a = easeOut(seg(p, 0.1 + i * 0.15, 0.35 + i * 0.15))
      const y = H * (0.3 + i * 0.15)
      txt(from, W * 0.45, y, { size: fz(13), color: C.muted, align: 'right', alpha: a })
      txt('→', W * 0.5, y, { size: fz(14), color: C.hi, weight: 700, align: 'center', alpha: a })
      txt(to, W * 0.55, y, { size: fz(13), color: C.ink, weight: 700, alpha: a })
    })
  })

  group(toTime * (1 - toUpset), () => {
    const x0 = W * (NARROW ? 0.13 : 0.1)
    const x1 = W * 0.96
    const y0 = H * 0.12
    const y1 = H * 0.8
    const X = (d) => lerp(x0, x1, d / 50)
    const Y = (v) => lerp(y1, y0, (v - 1300) / 500)
    ;[1400, 1550, 1700].forEach((v) => {
      line(x0, Y(v), x1, Y(v), C.faint, 1, 0.4)
      txt(`${v}`, x0 - 8, Y(v), { size: fz(10), color: C.dim, mono: true, align: 'right' })
    })
    for (let d = 0; d <= 50; d += 10) txt(`${d}`, X(d), y1 + fz(14), { size: fz(10), color: C.dim, mono: true, align: 'center' })
    txt('days', (x0 + x1) / 2, y1 + fz(31), { size: fz(10.5), color: C.muted, align: 'center' })
    txt('rating ± σ', x0, y0 - fz(14), { size: fz(10.5), color: C.muted, weight: 700 })
    const upto = ease(seg(p, 1.25, 1.9)) * 50
    const up = []
    const lo = []
    RATE.days.forEach(({ d, pre, post }) => {
      if (d > upto) return
      up.push({ x: X(d), y: Y(1550 + Math.sqrt(pre)) })
      lo.push({ x: X(d), y: Y(1550 - Math.sqrt(pre)) })
      up.push({ x: X(d), y: Y(1550 + Math.sqrt(post)) })
      lo.push({ x: X(d), y: Y(1550 - Math.sqrt(post)) })
    })
    if (up.length > 1) {
      A(0.18)
      ctx.fillStyle = C.accent
      ctx.beginPath()
      up.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)))
      for (let i = lo.length - 1; i >= 0; i--) ctx.lineTo(lo[i].x, lo[i].y)
      ctx.closePath()
      ctx.fill()
      line(X(0), Y(1550), X(upto), Y(1550), C.accent, 2.4)
    }
    RATE.games.forEach((d) => { if (d <= upto) dot(X(d), Y(1550), 3.4, C.hi) })
    const ia = easeOut(seg(p, 1.7, 1.9))
    txt(NARROW ? 'idle' : 'no matches: band widens', X(25), Y(1550) - fz(16), { size: fz(10.5), color: C.pink, weight: 700, align: 'center', alpha: ia })
    txt(NARROW ? '● match' : '● a match', x1, y0 + fz(4), { size: fz(10.5), color: C.hi, weight: 700, align: 'right', alpha: ia })
  })

  group(toUpset, () => {
    const ax = { x0: W * 0.06, x1: W * 0.94, X: (v) => lerp(W * 0.06, W * 0.94, (v - 1250) / 600) }
    const shift = ease(seg(p, 2.4, 2.9))
    RATE.players.forEach((pl, i) => {
      const yb = H * (0.42 + i * 0.4)
      const yt = yb - H * 0.26
      const mu = 1550 - pl.move * shift
      const s = lerp(Math.sqrt(pl.P), Math.sqrt(pl.after), shift)
      const peak = (yb - yt) * Math.min(1, 60 / s) * 0.95
      const draw = (m, sdv, color, alpha, fill) => {
        A(alpha * fill)
        ctx.fillStyle = color
        ctx.beginPath()
        ctx.moveTo(ax.X(1250), yb)
        for (let k = 0; k <= 120; k++) {
          const v = 1250 + 600 * k / 120
          ctx.lineTo(ax.X(v), yb - peak * Math.exp(-0.5 * ((v - m) / sdv) ** 2))
        }
        ctx.lineTo(ax.X(1850), yb)
        ctx.closePath()
        ctx.fill()
      }
      line(ax.x0, yb, ax.x1, yb, C.ink, 1.2, 0.5)
      draw(mu, s, i ? C.hi : C.accent, 1, 0.22)
      txt(`${pl.name}, σ ${Math.round(Math.sqrt(pl.P))}`, ax.x0, yt - fz(4), { size: fz(12), weight: 700, color: i ? C.hi : C.accent })
      const la = easeOut(seg(p, 2.8, 3))
      txt(`K = ${f2(pl.K)}: moves ${Math.round(pl.move)}`, ax.X(mu), yb - peak - fz(12), { size: fz(11.5), mono: true, weight: 700, color: C.pink, align: 'center', alpha: la })
      if (shift > 0 && shift < 1) arrow(ax.X(1550), yb + 10, ax.X(mu), yb + 10, C.pink, 1, 2)
    })
    chip(NARROW ? 'rating ± σ → win chance' : 'rating and its uncertainty → win chance for each match', W / 2, H * 0.94, C.green, easeOut(seg(p, 3.1, 3.35)), true)
  })
}

      { text: `The blue line is the filter’s best guess, with its ±<i>σ</i> band. It stays closer to the truth than the raw GPS: a typical error of ${f1(LOOP.rmsF)} m, against ${f1(LOOP.rmsG)} m for GPS alone.` },
      { text: `The band quickly settles to a steady width, <i>σ</i> ≈ ${f1(sd(LOOP.steady))} m, where each prediction’s widening exactly balances each update’s narrowing.` }
    ]
  },
  {
    short: 'Ratings',
    title: 'Rating esports players',
    formula: [String.raw`s_{j} \sim \mathcal{N}(\mu_{j},\ \sigma_{j}^{2})`, String.raw`K_{j} = \dfrac{\sigma_{j}^{2}}{\sigma_{j}^{2} + r}`],
    where: [
      [String.raw`s_{j}`, String.raw`the true skill of player $j$`],
      [String.raw`\mu_{j},\ \sigma_{j}`, String.raw`player $j$’s rating and its uncertainty`],
      [String.raw`r`, String.raw`the noise in a single match result`]
    ],
    draw: sceneRatings,
    beats: [
      { text: 'The esports predictor uses the same ideas to rate players. A player’s true skill plays the part of the car’s position, and each match plays the part of a GPS reading, noisy because single games involve luck.' },
      { text: 'Between matches, skill can drift, so the predict step widens every player’s band. The longer a player goes without a match, the wider it gets, so a returning player starts out less certain.' },
      { text: `After a match, ratings move by the Kalman gain. Here both players lose a match they were expected to win. The new player, with a wide band, moves ${Math.round(RATE.players[0].move)} points. The veteran, with a narrow band, moves only ${Math.round(RATE.players[1].move)}.` },
      { text: 'One thing does not fit: a match result depends on skill through a curve, not a straight line. The extended and unscented Kalman filters, the next two notes in this series, handle exactly that.' }
    ]
  }
]

// ===== RUNTIME: do not change =====
function drawScene (context, index, p, { width, height, dpr, font }, time = 0) {
  ctx = context
  T = time
  LIVE = time > 0
  W = width
  H = height
  NARROW = width < 520
  U = clamp(Math.min(width, height) / 600, 0.55, 1.15)
  GA = 1
  if (font) FONT = font
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.globalAlpha = 1
  ctx.clearRect(0, 0, W, H)
  SCENES[index].draw(p)
}

;(() => {
  const START_LINE = 0.45
  const MS_PER_WORD = 210
  const BEAT_PADDING_MS = 1300
  const MIN_BEAT_MS = 3600
  const MAX_BEAT_MS = 8200
  const DAMPING_MS = 140
  const SNAP_EPSILON = 4
  const SNAP_PADDING = 24
  const ENTRY_REACH = 0.6
  const MIN_GLIDE_MS = 900
  const MAX_GLIDE_MS = 1500
  const GLIDE_MS_PER_PX = 0.6
  const WHEEL_THRESHOLD = 24
  const WHEEL_QUIET_MS = 110
  const SWIPE_THRESHOLD = 36
  const KEY_DIRECTION = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 }

  const root = document.getElementById('story')
  const reduceMotion = !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches
  const font = getComputedStyle(root).fontFamily
  let raf = 0
  let lastFrame = 0
  let inView = false
  let activeChapter = -1
  let railShown = false
  let glideRaf = 0
  let settling = false
  let lastWheelAt = 0
  let lastWheelSize = 0
  let wheelTotal = 0
  let touch = null

  const make = (tag, cls, text) => {
    const node = document.createElement(tag)
    if (cls) node.className = cls
    if (text !== undefined) node.textContent = text
    return node
  }
  const beatDuration = ({ text, ms }) => {
    if (ms) return ms
    const words = text.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).length
    return Math.min(MAX_BEAT_MS, Math.max(MIN_BEAT_MS, words * MS_PER_WORD + BEAT_PADDING_MS))
  }

  const rail = make('nav', 'rail')
  rail.setAttribute('aria-label', 'Stages')
  const railItems = SCENES.map((s, i) => {
    const item = make('button', 'rail-item')
    item.type = 'button'
    item.append(make('span', 'rail-label', s.short), make('span', 'rail-mark'))
    item.addEventListener('click', () => jump(i))
    rail.append(item)
    return item
  })
  root.append(rail)

  // The opening: the topic name rises in word by word, and the chapters draw in as a map.
  const opening = document.querySelector('.opening')
  if (opening) {
    const title = opening.querySelector('.opening-title')
    if (title) {
      const words = title.textContent.trim().split(/\s+/)
      title.setAttribute('aria-label', words.join(' '))
      title.textContent = ''
      words.forEach((w, n) => {
        const outer = make('span', 'ow')
        outer.setAttribute('aria-hidden', 'true')
        const inner = make('span', '', w)
        inner.style.transitionDelay = `${120 + n * 90}ms`
        outer.append(inner)
        title.append(outer, ' ')
      })
    }
    const map = opening.querySelector('.opening-map')
    if (map) {
      SCENES.forEach((s, i) => {
        const li = make('li')
        const btn = make('button', 'map-item')
        btn.type = 'button'
        btn.style.setProperty('--i', i)
        btn.append(make('span', 'map-num mono', String(i + 1).padStart(2, '0')), make('span', 'map-label', s.short))
        btn.addEventListener('click', () => jump(i))
        li.append(btn)
        map.append(li)
      })
    }
    requestAnimationFrame(() => requestAnimationFrame(() => opening.classList.add('play')))
  }

  const chapters = SCENES.map((s, i) => {
    const el = make('section', i % 2 ? 'chapter flip' : 'chapter')
    const col = make('div', 'stage-col')
    const stage = make('div', 'stage')
    const box = make('div', 'canvas-box')
    const canvas = make('canvas')
    canvas.setAttribute('role', 'img')
    canvas.setAttribute('aria-label', `Animation: ${s.title}. The steps are described in the text alongside.`)
    box.append(canvas)
    const ticks = make('div', 'ticks')
    ticks.setAttribute('aria-hidden', 'true')
    const tickEls = s.beats.map(() => ticks.appendChild(make('span', 'tick')))
    stage.append(box, ticks)
    col.append(stage)

    const copy = make('div', 'copy')
    const head = make('header', 'chapter-head')
    head.append(make('span', 'chapter-num mono', String(i + 1).padStart(2, '0')), make('h2', 'chapter-title', s.title))
    if (s.formula) head.append(noteFormula(s.formula, s.where, i + 1))
    if (s.code) head.append(make('code', 'chapter-code', s.code))
    const pagesEl = make('div', 'pages')
    const firstPage = make('div', 'pg')
    const steps = make('ol', 'steps')
    const lis = []
    const beatEls = s.beats.map((b, bi) => {
      const li = make('li')
      const btn = make('button', 'beat')
      btn.type = 'button'
      const bar = make('span', 'beat-bar')
      bar.setAttribute('aria-hidden', 'true')
      bar.append(make('span', 'beat-fill'))
      const text = make('span', 'beat-text')
      text.innerHTML = b.text
      btn.append(bar, text)
      btn.addEventListener('click', () => seek(i, bi))
      li.append(btn)
      steps.append(li)
      lis.push(li)
      return btn
    })
    firstPage.append(head, steps)
    pagesEl.append(firstPage)
    copy.append(pagesEl)
    el.append(col, copy)
    root.append(el)

    const durations = s.beats.map(beatDuration)
    let elapsed = 0
    const starts = durations.map((d) => { const at = elapsed; elapsed += d; return at })
    return {
      el, canvas, box, copy, beatEls, tickEls, durations, starts,
      col, stage, head, pagesEl, lis,
      flip: i % 2 === 1,
      num: String(i + 1).padStart(2, '0'),
      pages: [{ el: firstPage, list: steps }],
      pageOf: s.beats.map(() => 0),
      page: -1,
      ctx: canvas.getContext('2d'),
      total: elapsed,
      time: reduceMotion ? elapsed : 0,
      near: false,
      seen: false,
      started: reduceMotion,
      dirty: true,
      size: null,
      shown: reduceMotion ? durations.length : 0,
      drawn: -1,
      beat: -1,
      done: false
    }
  })

  function sizeCanvas (ch) {
    const width = ch.box.clientWidth
    const height = ch.box.clientHeight
    if (!width || !height) return
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    ch.size = { width, height, dpr, font }
    ch.canvas.width = Math.round(width * dpr)
    ch.canvas.height = Math.round(height * dpr)
    ch.dirty = true
  }
  let layoutKey = ''
  function resizeStages () {
    const key = `${window.innerWidth}x${window.innerHeight}`
    if (key !== layoutKey) {
      layoutKey = key
      chapters.forEach(paginate)
    }
    chapters.forEach((ch) => { if (ch.near) sizeCanvas(ch) })
    start()
  }
  function progressAt (ch) {
    let b = ch.durations.length - 1
    while (b > 0 && ch.time < ch.starts[b]) b--
    return b + Math.min(1, (ch.time - ch.starts[b]) / ch.durations[b])
  }
  function paintBeats (ch, beat, done) {
    if (ch.beat === beat && ch.done === done) return
    ch.beat = beat
    ch.done = done
    ch.copy.classList.toggle('done', done)
    ch.beatEls.forEach((el, n) => {
      el.classList.toggle('active', n === beat)
      el.classList.toggle('past', n < beat || done)
      if (n === beat) el.setAttribute('aria-current', 'step')
      else el.removeAttribute('aria-current')
    })
    ch.tickEls.forEach((el, n) => el.classList.toggle('on', n <= beat))
    applyPages(ch)
  }

  // A chapter whose steps do not fit beside the stage is split into pages. Reaching the next
  // page slides the stage across, squeezes the old page off the edge as it fades, and brings
  // the new page in on the side the stage has left. Narrow screens scroll the steps instead.
  const CONT_H = 40
  function paginate (ch) {
    const first = ch.pages[0]
    ch.lis.forEach((li) => first.list.append(li))
    ch.pages.splice(1).forEach((pg) => pg.el.remove())
    const wide = window.innerWidth > 900
    const limit = ch.stage.offsetHeight - 16
    const heights = ch.lis.map((li) => li.offsetHeight + 4)
    let used = ch.head.offsetHeight + (parseFloat(getComputedStyle(ch.head).marginBottom) || 0)
    const fits = !wide || used + heights.reduce((sum, h) => sum + h, 0) <= limit
    const groups = [[]]
    heights.forEach((h, i) => {
      if (!fits && groups[groups.length - 1].length && used + h > limit) {
        groups.push([])
        used = CONT_H
      }
      groups[groups.length - 1].push(i)
      used += h
    })
    groups.slice(1).forEach(() => {
      const el = make('div', 'pg')
      const list = make('ol', 'steps')
      el.append(make('span', 'chapter-cont mono', `${ch.num} · continued`), list)
      ch.pagesEl.append(el)
      ch.pages.push({ el, list })
    })
    groups.forEach((g, k) => g.forEach((i) => {
      if (k) ch.pages[k].list.append(ch.lis[i])
      ch.pageOf[i] = k
    }))
    applyPages(ch, true)
  }
  // How much of the previous page stays in view beside the stage before fading out.
  const GHOST_SHOWN = 0.5
  function applyPages (ch, force = false) {
    const cur = ch.pageOf[Math.max(0, ch.beat)] || 0
    if (!force && cur === ch.page) return
    ch.page = cur
    if (ch.pages.length < 2) {
      ch.col.style.translate = ''
      ch.pages.forEach(({ el }) => {
        el.style.translate = ''
        el.style.opacity = ''
        el.style.removeProperty('--fade')
        el.inert = false
      })
      return
    }
    const dir = ch.flip ? -1 : 1
    const stageW = ch.col.offsetWidth
    const copyW = ch.copy.offsetWidth
    const gap = Math.abs(ch.copy.offsetLeft - ch.col.offsetLeft) - (dir > 0 ? stageW : copyW)
    // The row pans as one: the stage moves across, the new page takes the side it left, and
    // the old page slides out beside the stage as a fading ghost. The whole row then shifts
    // away from the ghost, as far as the screen allows, so it stays balanced on screen.
    let shift = 0
    if (cur > 0) {
      const ghostSide = cur % 2 ? dir : -dir
      const rect = ch.el.getBoundingClientRect()
      const room = ghostSide > 0 ? rect.left : window.innerWidth - rect.right
      shift = -ghostSide * Math.min((gap + copyW * GHOST_SHOWN) / 2, Math.max(0, room - 16))
    }
    ch.col.style.translate = `${(cur % 2 ? dir * (copyW + gap) : 0) + shift}px 0`
    ch.pages.forEach(({ el }, k) => {
      const away = k % 2 === 1
      const base = (away ? -dir * (stageW + gap) : 0) + shift
      const out = away ? -dir : dir
      const s = el.style
      s.setProperty('--fade-dir', out > 0 ? '90deg' : '270deg')
      if (k === cur) {
        s.translate = `${base}px 0`
        s.opacity = '1'
        s.setProperty('--fade', '150%')
      } else if (k < cur) {
        s.translate = `${base + out * (copyW + gap)}px 0`
        s.opacity = k === cur - 1 ? '.75' : '0'
        s.setProperty('--fade', k === cur - 1 ? `${GHOST_SHOWN * 100}%` : '0%')
      } else {
        s.translate = `${base + out * 56}px 0`
        s.opacity = '0'
        s.setProperty('--fade', '150%')
      }
      el.inert = k !== cur
    })
  }

  function frame (now) {
    raf = 0
    if (!inView) { lastFrame = 0; return }
    const dt = lastFrame ? Math.min(64, now - lastFrame) : 16
    lastFrame = now
    const vh = window.innerHeight
    const rate = reduceMotion ? 1 : 1 - Math.exp(-dt / DAMPING_MS)
    let current = activeChapter

    chapters.forEach((ch, i) => {
      const rect = ch.el.getBoundingClientRect()
      if (rect.top < vh * 0.5 && rect.bottom > vh * 0.5) current = i
      const near = rect.bottom > -vh * 0.3 && rect.top < vh * 1.3
      if (near !== ch.near) {
        ch.near = near
        if (near) {
          sizeCanvas(ch)
        } else {
          ch.canvas.width = 0
          ch.canvas.height = 0
          ch.size = null
        }
      }
      if (!ch.seen && rect.top < vh * 0.9) {
        ch.seen = true
        ch.el.classList.add('seen')
      }
      if (!ch.started && rect.top < vh * START_LINE && rect.bottom > vh * 0.2) ch.started = true
      const visible = rect.top < vh * 0.8 && rect.bottom > vh * 0.2
      if (ch.started && visible && !reduceMotion && ch.time < ch.total) {
        ch.time = Math.min(ch.total, ch.time + dt)
      }
      const target = progressAt(ch)
      ch.shown += (target - ch.shown) * rate
      if (Math.abs(target - ch.shown) < 0.0004) ch.shown = target
      const beat = Math.min(ch.beatEls.length - 1, Math.floor(target))
      paintBeats(ch, beat, ch.time >= ch.total)
      ch.beatEls[beat].style.setProperty('--fill', (target - beat).toFixed(3))
      if (!near) return
      const looping = !reduceMotion && rect.bottom > 0 && rect.top < vh
      if (ch.size && (looping || ch.dirty || Math.abs(ch.shown - ch.drawn) > 0.0002)) {
        drawScene(ch.ctx, i, ch.shown, ch.size, reduceMotion ? 0 : now)
        ch.drawn = ch.shown
        ch.dirty = false
      }
    })

    if (current !== activeChapter) {
      activeChapter = current
      railItems.forEach((item, n) => item.classList.toggle('on', n === current))
    }
    const first = chapters[0].el.getBoundingClientRect()
    const last = chapters[chapters.length - 1].el.getBoundingClientRect()
    const shown = first.top < vh * 0.5 && last.bottom > vh * 0.5
    if (shown !== railShown) {
      railShown = shown
      rail.classList.toggle('shown', shown)
    }
    raf = requestAnimationFrame(frame)
  }
  function start () {
    if (!raf && inView) raf = requestAnimationFrame(frame)
  }

  // The opening is a stop of its own, so one scroll from it glides into the first chapter.
  function openingZone () {
    if (!opening) return []
    const bottom = opening.getBoundingClientRect().bottom + window.scrollY
    return [{ snap: 0, end: Math.max(0, bottom - window.innerHeight) }]
  }
  function zoneOf (ch) {
    const vh = window.innerHeight
    const rect = ch.el.getBoundingClientRect()
    const top = rect.top + window.scrollY
    const maxScroll = document.documentElement.scrollHeight - vh
    const snap = Math.min(maxScroll, Math.max(0, top - Math.max(SNAP_PADDING, (vh - rect.height) / 2)))
    const end = Math.min(maxScroll, Math.max(snap, top + rect.height + SNAP_PADDING - vh))
    return { snap, end }
  }
  // `force` lets the keyboard enter the story from anywhere above or below it.
  function nextStop (direction, force = false) {
    const y = window.scrollY
    const reach = window.innerHeight * ENTRY_REACH
    const zones = [...openingZone(), ...chapters.map(zoneOf)]
    if (direction > 0) {
      for (let i = 0; i < zones.length; i++) {
        if (y < zones[i].snap - SNAP_EPSILON) return i === 0 && !force && zones[i].snap - y > reach ? null : zones[i].snap
        if (y < zones[i].end - SNAP_EPSILON) return null
      }
      return null
    }
    for (let i = zones.length - 1; i >= 0; i--) {
      if (y > zones[i].end + SNAP_EPSILON) return i === zones.length - 1 && !force && y - zones[i].end > reach ? null : zones[i].end
      if (y > zones[i].snap + SNAP_EPSILON) return null
    }
    return null
  }
  function cancelGlide () {
    if (glideRaf) cancelAnimationFrame(glideRaf)
    glideRaf = 0
  }
  function glideTo (target) {
    cancelGlide()
    const from = window.scrollY
    const distance = Math.abs(target - from)
    if (distance < 2) return
    const duration = Math.min(MAX_GLIDE_MS, Math.max(MIN_GLIDE_MS, distance * GLIDE_MS_PER_PX + 500))
    const startedAt = performance.now()
    settling = true
    wheelTotal = 0
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - startedAt) / duration))
      window.scrollTo({ top: from + (target - from) * ease(t), behavior: 'instant' })
      glideRaf = t < 1 ? requestAnimationFrame(step) : 0
    }
    glideRaf = requestAnimationFrame(step)
  }
  function onWheel (e) {
    if (e.ctrlKey || !e.deltaY || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return
    const delta = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaMode === 2 ? e.deltaY * window.innerHeight : e.deltaY
    const size = Math.abs(delta)
    const now = performance.now()
    const gap = now - lastWheelAt
    const rising = size > 30 && size > lastWheelSize * 1.6
    lastWheelAt = now
    lastWheelSize = size
    if (glideRaf) { e.preventDefault(); return }
    if (gap > WHEEL_QUIET_MS) {
      settling = false
      wheelTotal = 0
    }
    if (settling) {
      if (!rising) { e.preventDefault(); return }
      settling = false
      wheelTotal = 0
    }
    const direction = Math.sign(delta)
    const target = nextStop(direction)
    if (target === null) return
    e.preventDefault()
    if (Math.sign(wheelTotal) !== direction) wheelTotal = 0
    wheelTotal += delta
    if (Math.abs(wheelTotal) >= WHEEL_THRESHOLD) glideTo(target)
  }
  // ← and → move between steps, continuing into the next or previous chapter at either end.
  function stepBy (dir) {
    const i = Math.max(0, activeChapter)
    const ch = chapters[i]
    if (activeChapter !== i) {
      jump(i)
      seek(i, 0)
      return
    }
    const n = ch.beatEls.length
    const current = ch.started ? Math.min(n - 1, Math.floor(progressAt(ch))) : -1
    const target = current + dir
    if (target >= n) {
      if (i + 1 < chapters.length) {
        jump(i + 1)
        seek(i + 1, 0)
      }
    } else if (target < 0) {
      if (i > 0) {
        jump(i - 1)
        seek(i - 1, chapters[i - 1].beatEls.length - 1)
      }
    } else {
      seek(i, target)
    }
  }
  function onKeydown (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault()
      stepBy(e.key === 'ArrowRight' ? 1 : -1)
      return
    }
    let direction = KEY_DIRECTION[e.key]
    if (e.key === ' ') {
      if (e.target.closest?.('button, a')) return
      direction = e.shiftKey ? -1 : 1
    }
    if (!direction) return
    if (glideRaf) { e.preventDefault(); return }
    const target = nextStop(direction, true)
    if (target === null) return
    e.preventDefault()
    if (reduceMotion) window.scrollTo({ top: target, behavior: 'instant' })
    else glideTo(target)
  }
  function onTouchStart (e) {
    touch = e.touches.length === 1 ? { y: e.touches[0].clientY, target: undefined } : null
  }
  function onTouchMove (e) {
    if (glideRaf) {
      if (e.cancelable) e.preventDefault()
      return
    }
    if (!touch) return
    const dy = e.touches[0].clientY - touch.y
    if (touch.target === undefined) {
      if (Math.abs(dy) < 8) return
      touch.target = nextStop(dy < 0 ? 1 : -1)
    }
    if (touch.target === null || !e.cancelable) return
    e.preventDefault()
    if (Math.abs(dy) >= SWIPE_THRESHOLD) {
      glideTo(touch.target)
      touch = null
    }
  }
  function onPointerDown (e) {
    if (e.target === document.documentElement) cancelGlide()
  }
  function jump (i) {
    const { snap } = zoneOf(chapters[i])
    if (reduceMotion) window.scrollTo({ top: snap, behavior: 'instant' })
    else glideTo(snap)
  }
  function seek (i, beat) {
    const ch = chapters[i]
    ch.started = true
    ch.time = reduceMotion ? ch.starts[beat] + ch.durations[beat] - 1 : ch.starts[beat]
  }

  new ResizeObserver(resizeStages).observe(root)
  window.addEventListener('resize', resizeStages)
  window.addEventListener('keydown', onKeydown)
  if (!reduceMotion) {
    window.addEventListener('wheel', onWheel, { passive: false })
    window.addEventListener('touchstart', onTouchStart, { passive: true })
    window.addEventListener('touchmove', onTouchMove, { passive: false })
    window.addEventListener('pointerdown', onPointerDown)
  }
  document.fonts?.ready.then(() => chapters.forEach((ch) => { paginate(ch); ch.dirty = true }))
  window.addEventListener('scene-assets', () => chapters.forEach((ch) => { ch.dirty = true }))
  new IntersectionObserver(([entry]) => {
    inView = entry.isIntersecting
    if (inView) start()
  }, { rootMargin: '30% 0px' }).observe(root)
})()
</script>
