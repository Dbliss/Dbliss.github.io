<style>

<script>
// ===== DRAWING HELPERS (keep these; add more in the content section if needed) =====
const C = {
  ink: '#111632', muted: '#626980', dim: '#8a90ad', faint: '#c9cde0',
  one: '#e4002b', two: '#c08a12', accent: '#1aa3c2', hi: '#6858e8',
  green: '#0e9f6e', pink: '#d63d8f', surface: '#ffffff', track: 'rgba(17,22,50,0.07)'
}
const MONO = "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
const MATH = 'KaTeX_Main, "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", serif'
const TAU = Math.PI * 2
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, t) => a + (b - a) * t
const seg = (p, a, b) => clamp((p - a) / (b - a))
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)
const easeOut = (t) => 1 - Math.pow(1 - t, 3)
const backOut = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2) }
function rng (seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6d2b79f5) >>> 0
    let t = a
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

let ctx = null
let W = 0
let H = 0
let NARROW = false
let U = 1
let GA = 1
let FONT = 'system-ui, sans-serif'
let T = 0
let LIVE = false

const fz = (n) => Math.max(8.5, n * U)
const cycle = (period, offset = 0) => (T / period + offset) % 1
const pulse = (period = 1800, offset = 0) => (LIVE ? 0.5 + 0.5 * Math.sin(TAU * cycle(period, offset)) : 1)
const bob = (seed, amount = 2) => (LIVE ? Math.sin(T / 520 + seed) * amount : 0)
function A (a = 1) { ctx.globalAlpha = clamp(GA * a) }
function group (a, fn) {
  if (a <= 0) return
  const parent = GA
  GA = parent * a
  fn()
  GA = parent
}
function rgba (hex, a) {
  const n = parseInt(hex.slice(1), 16)
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`
}
function txt (s, x, y, o = {}) {
  const { size = 11, color = C.ink, align = 'left', weight = 500, mono = false, math = false, base = 'middle', alpha = 1 } = o
  if (math) return drawMath(s, x, y, { size: size * 1.12, color, align, weight, alpha, base })
  A(alpha)
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  ctx.fillStyle = color
  ctx.textAlign = align
  ctx.textBaseline = base
  ctx.fillText(s, x, y)
}
// Typeset a small maths expression: single letters italic, numbers and longer words upright,
// `_x` / `^x` (or `_{xy}`) as subscripts and superscripts.
function mathRuns (s) {
  const runs = []
  const push = (t, level) => {
    const re = /([A-Za-zα-ωΑ-Ω]+)|([^A-Za-zα-ωΑ-Ω]+)/g
    let m
    while ((m = re.exec(t))) {
      if (m[1]) {
        // A single letter straight after a number and a space is a unit (4 m), so it stays upright.
        const prev = runs[runs.length - 1]
        const unit = m[1].length === 1 && prev && prev.level === level && /\d\s$/.test(prev.t)
        runs.push({ t: m[1], italic: m[1].length < 3 && !unit, level })
      }
      else runs.push({ t: m[2], italic: false, level })
    }
  }
  let i = 0
  while (i < s.length) {
    const c = s[i]
    if ((c === '_' || c === '^') && i + 1 < s.length) {
      const level = c === '_' ? -1 : 1
      if (s[i + 1] === '{') {
        const j = s.indexOf('}', i + 2)
        push(s.slice(i + 2, j < 0 ? s.length : j), level)
        i = j < 0 ? s.length : j + 1
      } else {
        push(s[i + 1], level)
        i += 2
      }
    } else {
      let j = i
      while (j < s.length && s[j] !== '_' && s[j] !== '^') j++
      push(s.slice(i, j), 0)
      i = j
    }
  }
  return runs
}
function drawMath (s, x, y, o) {
  const runs = mathRuns(s)
  const fontFor = (r) => `${r.italic ? 'italic ' : ''}${o.weight} ${r.level ? o.size * 0.68 : o.size}px ${MATH}`
  let total = 0
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    r.w = ctx.measureText(r.t).width + (r.italic && !r.level ? o.size * 0.04 : 0)
    total += r.w
  })
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x
  A(o.alpha)
  ctx.fillStyle = o.color
  ctx.textAlign = 'left'
  ctx.textBaseline = o.base
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    ctx.fillText(r.t, cx, y + (r.level < 0 ? o.size * 0.3 : r.level > 0 ? -o.size * 0.36 : 0))
    cx += r.w
  })
}
// Stacked maths lines for derivations and slow worked examples. The newest revealed line is highlighted.
function formulaSteps (lines, x, y, shown, o = {}) {
  const { size = fz(15), gap = fz(30), align = 'left' } = o
  lines.forEach((s, i) => {
    const a = clamp(shown - i)
    if (a <= 0) return
    const current = shown - i < 2 && i === Math.min(lines.length - 1, Math.ceil(shown) - 1)
    txt(s, x, y + i * gap, { size, math: true, color: current ? C.hi : C.ink, align, alpha: easeOut(a) * (current ? 1 : 0.75) })
  })
}
function measure (s, size, weight = 500, mono = false) {
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  return ctx.measureText(s).width
}
function rr (x, y, w, h, r) {
  ctx.beginPath()
  ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r)
}
function line (x1, y1, x2, y2, color, w = 1, a = 1, dash = null) {
  A(a)
  ctx.strokeStyle = color
  ctx.lineWidth = w
  if (dash) ctx.setLineDash(dash)
  ctx.beginPath()
  ctx.moveTo(x1, y1)
  ctx.lineTo(x2, y2)
  ctx.stroke()
  if (dash) ctx.setLineDash([])
}
function dot (x, y, r, color, a = 1) {
  A(a)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.arc(x, y, Math.max(0.1, r), 0, TAU)
  ctx.fill()
}
function glow (x, y, r, color, a = 1) {
  A(a)
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4)
  g.addColorStop(0, rgba(color, 0.3))
  g.addColorStop(1, rgba(color, 0))
  ctx.fillStyle = g
  ctx.beginPath()
  ctx.arc(x, y, r * 4, 0, TAU)
  ctx.fill()
  dot(x, y, r, color, a)
  dot(x, y, r * 0.42, '#ffffff', a)
}
function softShadow (on) {
  ctx.shadowColor = on ? 'rgba(27,31,69,0.08)' : 'transparent'
  ctx.shadowBlur = on ? 14 : 0
  ctx.shadowOffsetY = on ? 4 : 0
}
function panel (x, y, w, h, a = 1, border = C.hi) {
  A(a)
  softShadow(true)
  rr(x, y, w, h, 12)
  ctx.fillStyle = C.surface
  ctx.fill()
  softShadow(false)
  ctx.strokeStyle = rgba(border, 0.4)
  ctx.lineWidth = 1
  ctx.stroke()
}
function qb (a, c, b, t) {
  const u = 1 - t
  return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }
}
// A glowing dot with a tail, arcing from a to b as t goes 0..1.
function flight (a, b, t, color, r = 2.4, lift = 40) {
  if (t <= 0 || t >= 1.25) return
  const c = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - lift }
  for (let k = 6; k >= 0; k--) {
    const tt = t - k * 0.04
    if (tt < 0 || tt > 1) continue
    const q = qb(a, c, b, ease(tt))
    if (k === 0) glow(q.x, q.y, r, color)
    else dot(q.x, q.y, r * (1 - k / 9), color, 0.45 * (1 - k / 7))
  }
}
function polyLen (pts) {
  const L = [0]
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y))
  return L
}
function along (pts, L, t) {
  const d = clamp(t) * L[L.length - 1]
  let i = 1
  while (i < L.length - 1 && L[i] < d) i++
  const s = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1)
  return { x: lerp(pts[i - 1].x, pts[i].x, s), y: lerp(pts[i - 1].y, pts[i].y, s) }
}
// Draws a path up to t (0..1) and returns its leading point.
function tracePath (pts, t, color, width = 2.2, a = 1) {
  const L = polyLen(pts)
  const total = L[L.length - 1] || 1
  for (let s = 1; s < pts.length; s++) {
    if (t * total < L[s - 1]) break
    const end = t * total < L[s] ? along(pts, L, t) : pts[s]
    line(pts[s - 1].x, pts[s - 1].y, end.x, end.y, color, width, a)
  }
  return along(pts, L, t)
}
// Looping: small dots travelling along a path.
function runner (pts, offset = 0, color = C.hi, alpha = 1, period = 2600) {
  if (!LIVE || alpha <= 0 || pts.length < 2) return
  const L = polyLen(pts)
  const t = cycle(period, offset)
  const fade = Math.sin(Math.PI * t) * alpha
  for (let k = 4; k >= 0; k--) {
    const tail = t - k * 0.018
    if (tail < 0) continue
    const q = along(pts, L, tail)
    dot(q.x, q.y, k ? 1.5 : 2.8, color, fade * (1 - k / 6))
  }
}
// Looping: an expanding ring.
function ripple (x, y, r0, r1, color, a = 1, period = 2000, offset = 0) {
  if (!LIVE || a <= 0) return
  const t = cycle(period, offset)
  A(a * (1 - t) * 0.55)
  ctx.beginPath()
  ctx.arc(x, y, lerp(r0, r1, t), 0, TAU)
  ctx.strokeStyle = color
  ctx.lineWidth = 1.4
  ctx.stroke()
}

// ===== CONTENT: Lighting uniformity and differential evolution =====
// One worked example: a 100 m × 60 m field lit by six 20 m poles, one floodlight each.
// The four corner floodlights share one aiming angle and the two halfway floodlights share another,
// because mirrored poles share fittings (as in Sportslux), so a design is two numbers.
// Illuminance follows the point-source law E = I(γ) cos θ / d², with I(γ) read from an
// intensity table the way an IES file supplies it. The optimiser is differential evolution
// (DE/rand/1/bin), the method Sportslux runs through SciPy.

const FIELD_W = 100
const FIELD_H = 60
const POLE_H = 20
const TARGET_E = 200
const TARGET_U = 0.7
const TABLE = [
  [0, 300000], [10, 285000], [20, 245000], [30, 185000], [40, 120000], [50, 62000], [60, 26000], [70, 8000], [90, 0]
]
const POLES = [
  { x: 0, y: -6, kind: 'c' }, { x: 50, y: -6, kind: 'm' }, { x: 100, y: -6, kind: 'c' },
  { x: 0, y: 66, kind: 'c' }, { x: 50, y: 66, kind: 'm' }, { x: 100, y: 66, kind: 'c' }
].map((p) => {
  const dx = (p.kind === 'm' ? 50 : 50 + (p.x === 0 ? -25 : 25)) - p.x
  const dy = 30 - p.y
  const L = Math.hypot(dx, dy)
  return { ...p, dir: { x: dx / L, y: dy / L } }
})
const GRID = []
for (let gy = 5; gy <= 55; gy += 10) for (let gx = 10; gx <= 90; gx += 10) GRID.push({ x: gx, y: gy })
const RANGE = { c: [30, 75], m: [20, 70] }
const deg = (r) => r * 180 / Math.PI
const rad = (d) => d * Math.PI / 180

function intensity (g) {
  for (let k = 1; k < TABLE.length; k++) {
    if (g <= TABLE[k][0]) {
      const [a0, i0] = TABLE[k - 1]
      const [a1, i1] = TABLE[k]
      return i0 + (i1 - i0) * (g - a0) / (a1 - a0)
    }
  }
  return 0
}
// Light from one floodlight, aimed `alpha` degrees away from straight down, at ground point q.
function contribution (pole, alpha, q) {
  const reach = POLE_H * Math.tan(rad(alpha))
  const aim = { x: pole.dir.x * reach, y: pole.dir.y * reach, z: -POLE_H }
  const v = { x: q.x - pole.x, y: q.y - pole.y, z: -POLE_H }
  const la = Math.hypot(aim.x, aim.y, aim.z)
  const d = Math.hypot(v.x, v.y, v.z)
  const cosG = (aim.x * v.x + aim.y * v.y + aim.z * v.z) / (la * d)
  const gamma = deg(Math.acos(clamp(cosG, -1, 1)))
  const I = intensity(gamma)
  const cosT = POLE_H / d
  return { E: I * cosT / (d * d), I, gamma, d, cosT, horiz: Math.hypot(v.x, v.y) }
}
function evaluate (ac, am) {
  const lux = GRID.map((q) => POLES.reduce((s, p) => s + contribution(p, p.kind === 'c' ? ac : am, q).E, 0))
  const avg = lux.reduce((s, v) => s + v, 0) / lux.length
  let minI = 0
  lux.forEach((v, i) => { if (v < lux[minI]) minI = i })
  const U = lux[minI] / avg
  const pE = 10 * Math.max(0, 1 - avg / TARGET_E)
  const pU = 10 * Math.max(0, TARGET_U - U)
  const bonus = 1 - U
  return { lux, avg, min: lux[minI], minI, U, pE, pU, bonus, cost: pE + pU + bonus }
}

const DESIGN_A = { c: 39, m: 30 }
const EVAL_A = evaluate(DESIGN_A.c, DESIGN_A.m)
const P_IDX = GRID.findIndex((q) => q.x === 50 && q.y === 25)
const MID_POLE = POLES[1]
const ONE = contribution(MID_POLE, DESIGN_A.m, GRID[P_IDX])
const CONTRIBS = POLES.map((p) => contribution(p, p.kind === 'c' ? DESIGN_A.c : DESIGN_A.m, GRID[P_IDX]).E)

const MAP = (() => {
  const cs = []
  for (let c = RANGE.c[0]; c <= RANGE.c[1]; c++) {
    const col = []
    for (let m = RANGE.m[0]; m <= RANGE.m[1]; m++) col.push(evaluate(c, m).cost)
    cs.push(col)
  }
  return cs
})()

const DE = (() => {
  const NP = 10
  const F = 0.8
  const CR = 0.7
  const GENS = 16
  const span = (k) => RANGE[k][1] - RANGE[k][0]
  const inside = (v) => v.c >= RANGE.c[0] && v.c <= RANGE.c[1] && v.m >= RANGE.m[0] && v.m <= RANGE.m[1]
  const clip = (v) => ({ c: clamp(v.c, RANGE.c[0], RANGE.c[1]), m: clamp(v.m, RANGE.m[0], RANGE.m[1]) })
  for (let seed = 10; seed < 2000; seed++) {
    const g = rng(seed)
    const perm = (n) => { const a = [...Array(n).keys()]; for (let i = n - 1; i > 0; i--) { const j = Math.floor(g() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a }
    const pc = perm(NP)
    const pm = perm(NP)
    let pop = Array.from({ length: NP }, (_, i) => {
      const x = { c: RANGE.c[0] + (pc[i] + g()) / NP * span('c'), m: RANGE.m[0] + (pm[i] + g()) / NP * span('m') }
      x.f = evaluate(x.c, x.m).cost
      return x
    })
    const gens = [pop.map((x) => ({ ...x }))]
    let worked = null
    for (let gen = 0; gen < GENS; gen++) {
      const next = pop.map((x) => ({ ...x }))
      for (let i = 0; i < NP; i++) {
        let a, b, c
        do { a = Math.floor(g() * NP) } while (a === i)
        do { b = Math.floor(g() * NP) } while (b === i || b === a)
        do { c = Math.floor(g() * NP) } while (c === i || c === a || c === b)
        const v = { c: pop[a].c + F * (pop[b].c - pop[c].c), m: pop[a].m + F * (pop[b].m - pop[c].m) }
        const jrand = Math.floor(g() * 2)
        const rs = [g(), g()]
        const u = clip({ c: rs[0] <= CR || jrand === 0 ? v.c : pop[i].c, m: rs[1] <= CR || jrand === 1 ? v.m : pop[i].m })
        u.f = evaluate(u.c, u.m).cost
        if (gen === 0 && i === 0) worked = { a, b, c, v, jrand, rs, u, x: { ...pop[i] }, ok: u.f <= pop[i].f, vin: inside(v) }
        if (u.f <= pop[i].f) next[i] = u
      }
      pop = next
      gens.push(pop.map((x) => ({ ...x })))
    }
    const w = worked
    const spread = Math.hypot(w.v.c - w.x.c, w.v.m - w.x.m)
    const moved = Math.abs(w.u.c - w.x.c)
    if (w.jrand === 0 && w.rs[1] > CR && w.ok && w.vin && spread > 12 && moved > 6 && w.x.f > 0.9) {
      let best = gens[GENS][0]
      gens[GENS].forEach((x) => { if (x.f < best.f) best = x })
      return { seed, NP, F, CR, GENS, gens, worked: w, best }
    }
  }
})()
const BEST = evaluate(DE.best.c, DE.best.m)
const SLICE = (() => {
  const c = 66
  const pts = []
  for (let m = RANGE.m[0]; m <= RANGE.m[1]; m += 0.25) { const e = evaluate(c, m); pts.push({ m, cost: e.cost, minI: e.minI }) }
  const key = (i) => { const q = GRID[i]; return Math.min(q.x, 100 - q.x) + ',' + Math.min(q.y, 60 - q.y) }
  const kinks = pts.filter((pt, k) => k > 0 && key(pt.minI) !== key(pts[k - 1].minI))
  return { c, pts, kinks }
})()

const W0 = DE.worked

const ATAN = deg(Math.atan(ONE.horiz / POLE_H))
const LO = TABLE[2]
const HI = TABLE[3]
const FRAC = (ONE.gamma - LO[0]) / (HI[0] - LO[0])
const ORDER = [1, 0, 2, 3, 4, 5]

// ---------- shared drawing ----------
function fieldView (bx, by, bw, bh) {

function poleColor (p) { return p.kind === 'c' ? C.one : C.two }

function aimPoint (p, alpha) {

function tag (s, x, y, color, a = 1, align = 'left') {

// The design map: corner angle across, halfway angle up, shaded by score.
function mapBox () {

}
function drawMap (b, a = 1) {

    txt('α_c', b.x1, b.y1 + fz(26), { size: fz(12), math: true, color: C.one, align: 'right', alpha: a })

// ---------- 1. the field ----------
function sceneField (p) {
  const V = fieldView(W * 0.04, H * 0.04, W * 0.92, H * 0.8)
  drawField(V, easeOut(seg(p, 0, 0.4)))
  const pa = easeOut(seg(p, 0.3, 0.7))
  drawPoles(V, pa, easeOut(seg(p, 3.05, 3.4)))
  if (pa > 0) {

  }
  GRID.forEach((g, i) => {
    const row = Math.floor(i / 9)
    const a = easeOut(seg(p, 1.05 + row * 0.1 + (i % 9) * 0.015, 1.3 + row * 0.1 + (i % 9) * 0.015))
    const q = V.P(g.x, g.y)

// ---------- 2. one floodlight, one point (side view) ----------

      line(ex - ux * sc * 7, gy - uy * sc * 7, ex, gy, C.green, 1.2, th)
    }
    line(px - wBeam / (2 * uy), gy + 3, px + wBeam / (2 * uy), gy + 3, C.green, 3, th)
  }
  // intensity table
  const tb = NARROW ? { x: W * 0.04, y: H * 0.5, w: W * 0.92 } : { x: W * 0.63, y: H * 0.1, w: W * 0.34 }
  const cols = TABLE.slice(0, 8)
  const ta = easeOut(seg(p, 3.05, 3.4))
  if (ta > 0) {
    const cw = tb.w / cols.length
    const rh = fz(22)
    panel(tb.x - 6, tb.y - rh * 0.9, tb.w + 12, rh * 2.8, ta, C.faint)
    cols.forEach(([g, I], k) => {
      const hot = k === 2 || k === 3
      const x = tb.x + (k + 0.5) * cw
      txt(`${g}°`, x, tb.y, { size: fz(9.5), mono: true, color: hot ? C.accent : C.muted, weight: hot ? 700 : 500, align: 'center', alpha: ta })
      txt(`${Math.round(I / 1000)}k`, x, tb.y + rh, { size: fz(9.5), mono: true, color: hot ? C.accent : C.ink, weight: hot ? 700 : 500, align: 'center', alpha: ta })
    })
    const mk = easeOut(seg(p, 3.3, 3.7))
    const xm = tb.x + (2.5 + FRAC) * cw
    line(xm, tb.y - rh * 0.6, xm, tb.y + rh * 1.6, C.accent, 1.6, mk)
    txt('candela at angle γ from the beam axis', tb.x + tb.w / 2, tb.y + rh * 2.3, { size: fz(9.5), color: C.muted, align: 'center', alpha: ta })
  }
  const lux = easeOut(seg(p, 5.2, 5.6))
  tag(`${f1(ONE.E)} lx`, SX(ONE.horiz), gy - fz(22), C.hi, lux, 'center')
  const lines = [
    `d = √(31^2 + 20^2) = ${f1(ONE.d)} m`,
    `γ = ${f1(ATAN)}° − ${DESIGN_A.m}° = ${f1(ONE.gamma)}°`,
    `I = 245,000 + ${f3(FRAC)} × (185,000 − 245,000) = ${fmt(ONE.I)}`,
    `cos θ = 20 ÷ ${f1(ONE.d)} = ${f3(ONE.cosT)}`,
    `E = ${fmt(ONE.I)} × ${f3(ONE.cosT)} ÷ ${f1(ONE.d)}^2 = ${f1(ONE.E)} lx`
  ]
  const shown = seg(p, 1.3, 1.6) + seg(p, 2.2, 2.5) + seg(p, 3.4, 3.7) + seg(p, 4.3, 4.6) + seg(p, 5.1, 5.4)
  if (NARROW) formulaSteps(lines, W * 0.04, H * 0.7, shown, { size: 10.5, gap: H * 0.055 })
  else formulaSteps(lines, W * 0.63, H * 0.42, shown, { size: fz(12.5), gap: Math.min(fz(30), H * 0.085) })
}

// ---------- 3. adding every floodlight ----------
function sceneSum (p) {
  const V = NARROW ? fieldView(W * 0.02, H * 0.02, W * 0.96, H * 0.62) : fieldView(W * 0.02, H * 0.04, W * 0.72, H * 0.9)
  drawField(V, 1)
  drawPoles(V, 1, 1)
  const fill = (i) => {
    if (i === P_IDX) return easeOut(seg(p, 1.9, 2.05))
    return easeOut(seg(p, 2.05 + i * 0.012, 2.25 + i * 0.012))
  }
  drawHeat(V, EVAL_A.lux, fill)
  const P = V.P(P_PT.x, P_PT.y)
  glow(P.x, P.y, 4, C.hi, 1 - seg(p, 2.1, 2.4))
  // stacked bar of contributions
  const bx = NARROW ? W * 0.1 : W * 0.8
  const by = NARROW ? H * 0.9 : H * 0.86
  const bwid = NARROW ? W * 0.8 : W * 0.1
  const scale = (NARROW ? W * 0.8 : H * 0.7) / 170
  let acc = 0
  ORDER.forEach((k, n) => {
    const t0 = n === 0 ? 0.15 : 1.05 + (n - 1) * 0.14
    const f = seg(p, t0, t0 + (n === 0 ? 0.6 : 0.3))
    const pole = POLES[k]
    const from = V.P(pole.x, pole.y)
    if (f > 0 && f < 1) {
      line(from.x, from.y, P.x, P.y, poleColor(pole), 1.4, 0.7 * (1 - f))
      flight(P, NARROW ? { x: bx + (acc + CONTRIBS[k] / 2) * scale, y: by } : { x: bx + bwid / 2, y: by - (acc + CONTRIBS[k] / 2) * scale }, f, poleColor(pole), 2.4, 30)
    }
    if (f >= 1) {
      A(0.85)
      ctx.fillStyle = poleColor(pole)
      if (NARROW) ctx.fillRect(bx + acc * scale, by - 7, CONTRIBS[k] * scale - 1, 14)
      else ctx.fillRect(bx, by - (acc + CONTRIBS[k]) * scale + 1, bwid, CONTRIBS[k] * scale - 1)
    }
    acc += f >= 1 ? CONTRIBS[k] : 0
  })
  if (acc > 0) {
    const total = acc
    if (NARROW) tag(`${f1(total)} lx`, bx + total * scale + 6, by, C.hi, 1)
    else tag(`${f1(total)} lx`, bx + bwid / 2, by - total * scale - fz(14), C.hi, 1, 'center')
  }
  const mn = easeOut(seg(p, 3.05, 3.4))
  if (mn > 0) {
    cellRing(V, MIN_PT, C.pink, mn)
    const c = V.P(MIN_PT.x, MIN_PT.y + 5)
    tag(`dimmest ${f1(EVAL_A.min)} lx`, c.x, c.y + fz(14), C.pink, mn, 'center')
  }
}

// ---------- 4. average and uniformity ----------
function sceneUniformity (p) {
  const V = fieldView(W * 0.2, H * 0.02, W * 0.6, H * 0.36)
  drawField(V, 1)
  drawHeat(V, EVAL_A.lux, () => 1, false)
  const x0 = W * 0.08
  const x1 = W * 0.95
  const base = H * 0.84
  const top = H * 0.46
  const Y = (v) => lerp(base, top, v / 260)
  const bw = (x1 - x0) / GRID.length
  line(x0, base, x1, base, C.ink, 1)
  ;[100, 200].forEach((v) => {
    line(x0, Y(v), x1, Y(v), C.faint, 1, 0.5)
    txt(String(v), x0 - 5, Y(v), { size: fz(9.5), mono: true, color: C.muted, align: 'right' })
  })
  GRID.forEach((q, i) => {
    const g = easeOut(seg(p, 0.1 + i * 0.008, 0.4 + i * 0.008))
    const isMin = i === EVAL_A.minI && p > 1
    A(isMin ? 1 : 0.8)
    ctx.fillStyle = isMin ? C.pink : luxFill(EVAL_A.lux[i], 1.2)
    ctx.fillRect(x0 + i * bw + 0.5, lerp(base, Y(EVAL_A.lux[i]), g), bw - 1, (base - Y(EVAL_A.lux[i])) * g)
  })
  const avg = ease(seg(p, 0.6, 0.95))
  if (avg > 0) {
    line(x0, Y(EVAL_A.avg), lerp(x0, x1, avg), Y(EVAL_A.avg), C.hi, 2)
    tag(`Ē ${f1(EVAL_A.avg)}`, x1, Y(EVAL_A.avg) - fz(14), C.hi, avg, 'right')
  }
  const mn = easeOut(seg(p, 1.05, 1.4))
  if (mn > 0) {
    const x = x0 + (EVAL_A.minI + 0.5) * bw
    glow(x, Y(EVAL_A.min), 4, C.pink, mn)
    tag(`E_min ${f1(EVAL_A.min)}`.replace('_', ' '), x + 8, Y(EVAL_A.min) + fz(16), C.pink, mn)
    const c = V.P(MIN_PT.x, MIN_PT.y)
    cellRing(V, MIN_PT, C.pink, mn)
    flight({ x: c.x, y: c.y }, { x, y: Y(EVAL_A.min) }, seg(p, 1.05, 1.5), C.pink, 2.4, 10)
  }
  const lines = [
    `U = ${f1(EVAL_A.min)} ÷ ${f1(EVAL_A.avg)} = ${EVAL_A.U.toFixed(3)}`
  ]
  formulaSteps(lines, W / 2, H * 0.93, seg(p, 2.1, 2.4), { align: 'center', size: NARROW ? 12 : fz(14) })
  tag('U below 0.70: fails', W * 0.95, H * 0.42, C.pink, easeOut(seg(p, 2.4, 2.7)), 'right')
  tag('Ē above 200: passes', W * 0.05, H * 0.42, C.green, easeOut(seg(p, 3.05, 3.4)))
  line(x0, Y(TARGET_E), x1, Y(TARGET_E), C.green, 1.4, easeOut(seg(p, 3.05, 3.4)), [5, 4])
}

// ---------- 5. the score ----------
function sceneCost (p) {
  const cols = [
    { e: EVAL_A, label: `A  (${DESIGN_A.c}°, ${DESIGN_A.m}°)`, x: W * 0.3 },
    { e: BEST, label: `B  (${f1(DE.best.c)}°, ${f1(DE.best.m)}°)`, x: W * 0.72 }
  ]
  const base = H * 0.88
  const scale = H * 0.42 / 1.8
  const bw = W * (NARROW ? 0.2 : 0.14)
  const terms = (e) => [
    { v: e.pE, color: C.two, name: 'light' },
    { v: e.pU, color: C.pink, name: 'uniformity' },
    { v: e.bonus, color: C.hi, name: '1 − U' }
  ]
  const timing = [[0.1, 0.5], [1.05, 1.5], [2.05, 2.5]]
  cols.forEach((col, ci) => {
    const appear = ci === 0 ? easeOut(seg(p, 0, 0.3)) : easeOut(seg(p, 3.05, 3.4))
    if (appear <= 0) return
    const V = fieldView(col.x - W * 0.2, H * 0.03, W * 0.4, H * 0.3)
    group(appear, () => { drawField(V, 1); drawHeat(V, col.e.lux, () => 1, false) })
    txt(col.label, col.x, H * 0.37, { size: fz(11), mono: true, weight: 700, align: 'center', alpha: appear })
    line(col.x - bw, base, col.x + bw, base, C.ink, 1, appear)
    let acc = 0
    terms(col.e).forEach((t, k) => {
      const g = ci === 0 ? easeOut(seg(p, timing[k][0], timing[k][1])) : easeOut(seg(p, 3.2 + k * 0.1, 3.6 + k * 0.1))
      if (g <= 0) return
      const h = t.v * scale * g
      A(0.85)
      ctx.fillStyle = t.color
      ctx.fillRect(col.x - bw / 2, base - acc - h, bw, h)
      if (t.v > 0.05) txt(`${t.name} ${t.v.toFixed(2)}`, col.x + bw / 2 + 6, base - acc - h / 2, { size: fz(10), mono: true, color: t.color, alpha: g })
      else if (ci === 0) txt(`${t.name} 0`, col.x + bw / 2 + 6, base - acc - fz(8) * (k + 1), { size: fz(10), mono: true, color: t.color, alpha: g })
      acc += h
    })
    const tot = ci === 0 ? easeOut(seg(p, 2.4, 2.7)) : easeOut(seg(p, 3.5, 3.8))
    tag(`f = ${col.e.cost.toFixed(3)}`, col.x, base - acc - fz(16), ci === 0 ? C.ink : C.green, tot, 'center')
  })
}

// ---------- 6. why not try them all ----------
function sceneSpace (p) {
  const a0 = easeOut(seg(p, 0, 0.3))
  const chips = [['360', 'orientations'], ['26', 'tilts'], ['3', 'models']]
  const cy = H * 0.12
  const cw = Math.min(W * 0.22, fz(120))
  chips.forEach(([n, label], k) => {
    const f = easeOut(seg(p, 0.1 + k * 0.2, 0.4 + k * 0.2))
    const x = W / 2 + (k - 1) * (cw + fz(28))
    panel(x - cw / 2, cy - fz(20), cw, fz(40), f, C.faint)
    txt(n, x, cy - fz(5), { size: fz(15), mono: true, weight: 750, align: 'center', alpha: f })
    txt(label, x, cy + fz(11), { size: fz(9.5), color: C.muted, align: 'center', alpha: f })
    if (k < 2) txt('×', x + cw / 2 + fz(14), cy, { size: fz(15), color: C.muted, align: 'center', alpha: f })
  })
  tag('= 28,080 settings for one floodlight', W / 2, H * 0.25, C.ink, easeOut(seg(p, 0.7, 1)), 'center')
  // nine floodlights
  const nine = easeOut(seg(p, 1.05, 1.5))
  for (let k = 0; k < 9; k++) {
    const f = easeOut(seg(p, 1.05 + k * 0.05, 1.3 + k * 0.05))
    const x = W / 2 + (k - 4) * Math.min(W * 0.09, fz(46))
    dot(x, H * 0.36, 5, C.two, f)
  }
  const exp = Math.round(40 * ease(seg(p, 1.3, 1.85)))
  if (nine > 0) {
    txt(`28,080^9 ≈ 1.1 × 10^{${exp}} designs`, W / 2, H * 0.45, { size: NARROW ? 13 : fz(17), math: true, align: 'center', color: C.hi, alpha: nine })
    tag('at a million a second: 3.5 × 10²⁶ years', W / 2, H * 0.53, C.pink, easeOut(seg(p, 1.7, 2)), 'center')
  }
  // the slice
  const sa = easeOut(seg(p, 2.05, 2.3))
  if (sa > 0) {
    const x0 = W * 0.12
    const x1 = W * 0.94
    const y0 = H * 0.62
    const y1 = H * 0.9
    const lo = 0.26
    const hi = 0.6
    const X = (m) => lerp(x0, x1, (m - RANGE.m[0]) / (RANGE.m[1] - RANGE.m[0]))
    const Y = (c) => lerp(y1, y0, (c - lo) / (hi - lo))
    line(x0, y1, x1, y1, C.ink, 1, sa)
    txt(`score f along α_m, with α_c = ${SLICE.c}°`, x0, y0 - fz(10), { size: fz(10.5), math: true, color: C.muted, alpha: sa })
    ;[20, 45, 70].forEach((m) => txt(`${m}°`, X(m), y1 + fz(12), { size: fz(9.5), mono: true, color: C.muted, align: 'center', alpha: sa }))
    const pts = SLICE.pts.map((pt) => ({ x: X(pt.m), y: Y(pt.cost) }))
    tracePath(pts, ease(seg(p, 2.1, 2.8)), C.hi, 2)
    SLICE.kinks.forEach((k, n) => {
      const f = easeOut(seg(p, 2.8 + n * 0.1, 3 + n * 0.1))
      const q = { x: X(k.m), y: Y(k.cost) }
      ripple(q.x, q.y, 3, 16, C.pink, f)
      glow(q.x, q.y, 3.5, C.pink, f)
    })
  }
}

// ---------- 7. mutation ----------
function sceneMutation (p) {
  const b = mapBox()
  const { MX, MY } = drawMap(b, 1)
  const pa = easeOut(seg(p, 0.1, 0.6))
  // Latin hypercube strata
  const strata = easeOut(seg(p, 0.1, 0.4)) * (1 - easeOut(seg(p, 0.9, 1.05)))
  for (let k = 1; k < DE.NP; k++) {
    const xc = lerp(b.x0, b.x1, k / DE.NP)
    const ym = lerp(b.y1, b.y0, k / DE.NP)
    line(xc, b.y0, xc, b.y1, C.ink, 1, 0.12 * strata)
    line(b.x0, ym, b.x1, ym, C.ink, 1, 0.12 * strata)
  }
  GP.forEach((x, i) => {
    const role = i === 0 ? 'x' : i === W0.a ? 'a' : i === W0.b ? 'b' : i === W0.c ? 'c' : null
    const lit = p > 1 && role
    dot(MX(x.c), MY(x.m), lit ? 5 : 4, lit ? (role === 'x' ? C.ink : C.accent) : C.ink, pa * (lit || p < 1 ? 1 : 0.4))
    if (lit) txt(role, MX(x.c) + 8, MY(x.m) - 9, { size: fz(13), math: true, weight: 700, color: role === 'x' ? C.ink : C.accent, alpha: easeOut(seg(p, 1.1, 1.4)) })
  })
  if (p > 1) {
    const r = easeOut(seg(p, 1.05, 1.3))
    A(r)
    ctx.strokeStyle = C.ink
    ctx.lineWidth = 1.5
    ctx.beginPath()
    ctx.arc(MX(GP[0].c), MY(GP[0].m), 9, 0, TAU)
    ctx.stroke()
  }
  const diff = ease(seg(p, 2.05, 2.6))
  if (diff > 0) arrow(MX(XC.c), MY(XC.m), lerp(MX(XC.c), MX(XB.c), diff), lerp(MY(XC.m), MY(XB.m), diff), C.accent, 2)
  const mv = ease(seg(p, 3.05, 3.7))
  if (mv > 0) {
    const dx = (MX(XB.c) - MX(XC.c)) * lerp(1, DE.F, mv)
    const dy = (MY(XB.m) - MY(XC.m)) * lerp(1, DE.F, mv)
    const sx = lerp(MX(XC.c), MX(XA.c), mv)
    const sy = lerp(MY(XC.m), MY(XA.m), mv)
    arrow(sx, sy, sx + dx, sy + dy, C.hi, 2.2)
    const va = easeOut(seg(p, 3.6, 3.9))
    glow(MX(W0.v.c), MY(W0.v.m), 5, C.hi, va)
    txt('v', MX(W0.v.c) + 9, MY(W0.v.m) - 9, { size: fz(13), math: true, weight: 700, color: C.hi, alpha: va })
  }
  const lines = [
    'v = a + F × (b − c)',
    `v_c = ${f1(XA.c)} + 0.8 × (${f1(XB.c)} − ${f1(XC.c)}) = ${f1(W0.v.c)}°`,
    `v_m = ${f1(XA.m)} + 0.8 × (${f1(XB.m)} − ${f1(XC.m)}) = ${f1(W0.v.m)}°`
  ]
  const shown = seg(p, 2.2, 2.5) + seg(p, 3.3, 3.6) + seg(p, 3.6, 3.9)
  if (NARROW) formulaSteps(lines, W * 0.05, H * 0.72, shown, { size: 11.5, gap: H * 0.07 })
  else formulaSteps(lines, W * 0.61, H * 0.36, shown, { size: fz(13), gap: Math.min(fz(36), H * 0.09) })
}

// ---------- 8. crossover and selection ----------
function sceneCross (p) {
  const b = mapBox()
  const { MX, MY } = drawMap(b, 1)
  const step3 = ease(seg(p, 3.05, 3.8))
  GP.forEach((x, i) => {
    if (i === 0) return
    const nx = DE.gens[1][i]
    dot(lerp(MX(x.c), MX(nx.c), step3), lerp(MY(x.m), MY(nx.m), step3), 4, C.ink, 0.45 + 0.55 * step3)
  })
  const X0 = { x: MX(W0.x.c), y: MY(W0.x.m) }
  const V0 = { x: MX(W0.v.c), y: MY(W0.v.m) }
  const U0 = { x: MX(W0.u.c), y: MY(W0.u.m) }
  dot(V0.x, V0.y, 4.5, C.hi, 1 - seg(p, 2.6, 3))
  txt('v', V0.x + 9, V0.y - 9, { size: fz(13), math: true, weight: 700, color: C.hi, alpha: 1 - seg(p, 2.6, 3) })
  const uA = easeOut(seg(p, 1.4, 1.8))
  if (uA > 0) {
    line(X0.x, X0.y, U0.x, U0.y, C.faint, 1, uA * (1 - seg(p, 2.6, 3)), [3, 3])
    line(V0.x, V0.y, U0.x, U0.y, C.faint, 1, uA * (1 - seg(p, 2.6, 3)), [3, 3])
  }
  const sel = ease(seg(p, 2.4, 2.9))
  const xPos = { x: lerp(X0.x, U0.x, sel), y: lerp(X0.y, U0.y, sel) }
  dot(xPos.x, xPos.y, 5, C.ink, 1)
  txt('x', xPos.x - 14, xPos.y - 9, { size: fz(13), math: true, weight: 700, alpha: 1 - sel })
  glow(U0.x, U0.y, 5, C.green, uA * (1 - sel))
  txt('u', U0.x + 9, U0.y + 12, { size: fz(13), math: true, weight: 700, color: C.green, alpha: uA * (1 - sel) })
  // chips
  const cx = NARROW ? W * 0.06 : W * 0.62
  const cy = NARROW ? H * 0.69 : H * 0.2
  const cw = NARROW ? W * 0.26 : W * 0.1
  const rowH = fz(36)
  const colX = (k) => cx + k * (cw + fz(12))
  const head = ['x', 'v', 'u']
  head.forEach((h, k) => txt(h, colX(k) + cw / 2, cy - fz(16), { size: fz(14), math: true, weight: 700, align: 'center', color: [C.ink, C.hi, C.green][k], alpha: k < 2 ? 1 : uA }))
  const vals = [[W0.x.c, W0.v.c], [W0.x.m, W0.v.m]]
  const names = ['α_c', 'α_m']
  const pickT = [easeOut(seg(p, 0.3, 0.8)), easeOut(seg(p, 1.2, 1.7))]
  const from = [1, 0]
  vals.forEach((pair, j) => {
    const y = cy + j * rowH
    txt(names[j], cx - 8, y + fz(13), { size: fz(12), math: true, align: 'right', color: j ? C.two : C.one })
    pair.forEach((v, k) => {
      const chosen = from[j] === k && pickT[j] > 0
      panel(colX(k), y, cw, fz(26), 1, chosen ? C.hi : C.faint)
      txt(`${f1(v)}°`, colX(k) + cw / 2, y + fz(13), { size: fz(11), mono: true, weight: chosen ? 700 : 500, align: 'center' })
    })
    const t = pickT[j]
    if (t > 0) {
      const sx = lerp(colX(from[j]), colX(2), t)
      panel(sx, y, cw, fz(26), 1, C.green)
      txt(`${f1(pair[from[j]])}°`, sx + cw / 2, y + fz(13), { size: fz(11), mono: true, weight: 700, color: C.green, align: 'center' })
    }
  })
  const rLines = [
    'always from v',
    `r = ${W0.rs[1].toFixed(2)} > 0.7: keep x`
  ]
  rLines.forEach((s, j) => txt(s, colX(0), cy + j * rowH + fz(34), { size: fz(9.5), mono: true, color: C.muted, alpha: pickT[j] }))
  const sc = easeOut(seg(p, 2.05, 2.4))
  const sy = cy + rowH * 2 + fz(40)
  tag(`f(x) = ${W0.x.f.toFixed(3)}`, colX(0), sy, C.ink, sc)
  tag(`f(u) = ${W0.u.f.toFixed(3)}`, colX(0), sy + fz(28), C.green, sc)
  tag('u ≤ x: u replaces x', colX(0), sy + fz(56), C.green, easeOut(seg(p, 2.4, 2.7)))
}

// ---------- 9. generations ----------
function sceneGens (p) {
  const b = mapBox()
  const { MX, MY } = drawMap(b, 1)
  const gt = seg(p, 0.1, 0.95) * DE.GENS
  const g0 = Math.min(DE.GENS - 1, Math.floor(gt))
  const ft = ease(clamp(gt - g0))
  DE.gens[g0].forEach((x, i) => {
    const y = DE.gens[g0 + 1][i]
    dot(lerp(MX(x.c), MX(y.c), ft), lerp(MY(x.m), MY(y.m), ft), 4, C.ink, 0.85)
  })
  tag(`generation ${Math.round(gt)}`, b.x0 + 6, b.y0 + fz(14), C.hi, 1)
  // mean score chart
  const cb = NARROW ? { x0: W * 0.14, x1: W * 0.6, y0: H * 0.68, y1: H * 0.92 } : { x0: W * 0.64, x1: W * 0.96, y0: H * 0.1, y1: H * 0.4 }
  const ca = easeOut(seg(p, 1.05, 1.3))
  if (ca > 0) {
    const X = (k) => lerp(cb.x0, cb.x1, k / DE.GENS)
    const Y = (v) => lerp(cb.y1, cb.y0, (v - 0.2) / 0.7)
    line(cb.x0, cb.y1, cb.x1, cb.y1, C.ink, 1, ca)
    txt('average score', cb.x0, cb.y0 - fz(8), { size: fz(10), color: C.muted, alpha: ca })
    const pts = MEANF.map((v, k) => ({ x: X(k), y: Y(v) }))
    const head = tracePath(pts, ease(seg(p, 1.1, 1.8)), C.hi, 2)
    glow(head.x, head.y, 3.5, C.hi, ca)
    txt(MEANF[0].toFixed(2), X(0) + 4, Y(MEANF[0]) - fz(9), { size: fz(9.5), mono: true, color: C.muted, alpha: ca })
    txt(MEANF[DE.GENS].toFixed(2), X(DE.GENS), Y(MEANF[DE.GENS]) - fz(10), { size: fz(9.5), mono: true, color: C.hi, align: 'right', alpha: easeOut(seg(p, 1.7, 1.9)) })
  }
  // best design's heat map
  const ha = easeOut(seg(p, 2.05, 2.5))
  if (ha > 0) {
    const hb = NARROW ? { x: W * 0.62, y: H * 0.64, w: W * 0.36, h: H * 0.3 } : { x: W * 0.62, y: H * 0.5, w: W * 0.36, h: H * 0.32 }
    const V = fieldView(hb.x, hb.y, hb.w, hb.h)
    group(ha, () => { drawField(V, 1); drawHeat(V, BEST.lux, () => 1, false) })
    glow(MX(DE.best.c), MY(DE.best.m), 5, C.green, ha)
    ripple(MX(DE.best.c), MY(DE.best.m), 4, 20, C.green, ha)
    if (!NARROW) tag(`U ${BEST.U.toFixed(2)} · Ē ${f1(BEST.avg)} lx`, hb.x + hb.w / 2, hb.y + hb.h + fz(10), C.green, easeOut(seg(p, 2.4, 2.7)), 'center')
  }
}

// ===== RUNTIME: do not change =====
function drawScene (context, index, p, { width, height, dpr, font }, time = 0) {
  ctx = context
  T = time
  LIVE = time > 0
  W = width
  H = height
  NARROW = width < 520
  U = clamp(Math.min(width, height) / 600, 0.55, 1.15)
  GA = 1
  if (font) FONT = font
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.globalAlpha = 1
  ctx.clearRect(0, 0, W, H)
  SCENES[index].draw(p)
}

    if (cur > 0) {
      const ghostSide = cur % 2 ? dir : -dir
      const rect = ch.el.getBoundingClientRect()
      const room = ghostSide > 0 ? rect.left : window.innerWidth - rect.right
      shift = -ghostSide * Math.min((gap + copyW * GHOST_SHOWN) / 2, Math.max(0, room - 16))
    }
    ch.col.style.translate = `${(cur % 2 ? dir * (copyW + gap) : 0) + shift}px 0`
    ch.pages.forEach(({ el }, k) => {
      const away = k % 2 === 1
      const base = (away ? -dir * (stageW + gap) : 0) + shift
      const out = away ? -dir : dir
      const s = el.style
      s.setProperty('--fade-dir', out > 0 ? '90deg' : '270deg')
      if (k === cur) {
        s.translate = `${base}px 0`
        s.opacity = '1'
        s.setProperty('--fade', '150%')
      } else if (k < cur) {
        s.translate = `${base + out * (copyW + gap)}px 0`
        s.opacity = k === cur - 1 ? '.75' : '0'
        s.setProperty('--fade', k === cur - 1 ? `${GHOST_SHOWN * 100}%` : '0%')
      } else {
        s.translate = `${base + out * 56}px 0`
        s.opacity = '0'
        s.setProperty('--fade', '150%')
      }
      el.inert = k !== cur
    })
  }

  function frame (now) {
    raf = 0
    if (!inView) { lastFrame = 0; return }
    const dt = lastFrame ? Math.min(64, now - lastFrame) : 16
    lastFrame = now
    const vh = window.innerHeight
    const rate = reduceMotion ? 1 : 1 - Math.exp(-dt / DAMPING_MS)
    let current = activeChapter

    chapters.forEach((ch, i) => {
      const rect = ch.el.getBoundingClientRect()
      if (rect.top < vh * 0.5 && rect.bottom > vh * 0.5) current = i
      const near = rect.bottom > -vh * 0.3 && rect.top < vh * 1.3
      if (near !== ch.near) {
        ch.near = near
        if (near) {
          sizeCanvas(ch)
        } else {
          ch.canvas.width = 0
          ch.canvas.height = 0
          ch.size = null
        }
      }
      if (!ch.seen && rect.top < vh * 0.9) {
        ch.seen = true
        ch.el.classList.add('seen')
      }
      if (!ch.started && rect.top < vh * START_LINE && rect.bottom > vh * 0.2) ch.started = true
      const visible = rect.top < vh * 0.8 && rect.bottom > vh * 0.2
      if (ch.started && visible && !reduceMotion && ch.time < ch.total) {
        ch.time = Math.min(ch.total, ch.time + dt)
      }
      const target = progressAt(ch)
      ch.shown += (target - ch.shown) * rate
      if (Math.abs(target - ch.shown) < 0.0004) ch.shown = target
      const beat = Math.min(ch.beatEls.length - 1, Math.floor(target))
      paintBeats(ch, beat, ch.time >= ch.total)
      ch.beatEls[beat].style.setProperty('--fill', (target - beat).toFixed(3))
      if (!near) return
      const looping = !reduceMotion && rect.bottom > 0 && rect.top < vh
      if (ch.size && (looping || ch.dirty || Math.abs(ch.shown - ch.drawn) > 0.0002)) {
        drawScene(ch.ctx, i, ch.shown, ch.size, reduceMotion ? 0 : now)
        ch.drawn = ch.shown
        ch.dirty = false
      }
    })

    if (current !== activeChapter) {
      activeChapter = current
      railItems.forEach((item, n) => item.classList.toggle('on', n === current))
    }
    const first = chapters[0].el.getBoundingClientRect()
    const last = chapters[chapters.length - 1].el.getBoundingClientRect()
    const shown = first.top < vh * 0.5 && last.bottom > vh * 0.5
    if (shown !== railShown) {
      railShown = shown
      rail.classList.toggle('shown', shown)
    }
    raf = requestAnimationFrame(frame)
  }
  function start () {
    if (!raf && inView) raf = requestAnimationFrame(frame)
  }

  // The opening is a stop of its own, so one scroll from it glides into the first chapter.
  function openingZone () {
    if (!opening) return []
    const bottom = opening.getBoundingClientRect().bottom + window.scrollY
    return [{ snap: 0, end: Math.max(0, bottom - window.innerHeight) }]
  }
  function zoneOf (ch) {
    const vh = window.innerHeight
    const rect = ch.el.getBoundingClientRect()
    const top = rect.top + window.scrollY
    const maxScroll = document.documentElement.scrollHeight - vh
    const snap = Math.min(maxScroll, Math.max(0, top - Math.max(SNAP_PADDING, (vh - rect.height) / 2)))
    const end = Math.min(maxScroll, Math.max(snap, top + rect.height + SNAP_PADDING - vh))
    return { snap, end }
  }
  // `force` lets the keyboard enter the story from anywhere above or below it.
  function nextStop (direction, force = false) {
    const y = window.scrollY
    const reach = window.innerHeight * ENTRY_REACH
    const zones = [...openingZone(), ...chapters.map(zoneOf)]
    if (direction > 0) {
      for (let i = 0; i < zones.length; i++) {
        if (y < zones[i].snap - SNAP_EPSILON) return i === 0 && !force && zones[i].snap - y > reach ? null : zones[i].snap
        if (y < zones[i].end - SNAP_EPSILON) return null
      }
      return null
    }
    for (let i = zones.length - 1; i >= 0; i--) {
      if (y > zones[i].end + SNAP_EPSILON) return i === zones.length - 1 && !force && y - zones[i].end > reach ? null : zones[i].end
      if (y > zones[i].snap + SNAP_EPSILON) return null
    }
    return null
  }
  function cancelGlide () {
    if (glideRaf) cancelAnimationFrame(glideRaf)
    glideRaf = 0
  }
  function glideTo (target) {
    cancelGlide()
    const from = window.scrollY
    const distance = Math.abs(target - from)
    if (distance < 2) return
    const duration = Math.min(MAX_GLIDE_MS, Math.max(MIN_GLIDE_MS, distance * GLIDE_MS_PER_PX + 500))
    const startedAt = performance.now()
    settling = true
    wheelTotal = 0
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - startedAt) / duration))
      window.scrollTo({ top: from + (target - from) * ease(t), behavior: 'instant' })
      glideRaf = t < 1 ? requestAnimationFrame(step) : 0
    }
    glideRaf = requestAnimationFrame(step)
  }
  function onWheel (e) {
    if (e.ctrlKey || !e.deltaY || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return
    const delta = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaMode === 2 ? e.deltaY * window.innerHeight : e.deltaY
    const size = Math.abs(delta)
    const now = performance.now()
    const gap = now - lastWheelAt
    const rising = size > 30 && size > lastWheelSize * 1.6
    lastWheelAt = now
    lastWheelSize = size
    if (glideRaf) { e.preventDefault(); return }
    if (gap > WHEEL_QUIET_MS) {
      settling = false
      wheelTotal = 0
    }
    if (settling) {
      if (!rising) { e.preventDefault(); return }
      settling = false
      wheelTotal = 0
    }
    const direction = Math.sign(delta)
    const target = nextStop(direction)
    if (target === null) return
    e.preventDefault()
    if (Math.sign(wheelTotal) !== direction) wheelTotal = 0
    wheelTotal += delta
    if (Math.abs(wheelTotal) >= WHEEL_THRESHOLD) glideTo(target)
  }
  // ← and → move between steps, continuing into the next or previous chapter at either end.
  function stepBy (dir) {
    const i = Math.max(0, activeChapter)
    const ch = chapters[i]
    if (activeChapter !== i) {
      jump(i)
      seek(i, 0)
      return
    }
    const n = ch.beatEls.length
    const current = ch.started ? Math.min(n - 1, Math.floor(progressAt(ch))) : -1
    const target = current + dir
    if (target >= n) {
      if (i + 1 < chapters.length) {
        jump(i + 1)
        seek(i + 1, 0)
      }
    } else if (target < 0) {
      if (i > 0) {
        jump(i - 1)
        seek(i - 1, chapters[i - 1].beatEls.length - 1)
      }
    } else {
      seek(i, target)
    }
  }
  function onKeydown (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault()
      stepBy(e.key === 'ArrowRight' ? 1 : -1)
      return
    }
    let direction = KEY_DIRECTION[e.key]
    if (e.key === ' ') {
      if (e.target.closest?.('button, a')) return
      direction = e.shiftKey ? -1 : 1
    }
    if (!direction) return
    if (glideRaf) { e.preventDefault(); return }
    const target = nextStop(direction, true)
    if (target === null) return
    e.preventDefault()
    if (reduceMotion) window.scrollTo({ top: target, behavior: 'instant' })
    else glideTo(target)
  }
  function onTouchStart (e) {
    touch = e.touches.length === 1 ? { y: e.touches[0].clientY, target: undefined } : null
  }
  function onTouchMove (e) {
    if (glideRaf) {
      if (e.cancelable) e.preventDefault()
      return
    }
    if (!touch) return
    const dy = e.touches[0].clientY - touch.y
    if (touch.target === undefined) {
      if (Math.abs(dy) < 8) return
      touch.target = nextStop(dy < 0 ? 1 : -1)
    }
    if (touch.target === null || !e.cancelable) return
    e.preventDefault()
    if (Math.abs(dy) >= SWIPE_THRESHOLD) {
      glideTo(touch.target)
      touch = null
    }
  }
  function onPointerDown (e) {
    if (e.target === document.documentElement) cancelGlide()
  }
  function jump (i) {
    const { snap } = zoneOf(chapters[i])
    if (reduceMotion) window.scrollTo({ top: snap, behavior: 'instant' })
    else glideTo(snap)
  }
  function seek (i, beat) {
    const ch = chapters[i]
    ch.started = true
    ch.time = reduceMotion ? ch.starts[beat] + ch.durations[beat] - 1 : ch.starts[beat]
  }

  new ResizeObserver(resizeStages).observe(root)
  window.addEventListener('resize', resizeStages)
  window.addEventListener('keydown', onKeydown)
  if (!reduceMotion) {
    window.addEventListener('wheel', onWheel, { passive: false })
    window.addEventListener('touchstart', onTouchStart, { passive: true })
    window.addEventListener('touchmove', onTouchMove, { passive: false })
    window.addEventListener('pointerdown', onPointerDown)
  }
  document.fonts?.ready.then(() => chapters.forEach((ch) => { paginate(ch); ch.dirty = true }))
  window.addEventListener('scene-assets', () => chapters.forEach((ch) => { ch.dirty = true }))
  new IntersectionObserver(([entry]) => {
    inView = entry.isIntersecting
    if (inView) start()
  }, { rootMargin: '30% 0px' }).observe(root)
})()
</script>
<script src="note-end.js" defer></script>
</body>
</html>
