<style>
:root {

}
* { box-sizing: border-box; }

.chapter { position: relative; }

.stage {
  position: sticky; top: calc((100vh - var(--stage-h)) / 2); height: var(--stage-h);
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--line); border-radius: 24px;
  background: radial-gradient(rgba(104, 88, 232, .13) 1px, transparent 1.4px) 0 0 / 22px 22px, linear-gradient(160deg, #fff 0%, #fbfaff 100%);

@media (max-width: 900px) {
  :root { --stage-h: min(46svh, 400px); }

  .stage { top: 8px; z-index: 2; border-radius: 18px; background: radial-gradient(rgba(104, 88, 232, .13) 1px, transparent 1.4px) 0 0 / 22px 22px, #fff; }

<div class="page">

<script>
// ===== DRAWING HELPERS (keep these; add more in the content section if needed) =====
const C = {

  one: '#e4002b', two: '#c08a12', accent: '#1aa3c2', hi: '#6858e8',
  green: '#0e9f6e', pink: '#d63d8f', surface: '#ffffff', track: 'rgba(17,22,50,0.07)'

const MATH = 'KaTeX_Main, "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", serif'
const TAU = Math.PI * 2
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, t) => a + (b - a) * t
const seg = (p, a, b) => clamp((p - a) / (b - a))
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)

const backOut = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2) }
function rng (seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6d2b79f5) >>> 0
    let t = a
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

let ctx = null
let W = 0
let H = 0
let NARROW = false
let U = 1
let GA = 1
let FONT = 'system-ui, sans-serif'
let T = 0
let LIVE = false

const fz = (n) => Math.max(8.5, n * U)
const cycle = (period, offset = 0) => (T / period + offset) % 1
const pulse = (period = 1800, offset = 0) => (LIVE ? 0.5 + 0.5 * Math.sin(TAU * cycle(period, offset)) : 1)
const bob = (seed, amount = 2) => (LIVE ? Math.sin(T / 520 + seed) * amount : 0)
function A (a = 1) { ctx.globalAlpha = clamp(GA * a) }
function group (a, fn) {
  if (a <= 0) return
  const parent = GA
  GA = parent * a
  fn()
  GA = parent
}
function rgba (hex, a) {
  const n = parseInt(hex.slice(1), 16)
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`
}
function txt (s, x, y, o = {}) {
  const { size = 11, color = C.ink, align = 'left', weight = 500, mono = false, math = false, base = 'middle', alpha = 1 } = o
  if (math) return drawMath(s, x, y, { size: size * 1.12, color, align, weight, alpha, base })
  A(alpha)
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  ctx.fillStyle = color
  ctx.textAlign = align
  ctx.textBaseline = base
  ctx.fillText(s, x, y)
}
// Typeset a small maths expression: single letters italic, numbers and longer words upright,
// `_x` / `^x` (or `_{xy}`) as subscripts and superscripts.
function mathRuns (s) {
  const runs = []
  const push = (t, level) => {
    const re = /([A-Za-zα-ωΑ-Ω]+)|([^A-Za-zα-ωΑ-Ω]+)/g
    let m
    while ((m = re.exec(t))) {
      if (m[1]) {
        // A single letter straight after a number and a space is a unit (4 m), so it stays upright.
        const prev = runs[runs.length - 1]
        const unit = m[1].length === 1 && prev && prev.level === level && /\d\s$/.test(prev.t)
        runs.push({ t: m[1], italic: m[1].length < 3 && !unit, level })
      }
      else runs.push({ t: m[2], italic: false, level })
    }
  }
  let i = 0
  while (i < s.length) {
    const c = s[i]
    if ((c === '_' || c === '^') && i + 1 < s.length) {
      const level = c === '_' ? -1 : 1
      if (s[i + 1] === '{') {
        const j = s.indexOf('}', i + 2)
        push(s.slice(i + 2, j < 0 ? s.length : j), level)
        i = j < 0 ? s.length : j + 1
      } else {
        push(s[i + 1], level)
        i += 2
      }
    } else {
      let j = i
      while (j < s.length && s[j] !== '_' && s[j] !== '^') j++
      push(s.slice(i, j), 0)
      i = j
    }
  }
  return runs
}
function drawMath (s, x, y, o) {
  const runs = mathRuns(s)
  const fontFor = (r) => `${r.italic ? 'italic ' : ''}${o.weight} ${r.level ? o.size * 0.68 : o.size}px ${MATH}`
  let total = 0
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    r.w = ctx.measureText(r.t).width + (r.italic && !r.level ? o.size * 0.04 : 0)
    total += r.w
  })
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x
  A(o.alpha)
  ctx.fillStyle = o.color
  ctx.textAlign = 'left'
  ctx.textBaseline = o.base
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    ctx.fillText(r.t, cx, y + (r.level < 0 ? o.size * 0.3 : r.level > 0 ? -o.size * 0.36 : 0))
    cx += r.w
  })

function measure (s, size, weight = 500, mono = false) {
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  return ctx.measureText(s).width
}
function rr (x, y, w, h, r) {
  ctx.beginPath()
  ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r)
}
function line (x1, y1, x2, y2, color, w = 1, a = 1, dash = null) {
  A(a)
  ctx.strokeStyle = color
  ctx.lineWidth = w
  if (dash) ctx.setLineDash(dash)
  ctx.beginPath()
  ctx.moveTo(x1, y1)
  ctx.lineTo(x2, y2)
  ctx.stroke()
  if (dash) ctx.setLineDash([])
}
function dot (x, y, r, color, a = 1) {
  A(a)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.arc(x, y, Math.max(0.1, r), 0, TAU)
  ctx.fill()
}
function glow (x, y, r, color, a = 1) {
  A(a)
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4)
  g.addColorStop(0, rgba(color, 0.3))
  g.addColorStop(1, rgba(color, 0))
  ctx.fillStyle = g
  ctx.beginPath()
  ctx.arc(x, y, r * 4, 0, TAU)
  ctx.fill()
  dot(x, y, r, color, a)
  dot(x, y, r * 0.42, '#ffffff', a)
}
function softShadow (on) {
  ctx.shadowColor = on ? 'rgba(27,31,69,0.08)' : 'transparent'
  ctx.shadowBlur = on ? 14 : 0
  ctx.shadowOffsetY = on ? 4 : 0
}
function panel (x, y, w, h, a = 1, border = C.hi) {
  A(a)
  softShadow(true)
  rr(x, y, w, h, 12)
  ctx.fillStyle = C.surface
  ctx.fill()
  softShadow(false)
  ctx.strokeStyle = rgba(border, 0.4)
  ctx.lineWidth = 1
  ctx.stroke()
}
function qb (a, c, b, t) {
  const u = 1 - t
  return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }
}
// A glowing dot with a tail, arcing from a to b as t goes 0..1.
function flight (a, b, t, color, r = 2.4, lift = 40) {
  if (t <= 0 || t >= 1.25) return
  const c = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - lift }
  for (let k = 6; k >= 0; k--) {
    const tt = t - k * 0.04
    if (tt < 0 || tt > 1) continue
    const q = qb(a, c, b, ease(tt))
    if (k === 0) glow(q.x, q.y, r, color)
    else dot(q.x, q.y, r * (1 - k / 9), color, 0.45 * (1 - k / 7))
  }
}
function polyLen (pts) {
  const L = [0]
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y))
  return L
}
function along (pts, L, t) {
  const d = clamp(t) * L[L.length - 1]
  let i = 1
  while (i < L.length - 1 && L[i] < d) i++
  const s = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1)
  return { x: lerp(pts[i - 1].x, pts[i].x, s), y: lerp(pts[i - 1].y, pts[i].y, s) }
}
// Draws a path up to t (0..1) and returns its leading point.
function tracePath (pts, t, color, width = 2.2, a = 1) {
  const L = polyLen(pts)
  const total = L[L.length - 1] || 1
  for (let s = 1; s < pts.length; s++) {
    if (t * total < L[s - 1]) break
    const end = t * total < L[s] ? along(pts, L, t) : pts[s]
    line(pts[s - 1].x, pts[s - 1].y, end.x, end.y, color, width, a)
  }
  return along(pts, L, t)
}
// Looping: small dots travelling along a path.
function runner (pts, offset = 0, color = C.hi, alpha = 1, period = 2600) {
  if (!LIVE || alpha <= 0 || pts.length < 2) return
  const L = polyLen(pts)
  const t = cycle(period, offset)
  const fade = Math.sin(Math.PI * t) * alpha
  for (let k = 4; k >= 0; k--) {
    const tail = t - k * 0.018
    if (tail < 0) continue
    const q = along(pts, L, tail)
    dot(q.x, q.y, k ? 1.5 : 2.8, color, fade * (1 - k / 6))
  }

// Looping: an expanding ring.
function ripple (x, y, r0, r1, color, a = 1, period = 2000, offset = 0) {
  if (!LIVE || a <= 0) return
  const t = cycle(period, offset)
  A(a * (1 - t) * 0.55)
  ctx.beginPath()
  ctx.arc(x, y, lerp(r0, r1, t), 0, TAU)

  ctx.lineWidth = 1.4
  ctx.stroke()
}
function treeLayout (cx, top, w, h, depth = 3) {
  const lv = []
  for (let l = 0; l <= depth; l++) {
    const n = 1 << l
    lv.push(Array.from({ length: n }, (_, i) => ({ x: cx - w / 2 + (i + 0.5) * w / n, y: top + l * h / depth })))
  }
  return lv
}
const treePath = (lv, leaf) => lv.map((nodes, l) => nodes[leaf >> (lv.length - 1 - l)])
function drawTree (lv, a = 1, r = 2.2) {
  for (let l = 0; l < lv.length - 1; l++) {
    lv[l].forEach((n, i) => {
      line(n.x, n.y, lv[l + 1][2 * i].x, lv[l + 1][2 * i].y, C.faint, 1, a)
      line(n.x, n.y, lv[l + 1][2 * i + 1].x, lv[l + 1][2 * i + 1].y, C.faint, 1, a)
    })
  }
  lv.forEach((nodes) => nodes.forEach((n) => dot(n.x, n.y, r, C.faint, a)))
}
// A code listing. `active` is a line index and may be fractional, so the highlight can slide between lines.
function codeBlock (lines, x, y, w, h, active, a = 1) {
  panel(x, y, w, h, a, C.faint)
  const lh = Math.min(fz(22), (h - 20) / lines.length)
  const longest = Math.max(...lines.map((s) => s.length), 1)
  const size = Math.min(lh * 0.64, (w - 28) / (longest * 0.62))
  const top = y + (h - lh * lines.length) / 2
  const at = clamp(active, 0, lines.length - 1)
  A(a * 0.1)
  ctx.fillStyle = C.hi
  rr(x + 6, top + at * lh, w - 12, lh, 5)
  ctx.fill()
  lines.forEach((s, n) => {
    const on = Math.abs(n - at) < 0.5
    txt(s, x + 14, top + (n + 0.5) * lh, { size, mono: true, color: on ? C.ink : C.muted, weight: on ? 700 : 500, alpha: a })
  })
}

// ===== CONTENT: PID control =====
// One worked example: a drone climbing from the ground to hold 10 m.
// Physics is a simple vertical model, simulated once at load: acceleration = thrust command − unknown load − drag × speed.
// The thrust command is measured as extra upward acceleration on top of the drone's built-in hover thrust.

const TARGET = 10
const DT = 0.01
const DUR = 10
const DRAG = 0.3
const KP = 0.8
const KD = 1.6
const KI = 0.3
const LOAD = 1

function simulate ({ kp = 0, ki = 0, kd = 0, load = 0, loadAt = 0, x0 = 0, limit = Infinity, delay = 0, iClamp = Infinity }) {
  const n = Math.round(DUR / DT)
  const lag = Math.round(delay / DT)
  const seenHist = []
  let x = x0
  let v = 0
  let integ = 0
  const out = { x: [], v: [], u: [], i: [] }
  for (let s = 0; s <= n; s++) {
    seenHist.push(x)
    const seen = seenHist[Math.max(0, seenHist.length - 1 - lag)]
    const seenPrev = seenHist[Math.max(0, seenHist.length - 2 - lag)]
    const e = TARGET - seen
    const de = -(seen - seenPrev) / DT
    integ = clamp(integ + e * DT, -iClamp, iClamp)
    const u = clamp(kp * e + ki * integ + kd * de, -limit, limit)
    out.x.push(x)
    out.v.push(v)
    out.u.push(u)
    out.i.push(ki * integ)
    v += (u - (s * DT >= loadAt ? load : 0) - DRAG * v) * DT
    x += v * DT
  }
  return out
}

const DELAY = 0.8
const LOAD_AT = 1
const RUN = {
  p: simulate({ kp: KP }),
  pFast: simulate({ kp: 2 }),
  pSlow: simulate({ kp: 0.3 }),
  pd: simulate({ kp: KP, kd: KD }),
  pdLoad: simulate({ kp: KP, kd: KD, load: LOAD, loadAt: LOAD_AT, x0: TARGET }),
  pid: simulate({ kp: KP, kd: KD, ki: KI, load: LOAD, loadAt: LOAD_AT, x0: TARGET }),
  windup: simulate({ kp: KP, kd: KD, ki: KI, load: LOAD, limit: 2 }),
  antiWindup: simulate({ kp: KP, kd: KD, ki: KI, load: LOAD, limit: 2, iClamp: 4 }),
  delayed: simulate({ kp: KP, kd: KD, delay: DELAY })
}
const peakOf = (run) => {
  let k = 0
  run.x.forEach((x, i) => { if (x > run.x[k]) k = i })
  return { t: k * DT, x: run.x[k] }
}
const crossOf = (run) => {
  const k = Math.max(1, run.x.findIndex((x) => x >= TARGET))
  return { t: k * DT, v: run.v[k] }
}
const endOf = (run) => run.x[run.x.length - 1]
const lowOf = (run) => Math.min(...run.x)
const PEAK = Object.fromEntries(Object.entries(RUN).map(([k, r]) => [k, peakOf(r)]))
const f1 = (v) => v.toFixed(1)
const SHORT = LOAD / KP

// Sensor jitter for the derivative-noise inset.
const JITTER = (() => {
  const r = rng(4242)
  return Array.from({ length: 90 }, () => r() * 2 - 1)
})()

// ---------- shared pieces ----------
function arrow (x1, y1, x2, y2, color, a = 1, w = 2) {
  if (a <= 0) return
  line(x1, y1, x2, y2, color, w, a)
  const ang = Math.atan2(y2 - y1, x2 - x1)
  const s = 5 + w * 1.5
  A(a)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.moveTo(x2, y2)
  ctx.lineTo(x2 - s * Math.cos(ang - 0.45), y2 - s * Math.sin(ang - 0.45))
  ctx.lineTo(x2 - s * Math.cos(ang + 0.45), y2 - s * Math.sin(ang + 0.45))
  ctx.closePath()
  ctx.fill()
}

function chip (s, x, y, color, a = 1, filled = false, size = fz(10.5)) {
  if (a <= 0) return
  const w = measure(s, size, 700, true) + 16
  const h = size + 10
  A(a)
  rr(x - w / 2, y - h / 2, w, h, h / 2)
  ctx.fillStyle = filled ? color : C.surface
  ctx.fill()
  ctx.strokeStyle = rgba(color, 0.5)
  ctx.lineWidth = 1
  ctx.stroke()
  txt(s, x, y, { size, mono: true, weight: 700, color: filled ? '#ffffff' : color, align: 'center', alpha: a })
}

function box (label, x, y, w, h, color, a = 1) {
  panel(x - w / 2, y - h / 2, w, h, a, color)
  txt(label, x, y, { size: fz(11), weight: 700, color, align: 'center', alpha: a })
}

function drone (x, y, s, a = 1) {
  if (a <= 0) return
  const spin = LIVE ? 0.55 + 0.45 * Math.abs(Math.cos(T / 40)) : 1
  line(x - s, y, x + s, y, C.ink, Math.max(2, s * 0.12), a)
  A(a)
  ctx.fillStyle = C.ink
  rr(x - s * 0.38, y - s * 0.16, s * 0.76, s * 0.32, s * 0.1)
  ctx.fill()
  ;[-1, 1].forEach((side) => {
    line(x + side * s, y, x + side * s, y - s * 0.22, C.ink, 2, a)
    A(a * 0.55)
    ctx.fillStyle = C.accent
    ctx.beginPath()
    ctx.ellipse(x + side * s, y - s * 0.26, s * 0.42 * spin, s * 0.07, 0, 0, TAU)
    ctx.fill()
  })
}

// Height-against-time chart.
function plot (a = 1, yMax = 16) {
  const x0 = W * (NARROW ? 0.13 : 0.1)
  const x1 = W * 0.96
  const y0 = H * 0.1
  const y1 = H * 0.82
  const X = (t) => lerp(x0, x1, t / DUR)
  const Y = (h) => lerp(y1, y0, h / yMax)
  if (a > 0) {
    for (let h = 0; h <= yMax; h += 5) {
      line(x0, Y(h), x1, Y(h), C.faint, 1, a * (h === 0 ? 0.9 : 0.4))
      txt(`${h}`, x0 - 8, Y(h), { size: fz(10), color: C.dim, mono: true, align: 'right', alpha: a })
    }
    for (let t = 0; t <= DUR; t += 2) txt(`${t}`, X(t), y1 + fz(14), { size: fz(10), color: C.dim, mono: true, align: 'center', alpha: a })
    txt('time (seconds)', (x0 + x1) / 2, y1 + fz(31), { size: fz(10.5), color: C.muted, align: 'center', alpha: a })
    txt('height (m)', x0, y0 - fz(14), { size: fz(10.5), color: C.muted, weight: 700, alpha: a })
    line(x0, Y(TARGET), x1, Y(TARGET), C.hi, 1.4, a * 0.8, [6, 5])
    txt('target 10 m', x1, Y(TARGET) - fz(10), { size: fz(10), color: C.hi, mono: true, weight: 700, align: 'right', alpha: a })
  }
  return { x0, x1, y0, y1, X, Y }
}

// Draw a run's height curve up to share t of the time axis; returns the leading point.
function trace (ax, run, t, color, width = 2.4, a = 1, key = 'x') {
  const n = run[key].length
  const last = Math.floor(clamp(t) * (n - 1))
  const pts = []
  for (let i = 0; i <= last; i += 4) pts.push({ x: ax.X(i * DT), y: ax.Y(run[key][i]) })
  pts.push({ x: ax.X(last * DT), y: ax.Y(run[key][last]) })
  if (a > 0 && t > 0) {
    ctx.save()
    ctx.beginPath()
    ctx.rect(ax.x0, ax.y0 - 20, ax.x1 - ax.x0, ax.y1 - ax.y0 + 20)
    ctx.clip()
    A(a)
    ctx.strokeStyle = color
    ctx.lineWidth = width
    ctx.lineJoin = 'round'
    ctx.beginPath()
    pts.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y)))
    ctx.stroke()
    ctx.restore()
  }
  return pts[pts.length - 1]
}

function peakMark (ax, peak, color, label, a) {
  if (a <= 0) return
  glow(ax.X(peak.t), ax.Y(peak.x), 3.4, color, a)
  txt(label, ax.X(peak.t) + 9, ax.Y(peak.x) - fz(11), { size: fz(10.5), color, mono: true, weight: 700, alpha: a })
}

// ---------- 01 · the control problem ----------
function sceneSetup (p) {
  const rx = W * 0.2
  const yG = H * 0.88
  const yT = H * 0.1
  const Hm = (h) => lerp(yG, yT, h / 12)
  const a0 = easeOut(seg(p, 0, 0.2))
  line(rx - W * 0.08, yG, rx + W * 0.13, yG, C.ink, 1.5, a0)
  for (let h = 0; h <= 12; h += 2) {
    line(rx - W * 0.09, Hm(h), rx - W * 0.075, Hm(h), C.faint, 1, a0)
    txt(`${h} m`, rx - W * 0.1, Hm(h), { size: fz(10), color: C.dim, mono: true, align: 'right', alpha: a0 })
  }
  const ta = easeOut(seg(p, 0.25, 0.5))
  line(rx - W * 0.075, Hm(TARGET), rx + W * 0.13, Hm(TARGET), C.hi, 1.6, ta, [6, 5])
  txt('target', rx + W * 0.14, Hm(TARGET), { size: fz(11), color: C.hi, weight: 700, alpha: ta })

  const h = lerp(0, 4, ease(seg(p, 1.45, 2)))
  const s = Math.max(16, W * 0.055)
  drone(rx, Hm(h) - s * 0.2 + bob(1, 1.5), s, easeOut(seg(p, 0.05, 0.3)))

  // Beat 1: the error is the gap to the target.
  const ea = easeOut(seg(p, 1.05, 1.3))
  if (ea > 0) {
    const ex = rx + W * 0.09
    line(ex, Hm(h) - 4, ex, Hm(TARGET) + 4, C.pink, 2.2, ea)
    txt('error', ex + 8, (Hm(h) + Hm(TARGET)) / 2, { size: fz(11), color: C.pink, weight: 700, alpha: ea })
    const cx = W * 0.5
    txt('error = target − height', cx, H * 0.13, { size: fz(12), color: C.muted, weight: 600, alpha: ea })
    txt(`e = 10 − ${f1(h)} = ${f1(TARGET - h)} m`, cx, H * 0.22, { size: fz(17), color: C.pink, math: true, weight: 500, alpha: ea })
  }

  // Beat 2: the control loop.
  const la = easeOut(seg(p, 2.05, 2.35))
  if (la > 0) {
    const cx = W * 0.73
    const cy = H * 0.62
    const dx = W * 0.12
    const dy = H * 0.15
    const bw = W * 0.21
    const bh = H * 0.1
    const names = NARROW ? ['Measure', 'Error', 'Thrust', 'Move'] : ['Measure height', 'Work out error', 'Choose thrust', 'Drone moves']
    const at = [{ x: cx - dx, y: cy - dy }, { x: cx + dx, y: cy - dy }, { x: cx + dx, y: cy + dy }, { x: cx - dx, y: cy + dy }]
    at.forEach((q, i) => {
      const next = at[(i + 1) % 4]
      const ba = easeOut(seg(p, 2.1 + i * 0.1, 2.35 + i * 0.1))
      if (i % 2 === 0) arrow(q.x + bw / 2 + 4, q.y, next.x - bw / 2 - 4, next.y, C.faint, ba, 1.6)
      else arrow(q.x, q.y + (i === 1 ? bh / 2 + 4 : -bh / 2 - 4), next.x, next.y + (i === 1 ? -bh / 2 - 4 : bh / 2 + 4), C.faint, ba, 1.6)
      box(names[i], q.x, q.y, bw, bh, C.hi, ba)
    })
    const ring = [at[0], at[1], at[2], at[3], at[0]].map((q) => ({ x: q.x, y: q.y }))
    runner(ring, 0, C.hi, la, 1400)
    txt(NARROW ? '100× a second' : 'repeated 100 times a second', cx, cy, { size: fz(11), color: C.muted, mono: true, weight: 700, align: 'center', alpha: easeOut(seg(p, 2.5, 2.7)) })
  }
}

// ---------- 02 · proportional ----------
function sceneP (p) {
  const ax = plot(easeOut(seg(p, 0, 0.15)))
  const { X, Y } = ax
  const pushA = easeOut(seg(p, 0.3, 0.55)) * (1 - seg(p, 1, 1.2))
  if (pushA > 0) {
    arrow(X(0) + 14, Y(0) - 6, X(0) + 14, Y(0) - H * 0.24, C.accent, pushA, 2.6)
    txt('u = 0.8 × 10 = 8', X(0) + 26, Y(0) - H * 0.14, { size: fz(15), color: C.accent, math: true, alpha: pushA })
  }
  const dim = 1 - 0.6 * seg(p, 3, 3.2)
  const t1 = ease(seg(p, 1.05, 1.9))
  const head = trace(ax, RUN.p, t1, C.accent, 2.6, dim)
  if (t1 > 0 && t1 < 1) glow(head.x, head.y, 3.4, C.accent)
  peakMark(ax, PEAK.p, C.pink, `peak ${f1(PEAK.p.x)} m`, easeOut(seg(p, 1.75, 1.95)) * dim)

  const c = crossOf(RUN.p)
  const zA = easeOut(seg(p, 2.1, 2.35)) * (1 - seg(p, 3, 3.2))
  if (zA > 0) {
    const x = X(c.t)
    const y = Y(TARGET)
    ripple(x, y, 4, 20, C.pink, zA)
    glow(x, y, 4, C.pink, zA)
    arrow(x, y, x, y - Math.min(H * 0.18, c.v * H * 0.03), C.pink, zA, 2.4)
    txt(NARROW ? `e = 0, ${f1(c.v)} m/s up` : `error 0, still rising ${f1(c.v)} m/s`, x - 12, y + fz(18), { size: fz(11), color: C.pink, weight: 700, align: 'right', alpha: zA })
  }

  const g = ease(seg(p, 3.05, 3.6))
  if (g > 0) {
    trace(ax, RUN.pFast, g, C.two, 1.8)
    trace(ax, RUN.pSlow, g, C.hi, 1.8)
    const la = easeOut(seg(p, 3.5, 3.7))
    peakMark(ax, PEAK.pFast, C.two, `gain 2: ${f1(PEAK.pFast.x)} m`, la)
    txt('gain 0.3: slower', X(PEAK.pSlow.t), Y(PEAK.pSlow.x) - fz(12), { size: fz(10.5), color: C.hi, mono: true, weight: 700, align: 'center', alpha: la })
  }
}

// ---------- 03 · derivative ----------
function scenePD (p) {
  const ax = plot(easeOut(seg(p, 0, 0.15)))
  const { X, Y } = ax
  trace(ax, RUN.p, 1, C.accent, 1.6, 0.3)
  txt('P only', X(PEAK.p.t) + 8, Y(PEAK.p.x) - fz(10), { size: fz(10), color: C.accent, mono: true, alpha: 0.6 })

  // Beat 0: the slope of the curve is the speed.
  const ta = easeOut(seg(p, 0.2, 0.45)) * (1 - 0.7 * seg(p, 1, 1.2))
  if (ta > 0) {
    const t = 2
    const k = Math.round(t / DT)
    const v = RUN.p.v[k]
    const x0 = X(t - 0.7)
    const x1 = X(t + 0.7)
    line(x0, Y(RUN.p.x[k] - v * 0.7), x1, Y(RUN.p.x[k] + v * 0.7), C.pink, 2, ta)
    glow(X(t), Y(RUN.p.x[k]), 3.6, C.pink, ta)
    txt(`rising ${f1(v)} m/s`, X(t) + 12, Y(RUN.p.x[k]) + fz(12), { size: fz(11), color: C.pink, weight: 700, alpha: ta })
    txt(`de/dt = −${f1(v)}`, X(t) + 12, Y(RUN.p.x[k]) + fz(28), { size: fz(13), color: C.pink, math: true, alpha: ta })
  }

  const t1 = ease(seg(p, 1.05, 1.9))
  const head = trace(ax, RUN.pd, t1, C.green, 2.6)
  if (t1 > 0 && t1 < 1) glow(head.x, head.y, 3.4, C.green)
  txt('PD: no overshoot', X(7), Y(TARGET) + fz(16), { size: fz(10.5), color: C.green, mono: true, weight: 700, align: 'center', alpha: easeOut(seg(p, 1.8, 2)) })

  // Beat 2: noise inset.
  const na = easeOut(seg(p, 2.05, 2.3))
  if (na > 0) {
    const bx = W * 0.5
    const by = H * 0.5
    const bw = W * 0.44
    const bh = H * 0.27
    panel(bx, by, bw, bh, na, C.faint)
    const sx = (i) => bx + 12 + (i / (JITTER.length - 1)) * (bw - 24)
    const rowA = by + bh * 0.34
    const rowB = by + bh * 0.76
    txt('height sensor', bx + 12, by + bh * 0.12, { size: fz(10), color: C.muted, weight: 700, alpha: na })
    txt(NARROW ? 'D term' : 'D term (its rate of change)', bx + 12, by + bh * 0.55, { size: fz(10), color: C.pink, weight: 700, alpha: na })
    const reveal = Math.floor(JITTER.length * ease(seg(p, 2.2, 2.7)))
    A(na)
    ctx.strokeStyle = C.ink
    ctx.lineWidth = 1.4
    ctx.beginPath()
    for (let i = 0; i < reveal; i++) {
      const y = rowA + JITTER[i] * bh * 0.04
      if (i) ctx.lineTo(sx(i), y)
      else ctx.moveTo(sx(i), y)
    }
    ctx.stroke()
    ctx.strokeStyle = C.pink
    ctx.beginPath()
    for (let i = 1; i < reveal; i++) {
      const y = rowB - (JITTER[i] - JITTER[i - 1]) * bh * 0.09
      if (i > 1) ctx.lineTo(sx(i), y)
      else ctx.moveTo(sx(i), y)
    }
    ctx.stroke()
  }
}

// ---------- 04 · integral ----------
function scenePID (p) {
  const toWind = ease(seg(p, 3, 3.3))
  group(1 - toWind, () => {
    const ax = plot(easeOut(seg(p, 0, 0.15)), 12)
    const { X, Y } = ax
    const t0 = ease(seg(p, 0.15, 0.85))
    const dimPD = 1 - 0.5 * seg(p, 2, 2.2)
    trace(ax, RUN.pdLoad, t0, C.accent, 2.4, dimPD)
    const final = endOf(RUN.pdLoad)
    const loadA = easeOut(seg(p, 0.15, 0.35))
    line(X(LOAD_AT), ax.y0, X(LOAD_AT), ax.y1, C.pink, 1.2, loadA * 0.7, [3, 4])
    txt(NARROW ? 'payload' : 'payload attached', X(LOAD_AT) + 6, Y(11.4), { size: fz(10), color: C.pink, weight: 700, alpha: loadA })
    const ga = easeOut(seg(p, 0.8, 1)) * dimPD
    if (ga > 0) {
      const x = X(9.2)
      line(x, Y(final), x, Y(TARGET), C.pink, 2, ga)
      txt(`${SHORT.toFixed(2)} m short`, x - 8, (Y(final) + Y(TARGET)) / 2, { size: fz(11), color: C.pink, weight: 700, align: 'right', alpha: ga })
    }
    const ea = easeOut(seg(p, 1.2, 1.45)) * (1 - seg(p, 2, 2.2))
    chip(`0.8 × ${SHORT.toFixed(2)} = 1 = the extra pull`, (ax.x0 + ax.x1) / 2 + W * 0.1, Y(4), C.pink, ea)

    const t2 = ease(seg(p, 2.1, 2.9))
    const head = trace(ax, RUN.pid, t2, C.green, 2.6)
    if (t2 > 0 && t2 < 1) glow(head.x, head.y, 3.4, C.green)
    const gA = easeOut(seg(p, 2.1, 2.3))
    if (gA > 0) {
      const k = Math.floor(clamp(t2) * (RUN.pid.i.length - 1))
      const gx0 = X(4.6)
      const gx1 = X(9.6)
      const gy = Y(2.2)
      const S = (v) => lerp(gx0, gx1, clamp(v / 1.5))
      txt('I term push', gx0, gy - fz(16), { size: fz(10.5), color: C.green, weight: 700, alpha: gA })
      A(gA)
      ctx.fillStyle = C.track
      rr(gx0, gy - 5, gx1 - gx0, 10, 5)
      ctx.fill()
      A(gA)
      ctx.fillStyle = C.green
      rr(gx0, gy - 5, S(RUN.pid.i[k]) - gx0, 10, 5)
      ctx.fill()
      line(S(LOAD), gy - 10, S(LOAD), gy + 10, C.ink, 1.6, gA)
      txt(NARROW ? 'cancels load' : 'cancels the extra pull', S(LOAD), gy + fz(18), { size: fz(10), color: C.ink, align: 'center', alpha: gA })
    }
  })

  group(toWind, () => {
    const ax = plot(1)
    const t = ease(seg(p, 3.25, 3.95))
    trace(ax, RUN.windup, t, C.pink, 2.4)
    trace(ax, RUN.antiWindup, t, C.green, 2.4)
    const la = easeOut(seg(p, 3.85, 4))
    peakMark(ax, PEAK.windup, C.pink, `wound up: ${f1(PEAK.windup.x)} m`, la)
    peakMark(ax, PEAK.antiWindup, C.green, `capped: ${f1(PEAK.antiWindup.x)} m`, la)
    txt('thrust limited to 2', ax.X(0.3), ax.Y(14.5), { size: fz(10.5), color: C.muted, mono: true, weight: 700, alpha: easeOut(seg(p, 3.25, 3.45)) })
  })
}

// ---------- 05 · on the drone ----------
function sceneDrone (p) {
  const toChart = ease(seg(p, 3, 3.3))

  group(1 - toChart, () => {
    // Beat 0: a top-down quadcopter whose motor speeds change to tilt or turn it.
    const cx = W * (NARROW ? 0.27 : 0.25)
    const cy = H * 0.42
    const r = Math.min(W * 0.15, H * 0.22)
    const motors = [[-1, -1, 'FL'], [1, -1, 'FR'], [1, 1, 'BR'], [-1, 1, 'BL']]
    const phase = seg(p, 0.1, 0.95) * 3
    const mode = Math.min(2, Math.floor(phase))
    const amt = Math.sin(Math.PI * (phase - mode)) * (p < 1 ? 1 : 0)
    const modes = ['roll', 'pitch', 'yaw']
    const delta = ([mx, my]) => (mode === 0 ? -mx : mode === 1 ? -my : mx * my) * amt
    const a0 = easeOut(seg(p, 0, 0.15))
    A(a0)
    ctx.fillStyle = C.ink
    rr(cx - r * 0.2, cy - r * 0.2, r * 0.4, r * 0.4, 6)
    ctx.fill()
    motors.forEach((m) => {
      const mx = cx + m[0] * r * 0.72
      const my = cy + m[1] * r * 0.72
      line(cx, cy, mx, my, C.ink, 3, a0)
      const d = delta(m)
      const rad = r * 0.26 * (1 + 0.35 * d)
      A(a0 * 0.85)
      ctx.beginPath()
      ctx.arc(mx, my, rad, 0, TAU)
      ctx.strokeStyle = d > 0.05 ? C.green : d < -0.05 ? C.pink : C.accent
      ctx.lineWidth = 2.4
      ctx.stroke()
      txt(m[2], mx, my, { size: fz(10), mono: true, weight: 700, color: C.ink, align: 'center', alpha: a0 })
    })
    if (p < 1.05) {
      txt(modes[mode], cx, cy + r * 1.25, { size: fz(14), weight: 750, color: C.hi, align: 'center', alpha: easeOut(seg(p, 0.1, 0.2)) * (1 - seg(p, 0.95, 1.05)) })
      txt(NARROW ? 'green faster · pink slower' : 'green ring = faster motor · pink = slower', cx, cy + r * 1.25 + fz(20), { size: fz(10), color: C.muted, align: 'center', alpha: a0 * (1 - seg(p, 0.95, 1.05)) })
    }

    // Beat 1: one PID per axis, combined by a mixer.
    const bA = easeOut(seg(p, 1.05, 1.3))
    const names = ['roll', 'pitch', 'yaw', 'altitude']
    const bx = W * 0.62
    const bw = W * (NARROW ? 0.2 : 0.17)
    const bh = H * 0.09
    const rows = names.map((_, i) => H * (0.15 + i * 0.15))
    const mx = W * 0.88
    const my = (rows[0] + rows[3]) / 2
    names.forEach((n, i) => {
      const a = easeOut(seg(p, 1.05 + i * 0.08, 1.3 + i * 0.08))
      box(`${n} PID`, bx, rows[i], bw, bh, i < 3 ? C.hi : C.accent, a)
      arrow(bx + bw / 2 + 4, rows[i], mx - W * 0.05, my, C.faint, a, 1.4)
      // Beat 2: inner loops run fast, the outer loop slower.
      const la = easeOut(seg(p, 2.05, 2.3))
      if (la > 0) {
        const ox = bx - bw / 2 - W * 0.04
        const rad = Math.min(W * 0.022, H * 0.035)
        A(la * 0.5)
        ctx.beginPath()
        ctx.arc(ox, rows[i], rad, 0, TAU)
        ctx.strokeStyle = C.faint
        ctx.lineWidth = 1.4
        ctx.stroke()
        const ang = LIVE ? TAU * cycle(i < 3 ? 420 : 2200, i * 0.2) : -Math.PI / 2
        dot(ox + Math.cos(ang) * rad, rows[i] + Math.sin(ang) * rad, 3, i < 3 ? C.hi : C.accent, la)
      }
    })
    const mA = easeOut(seg(p, 1.35, 1.6))
    if (mA > 0) {
      panel(mx - W * 0.05, my - H * 0.12, W * 0.1, H * 0.24, mA, C.ink)
      txt('mixer', mx, my, { size: fz(11), weight: 700, color: C.ink, align: 'center', alpha: mA })
    }
    txt(NARROW ? 'FL = T + roll + pitch − yaw' : 'front-left motor = throttle + roll + pitch − yaw', W * 0.62, H * 0.82, { size: fz(14), math: true, color: C.ink, align: 'center', alpha: easeOut(seg(p, 1.55, 1.8)) })
    const lA = easeOut(seg(p, 2.3, 2.5))
    txt(NARROW ? 'inner: fast' : 'inner loops: hundreds of times a second', W * 0.62, H * 0.9, { size: fz(10.5), color: C.hi, mono: true, weight: 700, align: 'center', alpha: lA })
    txt(NARROW ? 'outer: slower' : 'outer loop: slower', W * 0.62, H * 0.96, { size: fz(10.5), color: C.accent, mono: true, weight: 700, align: 'center', alpha: lA })
  })

  group(toChart, () => {
    const ax = plot(1)
    const t = ease(seg(p, 3.25, 3.95))
    trace(ax, RUN.pd, t, C.green, 2.4)
    trace(ax, RUN.delayed, t, C.pink, 2.4)
    const la = easeOut(seg(p, 3.85, 4))
    peakMark(ax, PEAK.delayed, C.pink, `${DELAY} s late: ${f1(PEAK.delayed.x)} m`, la)
    txt(NARROW ? 'on time' : 'measurement on time', ax.X(8), ax.Y(TARGET) + fz(16), { size: fz(10.5), color: C.green, mono: true, weight: 700, align: 'center', alpha: la })
  })
}

      { text: 'At every moment the drone measures its height and works out the error: target minus height. At 0 m the error is 10 m. As the drone climbs, the error shrinks, and at the target it is zero.' },
      { text: 'A controller turns the error into a thrust command, the motors respond, and the drone moves. Then it measures again. This loop repeats around 100 times a second. The whole question is what rule turns error into thrust.' }
    ]
  },
  {
    short: 'P',
    title: 'P: push in proportion to the error',
    formula: String.raw`u(t) = K_{p}\, e(t)`,
    where: [
      [String.raw`u(t)`, String.raw`the thrust command: extra upward acceleration (m/s²)`],
      [String.raw`K_{p}`, String.raw`the proportional gain, here 0.8`]
    ],
    draw: sceneP,
    beats: [
      { text: 'The simplest rule is to push harder the further away the drone is: thrust <i>u</i> = <i>K</i><sub>p</sub> × <i>e</i>. <i>K</i><sub>p</sub> is a number we choose, called the proportional gain. With <i>K</i><sub>p</sub> = 0.8 and an error of 10 m, the drone pushes up with an extra 8 m/s².' },
      { text: `The drone climbs, and the push fades as the error shrinks. But it shoots past the target to ${f1(PEAK.p.x)} m, falls back below, and keeps swinging around 10 m before it settles.` },
      { text: `The problem is momentum. At 10 m the error is zero, so the push is zero, yet the drone is still rising at ${f1(crossOf(RUN.p).v)} m/s. P reacts only to where the drone is, not to where it is heading.` },
      { text: `Changing the gain trades one problem for another. A gain of 2 gets there sooner but swings to ${f1(PEAK.pFast.x)} m. A gain of 0.3 swings more gently but takes far longer to arrive.` }
    ]
  },
  {
    short: 'D',
    title: 'D: brake as you approach',
    formula: String.raw`u(t) = K_{p}\, e(t) + K_{d}\,\dfrac{de}{dt}`,
    where: [
      [String.raw`de/dt`, String.raw`how fast the error is changing`],
      [String.raw`K_{d}`, String.raw`the derivative gain, here 1.6`]
    ],
    draw: scenePD,
    beats: [
      { text: `The derivative, <i>de</i>/<i>dt</i>, is how fast the error is changing: the slope of the curve. Rising at ${f1(RUN.p.v[200])} m/s means the error shrinks by ${f1(RUN.p.v[200])} m every second, so <i>de</i>/<i>dt</i> = −${f1(RUN.p.v[200])}. Multiplied by a gain <i>K</i><sub>d</sub>, it becomes a brake that grows with speed.` },
      { text: `With <i>K</i><sub>d</sub> = 1.6, the rule becomes <i>u</i> = 0.8 <i>e</i> + 1.6 <i>de</i>/<i>dt</i>. The drone slows as it nears the target and settles at 10 m without overshooting.` },
      { text: 'The catch is noise. A height sensor that jitters by a few centimetres looks like sudden bursts of speed, and the D term turns that into spiky thrust. Real controllers smooth the derivative before using it.' }
    ]
  },
  {
    short: 'I',
    title: 'I: remove the leftover error',
    formula: String.raw`u(t) = K_{p}\, e(t) + K_{i} \int_{0}^{t} e(\tau)\, d\tau + K_{d}\,\dfrac{de}{dt}`,
    where: [
      [String.raw`\int_{0}^{t} e(\tau)\,d\tau`, String.raw`the running total of the error up to time $t$`],
      [String.raw`K_{i}`, String.raw`the integral gain, here 0.3`]
    ],
    draw: scenePID,
    beats: [
      { text: 'Now the PD drone is holding 10 m when, one second in, a heavier payload is attached. Its built-in hover thrust is no longer enough, so a constant extra pull of 1 m/s² drags it down, and the controller does not know about it.' },
      { text: `The drone sinks and settles ${SHORT.toFixed(2)} m short. At that height the P term’s push, 0.8 × ${SHORT.toFixed(2)} = 1, exactly cancels the extra pull, and with no movement the D term is zero. Nothing pushes it the rest of the way.` },
      { text: `The integral, ∫<i>e</i> <i>dt</i>, is a running total of the error over time. While the drone sits below the target the total keeps growing, so <i>K</i><sub>i</sub> × ∫<i>e</i> <i>dt</i> pushes harder and harder until the error is gone. With <i>K</i><sub>i</sub> = 0.3, the drone dips to ${f1(lowOf(RUN.pid))} m and climbs back to 10 m. Together the three terms are called PID.`, ms: 9500 },
      { text: `There is a trap. Climbing from the ground with thrust capped at 2, the motors sit at their limit, so the error lasts a long time and the running total piles up. The drone overshoots to ${f1(PEAK.windup.x)} m. This is called integral windup. Capping the total keeps the peak to ${f1(PEAK.antiWindup.x)} m.` }
    ]
  },
  {
    short: 'On the drone',
    title: 'PID on the drone',
    formula: String.raw`u_{\text{FL}} = u_{\text{throttle}} + u_{\text{roll}} + u_{\text{pitch}} - u_{\text{yaw}}`,
    where: [
      [String.raw`u_{\text{FL}}`, String.raw`the front-left motor’s command`],
      [String.raw`u_{\text{roll}},\ u_{\text{pitch}},\ u_{\text{yaw}}`, String.raw`the outputs of the three attitude PID controllers; the signs follow one common convention`]
    ],
    draw: sceneDrone,
    beats: [
      { text: 'On the drone, height is only one of four things to control. Speeding up some of its four motors and slowing others tilts it sideways (roll) or forwards (pitch), or turns it on the spot (yaw).' },
      { text: 'Each of the four gets its own PID controller with its own gains. A mixer then combines their outputs into four motor speeds. With one common sign convention, the front-left motor is throttle + roll + pitch − yaw.' },
      { text: 'Tilt changes fastest, so the roll, pitch and yaw loops run hundreds of times a second. Height and position change more slowly, so their loops can run less often and hand targets to the fast inner loops.' },
      { text: `That is why low latency matters on a Raspberry Pi. If each height reading arrives ${DELAY} s late, the same PD controller reacts to old data and swings up to ${f1(PEAK.delayed.x)} m instead of settling. The fast tilt loops are far more sensitive: there, milliseconds count.` }
    ]
  }
]

// ===== RUNTIME: do not change =====
function drawScene (context, index, p, { width, height, dpr, font }, time = 0) {
  ctx = context
  T = time
  LIVE = time > 0
  W = width
  H = height
  NARROW = width < 520
  U = clamp(Math.min(width, height) / 600, 0.55, 1.15)
  GA = 1
  if (font) FONT = font
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.globalAlpha = 1
  ctx.clearRect(0, 0, W, H)
  SCENES[index].draw(p)
}

;(() => {
  const START_LINE = 0.45
  const MS_PER_WORD = 210
  const BEAT_PADDING_MS = 1300
  const MIN_BEAT_MS = 3600
  const MAX_BEAT_MS = 8200
  const DAMPING_MS = 140
  const SNAP_EPSILON = 4
  const SNAP_PADDING = 24
  const ENTRY_REACH = 0.6
  const MIN_GLIDE_MS = 900
  const MAX_GLIDE_MS = 1500
  const GLIDE_MS_PER_PX = 0.6
  const WHEEL_THRESHOLD = 24
  const WHEEL_QUIET_MS = 110
  const SWIPE_THRESHOLD = 36
  const KEY_DIRECTION = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 }

  const root = document.getElementById('story')
  const reduceMotion = !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches
  const font = getComputedStyle(root).fontFamily
  let raf = 0
  let lastFrame = 0
  let inView = false
  let activeChapter = -1
  let railShown = false
  let glideRaf = 0
  let settling = false
  let lastWheelAt = 0
  let lastWheelSize = 0
  let wheelTotal = 0
  let touch = null

  const make = (tag, cls, text) => {
    const node = document.createElement(tag)
    if (cls) node.className = cls
    if (text !== undefined) node.textContent = text
    return node
  }
  const beatDuration = ({ text, ms }) => {
    if (ms) return ms
    const words = text.replace(/<[^>]+>/g, ' ').trim().split(/\s+/).length
    return Math.min(MAX_BEAT_MS, Math.max(MIN_BEAT_MS, words * MS_PER_WORD + BEAT_PADDING_MS))
  }

  const rail = make('nav', 'rail')
  rail.setAttribute('aria-label', 'Stages')
  const railItems = SCENES.map((s, i) => {
    const item = make('button', 'rail-item')
    item.type = 'button'
    item.append(make('span', 'rail-label', s.short), make('span', 'rail-mark'))
    item.addEventListener('click', () => jump(i))
    rail.append(item)
    return item
  })
  root.append(rail)

  // The opening: the topic name rises in word by word, and the chapters draw in as a map.
  const opening = document.querySelector('.opening')
  if (opening) {
    const title = opening.querySelector('.opening-title')
    if (title) {
      const words = title.textContent.trim().split(/\s+/)
      title.setAttribute('aria-label', words.join(' '))
      title.textContent = ''
      words.forEach((w, n) => {
        const outer = make('span', 'ow')

        inner.style.transitionDelay = `${120 + n * 90}ms`
        outer.append(inner)

    }
    const map = opening.querySelector('.opening-map')
    if (map) {
      SCENES.forEach((s, i) => {
        const li = make('li')
        const btn = make('button', 'map-item')
        btn.type = 'button'
        btn.style.setProperty('--i', i)
        btn.append(make('span', 'map-num mono', String(i + 1).padStart(2, '0')), make('span', 'map-label', s.short))

  }

  const chapters = SCENES.map((s, i) => {
    const el = make('section', i % 2 ? 'chapter flip' : 'chapter')
    const col = make('div', 'stage-col')
    const stage = make('div', 'stage')
    const box = make('div', 'canvas-box')
    const canvas = make('canvas')
    canvas.setAttribute('role', 'img')
    canvas.setAttribute('aria-label', `Animation: ${s.title}. The steps are described in the text alongside.`)
    box.append(canvas)
    const ticks = make('div', 'ticks')

    const tickEls = s.beats.map(() => ticks.appendChild(make('span', 'tick')))

    const head = make('header', 'chapter-head')

    if (s.formula) head.append(noteFormula(s.formula, s.where, i + 1))
    if (s.code) head.append(make('code', 'chapter-code', s.code))
    const pagesEl = make('div', 'pages')
    const firstPage = make('div', 'pg')
    const steps = make('ol', 'steps')
    const lis = []
    const beatEls = s.beats.map((b, bi) => {
      const li = make('li')
      const btn = make('button', 'beat')
      btn.type = 'button'
      const bar = make('span', 'beat-bar')
      bar.setAttribute('aria-hidden', 'true')
      bar.append(make('span', 'beat-fill'))
      const text = make('span', 'beat-text')
      text.innerHTML = b.text
      btn.append(bar, text)
      btn.addEventListener('click', () => seek(i, bi))
      li.append(btn)
      steps.append(li)
      lis.push(li)
      return btn
    })
    firstPage.append(head, steps)
    pagesEl.append(firstPage)
    copy.append(pagesEl)
    el.append(col, copy)
    root.append(el)

    const durations = s.beats.map(beatDuration)
    let elapsed = 0
    const starts = durations.map((d) => { const at = elapsed; elapsed += d; return at })
    return {
      el, canvas, box, copy, beatEls, tickEls, durations, starts,
      col, stage, head, pagesEl, lis,
      flip: i % 2 === 1,
      num: String(i + 1).padStart(2, '0'),
      pages: [{ el: firstPage, list: steps }],
      pageOf: s.beats.map(() => 0),
      page: -1,
      ctx: canvas.getContext('2d'),
      total: elapsed,
      time: reduceMotion ? elapsed : 0,
      near: false,
      seen: false,
      started: reduceMotion,
      dirty: true,
      size: null,
      shown: reduceMotion ? durations.length : 0,
      drawn: -1,
      beat: -1,
      done: false
    }
  })

  function sizeCanvas (ch) {
    const width = ch.box.clientWidth
    const height = ch.box.clientHeight
    if (!width || !height) return
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    ch.size = { width, height, dpr, font }
    ch.canvas.width = Math.round(width * dpr)
    ch.canvas.height = Math.round(height * dpr)
    ch.dirty = true
  }
  let layoutKey = ''
  function resizeStages () {
    const key = `${window.innerWidth}x${window.innerHeight}`
    if (key !== layoutKey) {
      layoutKey = key
      chapters.forEach(paginate)
    }
    chapters.forEach((ch) => { if (ch.near) sizeCanvas(ch) })
    start()
  }
  function progressAt (ch) {
    let b = ch.durations.length - 1
    while (b > 0 && ch.time < ch.starts[b]) b--
    return b + Math.min(1, (ch.time - ch.starts[b]) / ch.durations[b])
  }
  function paintBeats (ch, beat, done) {
    if (ch.beat === beat && ch.done === done) return
    ch.beat = beat
    ch.done = done
    ch.copy.classList.toggle('done', done)
    ch.beatEls.forEach((el, n) => {
      el.classList.toggle('active', n === beat)
      el.classList.toggle('past', n < beat || done)
      if (n === beat) el.setAttribute('aria-current', 'step')
      else el.removeAttribute('aria-current')

    ch.tickEls.forEach((el, n) => el.classList.toggle('on', n <= beat))

  // A chapter whose steps do not fit beside the stage is split into pages. Reaching the next
  // page slides the stage across, squeezes the old page off the edge as it fades, and brings
  // the new page in on the side the stage has left. Narrow screens scroll the steps instead.
  const CONT_H = 40
  function paginate (ch) {
    const first = ch.pages[0]
    ch.lis.forEach((li) => first.list.append(li))
    ch.pages.splice(1).forEach((pg) => pg.el.remove())
    const wide = window.innerWidth > 900
    const limit = ch.stage.offsetHeight - 16
    const heights = ch.lis.map((li) => li.offsetHeight + 4)
    let used = ch.head.offsetHeight + (parseFloat(getComputedStyle(ch.head).marginBottom) || 0)
    const fits = !wide || used + heights.reduce((sum, h) => sum + h, 0) <= limit
    const groups = [[]]
    heights.forEach((h, i) => {
      if (!fits && groups[groups.length - 1].length && used + h > limit) {
        groups.push([])
        used = CONT_H
      }
      groups[groups.length - 1].push(i)
      used += h
    })
    groups.slice(1).forEach(() => {
      const el = make('div', 'pg')
      const list = make('ol', 'steps')
      el.append(make('span', 'chapter-cont mono', `${ch.num} · continued`), list)
      ch.pagesEl.append(el)
      ch.pages.push({ el, list })
    })
    groups.forEach((g, k) => g.forEach((i) => {
      if (k) ch.pages[k].list.append(ch.lis[i])
      ch.pageOf[i] = k
    }))
    applyPages(ch, true)
  }
  // How much of the previous page stays in view beside the stage before fading out.
  const GHOST_SHOWN = 0.5
  function applyPages (ch, force = false) {
    const cur = ch.pageOf[Math.max(0, ch.beat)] || 0
    if (!force && cur === ch.page) return
    ch.page = cur
    if (ch.pages.length < 2) {
      ch.col.style.translate = ''
      ch.pages.forEach(({ el }) => {
        el.style.translate = ''
        el.style.opacity = ''
        el.style.removeProperty('--fade')
        el.inert = false
      })
      return
    }
    const dir = ch.flip ? -1 : 1
    const stageW = ch.col.offsetWidth
    const copyW = ch.copy.offsetWidth
    const gap = Math.abs(ch.copy.offsetLeft - ch.col.offsetLeft) - (dir > 0 ? stageW : copyW)
    // The row pans as one: the stage moves across, the new page takes the side it left, and
    // the old page slides out beside the stage as a fading ghost. The whole row then shifts
    // away from the ghost, as far as the screen allows, so it stays balanced on screen.
    let shift = 0
    if (cur > 0) {
      const ghostSide = cur % 2 ? dir : -dir
      const rect = ch.el.getBoundingClientRect()
      const room = ghostSide > 0 ? rect.left : window.innerWidth - rect.right
      shift = -ghostSide * Math.min((gap + copyW * GHOST_SHOWN) / 2, Math.max(0, room - 16))
    }
    ch.col.style.translate = `${(cur % 2 ? dir * (copyW + gap) : 0) + shift}px 0`
    ch.pages.forEach(({ el }, k) => {
      const away = k % 2 === 1
      const base = (away ? -dir * (stageW + gap) : 0) + shift
      const out = away ? -dir : dir
      const s = el.style
      s.setProperty('--fade-dir', out > 0 ? '90deg' : '270deg')
      if (k === cur) {
        s.translate = `${base}px 0`
        s.opacity = '1'
        s.setProperty('--fade', '150%')
      } else if (k < cur) {
        s.translate = `${base + out * (copyW + gap)}px 0`
        s.opacity = k === cur - 1 ? '.75' : '0'
        s.setProperty('--fade', k === cur - 1 ? `${GHOST_SHOWN * 100}%` : '0%')
      } else {
        s.translate = `${base + out * 56}px 0`
        s.opacity = '0'
        s.setProperty('--fade', '150%')
      }
      el.inert = k !== cur
    })
  }

  function frame (now) {
    raf = 0
    if (!inView) { lastFrame = 0; return }
    const dt = lastFrame ? Math.min(64, now - lastFrame) : 16
    lastFrame = now
    const vh = window.innerHeight
    const rate = reduceMotion ? 1 : 1 - Math.exp(-dt / DAMPING_MS)
    let current = activeChapter

    chapters.forEach((ch, i) => {
      const rect = ch.el.getBoundingClientRect()
      if (rect.top < vh * 0.5 && rect.bottom > vh * 0.5) current = i
      const near = rect.bottom > -vh * 0.3 && rect.top < vh * 1.3
      if (near !== ch.near) {
        ch.near = near
        if (near) {
          sizeCanvas(ch)
        } else {
          ch.canvas.width = 0
          ch.canvas.height = 0
          ch.size = null
        }
      }
      if (!ch.seen && rect.top < vh * 0.9) {
        ch.seen = true
        ch.el.classList.add('seen')
      }
      if (!ch.started && rect.top < vh * START_LINE && rect.bottom > vh * 0.2) ch.started = true
      const visible = rect.top < vh * 0.8 && rect.bottom > vh * 0.2
      if (ch.started && visible && !reduceMotion && ch.time < ch.total) {
        ch.time = Math.min(ch.total, ch.time + dt)
      }
      const target = progressAt(ch)
      ch.shown += (target - ch.shown) * rate
      if (Math.abs(target - ch.shown) < 0.0004) ch.shown = target
      const beat = Math.min(ch.beatEls.length - 1, Math.floor(target))
      paintBeats(ch, beat, ch.time >= ch.total)
      ch.beatEls[beat].style.setProperty('--fill', (target - beat).toFixed(3))
      if (!near) return
      const looping = !reduceMotion && rect.bottom > 0 && rect.top < vh
      if (ch.size && (looping || ch.dirty || Math.abs(ch.shown - ch.drawn) > 0.0002)) {
        drawScene(ch.ctx, i, ch.shown, ch.size, reduceMotion ? 0 : now)
        ch.drawn = ch.shown
        ch.dirty = false
      }
    })

    if (current !== activeChapter) {
      activeChapter = current
      railItems.forEach((item, n) => item.classList.toggle('on', n === current))
    }
    const first = chapters[0].el.getBoundingClientRect()
    const last = chapters[chapters.length - 1].el.getBoundingClientRect()
    const shown = first.top < vh * 0.5 && last.bottom > vh * 0.5
    if (shown !== railShown) {
      railShown = shown
      rail.classList.toggle('shown', shown)
    }
    raf = requestAnimationFrame(frame)
  }
  function start () {
    if (!raf && inView) raf = requestAnimationFrame(frame)
  }

  // The opening is a stop of its own, so one scroll from it glides into the first chapter.
  function openingZone () {
    if (!opening) return []
    const bottom = opening.getBoundingClientRect().bottom + window.scrollY
    return [{ snap: 0, end: Math.max(0, bottom - window.innerHeight) }]
  }
  function zoneOf (ch) {
    const vh = window.innerHeight
    const rect = ch.el.getBoundingClientRect()
    const top = rect.top + window.scrollY
    const maxScroll = document.documentElement.scrollHeight - vh
    const snap = Math.min(maxScroll, Math.max(0, top - Math.max(SNAP_PADDING, (vh - rect.height) / 2)))
    const end = Math.min(maxScroll, Math.max(snap, top + rect.height + SNAP_PADDING - vh))
    return { snap, end }
  }
  // `force` lets the keyboard enter the story from anywhere above or below it.
  function nextStop (direction, force = false) {
    const y = window.scrollY
    const reach = window.innerHeight * ENTRY_REACH
    const zones = [...openingZone(), ...chapters.map(zoneOf)]
    if (direction > 0) {
      for (let i = 0; i < zones.length; i++) {
        if (y < zones[i].snap - SNAP_EPSILON) return i === 0 && !force && zones[i].snap - y > reach ? null : zones[i].snap
        if (y < zones[i].end - SNAP_EPSILON) return null
      }
      return null
    }
    for (let i = zones.length - 1; i >= 0; i--) {
      if (y > zones[i].end + SNAP_EPSILON) return i === zones.length - 1 && !force && y - zones[i].end > reach ? null : zones[i].end
      if (y > zones[i].snap + SNAP_EPSILON) return null
    }
    return null
  }
  function cancelGlide () {
    if (glideRaf) cancelAnimationFrame(glideRaf)
    glideRaf = 0
  }
  function glideTo (target) {
    cancelGlide()
    const from = window.scrollY
    const distance = Math.abs(target - from)
    if (distance < 2) return
    const duration = Math.min(MAX_GLIDE_MS, Math.max(MIN_GLIDE_MS, distance * GLIDE_MS_PER_PX + 500))
    const startedAt = performance.now()
    settling = true
    wheelTotal = 0
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - startedAt) / duration))
      window.scrollTo({ top: from + (target - from) * ease(t), behavior: 'instant' })
      glideRaf = t < 1 ? requestAnimationFrame(step) : 0
    }
    glideRaf = requestAnimationFrame(step)
  }
  function onWheel (e) {
    if (e.ctrlKey || !e.deltaY || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return
    const delta = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaMode === 2 ? e.deltaY * window.innerHeight : e.deltaY
    const size = Math.abs(delta)
    const now = performance.now()
    const gap = now - lastWheelAt
    const rising = size > 30 && size > lastWheelSize * 1.6
    lastWheelAt = now
    lastWheelSize = size
    if (glideRaf) { e.preventDefault(); return }
    if (gap > WHEEL_QUIET_MS) {
      settling = false
      wheelTotal = 0
    }
    if (settling) {
      if (!rising) { e.preventDefault(); return }
      settling = false
      wheelTotal = 0
    }
    const direction = Math.sign(delta)
    const target = nextStop(direction)
    if (target === null) return
    e.preventDefault()
    if (Math.sign(wheelTotal) !== direction) wheelTotal = 0
    wheelTotal += delta
    if (Math.abs(wheelTotal) >= WHEEL_THRESHOLD) glideTo(target)
  }
  // ← and → move between steps, continuing into the next or previous chapter at either end.
  function stepBy (dir) {
    const i = Math.max(0, activeChapter)
    const ch = chapters[i]
    if (activeChapter !== i) {
      jump(i)
      seek(i, 0)
      return
    }
    const n = ch.beatEls.length
    const current = ch.started ? Math.min(n - 1, Math.floor(progressAt(ch))) : -1
    const target = current + dir
    if (target >= n) {
      if (i + 1 < chapters.length) {
        jump(i + 1)
        seek(i + 1, 0)
      }
    } else if (target < 0) {
      if (i > 0) {
        jump(i - 1)
        seek(i - 1, chapters[i - 1].beatEls.length - 1)
      }
    } else {
      seek(i, target)
    }
  }
  function onKeydown (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault()
      stepBy(e.key === 'ArrowRight' ? 1 : -1)
      return
    }
    let direction = KEY_DIRECTION[e.key]
    if (e.key === ' ') {
      if (e.target.closest?.('button, a')) return
      direction = e.shiftKey ? -1 : 1
    }
    if (!direction) return
    if (glideRaf) { e.preventDefault(); return }
    const target = nextStop(direction, true)
    if (target === null) return
    e.preventDefault()
    if (reduceMotion) window.scrollTo({ top: target, behavior: 'instant' })
    else glideTo(target)
  }
  function onTouchStart (e) {
    touch = e.touches.length === 1 ? { y: e.touches[0].clientY, target: undefined } : null
  }
  function onTouchMove (e) {
    if (glideRaf) {
      if (e.cancelable) e.preventDefault()
      return
    }
    if (!touch) return
    const dy = e.touches[0].clientY - touch.y
    if (touch.target === undefined) {
      if (Math.abs(dy) < 8) return
      touch.target = nextStop(dy < 0 ? 1 : -1)
    }
    if (touch.target === null || !e.cancelable) return
    e.preventDefault()
    if (Math.abs(dy) >= SWIPE_THRESHOLD) {
      glideTo(touch.target)
      touch = null
    }
  }
  function onPointerDown (e) {
    if (e.target === document.documentElement) cancelGlide()
  }
  function jump (i) {
    const { snap } = zoneOf(chapters[i])
    if (reduceMotion) window.scrollTo({ top: snap, behavior: 'instant' })
    else glideTo(snap)
  }
  function seek (i, beat) {
    const ch = chapters[i]
    ch.started = true
    ch.time = reduceMotion ? ch.starts[beat] + ch.durations[beat] - 1 : ch.starts[beat]
  }

  new ResizeObserver(resizeStages).observe(root)
  window.addEventListener('resize', resizeStages)
  window.addEventListener('keydown', onKeydown)
  if (!reduceMotion) {
    window.addEventListener('wheel', onWheel, { passive: false })
    window.addEventListener('touchstart', onTouchStart, { passive: true })
    window.addEventListener('touchmove', onTouchMove, { passive: false })
    window.addEventListener('pointerdown', onPointerDown)
  }
  document.fonts?.ready.then(() => chapters.forEach((ch) => { paginate(ch); ch.dirty = true }))
  window.addEventListener('scene-assets', () => chapters.forEach((ch) => { ch.dirty = true }))
  new IntersectionObserver(([entry]) => {
    inView = entry.isIntersecting
    if (inView) start()
  }, { rootMargin: '30% 0px' }).observe(root)
})()
</script>
<script src="note-end.js" defer></script>
