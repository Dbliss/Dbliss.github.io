<style>

}

.chapter-cont { display: block; margin-bottom: 14px; font-size: .78rem; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.stage {
  position: sticky; top: calc((100vh - var(--stage-h)) / 2); height: var(--stage-h);
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--line); border-radius: 24px;

<body>
<div class="page">
  <section class="opening" aria-label="Introduction">

    <div class="opening-body">

<script>
// ===== DRAWING HELPERS (keep these; add more in the content section if needed) =====
const C = {
  ink: '#111632', muted: '#626980', dim: '#8a90ad', faint: '#c9cde0',
  one: '#e4002b', two: '#c08a12', accent: '#1aa3c2', hi: '#6858e8',
  green: '#0e9f6e', pink: '#d63d8f', surface: '#ffffff', track: 'rgba(17,22,50,0.07)'
}
const MONO = "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
const MATH = 'KaTeX_Main, "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", serif'
const TAU = Math.PI * 2
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, t) => a + (b - a) * t
const seg = (p, a, b) => clamp((p - a) / (b - a))
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)
const easeOut = (t) => 1 - Math.pow(1 - t, 3)
const backOut = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2) }
function rng (seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6d2b79f5) >>> 0
    let t = a
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

let ctx = null
let W = 0
let H = 0
let NARROW = false
let U = 1
let GA = 1
let FONT = 'system-ui, sans-serif'
let T = 0
let LIVE = false

const fz = (n) => Math.max(8.5, n * U)
const cycle = (period, offset = 0) => (T / period + offset) % 1
const pulse = (period = 1800, offset = 0) => (LIVE ? 0.5 + 0.5 * Math.sin(TAU * cycle(period, offset)) : 1)
const bob = (seed, amount = 2) => (LIVE ? Math.sin(T / 520 + seed) * amount : 0)
function A (a = 1) { ctx.globalAlpha = clamp(GA * a) }
function group (a, fn) {
  if (a <= 0) return
  const parent = GA
  GA = parent * a
  fn()
  GA = parent
}
function rgba (hex, a) {
  const n = parseInt(hex.slice(1), 16)
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`
}
function txt (s, x, y, o = {}) {
  const { size = 11, color = C.ink, align = 'left', weight = 500, mono = false, math = false, base = 'middle', alpha = 1 } = o
  if (math) return drawMath(s, x, y, { size: size * 1.12, color, align, weight, alpha, base })
  A(alpha)
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  ctx.fillStyle = color
  ctx.textAlign = align
  ctx.textBaseline = base
  ctx.fillText(s, x, y)
}
// Typeset a small maths expression: single letters italic, numbers and longer words upright,
// `_x` / `^x` (or `_{xy}`) as subscripts and superscripts.
function mathRuns (s) {
  const runs = []
  const push = (t, level) => {
    const re = /([A-Za-zα-ωΑ-Ω]+)|([^A-Za-zα-ωΑ-Ω]+)/g
    let m
    while ((m = re.exec(t))) {
      if (m[1]) {
        // A single letter straight after a number and a space is a unit (4 m), so it stays upright.
        const prev = runs[runs.length - 1]
        const unit = m[1].length === 1 && prev && prev.level === level && /\d\s$/.test(prev.t)
        runs.push({ t: m[1], italic: m[1].length < 3 && !unit, level })
      }
      else runs.push({ t: m[2], italic: false, level })
    }
  }
  let i = 0
  while (i < s.length) {
    const c = s[i]
    if ((c === '_' || c === '^') && i + 1 < s.length) {
      const level = c === '_' ? -1 : 1
      if (s[i + 1] === '{') {
        const j = s.indexOf('}', i + 2)
        push(s.slice(i + 2, j < 0 ? s.length : j), level)
        i = j < 0 ? s.length : j + 1
      } else {
        push(s[i + 1], level)
        i += 2
      }
    } else {
      let j = i
      while (j < s.length && s[j] !== '_' && s[j] !== '^') j++
      push(s.slice(i, j), 0)
      i = j
    }
  }
  return runs
}
function drawMath (s, x, y, o) {
  const runs = mathRuns(s)
  const fontFor = (r) => `${r.italic ? 'italic ' : ''}${o.weight} ${r.level ? o.size * 0.68 : o.size}px ${MATH}`
  let total = 0
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    r.w = ctx.measureText(r.t).width + (r.italic && !r.level ? o.size * 0.04 : 0)
    total += r.w
  })
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x
  A(o.alpha)
  ctx.fillStyle = o.color
  ctx.textAlign = 'left'
  ctx.textBaseline = o.base
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    ctx.fillText(r.t, cx, y + (r.level < 0 ? o.size * 0.3 : r.level > 0 ? -o.size * 0.36 : 0))
    cx += r.w
  })
}
// Stacked maths lines for derivations and slow worked examples. The newest revealed line is highlighted.
function formulaSteps (lines, x, y, shown, o = {}) {
  const { size = fz(15), gap = fz(30), align = 'left' } = o
  lines.forEach((s, i) => {
    const a = clamp(shown - i)
    if (a <= 0) return
    const current = shown - i < 2 && i === Math.min(lines.length - 1, Math.ceil(shown) - 1)
    txt(s, x, y + i * gap, { size, math: true, color: current ? C.hi : C.ink, align, alpha: easeOut(a) * (current ? 1 : 0.75) })
  })
}
function measure (s, size, weight = 500, mono = false) {
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  return ctx.measureText(s).width
}
function rr (x, y, w, h, r) {
  ctx.beginPath()
  ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r)
}
function line (x1, y1, x2, y2, color, w = 1, a = 1, dash = null) {
  A(a)
  ctx.strokeStyle = color
  ctx.lineWidth = w
  if (dash) ctx.setLineDash(dash)
  ctx.beginPath()
  ctx.moveTo(x1, y1)
  ctx.lineTo(x2, y2)
  ctx.stroke()
  if (dash) ctx.setLineDash([])
}
function dot (x, y, r, color, a = 1) {
  A(a)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.arc(x, y, Math.max(0.1, r), 0, TAU)
  ctx.fill()
}
function glow (x, y, r, color, a = 1) {
  A(a)
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4)
  g.addColorStop(0, rgba(color, 0.3))
  g.addColorStop(1, rgba(color, 0))
  ctx.fillStyle = g
  ctx.beginPath()
  ctx.arc(x, y, r * 4, 0, TAU)
  ctx.fill()
  dot(x, y, r, color, a)
  dot(x, y, r * 0.42, '#ffffff', a)
}
function softShadow (on) {
  ctx.shadowColor = on ? 'rgba(27,31,69,0.08)' : 'transparent'
  ctx.shadowBlur = on ? 14 : 0
  ctx.shadowOffsetY = on ? 4 : 0
}
function panel (x, y, w, h, a = 1, border = C.hi) {
  A(a)
  softShadow(true)
  rr(x, y, w, h, 12)
  ctx.fillStyle = C.surface
  ctx.fill()
  softShadow(false)
  ctx.strokeStyle = rgba(border, 0.4)
  ctx.lineWidth = 1
  ctx.stroke()
}
function qb (a, c, b, t) {
  const u = 1 - t
  return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }
}
// A glowing dot with a tail, arcing from a to b as t goes 0..1.
function flight (a, b, t, color, r = 2.4, lift = 40) {
  if (t <= 0 || t >= 1.25) return
  const c = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - lift }
  for (let k = 6; k >= 0; k--) {
    const tt = t - k * 0.04
    if (tt < 0 || tt > 1) continue
    const q = qb(a, c, b, ease(tt))
    if (k === 0) glow(q.x, q.y, r, color)
    else dot(q.x, q.y, r * (1 - k / 9), color, 0.45 * (1 - k / 7))
  }
}
function polyLen (pts) {
  const L = [0]
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y))
  return L
}
function along (pts, L, t) {
  const d = clamp(t) * L[L.length - 1]
  let i = 1
  while (i < L.length - 1 && L[i] < d) i++
  const s = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1)
  return { x: lerp(pts[i - 1].x, pts[i].x, s), y: lerp(pts[i - 1].y, pts[i].y, s) }
}
// Draws a path up to t (0..1) and returns its leading point.
function tracePath (pts, t, color, width = 2.2, a = 1) {
  const L = polyLen(pts)
  const total = L[L.length - 1] || 1
  for (let s = 1; s < pts.length; s++) {
    if (t * total < L[s - 1]) break
    const end = t * total < L[s] ? along(pts, L, t) : pts[s]
    line(pts[s - 1].x, pts[s - 1].y, end.x, end.y, color, width, a)
  }
  return along(pts, L, t)
}
// Looping: small dots travelling along a path.
function runner (pts, offset = 0, color = C.hi, alpha = 1, period = 2600) {
  if (!LIVE || alpha <= 0 || pts.length < 2) return
  const L = polyLen(pts)
  const t = cycle(period, offset)
  const fade = Math.sin(Math.PI * t) * alpha
  for (let k = 4; k >= 0; k--) {
    const tail = t - k * 0.018
    if (tail < 0) continue
    const q = along(pts, L, tail)
    dot(q.x, q.y, k ? 1.5 : 2.8, color, fade * (1 - k / 6))
  }
}
// Looping: an expanding ring.
function ripple (x, y, r0, r1, color, a = 1, period = 2000, offset = 0) {
  if (!LIVE || a <= 0) return
  const t = cycle(period, offset)
  A(a * (1 - t) * 0.55)
  ctx.beginPath()
  ctx.arc(x, y, lerp(r0, r1, t), 0, TAU)
  ctx.strokeStyle = color
  ctx.lineWidth = 1.4
  ctx.stroke()
}
function treeLayout (cx, top, w, h, depth = 3) {
  const lv = []
  for (let l = 0; l <= depth; l++) {
    const n = 1 << l
    lv.push(Array.from({ length: n }, (_, i) => ({ x: cx - w / 2 + (i + 0.5) * w / n, y: top + l * h / depth })))
  }
  return lv
}
const treePath = (lv, leaf) => lv.map((nodes, l) => nodes[leaf >> (lv.length - 1 - l)])
function drawTree (lv, a = 1, r = 2.2) {
  for (let l = 0; l < lv.length - 1; l++) {
    lv[l].forEach((n, i) => {
      line(n.x, n.y, lv[l + 1][2 * i].x, lv[l + 1][2 * i].y, C.faint, 1, a)
      line(n.x, n.y, lv[l + 1][2 * i + 1].x, lv[l + 1][2 * i + 1].y, C.faint, 1, a)
    })
  }
  lv.forEach((nodes) => nodes.forEach((n) => dot(n.x, n.y, r, C.faint, a)))
}
// A code listing. `active` is a line index and may be fractional, so the highlight can slide between lines.
function codeBlock (lines, x, y, w, h, active, a = 1) {
  panel(x, y, w, h, a, C.faint)
  const lh = Math.min(fz(22), (h - 20) / lines.length)
  const longest = Math.max(...lines.map((s) => s.length), 1)
  const size = Math.min(lh * 0.64, (w - 28) / (longest * 0.62))
  const top = y + (h - lh * lines.length) / 2
  const at = clamp(active, 0, lines.length - 1)
  A(a * 0.1)
  ctx.fillStyle = C.hi
  rr(x + 6, top + at * lh, w - 12, lh, 5)
  ctx.fill()
  lines.forEach((s, n) => {
    const on = Math.abs(n - at) < 0.5
    txt(s, x + 14, top + (n + 0.5) * lh, { size, mono: true, color: on ? C.ink : C.muted, weight: on ? 700 : 500, alpha: a })
  })
}

// ===== CONTENT: Retrieval and guardrails for an AI chatbot =====
// One worked example: a shopper asks a supplement chatbot how much creatine to take.
// The pipeline follows the case study: request guardrail → heading-level chunks of markdown →
// token-overlap scoring with product names stripped → boosts → packing into a 32,000-character
// budget → the model call → deterministic response guards with one repair pass.

const MSG = 'I lift 4x a week. How much creatine should I take?'
const BLOCKED = 'I’m pregnant, is creatine okay?'
const PRODUCT_WORDS = ['creatine', 'monohydrate']
const tokens = (s) => s.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean)
const MSG_TOKENS = [...new Set(tokens(MSG))]
const MSG_KEPT = MSG_TOKENS.filter((t) => !PRODUCT_WORDS.includes(t))
const CHUNKS = [
  { id: 'daily', file: 'creatine/usage.md', head: 'Daily Maintenance', text: 'How much to take: one 5 g serve once a day.', chars: 900, named: true },
  { id: 'timing', file: 'creatine/usage.md', head: 'Timing', text: 'Take it any time: morning, after training or with a meal.', chars: 700, named: true },
  { id: 'faq', file: 'creatine/faq.md', head: 'Do I need to load?', text: 'No loading phase is needed. Take one serve a day.', chars: 3400, named: true },
  { id: 'pack', file: 'creatine/usage.md', head: 'Pack Yield', text: 'A 280 g tin gives you 56 serves.', chars: 500, named: true },
  { id: 'science', file: 'creatine/science.md', head: 'Strength', text: 'Supports strength for people who lift or train most weeks.', chars: 4800, named: true },
  { id: 'suit', file: 'creatine/suitability.md', head: 'Who it suits', text: 'Suits adults building strength or power.', chars: 3600, named: true },
  { id: 'whey', file: 'whey-protein/usage.md', head: 'Serving', text: 'Mix one scoop into water or milk after training.', chars: 800, named: false },
  { id: 'elec', file: 'electrolyte…/usage.md', head: 'When to drink', text: 'Drink during long or hot sessions.', chars: 700, named: false }
].map((c) => {
  const ct = new Set(tokens(c.head + ' ' + c.text))
  const shared = MSG_KEPT.filter((t) => ct.has(t))
  const overlap = shared.length
  const boost = c.named ? 10 : 0
  return { ...c, shared, overlap, boost, score: overlap + boost }
})
const RANKED = [...CHUNKS].filter((c) => c.score > 0).sort((a, b) => b.score - a.score)
const BUDGET = 32000
const ALWAYS = 17000
const IDENTITY = 2600
const PACK = (() => {
  let used = ALWAYS + IDENTITY
  const kept = []
  const dropped = []
  RANKED.forEach((c) => {
    if (used + c.chars <= BUDGET) { kept.push(c); used += c.chars } else dropped.push(c)
  })
  return { kept, dropped, used }
})()
const DAILY = CHUNKS[0]
const DRAFT = [
  'Great question!',
  'Creatine is one of the most studied supplements for strength.',
  'Take one 5 g serve once a day, mixed into water or any drink.',
  'Timing is flexible, so morning, after training or with a meal all work.'
]
const REPAIRED = [
  'Take one 5 g serve once a day, mixed into water or any drink.',
  'Timing is flexible, so morning, after training or with a meal all work.'
]
const fmt = (v) => Math.round(v).toLocaleString('en-US')

// ---------- shared drawing ----------
function tag (s, x, y, color, a = 1, align = 'left') {
  if (a <= 0) return
  const size = fz(11)
  const w = measure(s, size, 700, true) + 12
  const bx = align === 'left' ? x : align === 'right' ? x - w : x - w / 2
  A(a)
  ctx.fillStyle = '#ffffff'
  rr(bx, y - size * 0.95, w, size * 1.9, 6)
  ctx.fill()
  ctx.strokeStyle = rgba(color, 0.55)
  ctx.lineWidth = 1
  ctx.stroke()
  txt(s, bx + w / 2, y, { size, mono: true, weight: 700, color, align: 'center', alpha: a })
}
// Wraps text into lines that fit `w` and returns them.
function wrap (s, w, size, weight = 500) {
  const words = s.split(' ')
  const lines = []
  let cur = ''
  words.forEach((wd) => {
    const t = cur ? cur + ' ' + wd : wd
    if (measure(t, size, weight) > w && cur) { lines.push(cur); cur = wd } else cur = t
  })
  if (cur) lines.push(cur)
  return lines
}
function bubble (s, x, y, w, color, a = 1, align = 'left') {
  if (a <= 0) return 0
  const size = fz(12)
  const lines = wrap(s, w - 20, size)
  const h = lines.length * size * 1.35 + 16
  const bx = align === 'right' ? x - w : x
  A(a)
  softShadow(true)
  ctx.fillStyle = color === C.ink ? '#ffffff' : rgba(color, 0.1)
  rr(bx, y, w, h, 12)
  ctx.fill()
  softShadow(false)
  ctx.strokeStyle = rgba(color, 0.45)
  ctx.lineWidth = 1
  ctx.stroke()
  lines.forEach((l, i) => txt(l, bx + 10, y + 8 + size * 0.68 + i * size * 1.35, { size, alpha: a }))
  return h
}
function box (x, y, w, h, title, sub, color, a = 1, lit = false) {
  if (a <= 0) return
  panel(x, y, w, h, a, lit ? color : C.faint)
  if (lit) {
    A(a * 0.1)
    ctx.fillStyle = color
    rr(x, y, w, h, 12)
    ctx.fill()
  }
  txt(title, x + w / 2, y + h / 2 - (sub ? fz(7) : 0), { size: fz(11.5), weight: 700, align: 'center', color: lit ? color : C.ink, alpha: a })
  if (sub) txt(sub, x + w / 2, y + h / 2 + fz(9), { size: fz(9.5), color: C.muted, align: 'center', alpha: a })
}
function chip (s, x, y, color, a = 1, strike = false) {
  if (a <= 0) return 0
  const size = fz(11)
  const w = measure(s, size, 600, true) + 12
  A(a)
  ctx.fillStyle = rgba(color, 0.1)
  rr(x, y - size * 0.9, w, size * 1.8, 5)
  ctx.fill()
  ctx.strokeStyle = rgba(color, 0.5)
  ctx.lineWidth = 1
  ctx.stroke()
  txt(s, x + w / 2, y, { size, mono: true, weight: 600, color, align: 'center', alpha: a })
  if (strike) line(x + 3, y, x + w - 3, y, C.pink, 2, a)
  return w
}
function budgetBar (x, y, w, h, segs, a = 1) {
  A(a)
  ctx.fillStyle = C.track
  rr(x, y, w, h, 6)
  ctx.fill()
  let acc = 0
  segs.forEach((s) => {
    const g = s.t === undefined ? 1 : s.t
    if (g <= 0) return
    const sw = (s.chars / BUDGET) * w * g
    A(a * (s.alpha || 0.85))
    ctx.fillStyle = s.color
    ctx.fillRect(x + acc + 0.5, y, Math.max(0, sw - 1), h)
    acc += sw
  })
  A(a)
  ctx.strokeStyle = C.ink
  ctx.lineWidth = 1.5
  ctx.strokeRect(x, y, w, h)
  return acc
}

// ---------- 1. too much to send ----------
function sceneCorpus (p) {
  const always = ['brand.md', 'response-style.md', 'safety.md', 'recommendations.md', 'guidance', 'guidance']
  const parts = ['attributes', 'usage', 'science', 'suitability', 'faq', 'ingredients', 'safety']
  const products = ['creatine', 'whey', 'electrolytes', 'product 4']
  const cols = NARROW ? 4 : 4
  const gx = W * 0.05
  const gw = W * 0.9
  const cw = gw / (NARROW ? 3 : 6)
  const y0 = H * 0.06
  always.forEach((f, i) => {
    const a = easeOut(seg(p, 0.1 + i * 0.06, 0.4 + i * 0.06))
    const x = gx + (NARROW ? (i % 3) : i) * cw
    const y = y0 + (NARROW ? Math.floor(i / 3) * fz(30) : 0)
    box(x + 2, y, cw - 4, fz(26), f, null, C.hi, a, true)
  })
  const py = y0 + (NARROW ? fz(70) : fz(40))
  const pw = gw / cols
  products.forEach((prod, k) => {
    const x = gx + k * pw
    const a = easeOut(seg(p, 1.05 + k * 0.12, 1.4 + k * 0.12))
    txt(prod, x + pw / 2, py, { size: fz(10.5), weight: 700, align: 'center', alpha: a })
    parts.forEach((part, j) => {
      const aa = easeOut(seg(p, 1.1 + k * 0.12 + j * 0.03, 1.4 + k * 0.12 + j * 0.03))
      const y = py + fz(12) + j * fz(17)
      A(aa)
      ctx.fillStyle = rgba(C.two, 0.12)
      rr(x + 4, y, pw - 8, fz(14), 4)
      ctx.fill()
      txt(part + '.md', x + pw / 2, y + fz(7), { size: fz(9), mono: true, color: C.muted, align: 'center', alpha: aa })
    })
  })
  // budget
  const by = H * 0.8
  const bx = W * 0.08
  const bw = W * 0.84
  const ba = easeOut(seg(p, 2.05, 2.3))
  if (ba > 0) {
    const fill = ease(seg(p, 2.1, 2.9))
    const all = 61000
    budgetBar(bx, by, bw, fz(18), [{ chars: Math.min(BUDGET, all * fill), color: C.hi }], ba)
    if (all * fill > BUDGET) {
      const over = (all * fill - BUDGET) / BUDGET * bw
      A(0.7)
      ctx.fillStyle = C.pink
      ctx.fillRect(bx + bw, by, Math.min(over, W * 0.06), fz(18))
    }
    txt('32,000-character budget for one turn', bx, by - fz(12), { size: fz(10.5), color: C.muted, alpha: ba })
  }
  tag('the whole catalogue does not fit', W / 2, H * 0.92, C.pink, easeOut(seg(p, 2.8, 3.1)), 'center')
}

// ---------- 2. request guardrail ----------
function sceneGuard (p) {
  const bw = Math.min(W * 0.7, fz(360))
  const gateX = W * 0.5
  const gateY = H * 0.42
  const b1 = easeOut(seg(p, 0.1, 0.4))
  const slide1 = ease(seg(p, 0.5, 1.0))
  // patterns
  const pats = [['medical advice', 'pregnan…, medication…'], ['urgent symptoms', 'chest pain, faint…'], ['prompt injection', 'ignore previous…']]
  const pw = NARROW ? W * 0.3 : W * 0.24
  pats.forEach((pt, k) => {
    const a = easeOut(seg(p, 0.05 + k * 0.1, 0.35 + k * 0.1))
    const x = W / 2 + (k - 1) * (pw + 8) - pw / 2
    const hit = k === 0 && p > 1 && p < 3
    box(x, gateY - fz(22), pw, fz(44), pt[0], NARROW ? null : pt[1], hit ? C.pink : C.hi, a, hit)
  })
  // blocked message
  const m1y = lerp(H * 0.05, H * 0.05, 1)
  const h1 = bubble(BLOCKED, W * 0.05, m1y, bw, C.ink, b1 * (1 - seg(p, 2.9, 3.1)))
  if (slide1 > 0 && slide1 < 1) flight({ x: W * 0.05 + bw / 2, y: m1y + h1 }, { x: gateX - pw - 8, y: gateY - fz(22) }, slide1, C.pink, 2.4, -10)
  const hit = easeOut(seg(p, 1.05, 1.4))
  if (hit > 0 && p < 3) tag('matched: pregnancy + “okay”', W / 2, gateY + fz(38), C.pink, hit * (1 - seg(p, 2.9, 3.1)), 'center')
  const fixed = easeOut(seg(p, 2.05, 2.4)) * (1 - seg(p, 2.9, 3.1))
  bubble('I can’t provide medical advice or assess whether a supplement is safe for your individual circumstances. Please speak with a qualified healthcare professional who knows your medical history and medications.', W * 0.95, H * 0.58, Math.min(W * 0.8, fz(420)), C.hi, fixed, 'right')
  // the model, skipped
  const mx = W * 0.5
  const my = H * 0.9
  const skip = easeOut(seg(p, 2.3, 2.6)) * (1 - seg(p, 2.9, 3.1))
  box(mx - W * 0.13, my - fz(16), W * 0.26, fz(32), 'model', null, C.faint, 1)
  if (skip > 0) {
    line(mx - W * 0.13, my - fz(16), mx + W * 0.13, my + fz(16), C.pink, 2, skip)
    tag('not called', mx + W * 0.15, my, C.pink, skip)
  }
  // our message passes
  const b2 = easeOut(seg(p, 3.05, 3.35))
  bubble(MSG, W * 0.05, H * 0.05, bw, C.ink, b2)
  const pass = ease(seg(p, 3.3, 3.9))
  if (pass > 0) {
    const y = lerp(H * 0.16, my - fz(18), pass)
    glow(mx, y, 4, C.green)
    tag('no pattern matched', W / 2, gateY + fz(38), C.green, easeOut(seg(p, 3.5, 3.8)), 'center')
  }
}

// ---------- 3. chunking ----------
function sceneChunk (p) {
  const x = W * 0.06
  const w = NARROW ? W * 0.88 : W * 0.42
  const y = H * 0.08
  const lines = [
    ['# Creatine usage', C.ink, true],
    ['## Daily Maintenance', C.hi, true],
    ['How much to take: one 5 g serve…', C.muted, false],
    ['## Timing', C.accent, true],
    ['Take it any time: morning, after…', C.muted, false],
    ['## Pack Yield', C.two, true],
    ['A 280 g tin gives you 56 serves.', C.muted, false]
  ]
  const a0 = easeOut(seg(p, 0, 0.3))
  const lh = fz(20)
  const split = ease(seg(p, 1.05, 1.7))
  panel(x, y, w, lh * lines.length + 20, a0 * (1 - split), C.faint)
  txt('creatine/usage.md', x, y - fz(10), { size: fz(10), mono: true, color: C.muted, alpha: a0 })
  const groups = [[1, 2], [3, 4], [5, 6]]
  const colors = [C.hi, C.accent, C.two]
  const tx = NARROW ? x : W * 0.54
  lines.forEach(([s, col, bold], i) => {
    const g = groups.findIndex((gr) => gr.includes(i))
    const from = { x: x + 12, y: y + 10 + (i + 0.5) * lh }
    let to = from
    if (g >= 0) {
      const k = groups[g].indexOf(i)
      to = { x: tx + 12, y: (NARROW ? H * 0.12 : H * 0.1) + g * (NARROW ? fz(56) : fz(70)) + (k + 0.5) * lh + 8 + (NARROW ? H * 0.0 : 0) }
      if (NARROW) to = { x: x + 12, y: H * 0.08 + g * fz(56) + (k + 0.5) * lh + 8 }
    }
    const pos = { x: lerp(from.x, to.x, split), y: lerp(from.y, to.y, split) }
    const a = easeOut(seg(p, 0.1 + i * 0.07, 0.35 + i * 0.07)) * (g < 0 ? 1 - split * 0.6 : 1)
    if (g < 0 && NARROW && split > 0) return
    txt(s, pos.x, pos.y, { size: fz(11), mono: true, weight: bold ? 700 : 500, color: col, alpha: a })
  })
  groups.forEach((gr, g) => {
    const a = easeOut(seg(p, 1.4 + g * 0.1, 1.8 + g * 0.1))
    const by = NARROW ? H * 0.08 + g * fz(56) : H * 0.1 + g * fz(70)
    const bx = NARROW ? x : tx
    const bwid = NARROW ? w : W * 0.4
    if (a <= 0) return
    A(a)
    ctx.strokeStyle = colors[g]
    ctx.lineWidth = 1.5
    rr(bx, by, bwid, lh * 2 + 16, 10)
    ctx.stroke()
  })
  // the whole catalogue becomes a pile of chunks
  const pile = easeOut(seg(p, 2.05, 2.5))
  if (pile > 0) {
    const n = 60
    const py = NARROW ? H * 0.72 : H * 0.7
    for (let k = 0; k < n; k++) {
      const f = easeOut(seg(p, 2.05 + k * 0.01, 2.3 + k * 0.01))
      const cx = W * 0.06 + (k % 20) * (W * 0.88 / 20)
      const cy = py + Math.floor(k / 20) * fz(16)
      A(f * 0.8)
      ctx.fillStyle = k < 6 ? rgba(C.hi, 0.35) : rgba(C.two, 0.22)
      rr(cx + 2, cy, W * 0.88 / 20 - 4, fz(12), 3)
      ctx.fill()
    }
    txt('every file, split at its headings', W * 0.06, py - fz(12), { size: fz(10), color: C.muted, alpha: pile })
  }
}

// ---------- 4. scoring by shared words ----------
function sceneScore (p) {
  const y0 = H * 0.1
  const x0 = W * 0.05
  txt('message', x0, y0 - fz(16), { size: fz(10), color: C.muted })
  let x = x0
  let row = 0
  const strip = easeOut(seg(p, 1.05, 1.4))
  const maxX = W * 0.95
  const pos = {}
  MSG_TOKENS.forEach((t, i) => {
    const a = easeOut(seg(p, 0.1 + i * 0.05, 0.35 + i * 0.05))
    const isProd = PRODUCT_WORDS.includes(t)
    const shared = DAILY.shared.includes(t)
    const w = measure(t, fz(11), 600, true) + 12
    if (x + w > maxX) { x = x0; row++ }
    const yy = y0 + row * fz(28)
    const col = isProd ? C.pink : shared && p > 2 ? C.green : C.ink
    chip(t, x, yy, col, a * (isProd ? 1 - 0.5 * strip : 1), isProd && strip > 0)
    pos[t] = { x: x + w / 2, y: yy }
    x += w + 6
  })
  tag('product name stripped', W * 0.95, y0 + (row + 1) * fz(28) + fz(4), C.pink, strip * (1 - seg(p, 2, 2.2)), 'right')
  // the chunk
  const cy = H * 0.5
  const ca = easeOut(seg(p, 2.05, 2.3))
  if (ca > 0) {
    txt(`${DAILY.file} · ${DAILY.head}`, x0, cy - fz(16), { size: fz(10), mono: true, color: C.hi, alpha: ca })
    const ct = tokens(DAILY.head + ' ' + DAILY.text)
    let cx = x0
    let crow = 0
    ct.forEach((t, i) => {
      const w = measure(t, fz(11), 600, true) + 12
      if (cx + w > maxX) { cx = x0; crow++ }
      const yy = cy + crow * fz(28)
      const hit = DAILY.shared.includes(t) && ct.indexOf(t) === i
      const a = easeOut(seg(p, 2.05 + i * 0.03, 2.3 + i * 0.03))
      chip(t, cx, yy, hit && p > 2.5 ? C.green : C.muted, a)
      if (hit && pos[t]) {
        const f = seg(p, 2.5 + DAILY.shared.indexOf(t) * 0.15, 2.9 + DAILY.shared.indexOf(t) * 0.15)
        if (f > 0 && f < 1) flight(pos[t], { x: cx + w / 2, y: yy }, f, C.green, 2.2, 10)
      }
      cx += w + 6
    })
  }
  const sc = easeOut(seg(p, 3.05, 3.4))
  tag(`shared words: ${DAILY.shared.join(', ')} → ${DAILY.overlap}`, W / 2, H * 0.86, C.green, sc, 'center')
}

// ---------- 5. boosts and ranking ----------
function sceneBoost (p) {
  const rows = CHUNKS
  const x0 = NARROW ? W * 0.04 : W * 0.06
  const labelW = NARROW ? W * 0.42 : W * 0.34
  const bx = x0 + labelW
  const bw = W * 0.92 - labelW
  const y0 = H * 0.1
  const rh = Math.min(fz(34), H * 0.1)
  const unit = bw / 16
  const sortT = ease(seg(p, 2.05, 2.7))
  rows.forEach((c, i) => {
    const rank = RANKED.indexOf(c)
    const target = rank >= 0 ? rank : RANKED.length + rows.filter((d, j) => j < i && RANKED.indexOf(d) < 0).length
    const y = lerp(y0 + i * rh, y0 + target * rh, sortT)
    const a = easeOut(seg(p, 0.05 + i * 0.05, 0.3 + i * 0.05))
    txt(NARROW ? c.head : `${c.file.replace('.md', '')} · ${c.head}`, bx - 8, y, { size: fz(NARROW ? 9.5 : 10), mono: true, align: 'right', color: c.score ? C.ink : C.muted, alpha: a })
    const ov = easeOut(seg(p, 0.2 + i * 0.05, 0.6 + i * 0.05))
    A(a)
    ctx.fillStyle = C.green
    ctx.fillRect(bx, y - rh * 0.28, c.overlap * unit * ov, rh * 0.56)
    const bo = easeOut(seg(p, 1.05 + i * 0.04, 1.4 + i * 0.04)) 
    if (c.boost && bo > 0) {
      A(a)
      ctx.fillStyle = C.hi
      ctx.fillRect(bx + c.overlap * unit, y - rh * 0.28, c.boost * unit * bo, rh * 0.56)
    }
    const total = c.overlap + (c.boost ? c.boost * bo : 0)
    txt(String(Math.round(total)), bx + total * unit + 6, y, { size: fz(10.5), mono: true, weight: 700, color: c.score ? C.ink : C.muted, alpha: a })
  })
  tag('+10 named product', bx, y0 - fz(30) + H * 0.02, C.hi, easeOut(seg(p, 1.05, 1.3)))
  tag('word overlap', bx + measure('+10 named product', fz(11), 700, true) + fz(24), y0 - fz(30) + H * 0.02, C.green, easeOut(seg(p, 0.2, 0.5)))
  const other = easeOut(seg(p, 3.05, 3.4))
  if (other > 0) {
    tag('+6 product on the current page', W * 0.06, H * 0.84, C.accent, other)
    tag('+5 safety & suitability after an avoidance', W * 0.06, H * 0.92, C.accent, easeOut(seg(p, 3.2, 3.5)))
  }
}

// ---------- 6. packing the budget ----------
function scenePack (p) {
  const bx = W * 0.06
  const bw = W * 0.88
  const by = H * 0.18
  const bh = fz(30)
  const segs = [
    { chars: ALWAYS, color: C.hi, t: ease(seg(p, 0.1, 0.6)) },
    { chars: IDENTITY, color: C.two, t: ease(seg(p, 0.6, 0.9)) }
  ]
  const kt = PACK.kept.map((c, k) => ({ chars: c.chars, color: C.green, alpha: 0.55 + 0.1 * (k % 2), t: ease(seg(p, 1.05 + k * 0.2, 1.25 + k * 0.2)) }))
  const used = budgetBar(bx, by, bw, bh, [...segs, ...kt], 1)
  txt('32,000 characters', bx + bw, by - fz(12), { size: fz(10), mono: true, color: C.muted, align: 'right' })
  txt(`always-on guidance ${fmt(ALWAYS)}`, bx, by + bh + fz(14), { size: fz(10), mono: true, color: C.hi, alpha: segs[0].t })
  txt(`identity ${fmt(IDENTITY)}`, bx + (ALWAYS / BUDGET) * bw, by + bh + fz(30), { size: fz(10), mono: true, color: C.two, alpha: segs[1].t })
  // ranked list
  const ly = H * 0.42
  const rh = Math.min(fz(26), H * 0.075)
  RANKED.forEach((c, k) => {
    const kept = PACK.kept.includes(c)
    const t0 = kept ? 1.05 + PACK.kept.indexOf(c) * 0.2 : 2.05
    const gone = seg(p, t0, t0 + 0.25)
    const y = ly + k * rh
    const a = 1 - (kept ? 0.6 * gone : 0)
    const col = kept ? C.green : p > 2.05 ? C.pink : C.ink
    txt(`${c.score}`, bx, y, { size: fz(10.5), mono: true, weight: 700, color: col, alpha: a })
    txt(`${c.file} · ${c.head}`, bx + fz(26), y, { size: fz(10.5), mono: true, color: col, alpha: a })
    txt(`${fmt(c.chars)} chars`, W * 0.94, y, { size: fz(10), mono: true, color: C.muted, align: 'right', alpha: a })
    if (kept && gone > 0 && gone < 1) flight({ x: bx + fz(40), y }, { x: bx + (used / bw) * bw - 10, y: by + bh / 2 }, gone, C.green, 2.2, 20)
    if (!kept) {
      const d = easeOut(seg(p, 2.05, 2.4))
      line(bx, y, bx + d * W * 0.7, y, C.pink, 1.6, d)
    }
  })
  if (PACK.dropped.length) {
    const d = PACK.dropped[0]
    tag(`dropped whole and logged: ${d.file} · ${d.head}`, W / 2, H * 0.88, C.pink, easeOut(seg(p, 2.3, 2.6)), 'center')
  }
  tag('zero-score chunks stay out', W / 2, H * 0.95, C.muted, easeOut(seg(p, 3.05, 3.4)), 'center')
}

// ---------- 7. the model call ----------
function sceneModel (p) {
  const x = W * 0.06
  const w = NARROW ? W * 0.88 : W * 0.38
  const y = H * 0.08
  const parts = [
    ['always-on guidance', C.hi], ['product identity', C.two],
    ...PACK.kept.map((c) => [c.head, C.green]),
    ['shopper profile', C.accent], ['message', C.ink]
  ]
  const ph = Math.min(fz(22), H * 0.055)
  parts.forEach(([s, col], k) => {
    const a = easeOut(seg(p, 0.1 + k * 0.08, 0.35 + k * 0.08))
    const yy = y + k * (ph + 3)
    A(a)
    ctx.fillStyle = rgba(col, 0.12)
    rr(x, yy, w, ph, 5)
    ctx.fill()
    txt(s, x + 8, yy + ph / 2, { size: fz(10), mono: true, color: col, alpha: a })
  })
  const stackH = parts.length * (ph + 3)
  const mx = NARROW ? W / 2 : W * 0.66
  const my = NARROW ? y + stackH + fz(40) : H * 0.3
  const go = seg(p, 1.05, 1.6)
  box(mx - W * 0.12, my - fz(18), W * 0.24, fz(36), 'model', 'OpenAI Responses API', C.hi, easeOut(seg(p, 1, 1.2)), go > 0.9 && p < 2.2)
  if (go > 0 && go < 1) flight({ x: x + w, y: y + stackH / 2 }, { x: mx - W * 0.12, y: my }, go, C.hi, 2.6, 30)
  const out = easeOut(seg(p, 2.05, 2.4))
  const dy = NARROW ? my + fz(30) : H * 0.48
  const dx = NARROW ? W * 0.06 : W * 0.46
  const dw = NARROW ? W * 0.88 : W * 0.5
  bubble(DRAFT.join(' '), dx, dy, dw, C.ink, out)
  tag('draft', dx, dy - fz(12), C.muted, out)
}

// ---------- 8. response guards ----------
function sceneGuards (p) {
  const checks = [
    { s: 'at most three sentences', ok: false, t: 0.2 },
    { s: 'does not repeat the last question', ok: true, t: 0.5 },
    { s: 'goal + routine known before cards', ok: true, t: 2.05 },
    { s: 'no duplicate card, never the page’s product', ok: true, t: 2.35 }
  ]
  const x = W * 0.06
  const y0 = H * 0.08
  const rh = Math.min(fz(28), H * 0.075)
  checks.forEach((c, k) => {
    const a = easeOut(seg(p, c.t, c.t + 0.3))
    const y = y0 + k * rh
    const fixedNow = k === 0 && p > 1.6
    const ok = c.ok || fixedNow
    const col = ok ? C.green : C.pink
    if (a <= 0) return
    dot(x + 6, y, 6, col, a)
    txt(ok ? '✓' : '✕', x + 6, y + 1, { size: fz(9), weight: 800, color: '#ffffff', align: 'center', alpha: a })
    txt(c.s, x + 20, y, { size: fz(11), alpha: a, color: ok ? C.ink : C.pink })
  })
  const by = y0 + checks.length * rh + fz(10)
  const bw = NARROW ? W * 0.88 : W * 0.6
  const draftA = 1 - easeOut(seg(p, 1.05, 1.4))
  const sentences = easeOut(seg(p, 0.6, 0.9))
  if (draftA > 0) {
    bubble(DRAFT.join(' '), x, by, bw, C.ink, draftA)
    tag(`${DRAFT.length} sentences`, x + bw, by - fz(10), C.pink, sentences * draftA, 'right')
  }
  const fix = easeOut(seg(p, 1.2, 1.6))
  if (fix > 0) {
    bubble(REPAIRED.join(' '), x, by, bw, C.hi, fix)
    tag('one repair pass', x + bw, by - fz(10), C.hi, fix, 'right')
  }
  // product card
  const card = easeOut(seg(p, 2.5, 2.9))
  if (card > 0) {
    const cx = NARROW ? x : W * 0.7
    const cy = NARROW ? H * 0.78 : by
    const cw = NARROW ? W * 0.5 : W * 0.24
    panel(cx, cy, cw, fz(58), card, C.green)
    txt('Creatine Monohydrate', cx + 10, cy + fz(18), { size: fz(11), weight: 700, alpha: card })
    txt('5 g once daily · 56 serves per tin', cx + 10, cy + fz(38), { size: fz(9.5), color: C.muted, alpha: card })
  }
  const send = easeOut(seg(p, 3.05, 3.4))
  tag('sent to the shopper', W / 2, H * 0.94, C.green, send, 'center')
}

function drawScene (context, index, p, { width, height, dpr, font }, time = 0) {
  ctx = context

    const first = ch.pages[0]
    ch.lis.forEach((li) => first.list.append(li))

      if (!fits && groups[groups.length - 1].length && used + h > limit) {

      groups[groups.length - 1].push(i)

    if (ch.pages.length < 2) {

    const stageW = ch.col.offsetWidth

    const gap = Math.abs(ch.copy.offsetLeft - ch.col.offsetLeft) - (dir > 0 ? stageW : copyW)
    // The row pans as one: the stage moves across, the new page takes the side it left, and
    // the old page slides out beside the stage as a fading ghost. The whole row then shifts
    // away from the ghost, as far as the screen allows, so it stays balanced on screen.
    let shift = 0
    if (cur > 0) {
      const ghostSide = cur % 2 ? dir : -dir
      const rect = ch.el.getBoundingClientRect()
      const room = ghostSide > 0 ? rect.left : window.innerWidth - rect.right
      shift = -ghostSide * Math.min((gap + copyW * GHOST_SHOWN) / 2, Math.max(0, room - 16))
    }
    ch.col.style.translate = `${(cur % 2 ? dir * (copyW + gap) : 0) + shift}px 0`
    ch.pages.forEach(({ el }, k) => {
      const away = k % 2 === 1
      const base = (away ? -dir * (stageW + gap) : 0) + shift
      const out = away ? -dir : dir
      const s = el.style
      s.setProperty('--fade-dir', out > 0 ? '90deg' : '270deg')
      if (k === cur) {
        s.translate = `${base}px 0`
        s.opacity = '1'
        s.setProperty('--fade', '150%')
      } else if (k < cur) {
        s.translate = `${base + out * (copyW + gap)}px 0`
        s.opacity = k === cur - 1 ? '.75' : '0'
        s.setProperty('--fade', k === cur - 1 ? `${GHOST_SHOWN * 100}%` : '0%')
      } else {
        s.translate = `${base + out * 56}px 0`
        s.opacity = '0'
        s.setProperty('--fade', '150%')
      }
      el.inert = k !== cur
    })
  }

  function frame (now) {
    raf = 0
    if (!inView) { lastFrame = 0; return }
    const dt = lastFrame ? Math.min(64, now - lastFrame) : 16
    lastFrame = now
    const vh = window.innerHeight
    const rate = reduceMotion ? 1 : 1 - Math.exp(-dt / DAMPING_MS)
    let current = activeChapter

    chapters.forEach((ch, i) => {
      const rect = ch.el.getBoundingClientRect()
      if (rect.top < vh * 0.5 && rect.bottom > vh * 0.5) current = i
      const near = rect.bottom > -vh * 0.3 && rect.top < vh * 1.3
      if (near !== ch.near) {
        ch.near = near
        if (near) {
          sizeCanvas(ch)
        } else {
          ch.canvas.width = 0
          ch.canvas.height = 0
          ch.size = null
        }
      }
      if (!ch.seen && rect.top < vh * 0.9) {
        ch.seen = true
        ch.el.classList.add('seen')
      }
      if (!ch.started && rect.top < vh * START_LINE && rect.bottom > vh * 0.2) ch.started = true
      const visible = rect.top < vh * 0.8 && rect.bottom > vh * 0.2
      if (ch.started && visible && !reduceMotion && ch.time < ch.total) {
        ch.time = Math.min(ch.total, ch.time + dt)
      }
      const target = progressAt(ch)
      ch.shown += (target - ch.shown) * rate
      if (Math.abs(target - ch.shown) < 0.0004) ch.shown = target
      const beat = Math.min(ch.beatEls.length - 1, Math.floor(target))
      paintBeats(ch, beat, ch.time >= ch.total)
      ch.beatEls[beat].style.setProperty('--fill', (target - beat).toFixed(3))
      if (!near) return
      const looping = !reduceMotion && rect.bottom > 0 && rect.top < vh
      if (ch.size && (looping || ch.dirty || Math.abs(ch.shown - ch.drawn) > 0.0002)) {
        drawScene(ch.ctx, i, ch.shown, ch.size, reduceMotion ? 0 : now)
        ch.drawn = ch.shown
        ch.dirty = false
      }
    })

    if (current !== activeChapter) {
      activeChapter = current
      railItems.forEach((item, n) => item.classList.toggle('on', n === current))
    }
    const first = chapters[0].el.getBoundingClientRect()
    const last = chapters[chapters.length - 1].el.getBoundingClientRect()
    const shown = first.top < vh * 0.5 && last.bottom > vh * 0.5
    if (shown !== railShown) {
      railShown = shown
      rail.classList.toggle('shown', shown)
    }
    raf = requestAnimationFrame(frame)
  }
  function start () {
    if (!raf && inView) raf = requestAnimationFrame(frame)
  }

  // The opening is a stop of its own, so one scroll from it glides into the first chapter.
  function openingZone () {
    if (!opening) return []
    const bottom = opening.getBoundingClientRect().bottom + window.scrollY
    return [{ snap: 0, end: Math.max(0, bottom - window.innerHeight) }]
  }
  function zoneOf (ch) {
    const vh = window.innerHeight
    const rect = ch.el.getBoundingClientRect()
    const top = rect.top + window.scrollY
    const maxScroll = document.documentElement.scrollHeight - vh
    const snap = Math.min(maxScroll, Math.max(0, top - Math.max(SNAP_PADDING, (vh - rect.height) / 2)))
    const end = Math.min(maxScroll, Math.max(snap, top + rect.height + SNAP_PADDING - vh))
    return { snap, end }
  }
  // `force` lets the keyboard enter the story from anywhere above or below it.
  function nextStop (direction, force = false) {
    const y = window.scrollY
    const reach = window.innerHeight * ENTRY_REACH
    const zones = [...openingZone(), ...chapters.map(zoneOf)]
    if (direction > 0) {
      for (let i = 0; i < zones.length; i++) {
        if (y < zones[i].snap - SNAP_EPSILON) return i === 0 && !force && zones[i].snap - y > reach ? null : zones[i].snap
        if (y < zones[i].end - SNAP_EPSILON) return null
      }
      return null
    }
    for (let i = zones.length - 1; i >= 0; i--) {
      if (y > zones[i].end + SNAP_EPSILON) return i === zones.length - 1 && !force && y - zones[i].end > reach ? null : zones[i].end
      if (y > zones[i].snap + SNAP_EPSILON) return null
    }
    return null
  }
  function cancelGlide () {
    if (glideRaf) cancelAnimationFrame(glideRaf)
    glideRaf = 0
  }
  function glideTo (target) {
    cancelGlide()
    const from = window.scrollY
    const distance = Math.abs(target - from)
    if (distance < 2) return
    const duration = Math.min(MAX_GLIDE_MS, Math.max(MIN_GLIDE_MS, distance * GLIDE_MS_PER_PX + 500))
    const startedAt = performance.now()
    settling = true
    wheelTotal = 0
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - startedAt) / duration))
      window.scrollTo({ top: from + (target - from) * ease(t), behavior: 'instant' })
      glideRaf = t < 1 ? requestAnimationFrame(step) : 0
    }
    glideRaf = requestAnimationFrame(step)
  }
  function onWheel (e) {
    if (e.ctrlKey || !e.deltaY || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return
    const delta = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaMode === 2 ? e.deltaY * window.innerHeight : e.deltaY
    const size = Math.abs(delta)
    const now = performance.now()
    const gap = now - lastWheelAt
    const rising = size > 30 && size > lastWheelSize * 1.6
    lastWheelAt = now
    lastWheelSize = size
    if (glideRaf) { e.preventDefault(); return }
    if (gap > WHEEL_QUIET_MS) {
      settling = false
      wheelTotal = 0
    }
    if (settling) {
      if (!rising) { e.preventDefault(); return }
      settling = false
      wheelTotal = 0
    }
    const direction = Math.sign(delta)
    const target = nextStop(direction)
    if (target === null) return
    e.preventDefault()
    if (Math.sign(wheelTotal) !== direction) wheelTotal = 0
    wheelTotal += delta
    if (Math.abs(wheelTotal) >= WHEEL_THRESHOLD) glideTo(target)
  }
  // ← and → move between steps, continuing into the next or previous chapter at either end.
  function stepBy (dir) {
    const i = Math.max(0, activeChapter)
    const ch = chapters[i]
    if (activeChapter !== i) {
      jump(i)
      seek(i, 0)
      return
    }
    const n = ch.beatEls.length
    const current = ch.started ? Math.min(n - 1, Math.floor(progressAt(ch))) : -1
    const target = current + dir
    if (target >= n) {
      if (i + 1 < chapters.length) {
        jump(i + 1)
        seek(i + 1, 0)
      }
    } else if (target < 0) {
      if (i > 0) {
        jump(i - 1)
        seek(i - 1, chapters[i - 1].beatEls.length - 1)
      }
    } else {
      seek(i, target)
    }
  }
  function onKeydown (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault()
      stepBy(e.key === 'ArrowRight' ? 1 : -1)
      return
    }
    let direction = KEY_DIRECTION[e.key]
    if (e.key === ' ') {
      if (e.target.closest?.('button, a')) return
      direction = e.shiftKey ? -1 : 1
    }
    if (!direction) return
    if (glideRaf) { e.preventDefault(); return }
    const target = nextStop(direction, true)
    if (target === null) return
    e.preventDefault()
    if (reduceMotion) window.scrollTo({ top: target, behavior: 'instant' })
    else glideTo(target)
  }
  function onTouchStart (e) {
    touch = e.touches.length === 1 ? { y: e.touches[0].clientY, target: undefined } : null
  }
  function onTouchMove (e) {
    if (glideRaf) {
      if (e.cancelable) e.preventDefault()
      return
    }
    if (!touch) return
    const dy = e.touches[0].clientY - touch.y
    if (touch.target === undefined) {
      if (Math.abs(dy) < 8) return
      touch.target = nextStop(dy < 0 ? 1 : -1)
    }
    if (touch.target === null || !e.cancelable) return
    e.preventDefault()
    if (Math.abs(dy) >= SWIPE_THRESHOLD) {
      glideTo(touch.target)
      touch = null
    }
  }
  function onPointerDown (e) {
    if (e.target === document.documentElement) cancelGlide()
  }
  function jump (i) {
    const { snap } = zoneOf(chapters[i])
    if (reduceMotion) window.scrollTo({ top: snap, behavior: 'instant' })
    else glideTo(snap)
  }
  function seek (i, beat) {
    const ch = chapters[i]
    ch.started = true
    ch.time = reduceMotion ? ch.starts[beat] + ch.durations[beat] - 1 : ch.starts[beat]
  }

  new ResizeObserver(resizeStages).observe(root)
  window.addEventListener('resize', resizeStages)
  window.addEventListener('keydown', onKeydown)
  if (!reduceMotion) {
    window.addEventListener('wheel', onWheel, { passive: false })
    window.addEventListener('touchstart', onTouchStart, { passive: true })
    window.addEventListener('touchmove', onTouchMove, { passive: false })
    window.addEventListener('pointerdown', onPointerDown)
  }
  document.fonts?.ready.then(() => chapters.forEach((ch) => { paginate(ch); ch.dirty = true }))
  window.addEventListener('scene-assets', () => chapters.forEach((ch) => { ch.dirty = true }))
  new IntersectionObserver(([entry]) => {
    inView = entry.isIntersecting
    if (inView) start()
  }, { rootMargin: '30% 0px' }).observe(root)
})()
</script>
<script src="note-end.js" defer></script>
</body>
</html>
