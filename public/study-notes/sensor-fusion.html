<style>
:root {

}

<script>
// ===== DRAWING HELPERS (keep these; add more in the content section if needed) =====
const C = {

  one: '#e4002b', two: '#c08a12', accent: '#1aa3c2', hi: '#6858e8',

const TAU = Math.PI * 2
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))

const seg = (p, a, b) => clamp((p - a) / (b - a))
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)

const backOut = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2) }
function rng (seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6d2b79f5) >>> 0
    let t = a
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

let ctx = null
let W = 0
let H = 0
let NARROW = false
let U = 1
let GA = 1
let FONT = 'system-ui, sans-serif'
let T = 0
let LIVE = false

const fz = (n) => Math.max(8.5, n * U)
const cycle = (period, offset = 0) => (T / period + offset) % 1
const pulse = (period = 1800, offset = 0) => (LIVE ? 0.5 + 0.5 * Math.sin(TAU * cycle(period, offset)) : 1)
const bob = (seed, amount = 2) => (LIVE ? Math.sin(T / 520 + seed) * amount : 0)
function A (a = 1) { ctx.globalAlpha = clamp(GA * a) }
function group (a, fn) {
  if (a <= 0) return
  const parent = GA
  GA = parent * a
  fn()
  GA = parent
}
function rgba (hex, a) {
  const n = parseInt(hex.slice(1), 16)
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`
}
function txt (s, x, y, o = {}) {
  const { size = 11, color = C.ink, align = 'left', weight = 500, mono = false, math = false, base = 'middle', alpha = 1 } = o
  if (math) return drawMath(s, x, y, { size: size * 1.12, color, align, weight, alpha, base })
  A(alpha)
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  ctx.fillStyle = color
  ctx.textAlign = align
  ctx.textBaseline = base
  ctx.fillText(s, x, y)
}
// Typeset a small maths expression: single letters italic, numbers and longer words upright,
// `_x` / `^x` (or `_{xy}`) as subscripts and superscripts.
function mathRuns (s) {
  const runs = []
  const push = (t, level) => {
    const re = /([A-Za-zα-ωΑ-Ω]+)|([^A-Za-zα-ωΑ-Ω]+)/g
    let m
    while ((m = re.exec(t))) {
      if (m[1]) {
        // A single letter straight after a number and a space is a unit (4 m), so it stays upright.
        const prev = runs[runs.length - 1]
        const unit = m[1].length === 1 && prev && prev.level === level && /\d\s$/.test(prev.t)
        runs.push({ t: m[1], italic: m[1].length < 3 && !unit, level })
      }
      else runs.push({ t: m[2], italic: false, level })
    }
  }
  let i = 0
  while (i < s.length) {
    const c = s[i]
    if ((c === '_' || c === '^') && i + 1 < s.length) {
      const level = c === '_' ? -1 : 1
      if (s[i + 1] === '{') {
        const j = s.indexOf('}', i + 2)
        push(s.slice(i + 2, j < 0 ? s.length : j), level)
        i = j < 0 ? s.length : j + 1
      } else {
        push(s[i + 1], level)
        i += 2
      }
    } else {
      let j = i
      while (j < s.length && s[j] !== '_' && s[j] !== '^') j++
      push(s.slice(i, j), 0)
      i = j
    }
  }
  return runs
}
function drawMath (s, x, y, o) {
  const runs = mathRuns(s)
  const fontFor = (r) => `${r.italic ? 'italic ' : ''}${o.weight} ${r.level ? o.size * 0.68 : o.size}px ${MATH}`
  let total = 0
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    r.w = ctx.measureText(r.t).width + (r.italic && !r.level ? o.size * 0.04 : 0)
    total += r.w
  })
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x
  A(o.alpha)
  ctx.fillStyle = o.color
  ctx.textAlign = 'left'
  ctx.textBaseline = o.base
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    ctx.fillText(r.t, cx, y + (r.level < 0 ? o.size * 0.3 : r.level > 0 ? -o.size * 0.36 : 0))
    cx += r.w
  })

function measure (s, size, weight = 500, mono = false) {
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  return ctx.measureText(s).width
}
function rr (x, y, w, h, r) {
  ctx.beginPath()
  ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r)
}
function line (x1, y1, x2, y2, color, w = 1, a = 1, dash = null) {
  A(a)
  ctx.strokeStyle = color
  ctx.lineWidth = w
  if (dash) ctx.setLineDash(dash)
  ctx.beginPath()
  ctx.moveTo(x1, y1)
  ctx.lineTo(x2, y2)
  ctx.stroke()
  if (dash) ctx.setLineDash([])
}
function dot (x, y, r, color, a = 1) {
  A(a)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.arc(x, y, Math.max(0.1, r), 0, TAU)
  ctx.fill()
}
function glow (x, y, r, color, a = 1) {
  A(a)
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4)
  g.addColorStop(0, rgba(color, 0.3))
  g.addColorStop(1, rgba(color, 0))
  ctx.fillStyle = g
  ctx.beginPath()
  ctx.arc(x, y, r * 4, 0, TAU)
  ctx.fill()
  dot(x, y, r, color, a)
  dot(x, y, r * 0.42, '#ffffff', a)
}
function softShadow (on) {
  ctx.shadowColor = on ? 'rgba(27,31,69,0.08)' : 'transparent'
  ctx.shadowBlur = on ? 14 : 0
  ctx.shadowOffsetY = on ? 4 : 0
}
function panel (x, y, w, h, a = 1, border = C.hi) {
  A(a)
  softShadow(true)
  rr(x, y, w, h, 12)
  ctx.fillStyle = C.surface
  ctx.fill()
  softShadow(false)
  ctx.strokeStyle = rgba(border, 0.4)
  ctx.lineWidth = 1
  ctx.stroke()
}
function qb (a, c, b, t) {
  const u = 1 - t
  return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }
}
// A glowing dot with a tail, arcing from a to b as t goes 0..1.
function flight (a, b, t, color, r = 2.4, lift = 40) {
  if (t <= 0 || t >= 1.25) return
  const c = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - lift }
  for (let k = 6; k >= 0; k--) {
    const tt = t - k * 0.04
    if (tt < 0 || tt > 1) continue
    const q = qb(a, c, b, ease(tt))
    if (k === 0) glow(q.x, q.y, r, color)
    else dot(q.x, q.y, r * (1 - k / 9), color, 0.45 * (1 - k / 7))
  }
}
function polyLen (pts) {
  const L = [0]
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y))
  return L
}
function along (pts, L, t) {
  const d = clamp(t) * L[L.length - 1]
  let i = 1
  while (i < L.length - 1 && L[i] < d) i++
  const s = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1)
  return { x: lerp(pts[i - 1].x, pts[i].x, s), y: lerp(pts[i - 1].y, pts[i].y, s) }
}
// Draws a path up to t (0..1) and returns its leading point.
function tracePath (pts, t, color, width = 2.2, a = 1) {
  const L = polyLen(pts)
  const total = L[L.length - 1] || 1
  for (let s = 1; s < pts.length; s++) {
    if (t * total < L[s - 1]) break
    const end = t * total < L[s] ? along(pts, L, t) : pts[s]

  }
  return along(pts, L, t)
}
// Looping: small dots travelling along a path.
function runner (pts, offset = 0, color = C.hi, alpha = 1, period = 2600) {
  if (!LIVE || alpha <= 0 || pts.length < 2) return
  const L = polyLen(pts)
  const t = cycle(period, offset)
  const fade = Math.sin(Math.PI * t) * alpha
  for (let k = 4; k >= 0; k--) {
    const tail = t - k * 0.018
    if (tail < 0) continue
    const q = along(pts, L, tail)
    dot(q.x, q.y, k ? 1.5 : 2.8, color, fade * (1 - k / 6))
  }

// Looping: an expanding ring.
function ripple (x, y, r0, r1, color, a = 1, period = 2000, offset = 0) {
  if (!LIVE || a <= 0) return
  const t = cycle(period, offset)
  A(a * (1 - t) * 0.55)
  ctx.beginPath()
  ctx.arc(x, y, lerp(r0, r1, t), 0, TAU)

  ctx.lineWidth = 1.4
  ctx.stroke()
}
function treeLayout (cx, top, w, h, depth = 3) {
  const lv = []
  for (let l = 0; l <= depth; l++) {
    const n = 1 << l
    lv.push(Array.from({ length: n }, (_, i) => ({ x: cx - w / 2 + (i + 0.5) * w / n, y: top + l * h / depth })))
  }
  return lv
}
const treePath = (lv, leaf) => lv.map((nodes, l) => nodes[leaf >> (lv.length - 1 - l)])
function drawTree (lv, a = 1, r = 2.2) {
  for (let l = 0; l < lv.length - 1; l++) {
    lv[l].forEach((n, i) => {
      line(n.x, n.y, lv[l + 1][2 * i].x, lv[l + 1][2 * i].y, C.faint, 1, a)
      line(n.x, n.y, lv[l + 1][2 * i + 1].x, lv[l + 1][2 * i + 1].y, C.faint, 1, a)
    })
  }
  lv.forEach((nodes) => nodes.forEach((n) => dot(n.x, n.y, r, C.faint, a)))
}
// A code listing. `active` is a line index and may be fractional, so the highlight can slide between lines.
function codeBlock (lines, x, y, w, h, active, a = 1) {
  panel(x, y, w, h, a, C.faint)
  const lh = Math.min(fz(22), (h - 20) / lines.length)
  const longest = Math.max(...lines.map((s) => s.length), 1)
  const size = Math.min(lh * 0.64, (w - 28) / (longest * 0.62))
  const top = y + (h - lh * lines.length) / 2
  const at = clamp(active, 0, lines.length - 1)
  A(a * 0.1)
  ctx.fillStyle = C.hi
  rr(x + 6, top + at * lh, w - 12, lh, 5)
  ctx.fill()
  lines.forEach((s, n) => {
    const on = Math.abs(n - at) < 0.5
    txt(s, x + 14, top + (n + 0.5) * lh, { size, mono: true, color: on ? C.ink : C.muted, weight: on ? 700 : 500, alpha: a })
  })
}

// ===== CONTENT: accelerometer + magnetometer sensor fusion =====
// One worked example: a drone rolled 20° right, pitched 10° nose up, facing 30° east of magnetic north.
// Body axes: x forward, y right, z down. Earth's field: 50 µT, dipping 60° below horizontal towards north.
// The accelerometer is treated as measuring gravity (pointing down), as in most tilt-compass write-ups.

const D2R = Math.PI / 180
const R2D = 180 / Math.PI
const G = 9.81
const BF = 50
const DIP = 60 * D2R
const FIELD = [BF * Math.cos(DIP), 0, BF * Math.sin(DIP)]
const EX = { roll: 20, pitch: 10, head: 30 }

// Readings in body axes for a given orientation: R(body→north-east-down) transposed times the vector.
function bodyReading (rollD, pitchD, headD, v) {
  const f = rollD * D2R
  const t = pitchD * D2R
  const s = headD * D2R
  const [cf, sf, ct, st, cs, ss] = [Math.cos(f), Math.sin(f), Math.cos(t), Math.sin(t), Math.cos(s), Math.sin(s)]
  const R = [
    [cs * ct, cs * st * sf - ss * cf, cs * st * cf + ss * sf],
    [ss * ct, ss * st * sf + cs * cf, ss * st * cf - cs * sf],
    [-st, ct * sf, ct * cf]
  ]
  return [0, 1, 2].map((j) => R[0][j] * v[0] + R[1][j] * v[1] + R[2][j] * v[2])
}
const deg360 = (rad) => ((rad * R2D) % 360 + 360) % 360
const tiltFrom = (a) => ({ roll: Math.atan2(a[1], a[2]) * R2D, pitch: Math.atan2(-a[0], Math.hypot(a[1], a[2])) * R2D })
function compensate (m, rollD, pitchD) {
  const f = rollD * D2R
  const t = pitchD * D2R
  const Xh = m[0] * Math.cos(t) + m[1] * Math.sin(f) * Math.sin(t) + m[2] * Math.cos(f) * Math.sin(t)
  const Yh = m[1] * Math.cos(f) - m[2] * Math.sin(f)
  return { Xh, Yh, head: deg360(Math.atan2(-Yh, Xh)) }
}
const naiveHeading = (m) => deg360(Math.atan2(-m[1], m[0]))
const angleGap = (a, b) => Math.abs(((a - b + 540) % 360) - 180)

const ACC_ROLL = bodyReading(EX.roll, 0, EX.head, [0, 0, G])
const ACC = bodyReading(EX.roll, EX.pitch, EX.head, [0, 0, G])
const MAG_LEVEL = bodyReading(0, 0, EX.head, FIELD)
const MAG = bodyReading(EX.roll, EX.pitch, EX.head, FIELD)
const TILT = tiltFrom(ACC)
const COMP = compensate(MAG, TILT.roll, TILT.pitch)
const NAIVE = naiveHeading(MAG)
const BAD_TILT = compensate(MAG, TILT.roll + 5, TILT.pitch)
const f1 = (v) => v.toFixed(1)
const f2 = (v) => v.toFixed(2)
const v3 = (a, d = 2) => `(${a.map((v) => v.toFixed(d)).join(', ')})`

// Hard-iron offset: the readings circle is shifted by OFFSET (µT).
const OFFSET = [8, -5]
const HORIZ = BF * Math.cos(DIP)
const HARD_ERR = (() => {
  let worst = 0
  for (let h = 0; h < 360; h += 0.5) {
    const m = bodyReading(0, 0, h, FIELD)
    worst = Math.max(worst, angleGap(naiveHeading([m[0] + OFFSET[0], m[1] + OFFSET[1], m[2]]), h))
  }
  return worst
})()
const FWD_ACC = 2
const FAKE_PITCH = Math.atan(FWD_ACC / G) * R2D

// Complementary filter over 10 seconds of rolling about.
const ALPHA = 0.98
const GYRO_BIAS = 0.5
const CF = (() => {
  const r = rng(808)
  const g = () => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(TAU * r())
  const dt = 0.01
  const n = 1000
  const truth = (t) => 15 * Math.sin(TAU * t / 5) + 6 * Math.sin(TAU * t / 1.7)
  const rate = (t) => 15 * (TAU / 5) * Math.cos(TAU * t / 5) + 6 * (TAU / 1.7) * Math.cos(TAU * t / 1.7)
  const out = { t: [], truth: [], acc: [], gyro: [], fused: [] }
  let gyro = truth(0)
  let fused = truth(0)
  for (let i = 0; i <= n; i++) {
    const t = i * dt
    const acc = truth(t) + g() * 3
    const w = rate(t) + GYRO_BIAS + g() * 0.5
    if (i) {
      gyro += w * dt
      fused = ALPHA * (fused + w * dt) + (1 - ALPHA) * acc
    }
    out.t.push(t)
    out.truth.push(truth(t))
    out.acc.push(acc)
    out.gyro.push(gyro)
    out.fused.push(fused)
  }
  const rms = (key) => Math.sqrt(out[key].reduce((s, v, i) => s + (v - out.truth[i]) ** 2, 0) / out[key].length)
  out.rmsA = rms('acc')
  out.rmsG = rms('gyro')
  out.rmsF = rms('fused')
  out.drift = out.gyro[n] - out.truth[n]
  return out
})()

// Vibration jitter for the noise beat.
const JIT = (() => {
  const r = rng(31)
  return Array.from({ length: 80 }, () => (r() + r() + r() - 1.5) * 2)
})()

// ---------- shared pieces ----------
// The site's drone model, drawn by the 3D module at the end of the page once it has loaded.
function drone3d (x, y, size, pose, a = 1) {
  if (a <= 0 || !window.DRONE3D) return false
  A(a)
  window.DRONE3D.draw(ctx, x, y, size, { ...pose, spin: LIVE ? T : 0 })
  return true
}

function arrow (x1, y1, x2, y2, color, a = 1, w = 2) {
  if (a <= 0) return
  line(x1, y1, x2, y2, color, w, a)
  const ang = Math.atan2(y2 - y1, x2 - x1)
  const s = 5 + w * 1.5
  A(a)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.moveTo(x2, y2)
  ctx.lineTo(x2 - s * Math.cos(ang - 0.45), y2 - s * Math.sin(ang - 0.45))
  ctx.lineTo(x2 - s * Math.cos(ang + 0.45), y2 - s * Math.sin(ang + 0.45))
  ctx.closePath()
  ctx.fill()
}

function chip (s, x, y, color, a = 1, filled = false, size = fz(10.5)) {
  if (a <= 0) return
  const w = measure(s, size, 700, true) + 16
  const h = size + 10
  A(a)
  rr(x - w / 2, y - h / 2, w, h, h / 2)
  ctx.fillStyle = filled ? color : C.surface
  ctx.fill()
  ctx.strokeStyle = rgba(color, 0.5)
  ctx.lineWidth = 1
  ctx.stroke()
  txt(s, x, y, { size, mono: true, weight: 700, color: filled ? '#ffffff' : color, align: 'center', alpha: a })
}

function box (label, x, y, w, h, color, a = 1) {
  panel(x - w / 2, y - h / 2, w, h, a, color)
  txt(label, x, y, { size: fz(11), weight: 700, color, align: 'center', alpha: a })
}

// A board seen edge-on and tilted by `deg` (positive = right side or nose dips/raises as described).
// `side` names its horizontal axis. Returns screen directions of the board's horizontal and down axes.
function boardEdge (cx, cy, len, deg, a = 1, side = 'y', color = C.ink) {
  const t = deg * D2R
  const hx = Math.cos(t)
  const hy = side === 'y' ? Math.sin(t) : -Math.sin(t)
  const dx = -hy
  const dy = hx
  if (a > 0) {
    const pose = side === 'y' ? { view: 'rear', roll: deg } : { view: 'side', pitch: deg }
    if (!drone3d(cx, cy, len * 1.35, pose, a)) {
      A(a)
      ctx.save()
      ctx.translate(cx, cy)
      ctx.rotate(Math.atan2(hy, hx))
      softShadow(true)
      rr(-len / 2, -len * 0.06, len, len * 0.12, len * 0.04)
      ctx.fillStyle = color
      ctx.fill()
      softShadow(false)
      ctx.restore()
    }
    const ax = len * 0.42
    arrow(cx, cy, cx + hx * ax, cy + hy * ax, C.accent, a, 1.8)
    txt(side, cx + hx * (ax + 14), cy + hy * (ax + 14), { size: fz(12), math: true, color: C.accent, align: 'center', alpha: a })
    arrow(cx, cy, cx + dx * ax * 0.75, cy + dy * ax * 0.75, C.accent, a, 1.8)
    txt('z', cx + dx * (ax * 0.75 + 14), cy + dy * (ax * 0.75 + 14), { size: fz(12), math: true, color: C.accent, align: 'center', alpha: a })
  }
  return { h: { x: hx, y: hy }, d: { x: dx, y: dy } }
}

// Top-down compass: north up. Returns the screen centre and radius.
function compass (cx, cy, r, a = 1) {
  if (a <= 0) return
  A(a * 0.6)
  ctx.beginPath()
  ctx.arc(cx, cy, r, 0, TAU)
  ctx.strokeStyle = C.faint
  ctx.lineWidth = 1.2
  ctx.stroke()
  ;[['N', 0, -1], ['E', 1, 0], ['S', 0, 1], ['W', -1, 0]].forEach(([n, x, y]) => {
    txt(n, cx + x * (r + fz(12)), cy + y * (r + fz(12)), { size: fz(11), weight: 750, color: n === 'N' ? C.pink : C.dim, align: 'center', alpha: a })
  })
}

// A drone seen from above, facing heading `deg` clockwise from north.
function droneTop (cx, cy, s, deg, a = 1, color = C.ink) {
  if (a <= 0) return
  const t = deg * D2R
  const fx = Math.sin(t)
  const fy = -Math.cos(t)
  const rx = Math.cos(t)
  const ry = Math.sin(t)
  if (!drone3d(cx, cy, s * 3, { view: 'top', head: deg }, a)) {
    ;[[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([u, v]) => {
      const px = cx + (fx * u + rx * v) * s * 0.7
      const py = cy + (fy * u + ry * v) * s * 0.7
      line(cx, cy, px, py, color, 2.4, a)
      A(a * 0.6)
      ctx.beginPath()
      ctx.arc(px, py, s * 0.26, 0, TAU)
      ctx.strokeStyle = C.accent
      ctx.lineWidth = 1.6
      ctx.stroke()
    })
    A(a)
    ctx.fillStyle = color
    rr(cx - s * 0.18, cy - s * 0.18, s * 0.36, s * 0.36, 5)
    ctx.fill()
  }
  arrow(cx, cy, cx + fx * s * 1.2, cy + fy * s * 1.2, C.accent, a, 2)
  txt('x', cx + fx * s * 1.42, cy + fy * s * 1.42, { size: fz(12), math: true, color: C.accent, align: 'center', alpha: a })
  arrow(cx, cy, cx + rx * s * 0.9, cy + ry * s * 0.9, C.accent, a * 0.8, 1.6)
  txt('y', cx + rx * s * 1.1, cy + ry * s * 1.1, { size: fz(12), math: true, color: C.accent, align: 'center', alpha: a * 0.8 })
}

function readout (lines, x, y, a = 1, gap = fz(24)) {
  lines.forEach(([label, value, color], i) => {
    const la = typeof a === 'function' ? a(i) : a
    if (la <= 0) return
    txt(label, x, y + i * gap, { size: fz(11), color: C.muted, weight: 600, alpha: la })
    const isMath = /[=_]/.test(value)
    txt(value, x, y + i * gap + fz(14), isMath ? { size: fz(14), math: true, color: color || C.ink, alpha: la } : { size: fz(13), weight: 700, color: color || C.ink, alpha: la })
  })
}

// ---------- 01 · what the sensors feel ----------
function sceneSensors (p) {
  const intro = 1 - ease(seg(p, 1, 1.25))
  group(intro, () => {
    const icons = [['roll', 'tilt sideways'], ['pitch', 'nose up or down'], ['heading', 'which way it faces']]
    icons.forEach(([name, sub], i) => {
      const a = easeOut(seg(p, 0.1 + i * 0.15, 0.35 + i * 0.15))
      const cx = W * (0.2 + i * 0.3)
      const cy = H * 0.45
      const len = Math.min(W * 0.2, H * 0.3)
      const rock = LIVE ? Math.sin(T / 700 + i) * 18 : 15
      if (i < 2) boardEdge(cx, cy, len, rock, a, i === 0 ? 'y' : 'x')
      else droneTop(cx, cy, len * 0.32, 30 + rock * 2, a)
      txt(name, cx, H * 0.75, { size: fz(14), weight: 750, color: C.ink, align: 'center', alpha: a })
      txt(sub, cx, H * 0.75 + fz(18), { size: fz(10.5), color: C.muted, align: 'center', alpha: a })
    })
  })

  group(1 - intro, () => {
    const cx = W * 0.32
    const cy = H * 0.42
    const len = Math.min(W * 0.36, H * 0.5)
    boardEdge(cx, cy, len, 0, 1, 'x')
    txt(NARROW ? 'side view' : 'side view, nose to the right', cx, H * 0.1, { size: fz(11), color: C.muted, weight: 600, align: 'center' })
    const ga = easeOut(seg(p, 1.15, 1.4))
    arrow(cx + len * 0.6, cy - len * 0.25, cx + len * 0.6, cy + len * 0.45, C.ink, ga, 3)
    txt('gravity 9.81 m/s²', cx + len * 0.6 + 10, cy + len * 0.15, { size: fz(11.5), color: C.ink, weight: 700, alpha: ga })
    const ma = easeOut(seg(p, 2.1, 2.4))
    if (ma > 0) {
      const L = len * 0.65
      const sx = cx - len * 0.55
      const sy = cy - len * 0.35
      arrow(sx, sy, sx + Math.cos(DIP) * L, sy + Math.sin(DIP) * L, C.pink, ma, 3)
      txt('Earth’s field, 50 µT', sx - 4, sy - fz(12), { size: fz(11.5), color: C.pink, weight: 700, alpha: ma })
      txt('dips 60°', sx + Math.cos(DIP) * L * 0.5 + 12, sy + Math.sin(DIP) * L * 0.5 - 4, { size: fz(10.5), color: C.pink, mono: true, weight: 700, alpha: easeOut(seg(p, 2.3, 2.5)) })
      txt('north →', cx + len * 0.2, H * 0.9, { size: fz(11), color: C.pink, weight: 700, align: 'center', alpha: ma })
    }
    const ra = easeOut(seg(p, 3.05, 3.3))
    readout([
      ['accelerometer tells you', 'which way is down', C.ink],
      ['magnetometer tells you', 'which way is north', C.pink],
      ['together', 'the full orientation', C.green]
    ], W * 0.68, H * 0.24, (i) => ra * easeOut(seg(p, 3.05 + i * 0.15, 3.3 + i * 0.15)), fz(46))
  })
}

// ---------- 02 · roll and pitch from gravity ----------
function sceneTilt (p) {
  const toPitch = ease(seg(p, 3, 3.3))
  const toSpin = ease(seg(p, 4, 4.3))
  const cx = W * 0.3
  const cy = H * 0.45
  const len = Math.min(W * 0.36, H * 0.5)

  group((1 - toPitch), () => {
    const roll = lerp(0, EX.roll, ease(seg(p, 1.05, 1.5)))
    txt(NARROW ? 'rear view' : 'rear view, right wing to the right', cx, H * 0.08, { size: fz(11), color: C.muted, weight: 600, align: 'center' })
    const ax = boardEdge(cx, cy, len, roll, 1, 'y')
    const gl = len * 0.48
    arrow(cx, cy, cx, cy + gl, C.ink, 1, 3)
    txt('g', cx - 12, cy + gl * 0.8, { size: fz(13), math: true, color: C.ink, align: 'right' })
    const ca = easeOut(seg(p, 1.4, 1.7))
    if (ca > 0) {
      const ay = gl * Math.sin(roll * D2R)
      const az = gl * Math.cos(roll * D2R)
      line(cx, cy + gl, cx + ax.d.x * az, cy + ax.d.y * az, C.two, 1.6, ca, [4, 3])
      arrow(cx, cy, cx + ax.h.x * ay, cy + ax.h.y * ay, C.two, ca, 2.6)
      arrow(cx, cy, cx + ax.d.x * az, cy + ax.d.y * az, C.two, ca, 2.6)
    }
    const a = bodyReading(roll, 0, EX.head, [0, 0, G])
    readout([
      ['accelerometer reads', `a = ${v3(a)}`, C.two],
      ['roll', `φ = atan2(a_y, a_z) = ${f1(Math.atan2(a[1], a[2]) * R2D)}°`, C.green]
    ], W * 0.6, H * 0.3, (i) => (i === 0 ? 1 : easeOut(seg(p, 2.05, 2.3))), fz(50))
  })

  group(toPitch * (1 - toSpin), () => {
    const pitch = lerp(0, EX.pitch, ease(seg(p, 3.15, 3.5)))
    txt(NARROW ? 'side view' : 'side view, nose to the right', cx, H * 0.08, { size: fz(11), color: C.muted, weight: 600, align: 'center' })
    boardEdge(cx, cy, len, pitch, 1, 'x')
    arrow(cx, cy, cx, cy + len * 0.48, C.ink, 1, 3)
    readout([
      ['accelerometer reads', `a = ${v3(ACC)}`, C.two],
      ['pitch', `θ = atan2(−a_x, √(a_y² + a_z²)) = ${f1(TILT.pitch)}°`, C.green]
    ], W * 0.56, H * 0.3, (i) => (i === 0 ? 1 : easeOut(seg(p, 3.4, 3.6))), fz(50))
  })

  group(toSpin, () => {
    const spin = LIVE ? (T / 30) % 360 : 120
    compass(cx, cy, len * 0.48, 1)
    droneTop(cx, cy, len * 0.17, spin, 1)
    txt('top view', cx, H * 0.08, { size: fz(11), color: C.muted, weight: 600, align: 'center' })
    readout([
      ['heading', 'changing', C.accent],
      ['accelerometer reads', `a = ${v3(ACC_ROLL)}`, C.two],
      ['', 'no change at all', C.pink]
    ], W * 0.6, H * 0.26, 1, fz(50))
  })
}

// ---------- 03 · heading from the field ----------
function sceneHeading (p) {
  const cx = W * 0.3
  const cy = H * 0.47
  const r = Math.min(W * 0.2, H * 0.3)
  const toSide = ease(seg(p, 2, 2.25)) * (1 - ease(seg(p, 3, 3.25)))

  group(1 - toSide, () => {
    compass(cx, cy, r, 1)
    droneTop(cx, cy, r * 0.38, EX.head, 1)
    txt('top view', cx, H * 0.06, { size: fz(11), color: C.muted, weight: 600, align: 'center' })
    const fa = easeOut(seg(p, 0.15, 0.4))
    arrow(cx - r * 0.85, cy + r * 0.5, cx - r * 0.85, cy - r * 0.5, C.pink, fa * (p < 3 ? 1 : 0.4), 2.6)
    txt(NARROW ? 'field' : 'field, horizontal part', cx - r * 0.85, cy + r * 0.5 + fz(14), { size: fz(10.5), color: C.pink, weight: 700, align: 'center', alpha: fa * (p < 3 ? 1 : 0.4) })
    const level = p < 3
    readout(level
      ? [['magnetometer reads (µT)', `m = ${v3(MAG_LEVEL, 1)}`, C.pink], ['heading', `ψ = atan2(−m_y, m_x) = ${f1(naiveHeading(MAG_LEVEL))}°`, C.green]]
      : [['tilted drone reads (µT)', `m = ${v3(MAG, 1)}`, C.pink], ['same formula says', `ψ = ${f1(NAIVE)}°`, C.pink]],
    W * 0.58, H * 0.3, (i) => (level ? (i === 0 ? fa : easeOut(seg(p, 1.05, 1.3))) : easeOut(seg(p, 3.2 + i * 0.15, 3.45 + i * 0.15))), fz(50))
    const wa = easeOut(seg(p, 3.4, 3.65))
    if (wa > 0) {
      const t = NAIVE * D2R
      arrow(cx, cy, cx + Math.sin(t) * r * 0.95, cy - Math.cos(t) * r * 0.95, C.pink, wa, 2.4)
      txt(`${f1(angleGap(NAIVE, EX.head))}° wrong`, cx + Math.sin(t) * r * 0.95 - 8, cy - Math.cos(t) * r * 0.95 - fz(10), { size: fz(11), color: C.pink, weight: 700, align: 'right', alpha: wa })
    }
  })

  group(toSide, () => {
    const len = Math.min(W * 0.36, H * 0.5)
    boardEdge(cx, cy, len, 0, 1, 'x')
    txt('side view', cx, H * 0.06, { size: fz(11), color: C.muted, weight: 600, align: 'center' })
    const L = len * 0.75
    const sx = cx - len * 0.45
    const sy = cy - len * 0.4
    const ex = sx + Math.cos(DIP) * L
    const ey = sy + Math.sin(DIP) * L
    arrow(sx, sy, ex, ey, C.pink, 1, 3)
    line(sx, sy, ex, sy, C.pink, 1.4, 0.6, [4, 3])
    line(ex, sy, ex, ey, C.pink, 1.4, 0.6, [4, 3])
    txt(`${f1(MAG_LEVEL[2])} down`, ex + 8, (sy + ey) / 2, { size: fz(11), color: C.pink, mono: true, weight: 700 })
    txt(`${f1(HORIZ)} towards north`, (sx + ex) / 2, sy - fz(12), { size: fz(11), color: C.pink, mono: true, weight: 700, align: 'center' })
  })
}

// ---------- 04 · tilt compensation ----------
function sceneCompensate (p) {
  const cxs = NARROW ? [0.18, 0.5, 0.82] : [0.15, 0.42, 0.7]
  const row1 = H * 0.2
  const row2 = H * 0.46
  const bw = W * (NARROW ? 0.28 : 0.2)
  const bh = H * 0.11
  const step = (i) => easeOut(seg(p, 0.1 + i * 0.15, 0.35 + i * 0.15))
  box('accelerometer', W * cxs[0], row1, bw, bh, C.two, step(0))
  box('magnetometer', W * cxs[0], row2, bw, bh, C.pink, step(1))
  box(NARROW ? 'rotate' : 'rotate back to level', W * cxs[1], row2, bw, bh, C.hi, step(2))
  box('atan2', W * cxs[2], row2, bw * 0.7, bh, C.green, step(3))
  arrow(W * cxs[0] + bw / 2, row1, W * cxs[1], row2 - bh / 2 - 4, C.two, step(2), 1.6)
  txt(`φ = ${f1(TILT.roll)}°, θ = ${f1(TILT.pitch)}°`, W * (cxs[0] + cxs[1]) / 2 + W * 0.06, row1 - fz(4), { size: fz(13), math: true, color: C.two, alpha: step(2) })
  arrow(W * cxs[0] + bw / 2, row2, W * cxs[1] - bw / 2 - 4, row2, C.pink, step(2), 1.6)
  arrow(W * cxs[1] + bw / 2, row2, W * cxs[2] - bw * 0.35 - 4, row2, C.hi, step(3), 1.6)
  if (!NARROW) runner([{ x: W * cxs[0] + bw / 2, y: row2 }, { x: W * cxs[1] - bw / 2, y: row2 }], 0, C.pink, step(2), 1800)

  const na = easeOut(seg(p, 1.05, 1.35))
  txt(`X_h = ${f1(COMP.Xh)}`, W * cxs[1], row2 + bh / 2 + fz(22), { size: fz(14), math: true, color: C.hi, align: 'center', alpha: na })
  txt(`Y_h = ${f1(COMP.Yh)}`, W * cxs[1], row2 + bh / 2 + fz(44), { size: fz(14), math: true, color: C.hi, align: 'center', alpha: na })
  const ha = easeOut(seg(p, 2.05, 2.35))
  txt(`ψ = ${f1(COMP.head)}°`, W * cxs[2], row2 + bh / 2 + fz(30), { size: fz(20), math: true, color: C.green, align: 'center', alpha: ha })

  const cr = Math.min(W * 0.1, H * 0.14)
  const ccx = W * (NARROW ? 0.5 : 0.9)
  const ccy = H * (NARROW ? 0.8 : 0.42)
  if (!NARROW || ha > 0) {
    compass(ccx, ccy, cr, ha)
    if (ha > 0) {
      const t = COMP.head * D2R
      arrow(ccx, ccy, ccx + Math.sin(t) * cr * 0.95, ccy - Math.cos(t) * cr * 0.95, C.green, ha, 2.6)
    }
  }
  const ba = easeOut(seg(p, 3.05, 3.3))
  chip(`tilt 5° wrong → heading ${f1(angleGap(BAD_TILT.head, EX.head))}° wrong`, W / 2, H * 0.92, C.pink, ba, true)
}

// ---------- 05 · when sensors lie ----------
function sceneErrors (p) {
  const toMag = ease(seg(p, 2, 2.3))
  group(1 - toMag, () => {
    const cx = W * 0.3
    const cy = H * 0.42
    const len = Math.min(W * 0.36, H * 0.5)
    boardEdge(cx, cy, len, 0, 1, 'x')
    txt('side view, level but speeding up', cx, H * 0.07, { size: fz(11), color: C.muted, weight: 600, align: 'center' })
    const gl = len * 0.5
    const al = gl * FWD_ACC / G
    const a0 = easeOut(seg(p, 0.15, 0.4))
    arrow(cx, cy, cx, cy + gl, C.ink, 1, 3)
    arrow(cx, cy, cx - al, cy, C.two, a0, 2.6)
    txt('push of speeding up', cx - al - 6, cy - fz(12), { size: fz(10.5), color: C.two, weight: 700, align: 'right', alpha: a0 })
    const fa = easeOut(seg(p, 0.5, 0.8))
    arrow(cx, cy, cx - al, cy + gl, C.pink, fa, 2.6)
    txt(`looks tilted ${f1(FAKE_PITCH)}°`, cx - al - 8, cy + gl + fz(8), { size: fz(11.5), color: C.pink, weight: 700, align: 'right', alpha: fa })

    const va = easeOut(seg(p, 1.05, 1.3))
    if (va > 0) {
      const x0 = W * 0.58
      const x1 = W * 0.95
      const yc = H * 0.4
      txt('raw tilt reading, hovering', x0, yc - H * 0.14, { size: fz(10.5), color: C.muted, weight: 700, alpha: va })
      line(x0, yc, x1, yc, C.faint, 1, va, [4, 3])
      const reveal = Math.floor(JIT.length * ease(seg(p, 1.1, 1.8)))
      A(va)
      ctx.strokeStyle = C.two
      ctx.lineWidth = 1.6
      ctx.beginPath()
      for (let i = 0; i < reveal; i++) {
        const x = lerp(x0, x1, i / (JIT.length - 1))
        const y = yc - JIT[i] * H * 0.035
        if (i) ctx.lineTo(x, y)
        else ctx.moveTo(x, y)
      }
      ctx.stroke()
      txt('±3° of jitter', x1, yc + H * 0.14, { size: fz(10.5), color: C.two, mono: true, weight: 700, align: 'right', alpha: va })
    }
  })

  group(toMag, () => {
    const cx = W * 0.32
    const cy = H * 0.48
    const S = Math.min(W * 0.27, H * 0.38) / 40
    const P = (x, y) => ({ x: cx + x * S, y: cy - y * S })
    line(P(-40, 0).x, cy, P(40, 0).x, cy, C.faint, 1, 1)
    line(cx, P(0, -40).y, cx, P(0, 40).y, C.faint, 1, 1)
    txt('m_x', P(40, 0).x, cy + fz(14), { size: fz(11), math: true, color: C.muted, align: 'right' })
    txt('m_y', cx + 8, P(0, 40).y, { size: fz(11), math: true, color: C.muted })
    const fix = ease(seg(p, 3.1, 3.6))
    const off = { x: OFFSET[0] * (1 - fix), y: OFFSET[1] * (1 - fix) }
    const reveal = ease(seg(p, 2.15, 2.85))
    for (let k = 0; k < 48; k++) {
      if (k / 48 > reveal) break
      const h = (k / 48) * 360
      const m = bodyReading(0, 0, h, FIELD)
      const q = P(m[0] + off.x, m[1] + off.y)
      dot(q.x, q.y, 3, C.pink, 0.85)
    }
    const ca = easeOut(seg(p, 2.8, 3))
    if (ca > 0) {
      const c = P(off.x, off.y)
      line(c.x - 6, c.y, c.x + 6, c.y, C.ink, 2, ca)
      line(c.x, c.y - 6, c.x, c.y + 6, C.ink, 2, ca)
      txt(fix > 0.5 ? 'centred' : `centre (${OFFSET[0]}, ${OFFSET[1]}) µT`, c.x + 10, c.y - fz(12), { size: fz(10.5), color: C.ink, mono: true, weight: 700, alpha: ca })
    }
    readout([
      ['spin the level drone once', 'readings trace a circle', C.pink],
      ['uncorrected offset', `heading up to ${f1(HARD_ERR)}° wrong`, C.pink],
      ['after calibration', 'subtract the centre', C.green]
    ], W * 0.62, H * 0.22, (i) => easeOut(seg(p, 2.2 + i * 0.5, 2.45 + i * 0.5)) * (i === 2 ? seg(p, 3.05, 3.3) : 1), fz(50))
  })
}

// ---------- 06 · adding a gyroscope ----------
function sceneGyro (p) {
  const x0 = W * (NARROW ? 0.13 : 0.1)
  const x1 = W * 0.96
  const y0 = H * 0.12
  const y1 = H * 0.8
  const X = (t) => lerp(x0, x1, t / 10)
  const Y = (v) => lerp(y1, y0, (v + 30) / 60)
  ;[-20, 0, 20].forEach((v) => {
    line(x0, Y(v), x1, Y(v), C.faint, 1, v === 0 ? 0.9 : 0.4)
    txt(`${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v)}°`, x0 - 8, Y(v), { size: fz(10), color: C.dim, mono: true, align: 'right' })
  })
  for (let t = 0; t <= 10; t += 2) txt(`${t}`, X(t), y1 + fz(14), { size: fz(10), color: C.dim, mono: true, align: 'center' })
  txt('time (seconds)', (x0 + x1) / 2, y1 + fz(31), { size: fz(10.5), color: C.muted, align: 'center' })
  txt('roll angle', x0, y0 - fz(14), { size: fz(10.5), color: C.muted, weight: 700 })

  const curve = (key, t, color, width, a, step = 4, dash = null) => {
    if (a <= 0 || t <= 0) return
    const last = Math.floor(clamp(t) * (CF.t.length - 1))
    A(a)
    ctx.strokeStyle = color
    ctx.lineWidth = width
    if (dash) ctx.setLineDash(dash)
    ctx.beginPath()
    for (let i = 0; i <= last; i += step) {
      const q = { x: X(CF.t[i]), y: Y(CF[key][i]) }
      if (i) ctx.lineTo(q.x, q.y)
      else ctx.moveTo(q.x, q.y)
    }
    ctx.stroke()
    ctx.setLineDash([])
  }
  curve('truth', 1, C.ink, 1.6, 0.7, 4, [5, 4])
  txt('true angle', x1, Y(CF.truth[CF.t.length - 1]) + fz(14), { size: fz(10), color: C.ink, weight: 700, align: 'right', alpha: 0.7 })
  const dimOld = 1 - 0.6 * seg(p, 3, 3.2)
  curve('gyro', ease(seg(p, 0.15, 0.85)), C.pink, 2, dimOld)
  txt(`gyro alone: ${f1(CF.drift)}° off`, x1, Y(CF.gyro[CF.t.length - 1]) - fz(12), { size: fz(10.5), color: C.pink, weight: 700, align: 'right', alpha: easeOut(seg(p, 0.8, 1)) * dimOld })
  curve('acc', ease(seg(p, 1.1, 1.8)), C.two, 1.1, 0.75 * dimOld, 3)
  txt('accelerometer alone', x0 + 6, y0 + fz(4), { size: fz(10.5), color: C.two, weight: 700, alpha: easeOut(seg(p, 1.6, 1.8)) * dimOld })
  const fa = easeOut(seg(p, 2.1, 2.3))
  txt('angle = 0.98 × (angle + ω Δt) + 0.02 × accelerometer angle', W / 2, H * 0.95, { size: fz(NARROW ? 11 : 14), math: true, color: C.green, align: 'center', alpha: fa })
  curve('fused', ease(seg(p, 2.3, 3)), C.green, 2.6, 1)
  const ra = easeOut(seg(p, 3.1, 3.3))
  chip(`typical error ${f1(CF.rmsF)}°`, X(5), Y(-25), C.green, ra, true)
}

// ---------- 07 · on the drone ----------
function sceneDrone (p) {
  const toTilt = ease(seg(p, 1, 1.25)) * (1 - ease(seg(p, 2, 2.25)))
  const toMount = ease(seg(p, 2, 2.25)) * (1 - ease(seg(p, 3, 3.25)))
  const toYaw = ease(seg(p, 3, 3.25))

  group(1 - Math.max(toTilt, toMount, toYaw), () => {
    const names = NARROW ? ['gyro', 'accel', 'mag'] : ['gyroscope', 'accelerometer', 'magnetometer']
    const cols = [C.pink, C.two, C.hi]
    const bw = W * 0.22
    const bh = H * 0.1
    names.forEach((n, i) => {
      const a = easeOut(seg(p, 0.1 + i * 0.1, 0.35 + i * 0.1))
      const y = H * (0.25 + i * 0.2)
      box(n, W * 0.15, y, bw, bh, cols[i], a)
      arrow(W * 0.15 + bw / 2 + 4, y, W * 0.4, H * 0.45, C.faint, a, 1.4)
      runner([{ x: W * 0.15 + bw / 2, y }, { x: W * 0.4, y: H * 0.45 }], i * 0.3, cols[i], a, 900)
    })
    const fa = easeOut(seg(p, 0.45, 0.7))
    box('fusion', W * 0.47, H * 0.45, W * 0.14, H * 0.13, C.green, fa)
    arrow(W * 0.54 + 4, H * 0.45, W * 0.64, H * 0.45, C.green, fa, 1.6)
    readout([['attitude', 'φ, θ, ψ', C.green]], W * 0.66, H * 0.4, fa)
    const pa = easeOut(seg(p, 0.65, 0.9))
    box(NARROW ? 'PID' : 'PID loops', W * 0.86, H * 0.45, W * 0.15, H * 0.11, C.accent, pa)
  })

  group(toTilt, () => {
    const cx = W * 0.35
    const cy = H * 0.45
    const len = Math.min(W * 0.4, H * 0.55)
    const drift = LIVE ? (T / 18) % (W * 0.3) : W * 0.1
    boardEdge(cx + drift, cy, len, 3, 1, 'y')
    arrow(cx + drift + len * 0.55, cy - len * 0.3, cx + drift + len * 0.85, cy - len * 0.3, C.pink, 1, 2.4)
    readout([
      ['estimate is wrong by', '3°', C.pink],
      ['so it holds a 3° tilt and', `drifts at ${f1(G * Math.tan(3 * D2R))} m/s²`, C.pink]
    ], W * 0.62, H * 0.62, 1, fz(48))
  })

  group(toMount, () => {
    const cx = W * 0.3
    const cy = H * 0.47
    const s = Math.min(W * 0.11, H * 0.16)
    droneTop(cx, cy, s, 0, 1)
    A(0.9)
    ctx.fillStyle = C.two
    rr(cx - s * 0.5, cy + s * 0.25, s, s * 0.35, 4)
    ctx.fill()
    txt('battery', cx, cy + s * 0.42, { size: fz(9.5), color: '#ffffff', weight: 700, align: 'center' })
    const mx = cx + s * 1.9
    const my = cy - s * 1.3
    line(cx, cy, mx, my, C.faint, 2, 1)
    dot(mx, my, 7, C.hi, 1)
    txt(NARROW ? 'mag on a mast' : 'magnetometer raised on a mast', mx + 12, my, { size: fz(11), color: C.hi, weight: 700 })
    ripple(cx, cy + s * 0.42, 6, s * 1.1, C.two, 1, 1800)
    txt(NARROW ? 'big currents' : 'large currents disturb the field', cx, cy + s * 1.5, { size: fz(10.5), color: C.two, weight: 700, align: 'center' })
    const spin = LIVE ? (T / 12) % 360 : 60
    const ccx = W * 0.78
    const ccy = H * 0.72
    compass(ccx, ccy, Math.min(W * 0.08, H * 0.11), 1)
    droneTop(ccx, ccy, Math.min(W * 0.03, H * 0.045), spin, 1)
    txt(NARROW ? 'calibrate' : 'calibrate: rotate through every direction', ccx, H * 0.48, { size: fz(10.5), color: C.muted, weight: 700, align: 'center' })
  })

  group(toYaw, () => {
    const centres = [W * 0.28, W * 0.72]
    const r = Math.min(W * 0.17, H * 0.26)
    const drift = 25 * ease(seg(p, 3.2, 3.9))
    ;[['without magnetometer', C.pink, drift], ['with magnetometer', C.green, 0]].forEach(([name, col, err], i) => {
      const cx = centres[i]
      const cy = H * 0.47
      compass(cx, cy, r, 1)
      const t = (EX.head + err) * D2R
      arrow(cx, cy, cx + Math.sin(t) * r * 0.95, cy - Math.cos(t) * r * 0.95, col, 1, 2.6)
      const tt = EX.head * D2R
      line(cx, cy, cx + Math.sin(tt) * r, cy - Math.cos(tt) * r, C.ink, 1.2, 0.5, [4, 3])
      txt(NARROW ? (i ? 'with mag' : 'no mag') : name, cx, cy + r + fz(30), { size: fz(12), weight: 700, color: col, align: 'center' })
      if (i === 0) txt(`heading drifts ${f1(err)}°`, cx, cy + r + fz(48), { size: fz(10.5), color: C.pink, mono: true, weight: 700, align: 'center' })
    })
  })
}

      { text: `Roll the drone ${EX.roll}° to the right. Gravity still points straight down, but the drone’s axes have turned, so gravity now splits between them: ${f2(ACC_ROLL[1])} on y and ${f2(ACC_ROLL[2])} on z.` },
      { text: `The angle comes back with atan2, the two-argument arctangent, which gives the angle of an arrow from its two parts. Here atan2(${f2(ACC_ROLL[1])}, ${f2(ACC_ROLL[2])}) = ${EX.roll}°, the roll, written <i>φ</i> (phi).` },

      { text: `Calibration finds the centre of that circle, <i>c</i>, and subtracts it. Left uncorrected, this offset gives heading errors of up to ${f1(HARD_ERR)}°. Nearby metal can also squash the circle into an ellipse, called soft-iron distortion, which needs a scaling step as well.` }

  },
  {

    where: [

const SIZE = 640
try {
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true })
  renderer.setPixelRatio(1)
  renderer.setSize(SIZE, SIZE, false)
  renderer.outputColorSpace = THREE.SRGBColorSpace
  const scene = new THREE.Scene()
  scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa0bd, 2.4))
  const sun = new THREE.DirectionalLight(0xffffff, 2.4)
  sun.position.set(2, 5, 3)
  scene.add(sun)
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 30)
  const holder = new THREE.Group()
  holder.matrixAutoUpdate = false
  scene.add(holder)

  const gltf = await new GLTFLoader().loadAsync('../models/drone.glb')
  const model = gltf.scene
  const box = new THREE.Box3().setFromObject(model)
  const size = box.getSize(new THREE.Vector3())
  model.position.sub(box.getCenter(new THREE.Vector3()))
  const inner = new THREE.Group()
  inner.add(model)
  inner.scale.setScalar(1.7 / Math.max(size.x, size.y, size.z))
  holder.add(inner)
  const rotors = []
  model.traverse((o) => { if (o.isMesh && /Rotor_/i.test(o.name)) rotors.push(o) })

  const VIEWS = {
    rear: { pos: [0, 0, 6], up: [0, 1, 0] },
    side: { pos: [6, 0, 0], up: [0, 1, 0] },
    top: { pos: [0, 6, 0], up: [0, 0, -1] },
    iso: { pos: [3.4, 2.6, 4.2], up: [0, 1, 0] }
  }
  const D2R = Math.PI / 180

  // World matrix = (north-east-down → three) · R(body → north-east-down) · (model → body).
  function orient (rollD, pitchD, headD) {
    const [f, t, s] = [rollD * D2R, pitchD * D2R, headD * D2R]
    const [cf, sf, ct, st, cs, ss] = [Math.cos(f), Math.sin(f), Math.cos(t), Math.sin(t), Math.cos(s), Math.sin(s)]
    const R = [
      [cs * ct, cs * st * sf - ss * cf, cs * st * cf + ss * sf],
      [ss * ct, ss * st * sf + cs * cf, ss * st * cf - cs * sf],
      [-st, ct * sf, ct * cf]
    ]
    const col = (j, sign) => [R[0][j] * sign, R[1][j] * sign, R[2][j] * sign]
    const toThree = ([n, e, d]) => [e, -d, -n]
    const mx = toThree(col(1, -1)) // model +X is the drone's left: −right
    const my = toThree(col(2, -1)) // model +Y is up: −down
    const mz = toThree(col(0, 1)) // model +Z is the nose: forward
    holder.matrix.set(
      mx[0], my[0], mz[0], 0,
      mx[1], my[1], mz[1], 0,
      mx[2], my[2], mz[2], 0,
      0, 0, 0, 1
    )
    holder.matrixWorldNeedsUpdate = true
  }

  window.DRONE3D = {
    draw (ctx, x, y, size, { view = 'iso', roll = 0, pitch = 0, head = 0, spin = 0 } = {}) {
      orient(roll, pitch, head)
      const v = VIEWS[view] || VIEWS.iso
      camera.position.set(...v.pos)
      camera.up.set(...v.up)
      camera.lookAt(0, 0, 0)
      rotors.forEach((r) => { r.rotation.y = spin * 0.04 })
      renderer.render(scene, camera)
      ctx.drawImage(renderer.domElement, x - size / 2, y - size / 2, size, size)
    }
  }
  window.dispatchEvent(new Event('scene-assets'))
} catch (err) {
  console.warn('3D drone unavailable, using the flat drawing instead.', err)
}
</script>
<script src="note-end.js" defer></script>
</body>
</html>
