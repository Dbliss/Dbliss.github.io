<script>
// ===== DRAWING HELPERS (keep these; add more in the content section if needed) =====
const C = {
  ink: '#111632', muted: '#626980', dim: '#8a90ad', faint: '#c9cde0',
  one: '#e4002b', two: '#c08a12', accent: '#1aa3c2', hi: '#6858e8',
  green: '#0e9f6e', pink: '#d63d8f', surface: '#ffffff', track: 'rgba(17,22,50,0.07)'

const MONO = "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
const MATH = 'KaTeX_Main, "Cambria Math", "STIX Two Math", "Latin Modern Math", "Times New Roman", serif'
const TAU = Math.PI * 2
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const lerp = (a, b, t) => a + (b - a) * t
const seg = (p, a, b) => clamp((p - a) / (b - a))
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2)
const easeOut = (t) => 1 - Math.pow(1 - t, 3)
const backOut = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2) }
function rng (seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6d2b79f5) >>> 0
    let t = a
    t = Math.imul(t ^ (t >>> 15), t | 1)
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}

let ctx = null
let W = 0
let H = 0
let NARROW = false
let U = 1
let GA = 1
let FONT = 'system-ui, sans-serif'
let T = 0
let LIVE = false

const fz = (n) => Math.max(8.5, n * U)
const cycle = (period, offset = 0) => (T / period + offset) % 1
const pulse = (period = 1800, offset = 0) => (LIVE ? 0.5 + 0.5 * Math.sin(TAU * cycle(period, offset)) : 1)
const bob = (seed, amount = 2) => (LIVE ? Math.sin(T / 520 + seed) * amount : 0)
function A (a = 1) { ctx.globalAlpha = clamp(GA * a) }
function group (a, fn) {
  if (a <= 0) return
  const parent = GA
  GA = parent * a
  fn()
  GA = parent
}
function rgba (hex, a) {
  const n = parseInt(hex.slice(1), 16)
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`
}
function txt (s, x, y, o = {}) {
  const { size = 11, color = C.ink, align = 'left', weight = 500, mono = false, math = false, base = 'middle', alpha = 1 } = o
  if (math) return drawMath(s, x, y, { size: size * 1.12, color, align, weight, alpha, base })
  A(alpha)
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  ctx.fillStyle = color
  ctx.textAlign = align
  ctx.textBaseline = base
  ctx.fillText(s, x, y)
}
// Typeset a small maths expression: single letters italic, numbers and longer words upright,
// `_x` / `^x` (or `_{xy}`) as subscripts and superscripts.
function mathRuns (s) {
  const runs = []
  const push = (t, level) => {
    const re = /([A-Za-zα-ωΑ-Ω]+)|([^A-Za-zα-ωΑ-Ω]+)/g
    let m
    while ((m = re.exec(t))) {
      if (m[1]) {
        // A single letter straight after a number and a space is a unit (4 m), so it stays upright.
        const prev = runs[runs.length - 1]
        const unit = m[1].length === 1 && prev && prev.level === level && /\d\s$/.test(prev.t)
        runs.push({ t: m[1], italic: m[1].length < 3 && !unit, level })
      }
      else runs.push({ t: m[2], italic: false, level })
    }
  }
  let i = 0
  while (i < s.length) {
    const c = s[i]
    if ((c === '_' || c === '^') && i + 1 < s.length) {
      const level = c === '_' ? -1 : 1
      if (s[i + 1] === '{') {
        const j = s.indexOf('}', i + 2)
        push(s.slice(i + 2, j < 0 ? s.length : j), level)
        i = j < 0 ? s.length : j + 1
      } else {
        push(s[i + 1], level)
        i += 2
      }
    } else {
      let j = i
      while (j < s.length && s[j] !== '_' && s[j] !== '^') j++
      push(s.slice(i, j), 0)
      i = j
    }
  }
  return runs
}
function drawMath (s, x, y, o) {
  const runs = mathRuns(s)
  const fontFor = (r) => `${r.italic ? 'italic ' : ''}${o.weight} ${r.level ? o.size * 0.68 : o.size}px ${MATH}`
  let total = 0
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    r.w = ctx.measureText(r.t).width + (r.italic && !r.level ? o.size * 0.04 : 0)
    total += r.w
  })
  let cx = o.align === 'center' ? x - total / 2 : o.align === 'right' ? x - total : x
  A(o.alpha)
  ctx.fillStyle = o.color
  ctx.textAlign = 'left'
  ctx.textBaseline = o.base
  runs.forEach((r) => {
    ctx.font = fontFor(r)
    ctx.fillText(r.t, cx, y + (r.level < 0 ? o.size * 0.3 : r.level > 0 ? -o.size * 0.36 : 0))
    cx += r.w
  })

// Stacked maths lines for derivations and slow worked examples. The newest revealed line is highlighted.
function formulaSteps (lines, x, y, shown, o = {}) {
  const { size = fz(15), gap = fz(30), align = 'left' } = o
  lines.forEach((s, i) => {
    const a = clamp(shown - i)
    if (a <= 0) return
    const current = shown - i < 2 && i === Math.min(lines.length - 1, Math.ceil(shown) - 1)
    txt(s, x, y + i * gap, { size, math: true, color: current ? C.hi : C.ink, align, alpha: easeOut(a) * (current ? 1 : 0.75) })
  })
}
function measure (s, size, weight = 500, mono = false) {
  ctx.font = `${weight} ${size}px ${mono ? MONO : FONT}`
  return ctx.measureText(s).width
}
function rr (x, y, w, h, r) {
  ctx.beginPath()
  ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r)

function line (x1, y1, x2, y2, color, w = 1, a = 1, dash = null) {
  A(a)
  ctx.strokeStyle = color
  ctx.lineWidth = w
  if (dash) ctx.setLineDash(dash)
  ctx.beginPath()
  ctx.moveTo(x1, y1)
  ctx.lineTo(x2, y2)
  ctx.stroke()
  if (dash) ctx.setLineDash([])
}
function dot (x, y, r, color, a = 1) {
  A(a)
  ctx.fillStyle = color
  ctx.beginPath()
  ctx.arc(x, y, Math.max(0.1, r), 0, TAU)
  ctx.fill()
}
function glow (x, y, r, color, a = 1) {
  A(a)
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4)
  g.addColorStop(0, rgba(color, 0.3))
  g.addColorStop(1, rgba(color, 0))
  ctx.fillStyle = g
  ctx.beginPath()
  ctx.arc(x, y, r * 4, 0, TAU)
  ctx.fill()
  dot(x, y, r, color, a)
  dot(x, y, r * 0.42, '#ffffff', a)
}
function softShadow (on) {
  ctx.shadowColor = on ? 'rgba(27,31,69,0.08)' : 'transparent'
  ctx.shadowBlur = on ? 14 : 0
  ctx.shadowOffsetY = on ? 4 : 0
}
function panel (x, y, w, h, a = 1, border = C.hi) {
  A(a)
  softShadow(true)
  rr(x, y, w, h, 12)
  ctx.fillStyle = C.surface
  ctx.fill()
  softShadow(false)
  ctx.strokeStyle = rgba(border, 0.4)
  ctx.lineWidth = 1
  ctx.stroke()
}
function qb (a, c, b, t) {
  const u = 1 - t
  return { x: u * u * a.x + 2 * u * t * c.x + t * t * b.x, y: u * u * a.y + 2 * u * t * c.y + t * t * b.y }
}
// A glowing dot with a tail, arcing from a to b as t goes 0..1.
function flight (a, b, t, color, r = 2.4, lift = 40) {
  if (t <= 0 || t >= 1.25) return
  const c = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - lift }
  for (let k = 6; k >= 0; k--) {
    const tt = t - k * 0.04
    if (tt < 0 || tt > 1) continue
    const q = qb(a, c, b, ease(tt))
    if (k === 0) glow(q.x, q.y, r, color)
    else dot(q.x, q.y, r * (1 - k / 9), color, 0.45 * (1 - k / 7))
  }
}
function polyLen (pts) {
  const L = [0]
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y))
  return L
}
function along (pts, L, t) {
  const d = clamp(t) * L[L.length - 1]
  let i = 1
  while (i < L.length - 1 && L[i] < d) i++
  const s = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1)
  return { x: lerp(pts[i - 1].x, pts[i].x, s), y: lerp(pts[i - 1].y, pts[i].y, s) }
}
// Draws a path up to t (0..1) and returns its leading point.
function tracePath (pts, t, color, width = 2.2, a = 1) {
  const L = polyLen(pts)
  const total = L[L.length - 1] || 1
  for (let s = 1; s < pts.length; s++) {
    if (t * total < L[s - 1]) break
    const end = t * total < L[s] ? along(pts, L, t) : pts[s]

  }
  return along(pts, L, t)
}
// Looping: small dots travelling along a path.
function runner (pts, offset = 0, color = C.hi, alpha = 1, period = 2600) {
  if (!LIVE || alpha <= 0 || pts.length < 2) return
  const L = polyLen(pts)
  const t = cycle(period, offset)
  const fade = Math.sin(Math.PI * t) * alpha
  for (let k = 4; k >= 0; k--) {
    const tail = t - k * 0.018
    if (tail < 0) continue
    const q = along(pts, L, tail)
    dot(q.x, q.y, k ? 1.5 : 2.8, color, fade * (1 - k / 6))
  }
}
// Looping: an expanding ring.
function ripple (x, y, r0, r1, color, a = 1, period = 2000, offset = 0) {
  if (!LIVE || a <= 0) return
  const t = cycle(period, offset)
  A(a * (1 - t) * 0.55)
  ctx.beginPath()
  ctx.arc(x, y, lerp(r0, r1, t), 0, TAU)
  ctx.strokeStyle = color
  ctx.lineWidth = 1.4
  ctx.stroke()
}
function treeLayout (cx, top, w, h, depth = 3) {
  const lv = []
  for (let l = 0; l <= depth; l++) {
    const n = 1 << l
    lv.push(Array.from({ length: n }, (_, i) => ({ x: cx - w / 2 + (i + 0.5) * w / n, y: top + l * h / depth })))
  }
  return lv
}
const treePath = (lv, leaf) => lv.map((nodes, l) => nodes[leaf >> (lv.length - 1 - l)])
function drawTree (lv, a = 1, r = 2.2) {
  for (let l = 0; l < lv.length - 1; l++) {
    lv[l].forEach((n, i) => {
      line(n.x, n.y, lv[l + 1][2 * i].x, lv[l + 1][2 * i].y, C.faint, 1, a)
      line(n.x, n.y, lv[l + 1][2 * i + 1].x, lv[l + 1][2 * i + 1].y, C.faint, 1, a)
    })
  }
  lv.forEach((nodes) => nodes.forEach((n) => dot(n.x, n.y, r, C.faint, a)))
}
// A code listing. `active` is a line index and may be fractional, so the highlight can slide between lines.
function codeBlock (lines, x, y, w, h, active, a = 1) {
  panel(x, y, w, h, a, C.faint)
  const lh = Math.min(fz(22), (h - 20) / lines.length)
  const longest = Math.max(...lines.map((s) => s.length), 1)
  const size = Math.min(lh * 0.64, (w - 28) / (longest * 0.62))
  const top = y + (h - lh * lines.length) / 2
  const at = clamp(active, 0, lines.length - 1)
  A(a * 0.1)
  ctx.fillStyle = C.hi
  rr(x + 6, top + at * lh, w - 12, lh, 5)
  ctx.fill()
  lines.forEach((s, n) => {
    const on = Math.abs(n - at) < 0.5
    txt(s, x + 14, top + (n + 0.5) * lh, { size, mono: true, color: on ? C.ink : C.muted, weight: on ? 700 : 500, alpha: a })

}

// ===== CONTENT: Webhooks, HMAC signatures and idempotency =====
// One worked example: Shopify tells the Curated Wellness backend that order 1042 ($89.90) was paid,
// and a partner who referred the shopper earns 10% commission, $8.99. Every hash and signature on
// this page is computed live with a real SHA-256 and HMAC-SHA256, so the bits drawn are the true ones.

const ror = (x, n) => (x >>> n) | (x << (32 - n))
const sha256 = (() => {
  const primes = []
  for (let n = 2; primes.length < 64; n++) if (primes.every((q) => n % q)) primes.push(n)
  const frac = (x) => Math.floor((x - Math.floor(x)) * 4294967296) >>> 0
  const K = primes.map((q) => frac(Math.cbrt(q)))
  const H0 = primes.slice(0, 8).map((q) => frac(Math.sqrt(q)))
  return (msg) => {
    const bits = msg.length * 8
    const bytes = [...msg, 0x80]
    while (bytes.length % 64 !== 56) bytes.push(0)
    bytes.push(0, 0, 0, 0, (bits >>> 24) & 255, (bits >>> 16) & 255, (bits >>> 8) & 255, bits & 255)
    const h = H0.slice()
    const w = new Array(64)
    for (let off = 0; off < bytes.length; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = ((bytes[off + 4 * i] << 24) | (bytes[off + 4 * i + 1] << 16) | (bytes[off + 4 * i + 2] << 8) | bytes[off + 4 * i + 3]) >>> 0
      for (let i = 16; i < 64; i++) {
        const s0 = ror(w[i - 15], 7) ^ ror(w[i - 15], 18) ^ (w[i - 15] >>> 3)
        const s1 = ror(w[i - 2], 17) ^ ror(w[i - 2], 19) ^ (w[i - 2] >>> 10)
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0
      }
      let [a, b, c, d, e, f, g, hh] = h
      for (let i = 0; i < 64; i++) {
        const S1 = ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)
        const ch = (e & f) ^ (~e & g)
        const t1 = (hh + S1 + ch + K[i] + w[i]) >>> 0
        const S0 = ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)
        const maj = (a & b) ^ (a & c) ^ (b & c)
        const t2 = (S0 + maj) >>> 0
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0
      }
      ;[a, b, c, d, e, f, g, hh].forEach((v, k) => { h[k] = (h[k] + v) >>> 0 })
    }
    const out = []
    h.forEach((v) => out.push((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255))
    return out
  }
})()
const utf8 = (s) => Array.from(new TextEncoder().encode(s))
const hex = (b) => b.map((x) => x.toString(16).padStart(2, '0')).join('')
const b64 = (b) => btoa(String.fromCharCode(...b))
const bitsOf = (b) => b.flatMap((x) => [7, 6, 5, 4, 3, 2, 1, 0].map((k) => (x >> k) & 1))
function hmacParts (keyStr, msgStr) {
  let key = utf8(keyStr)
  if (key.length > 64) key = sha256(key)
  while (key.length < 64) key.push(0)
  const ipad = key.map((x) => x ^ 0x36)
  const opad = key.map((x) => x ^ 0x5c)
  const inner = sha256([...ipad, ...utf8(msgStr)])
  const outer = sha256([...opad, ...inner])
  return { key, ipad, opad, inner, outer }
}

const SECRET = 'my-app-secret'
const BODY = '{"id":1042,"total_price":"89.90"}'
const BODY_1 = '{"id":1042,"total_price":"89.91"}'
const FORGED = '{"id":1042,"total_price":"8990.00"}'
const RESTRUNG = '{"id": 1042, "total_price": "89.90"}'
const WEBHOOK_ID = 'b54557e4-bdd9-4b37-8a5f-bf7d70bcd043'
const H_BODY = sha256(utf8(BODY))
const H_BODY1 = sha256(utf8(BODY_1))
const FLIPS = bitsOf(H_BODY).filter((b, i) => b !== bitsOf(H_BODY1)[i]).length
const HM = hmacParts(SECRET, BODY)
const SIG = b64(HM.outer)
const SIG_FORGED_GUESS = b64(sha256(utf8(FORGED)))
const SIG_RESTRUNG = b64(hmacParts(SECRET, RESTRUNG).outer)
const fmtMoney = (v) => '$' + v.toFixed(2)

// ---------- shared drawing ----------
function tag (s, x, y, color, a = 1, align = 'left') {
  if (a <= 0) return
  const size = fz(11)
  const w = measure(s, size, 700, true) + 12
  const bx = align === 'left' ? x : align === 'right' ? x - w : x - w / 2
  A(a)
  ctx.fillStyle = '#ffffff'
  rr(bx, y - size * 0.95, w, size * 1.9, 6)
  ctx.fill()
  ctx.strokeStyle = rgba(color, 0.55)
  ctx.lineWidth = 1
  ctx.stroke()
  txt(s, bx + w / 2, y, { size, mono: true, weight: 700, color, align: 'center', alpha: a })
}
function box (x, y, w, h, title, sub, color, a = 1, lit = false) {
  if (a <= 0) return
  panel(x, y, w, h, a, lit ? color : C.faint)
  if (lit) {
    A(a * 0.1)
    ctx.fillStyle = color
    rr(x, y, w, h, 12)
    ctx.fill()
  }
  txt(title, x + w / 2, y + h / 2 - (sub ? fz(7) : 0), { size: fz(11.5), weight: 700, align: 'center', color: lit ? color : C.ink, alpha: a })
  if (sub) txt(sub, x + w / 2, y + h / 2 + fz(9), { size: fz(9.5), color: C.muted, align: 'center', alpha: a })
}
// A request card: method line, a few headers and the body.
function requestCard (x, y, w, lines, a = 1, border = C.faint) {
  if (a <= 0) return 0
  const size = Math.min(fz(10.5), (w - 20) / (Math.max(...lines.map((l) => l[0].length)) * 0.62))
  const lh = size * 1.6
  const h = lines.length * lh + 14
  panel(x, y, w, h, a, border)
  lines.forEach(([s, col], i) => txt(s, x + 10, y + 7 + (i + 0.5) * lh, { size, mono: true, color: col || C.ink, alpha: a }))
  return h
}
// 256 bits as a grid; `prev` lets cells cross-fade from another digest as `t` sweeps 0..1.
function bitGrid (bits, x, y, w, h, a = 1, prev = null, t = 1, color = C.ink) {
  const cols = 32
  const rows = bits.length / cols
  const cw = w / cols
  const ch = h / rows
  bits.forEach((b, i) => {
    const cx = x + (i % cols) * cw
    const cy = y + Math.floor(i / cols) * ch
    const done = prev ? clamp(t * bits.length - i) : 1
    const v = prev ? lerp(prev[i], b, done) : b
    const changed = prev && prev[i] !== b && done >= 1
    A(a)
    ctx.fillStyle = changed ? rgba(C.pink, 0.25 + 0.6 * v) : v > 0.5 ? rgba(color, 0.85) : rgba(color, 0.08)
    ctx.fillRect(cx + 0.5, cy + 0.5, cw - 1, ch - 1)
  })
}
function server (x, y, w, h, a = 1, lit = false, label = 'backend') {
  box(x, y, w, h, label, null, C.hi, a, lit)
}
function ledger (x, y, entries, a = 1) {
  const size = fz(11)
  entries.forEach((e, i) => {
    const g = e.t === undefined ? 1 : e.t
    if (g <= 0) return
    txt(e.s, x, y + i * size * 1.7, { size, mono: true, weight: 600, color: e.color || C.ink, alpha: a * g })
  })
}

// ---------- 1. webhooks ----------
function scenePush (p) {
  const sx = W * 0.06
  const bx = W * 0.62
  const bw = W * 0.32
  const sw = W * 0.26
  const y = H * 0.1
  const bh = fz(46)
  box(sx, y, sw, bh, 'Shopify', 'the store', C.two, 1)
  server(bx, y, bw, bh, 1)
  // polling
  const poll = 1 - easeOut(seg(p, 0.95, 1.2))
  for (let k = 0; k < 4; k++) {
    const t = seg(p, 0.1 + k * 0.2, 0.3 + k * 0.2)
    if (t > 0 && poll > 0) {
      line(bx, y + bh * 0.35, lerp(bx, sx + sw, t), y + bh * 0.35, C.muted, 1.2, poll * 0.7, [3, 3])
      if (t >= 1) txt(k < 3 ? 'anything new? no' : 'anything new? no', (sx + sw + bx) / 2, y + bh + fz(12) + k * fz(14), { size: fz(9.5), mono: true, color: C.muted, align: 'center', alpha: poll })
    }
  }
  // the webhook
  const ev = easeOut(seg(p, 1.05, 1.3))
  if (ev > 0) {
    tag('order 1042 paid', sx + sw / 2, y + bh + fz(16), C.two, ev, 'center')
    const fl = seg(p, 1.3, 1.9)
    flight({ x: sx + sw, y: y + bh / 2 }, { x: bx, y: y + bh / 2 }, fl, C.two, 3, 20)
    if (fl >= 1) line(sx + sw, y + bh / 2, bx, y + bh / 2, C.two, 2, 1)
  }
  const card = easeOut(seg(p, 2.05, 2.4))
  const ch = requestCard(W * 0.06, H * 0.36, W * 0.88, [
    ['POST /webhooks/orders-paid', C.hi],
    ['X-Shopify-Topic: orders/paid', C.muted],
    [`X-Shopify-Webhook-Id: ${WEBHOOK_ID.slice(0, 13)}…`, C.muted],
    [`X-Shopify-Hmac-Sha256: ${SIG.slice(0, 18)}…`, C.muted],
    ['', C.ink],
    [BODY, C.ink]
  ], card)
  const cr = easeOut(seg(p, 3.05, 3.4))
  tag('partner commission +$8.99', bx + bw / 2, H * 0.36 + ch + fz(24), C.green, cr, 'center')
  if (cr > 0) tag('200 OK', (sx + sw + bx) / 2, y + bh / 2 - fz(14), C.green, cr, 'center')
}

// ---------- 2. anyone can post ----------
function sceneForge (p) {
  const bx = W * 0.62
  const bw = W * 0.32
  const y = H * 0.1
  const bh = fz(46)
  server(bx, y, bw, bh, 1, p > 2 && p < 3)
  box(W * 0.06, y, W * 0.26, bh, 'Shopify', null, C.two, 1 - 0.5 * seg(p, 1, 1.2))
  const atk = easeOut(seg(p, 1.05, 1.4))
  box(W * 0.06, H * 0.3, W * 0.26, bh, 'anyone', 'a script', C.pink, atk, true)
  const url = easeOut(seg(p, 0.1, 0.5))
  tag('https://…/webhooks/orders-paid', bx + bw, y + bh + fz(16), C.muted, url, 'right')
  const fl = seg(p, 1.4, 1.95)
  flight({ x: W * 0.32, y: H * 0.3 + bh / 2 }, { x: bx, y: y + bh }, fl, C.pink, 3, 10)
  const card = easeOut(seg(p, 1.3, 1.6))
  requestCard(W * 0.06, H * 0.48, W * 0.88, [
    ['POST /webhooks/orders-paid', C.hi],
    ['X-Shopify-Topic: orders/paid', C.muted],
    ['', C.ink],
    [FORGED, C.pink]
  ], card, C.pink)
  const cred = easeOut(seg(p, 2.05, 2.4))
  tag('partner commission +$899.00', W / 2, H * 0.88, C.pink, cred, 'center')
}

// ---------- 3. a hash ----------
function sceneHash (p) {
  const gx = W * 0.06
  const gw = W * 0.88
  const gh = Math.min(H * 0.26, gw / 4)
  const gy = H * 0.3
  const a0 = easeOut(seg(p, 0, 0.3))
  txt(BODY, W / 2, H * 0.08, { size: NARROW ? 10.5 : fz(13), mono: true, align: 'center', alpha: a0 * (1 - seg(p, 1, 1.2)) })
  // edited body, with the changed character highlighted
  const ed = easeOut(seg(p, 1.05, 1.3))
  if (ed > 0) {
    const size = NARROW ? 10.5 : fz(13)
    const full = measure(BODY_1, size, 500, true)
    const pre = BODY_1.slice(0, BODY_1.length - 3)
    const x0 = W / 2 - full / 2
    txt(pre, x0, H * 0.08, { size, mono: true, alpha: ed })
    const px = x0 + measure(pre, size, 500, true)
    txt('1', px, H * 0.08, { size, mono: true, weight: 800, color: C.pink, alpha: ed })
    txt('"}', px + measure('1', size, 500, true), H * 0.08, { size, mono: true, alpha: ed })
  }
  const into = seg(p, 0.15, 0.6)
  flight({ x: W / 2, y: H * 0.11 }, { x: W / 2, y: gy }, into, C.hi, 3, -10)
  txt('SHA-256', W / 2, H * 0.2, { size: fz(12), weight: 750, align: 'center', color: C.hi, alpha: easeOut(seg(p, 0.1, 0.4)) })
  const b0 = bitsOf(H_BODY)
  const b1 = bitsOf(H_BODY1)
  const show = easeOut(seg(p, 0.45, 0.85))
  if (p < 1.05) bitGrid(b0, gx, gy, gw, gh, show)
  else bitGrid(b1, gx, gy, gw, gh, 1, b0, seg(p, 1.2, 1.9))
  const hx = p < 1.05 ? hex(H_BODY) : hex(H_BODY1)
  txt(hx.slice(0, NARROW ? 32 : 64), W / 2, gy + gh + fz(16), { size: NARROW ? 9.5 : fz(10), mono: true, color: C.muted, align: 'center', alpha: show })
  if (NARROW) txt(hx.slice(32), W / 2, gy + gh + fz(30), { size: 9.5, mono: true, color: C.muted, align: 'center', alpha: show })
  tag(`${FLIPS} of 256 bits flipped`, W / 2, gy + gh + fz(52), C.pink, easeOut(seg(p, 1.8, 2.05)), 'center')
  // anyone can compute it
  const anyone = easeOut(seg(p, 2.05, 2.4))
  if (anyone > 0) {
    box(W * 0.06, H * 0.84, W * 0.36, fz(40), 'anyone', 'hashes the forgery', C.pink, anyone, true)
    tag(`${b64(sha256(utf8(FORGED))).slice(0, 14)}…`, W * 0.94, H * 0.84 + fz(20), C.pink, anyone, 'right')
  }
}

// ---------- 4. HMAC ----------
function sceneHmac (p) {
  const n = NARROW ? 6 : 10
  const x0 = W * 0.06
  const cw = (W * 0.88) / n
  const rowY = [H * 0.1, H * 0.19, H * 0.28]
  const key = HM.key.slice(0, n)
  const a0 = easeOut(seg(p, 0.1, 0.5))
  const xorT = seg(p, 1.1, 1.8)
  const rows = [
    { label: 'key', bytes: key, color: C.two, a: a0 },
    { label: '0x36', bytes: key.map(() => 0x36), color: C.muted, a: easeOut(seg(p, 1.05, 1.3)) },
    { label: 'K ⊕ ipad', bytes: HM.ipad.slice(0, n), color: C.hi, a: 1 }
  ]
  txt(`secret: "${SECRET}", padded with zeros to 64 bytes`, x0, H * 0.04, { size: fz(10), mono: true, color: C.muted, alpha: a0 })
  rows.forEach((r, k) => {
    r.bytes.forEach((b, i) => {
      let a = r.a
      if (k === 2) a = clamp(xorT * n - i)
      if (a <= 0) return
      const x = x0 + i * cw
      const y = rowY[k]
      // eight bit cells per byte
      for (let bit = 0; bit < 8; bit++) {
        const v = (b >> (7 - bit)) & 1
        A(a)
        ctx.fillStyle = v ? rgba(r.color, 0.85) : rgba(r.color, 0.1)
        ctx.fillRect(x + 2 + bit * (cw - 6) / 8, y, (cw - 6) / 8 - 1, fz(12))
      }
      txt(b.toString(16).padStart(2, '0'), x + cw / 2, y + fz(22), { size: fz(9.5), mono: true, color: r.color, align: 'center', alpha: a })
    })
  })
  if (xorT > 0 && xorT < 1) {
    const i = Math.min(n - 1, Math.floor(xorT * n))
    A(0.15)
    ctx.fillStyle = C.hi
    ctx.fillRect(x0 + i * cw, rowY[0] - 4, cw, rowY[2] - rowY[0] + fz(28))
  }
  // nested hashes
  const flow = (t0) => easeOut(seg(p, t0, t0 + 0.3))
  const fy = H * 0.5
  const bw = W * 0.26
  const bh = fz(40)
  const xs = [W * 0.06, W * 0.37, W * 0.68]
  box(xs[0], fy, bw, bh, 'K ⊕ ipad ‖ body', null, C.hi, flow(2.05))
  box(xs[1], fy, bw, bh, 'SHA-256', 'inner', C.hi, flow(2.2), true)
  box(xs[2], fy, bw, bh, hex(HM.inner).slice(0, NARROW ? 6 : 12) + '…', 'inner hash', C.ink, flow(2.4))
  if (p > 2.05) {
    flight({ x: xs[0] + bw, y: fy + bh / 2 }, { x: xs[1], y: fy + bh / 2 }, seg(p, 2.1, 2.4), C.hi, 2.2, 10)
    flight({ x: xs[1] + bw, y: fy + bh / 2 }, { x: xs[2], y: fy + bh / 2 }, seg(p, 2.3, 2.6), C.hi, 2.2, 10)
  }
  const oy = H * 0.68
  box(xs[0], oy, bw, bh, 'K ⊕ opad ‖ inner', null, C.accent, flow(3.05))
  box(xs[1], oy, bw, bh, 'SHA-256', 'outer', C.accent, flow(3.2), true)
  box(xs[2], oy, bw, bh, 'signature', null, C.green, flow(3.4), true)
  if (p > 3.05) {
    flight({ x: xs[2] + bw / 2, y: fy + bh }, { x: xs[0] + bw / 2, y: oy }, seg(p, 3.05, 3.4), C.accent, 2.2, -10)
    flight({ x: xs[1] + bw, y: oy + bh / 2 }, { x: xs[2], y: oy + bh / 2 }, seg(p, 3.3, 3.6), C.green, 2.2, 10)
  }
  tag(`X-Shopify-Hmac-Sha256: ${NARROW ? SIG.slice(0, 16) + '…' : SIG}`, W / 2, H * 0.9, C.green, easeOut(seg(p, 3.6, 3.9)), 'center')
}

// ---------- 5. verifying ----------
function sceneVerify (p) {
  const x = W * 0.06
  const w = W * 0.88
  const rows = [
    { t: 0.1, body: BODY, header: SIG, computed: SIG, label: 'genuine', ok: true },
    { t: 1.05, body: FORGED, header: SIG_FORGED_GUESS, computed: b64(hmacParts(SECRET, FORGED).outer), label: 'forged', ok: false },
    { t: 2.05, body: RESTRUNG, header: SIG, computed: SIG_RESTRUNG, label: 're-serialised', ok: false }
  ]
  const rh = H * 0.27
  rows.forEach((r, k) => {
    const a = easeOut(seg(p, r.t, r.t + 0.3))
    if (a <= 0) return
    const y = H * 0.05 + k * rh
    const dim = p > rows[Math.min(2, k + 1)].t + 0.2 && k < 2 && p < 3 ? 0.45 : 1
    group(a * dim, () => {
      txt(r.label, x, y + fz(6), { size: fz(10.5), weight: 700, color: r.ok ? C.green : C.pink })
      txt(r.body, x, y + fz(24), { size: NARROW ? 9.5 : fz(11), mono: true })
      const hs = NARROW ? 18 : 30
      txt('header    ' + r.header.slice(0, hs) + '…', x, y + fz(44), { size: NARROW ? 9.5 : fz(10.5), mono: true, color: C.muted })
      const ca = easeOut(seg(p, r.t + 0.35, r.t + 0.65))
      txt('recomputed ' + r.computed.slice(0, hs) + '…', x, y + fz(62), { size: NARROW ? 9.5 : fz(10.5), mono: true, color: C.hi, alpha: ca })
      const v = easeOut(seg(p, r.t + 0.6, r.t + 0.85))
      tag(r.ok ? 'match: accept' : 'no match: 401', x + w, y + fz(6), r.ok ? C.green : C.pink, v, 'right')
    })
  })
  const te = easeOut(seg(p, 3.05, 3.4))
  tag('crypto.timingSafeEqual: always compares every byte', W / 2, H * 0.93, C.hi, te, 'center')
}

// ---------- 6. retries ----------
function sceneRetry (p) {
  const sx = W * 0.06
  const bx = W * 0.62
  const bw = W * 0.32
  const sw = W * 0.26
  const y = H * 0.08
  const bh = fz(46)
  box(sx, y, sw, bh, 'Shopify', null, C.two, 1)
  server(bx, y, bw, bh, 1)
  const tl = { x0: W * 0.08, x1: W * 0.92, y: H * 0.5 }
  line(tl.x0, tl.y, tl.x1, tl.y, C.faint, 1.5)

  else if (p < 3) active = 4

  codeBlock(CODE, cx, cy, cw, ch, active, 1)

  const refund = easeOut(seg(p, 3.3, 3.6))
  row('a7c0e2d1-…  refunds/create', 1, refund, C.accent)

}

// ---------- 8. one transaction ----------
function sceneTx (p) {
  const lanes = [
    { label: 'key, then credit', y: H * 0.14, parts: ['save key', 'crash', 'credit'], verdict: 'retry skipped: commission lost', bad: true, t: 0.1 },
    { label: 'credit, then key', y: H * 0.38, parts: ['credit', 'crash', 'save key'], verdict: 'retry credits again: paid twice', bad: true, t: 1.05 },
    { label: 'BEGIN … COMMIT', y: H * 0.62, parts: ['save key', 'credit', 'COMMIT'], verdict: 'all or nothing: exactly once', bad: false, t: 2.05 }
  ]
  const x0 = W * 0.06
  const cw = W * (NARROW ? 0.27 : 0.2)
  lanes.forEach((L, k) => {
    const a = easeOut(seg(p, L.t, L.t + 0.3))
    if (a <= 0) return
    txt(L.label, x0, L.y - fz(16), { size: fz(10.5), mono: true, weight: 700, color: L.bad ? C.ink : C.hi, alpha: a })
    L.parts.forEach((s, i) => {
      const f = easeOut(seg(p, L.t + 0.15 + i * 0.15, L.t + 0.4 + i * 0.15))
      const isCrash = s === 'crash'
      const after = L.bad && i === 2
      const x = x0 + i * (cw + fz(10))
      if (k === 2) {
        A(f * 0.1)
        ctx.fillStyle = C.hi
      }
      box(x, L.y - fz(4), cw, fz(30), s, null, isCrash ? C.pink : k === 2 ? C.hi : C.ink, f * (after ? 0.35 : 1), isCrash || (k === 2 && i === 2))
      if (after && f > 0) line(x + 6, L.y + fz(11), x + cw - 6, L.y + fz(11), C.pink, 1.6, f)
    })
    if (k === 2) {
      const brk = easeOut(seg(p, 2.6, 2.9))
      A(brk)
      ctx.strokeStyle = C.hi
      ctx.setLineDash([4, 3])
      ctx.lineWidth = 1.4
      rr(x0 - 6, L.y - fz(10), 3 * cw + 2 * fz(10) + 12, fz(42), 10)
      ctx.stroke()
      ctx.setLineDash([])
    }
    const v = easeOut(seg(p, L.t + 0.6, L.t + 0.9))
    tag(L.verdict, NARROW ? x0 : x0 + 3 * (cw + fz(10)) + fz(6), NARROW ? L.y + fz(42) : L.y + fz(11), L.bad ? C.pink : C.green, v)
  })
  tag('FrontRunner: retried publish jobs carry idempotency keys', W / 2, H * 0.9, C.accent, easeOut(seg(p, 3.05, 3.4)), 'center')
}

      { text: 'But anyone can run SHA-256. A forger simply hashes their own fake body and sends that hash along. A plain hash proves the body is intact, not who sent it.' }
    ]
  },
  {
    short: 'HMAC',
    title: 'HMAC: a hash with a secret inside',
    formula: String.raw`\operatorname{HMAC}(K, m) = H\big((K \oplus \text{opad}) \,\|\, H((K \oplus \text{ipad}) \,\|\, m)\big)`,
    where: [

      [String.raw`m`, String.raw`the message: the exact bytes of the body`],

      { text: 'Join that to the body and hash it. This inner hash already depends on the secret, so nobody without it can produce it.' },
      { text: `Do it once more with 0x5c and the inner hash. The result, written in base64 letters, goes in the X-Shopify-Hmac-Sha256 header. The second layer closes a gap where an attacker could otherwise lengthen a signed message.` }

function drawScene (context, index, p, { width, height, dpr, font }, time = 0) {
  ctx = context
  T = time
  LIVE = time > 0
  W = width
  H = height
  NARROW = width < 520
  U = clamp(Math.min(width, height) / 600, 0.55, 1.15)
  GA = 1
  if (font) FONT = font
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  ctx.globalAlpha = 1
  ctx.clearRect(0, 0, W, H)
  SCENES[index].draw(p)
}

      const el = make('div', 'pg')
      const list = make('ol', 'steps')
      el.append(make('span', 'chapter-cont mono', `${ch.num} · continued`), list)
      ch.pagesEl.append(el)
      ch.pages.push({ el, list })
    })
    groups.forEach((g, k) => g.forEach((i) => {
      if (k) ch.pages[k].list.append(ch.lis[i])
      ch.pageOf[i] = k
    }))
    applyPages(ch, true)
  }
  // How much of the previous page stays in view beside the stage before fading out.
  const GHOST_SHOWN = 0.5
  function applyPages (ch, force = false) {
    const cur = ch.pageOf[Math.max(0, ch.beat)] || 0
    if (!force && cur === ch.page) return
    ch.page = cur
    if (ch.pages.length < 2) {
      ch.col.style.translate = ''
      ch.pages.forEach(({ el }) => {
        el.style.translate = ''
        el.style.opacity = ''
        el.style.removeProperty('--fade')
        el.inert = false
      })
      return
    }
    const dir = ch.flip ? -1 : 1
    const stageW = ch.col.offsetWidth
    const copyW = ch.copy.offsetWidth
    const gap = Math.abs(ch.copy.offsetLeft - ch.col.offsetLeft) - (dir > 0 ? stageW : copyW)
    // The row pans as one: the stage moves across, the new page takes the side it left, and
    // the old page slides out beside the stage as a fading ghost. The whole row then shifts
    // away from the ghost, as far as the screen allows, so it stays balanced on screen.
    let shift = 0
    if (cur > 0) {
      const ghostSide = cur % 2 ? dir : -dir
      const rect = ch.el.getBoundingClientRect()
      const room = ghostSide > 0 ? rect.left : window.innerWidth - rect.right
      shift = -ghostSide * Math.min((gap + copyW * GHOST_SHOWN) / 2, Math.max(0, room - 16))
    }
    ch.col.style.translate = `${(cur % 2 ? dir * (copyW + gap) : 0) + shift}px 0`
    ch.pages.forEach(({ el }, k) => {
      const away = k % 2 === 1
      const base = (away ? -dir * (stageW + gap) : 0) + shift
      const out = away ? -dir : dir
      const s = el.style
      s.setProperty('--fade-dir', out > 0 ? '90deg' : '270deg')
      if (k === cur) {
        s.translate = `${base}px 0`
        s.opacity = '1'
        s.setProperty('--fade', '150%')
      } else if (k < cur) {
        s.translate = `${base + out * (copyW + gap)}px 0`
        s.opacity = k === cur - 1 ? '.75' : '0'
        s.setProperty('--fade', k === cur - 1 ? `${GHOST_SHOWN * 100}%` : '0%')
      } else {
        s.translate = `${base + out * 56}px 0`
        s.opacity = '0'
        s.setProperty('--fade', '150%')
      }
      el.inert = k !== cur
    })
  }

  function frame (now) {
    raf = 0
    if (!inView) { lastFrame = 0; return }
    const dt = lastFrame ? Math.min(64, now - lastFrame) : 16
    lastFrame = now
    const vh = window.innerHeight
    const rate = reduceMotion ? 1 : 1 - Math.exp(-dt / DAMPING_MS)
    let current = activeChapter

    chapters.forEach((ch, i) => {
      const rect = ch.el.getBoundingClientRect()
      if (rect.top < vh * 0.5 && rect.bottom > vh * 0.5) current = i
      const near = rect.bottom > -vh * 0.3 && rect.top < vh * 1.3
      if (near !== ch.near) {
        ch.near = near
        if (near) {
          sizeCanvas(ch)
        } else {
          ch.canvas.width = 0
          ch.canvas.height = 0
          ch.size = null
        }
      }
      if (!ch.seen && rect.top < vh * 0.9) {
        ch.seen = true
        ch.el.classList.add('seen')
      }
      if (!ch.started && rect.top < vh * START_LINE && rect.bottom > vh * 0.2) ch.started = true
      const visible = rect.top < vh * 0.8 && rect.bottom > vh * 0.2
      if (ch.started && visible && !reduceMotion && ch.time < ch.total) {
        ch.time = Math.min(ch.total, ch.time + dt)
      }
      const target = progressAt(ch)
      ch.shown += (target - ch.shown) * rate
      if (Math.abs(target - ch.shown) < 0.0004) ch.shown = target
      const beat = Math.min(ch.beatEls.length - 1, Math.floor(target))
      paintBeats(ch, beat, ch.time >= ch.total)
      ch.beatEls[beat].style.setProperty('--fill', (target - beat).toFixed(3))
      if (!near) return
      const looping = !reduceMotion && rect.bottom > 0 && rect.top < vh
      if (ch.size && (looping || ch.dirty || Math.abs(ch.shown - ch.drawn) > 0.0002)) {
        drawScene(ch.ctx, i, ch.shown, ch.size, reduceMotion ? 0 : now)
        ch.drawn = ch.shown
        ch.dirty = false
      }
    })

    if (current !== activeChapter) {
      activeChapter = current
      railItems.forEach((item, n) => item.classList.toggle('on', n === current))
    }
    const first = chapters[0].el.getBoundingClientRect()
    const last = chapters[chapters.length - 1].el.getBoundingClientRect()
    const shown = first.top < vh * 0.5 && last.bottom > vh * 0.5
    if (shown !== railShown) {
      railShown = shown
      rail.classList.toggle('shown', shown)
    }
    raf = requestAnimationFrame(frame)
  }
  function start () {
    if (!raf && inView) raf = requestAnimationFrame(frame)
  }

  // The opening is a stop of its own, so one scroll from it glides into the first chapter.
  function openingZone () {
    if (!opening) return []
    const bottom = opening.getBoundingClientRect().bottom + window.scrollY
    return [{ snap: 0, end: Math.max(0, bottom - window.innerHeight) }]
  }
  function zoneOf (ch) {
    const vh = window.innerHeight
    const rect = ch.el.getBoundingClientRect()
    const top = rect.top + window.scrollY
    const maxScroll = document.documentElement.scrollHeight - vh
    const snap = Math.min(maxScroll, Math.max(0, top - Math.max(SNAP_PADDING, (vh - rect.height) / 2)))
    const end = Math.min(maxScroll, Math.max(snap, top + rect.height + SNAP_PADDING - vh))
    return { snap, end }
  }
  // `force` lets the keyboard enter the story from anywhere above or below it.
  function nextStop (direction, force = false) {
    const y = window.scrollY
    const reach = window.innerHeight * ENTRY_REACH
    const zones = [...openingZone(), ...chapters.map(zoneOf)]
    if (direction > 0) {
      for (let i = 0; i < zones.length; i++) {
        if (y < zones[i].snap - SNAP_EPSILON) return i === 0 && !force && zones[i].snap - y > reach ? null : zones[i].snap
        if (y < zones[i].end - SNAP_EPSILON) return null
      }
      return null
    }
    for (let i = zones.length - 1; i >= 0; i--) {
      if (y > zones[i].end + SNAP_EPSILON) return i === zones.length - 1 && !force && y - zones[i].end > reach ? null : zones[i].end
      if (y > zones[i].snap + SNAP_EPSILON) return null
    }
    return null
  }
  function cancelGlide () {
    if (glideRaf) cancelAnimationFrame(glideRaf)
    glideRaf = 0
  }
  function glideTo (target) {
    cancelGlide()
    const from = window.scrollY
    const distance = Math.abs(target - from)
    if (distance < 2) return
    const duration = Math.min(MAX_GLIDE_MS, Math.max(MIN_GLIDE_MS, distance * GLIDE_MS_PER_PX + 500))
    const startedAt = performance.now()
    settling = true
    wheelTotal = 0
    const step = (now) => {
      const t = Math.min(1, Math.max(0, (now - startedAt) / duration))
      window.scrollTo({ top: from + (target - from) * ease(t), behavior: 'instant' })
      glideRaf = t < 1 ? requestAnimationFrame(step) : 0
    }
    glideRaf = requestAnimationFrame(step)
  }
  function onWheel (e) {
    if (e.ctrlKey || !e.deltaY || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return
    const delta = e.deltaMode === 1 ? e.deltaY * 32 : e.deltaMode === 2 ? e.deltaY * window.innerHeight : e.deltaY
    const size = Math.abs(delta)
    const now = performance.now()
    const gap = now - lastWheelAt
    const rising = size > 30 && size > lastWheelSize * 1.6
    lastWheelAt = now
    lastWheelSize = size
    if (glideRaf) { e.preventDefault(); return }
    if (gap > WHEEL_QUIET_MS) {
      settling = false
      wheelTotal = 0
    }
    if (settling) {
      if (!rising) { e.preventDefault(); return }
      settling = false
      wheelTotal = 0
    }
    const direction = Math.sign(delta)
    const target = nextStop(direction)
    if (target === null) return
    e.preventDefault()
    if (Math.sign(wheelTotal) !== direction) wheelTotal = 0
    wheelTotal += delta
    if (Math.abs(wheelTotal) >= WHEEL_THRESHOLD) glideTo(target)
  }
  // ← and → move between steps, continuing into the next or previous chapter at either end.
  function stepBy (dir) {
    const i = Math.max(0, activeChapter)
    const ch = chapters[i]
    if (activeChapter !== i) {
      jump(i)
      seek(i, 0)
      return
    }
    const n = ch.beatEls.length
    const current = ch.started ? Math.min(n - 1, Math.floor(progressAt(ch))) : -1
    const target = current + dir
    if (target >= n) {
      if (i + 1 < chapters.length) {
        jump(i + 1)
        seek(i + 1, 0)
      }
    } else if (target < 0) {
      if (i > 0) {
        jump(i - 1)
        seek(i - 1, chapters[i - 1].beatEls.length - 1)
      }
    } else {
      seek(i, target)
    }
  }
  function onKeydown (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return
    if (e.target.closest?.('input, textarea, select, [contenteditable]')) return
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault()
      stepBy(e.key === 'ArrowRight' ? 1 : -1)
      return
    }
    let direction = KEY_DIRECTION[e.key]
    if (e.key === ' ') {
      if (e.target.closest?.('button, a')) return
      direction = e.shiftKey ? -1 : 1
    }
    if (!direction) return
    if (glideRaf) { e.preventDefault(); return }
    const target = nextStop(direction, true)
    if (target === null) return
    e.preventDefault()
    if (reduceMotion) window.scrollTo({ top: target, behavior: 'instant' })
    else glideTo(target)
  }
  function onTouchStart (e) {
    touch = e.touches.length === 1 ? { y: e.touches[0].clientY, target: undefined } : null
  }
  function onTouchMove (e) {
    if (glideRaf) {
      if (e.cancelable) e.preventDefault()
      return
    }
    if (!touch) return
    const dy = e.touches[0].clientY - touch.y
    if (touch.target === undefined) {
      if (Math.abs(dy) < 8) return
      touch.target = nextStop(dy < 0 ? 1 : -1)
    }
    if (touch.target === null || !e.cancelable) return
    e.preventDefault()
    if (Math.abs(dy) >= SWIPE_THRESHOLD) {
      glideTo(touch.target)
      touch = null
    }
  }
  function onPointerDown (e) {
    if (e.target === document.documentElement) cancelGlide()
  }
  function jump (i) {
    const { snap } = zoneOf(chapters[i])
    if (reduceMotion) window.scrollTo({ top: snap, behavior: 'instant' })
    else glideTo(snap)
  }
  function seek (i, beat) {
    const ch = chapters[i]
    ch.started = true
    ch.time = reduceMotion ? ch.starts[beat] + ch.durations[beat] - 1 : ch.starts[beat]
  }

  new ResizeObserver(resizeStages).observe(root)
  window.addEventListener('resize', resizeStages)
  window.addEventListener('keydown', onKeydown)
  if (!reduceMotion) {
    window.addEventListener('wheel', onWheel, { passive: false })
    window.addEventListener('touchstart', onTouchStart, { passive: true })
    window.addEventListener('touchmove', onTouchMove, { passive: false })
    window.addEventListener('pointerdown', onPointerDown)
  }
  document.fonts?.ready.then(() => chapters.forEach((ch) => { paginate(ch); ch.dirty = true }))
  window.addEventListener('scene-assets', () => chapters.forEach((ch) => { ch.dirty = true }))
  new IntersectionObserver(([entry]) => {
    inView = entry.isIntersecting
    if (inView) start()
  }, { rootMargin: '30% 0px' }).observe(root)
})()
</script>
<script src="note-end.js" defer></script>
</body>
</html>
